<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 4 - Grammar and Exam Practice</title>
<style>
:root{--fs:18px;--ink:#111;--mut:#6b6b6b;--line:#dcdcdc;--soft:#f3f3f3;--ok:#e3f3e6;--okl:#2e7d4f;--bad:#fbe6e6;--badl:#b42b2b;--on:#e4e8ef}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Aptos,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;font-size:16px}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{height:100dvh;display:grid;grid-template-rows:56px 1fr auto}
#hd{display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(10px)}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.tabs{display:flex;gap:4px;margin:0 auto}
.tab{border:0;background:none;padding:15px 14px 13px;font-size:16px;border-bottom:3px solid transparent;color:var(--mut)}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.tools{display:flex;align-items:center;gap:6px}
.who2{font-size:14px;color:var(--mut);margin-right:6px}
.ib,.fsb{height:38px;min-width:38px;border:0;border-radius:19px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.fsb{font-weight:700;font-size:15px}
.ib.dark{background:#111;color:#fff}
.ib.off{opacity:.4}
.ib.bare{background:none;min-width:30px;height:30px;color:var(--ink)}
#main{--lw:52%;display:flex;min-height:0}
#passage{width:var(--lw);overflow:auto;padding:24px 28px 60px;min-width:0}
#split{width:10px;cursor:col-resize;background:var(--soft);flex:none;position:relative;touch-action:none}
#split:after{content:"";position:absolute;left:3px;top:50%;width:4px;height:44px;margin-top:-22px;border-radius:2px;background:#bdbdbd}
#qs{flex:1;overflow:auto;padding:24px 28px 80px;min-width:0}
.ptag{font-size:14px;color:var(--mut);margin-bottom:4px}
h2{margin:0 0 16px;font-size:calc(var(--fs) + 8px);line-height:1.25}
.para{display:flex;gap:12px;margin:0 0 14px}
.pl{font-weight:700;font-size:var(--fs);width:22px;flex:none;line-height:1.55}
.pl.pn{font-weight:400;font-size:12px;color:#aaa;padding-top:5px}
.pt{font-size:var(--fs);line-height:1.6;text-align:justify}
.para.quote{margin-left:34px}
.para.quote .pt{font-style:italic}
.who{font-style:normal;font-weight:700;font-size:calc(var(--fs) - 3px);margin-top:6px;text-align:left}
mark.v{background:none;color:inherit}
.vh mark.v{background:#fff0a8;border-radius:3px;cursor:help}
.tip{display:none;position:fixed;z-index:30;max-width:320px;background:#111;color:#fff;border-radius:10px;padding:8px 12px;font-size:15px;line-height:1.4;pointer-events:none}
.grp{margin:0 0 30px}
.gh{margin:0 0 6px;font-size:16px;line-height:1.45}
.gl{margin:0 0 6px;font-style:italic;font-size:16px}
.legend{border:1px solid #111;border-radius:8px;padding:10px 14px;margin:8px 0 14px}
.lr{display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:15px;padding:2px 0}
.qi{margin:0 0 18px}
.qt{display:block;font-size:16px;line-height:1.9}
.qt>*{vertical-align:middle}
.qt .qn{margin-right:10px}
.qn{display:inline-flex;min-width:30px;height:28px;padding:0 6px;align-items:center;justify-content:center;border-radius:8px;background:#e8eef7;font-weight:700;font-size:15px;flex:none}
.qn.wide{padding:0 10px}
.muted{color:var(--mut);font-size:15px;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0 40px}
.chip{min-width:42px;height:38px;padding:0 14px;border:1.5px solid var(--line);background:#fff;border-radius:19px;font-size:16px;font-weight:600}
.chip.wide{min-width:110px}
.chip:hover{border-color:#111}
.chip.sel{background:#111;color:#fff;border-color:#111}
.opts{display:flex;flex-direction:column;gap:7px;margin:8px 0 0 40px}
.opt{display:flex;gap:12px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-size:16px;line-height:1.45}
.opt b{flex:none;width:18px}
.opt:hover{border-color:#111}
.opt.sel{background:var(--on);border-color:#111}
.chip.right,.opt.right{background:var(--ok);border-color:var(--okl);color:var(--ink)}
.chip.wrong,.opt.wrong{background:var(--bad);border-color:var(--badl);color:var(--ink)}
.gap{font:inherit;font-size:16px;border:0;border-bottom:2px solid #111;background:var(--soft);padding:3px 8px;margin:0 6px;width:200px;border-radius:6px 6px 0 0;outline:none}
.gap:focus{background:#e9e9e9}
.gap.right{background:var(--ok);border-bottom-color:var(--okl)}
.gap.wrong{background:var(--bad);border-bottom-color:var(--badl)}
.gap.big{width:100%;margin:10px 0;padding:10px 12px;font-size:18px}
.ex{margin:8px 0 0 40px;padding:10px 16px;border-radius:10px;font-size:16px;line-height:1.5}
.ex.ok{background:var(--ok)}.ex.bad{background:var(--bad)}
.opts .ex{margin-left:0}
#tiles{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);overflow-x:auto;background:#fff}
.tg{display:flex;gap:4px;flex:none;padding:4px 6px;border-radius:12px}
.tg.cur{background:var(--soft)}
.tile{width:30px;height:30px;border:0;border-radius:8px;background:#e8eef7;font-size:13px;font-weight:600}
.tile.on{background:#b9c7de}
.tile.ok{background:#bfe3c7}.tile.bad{background:#f2b9b9}
.ov{position:fixed;inset:0;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50}
.ov.solid{background:#fff}
.card{width:min(480px,92vw);background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px 28px}
.card h3{margin:0 0 10px;font-size:22px}
.card p{margin:8px 0;line-height:1.5;font-size:16px}
.card p.score{font-size:44px;font-weight:700;margin:6px 0}
.err{color:var(--badl)}
.mv{display:none}
.sbar{position:sticky;bottom:-80px;display:flex;gap:10px;justify-content:flex-end;align-items:center;background:#fff;border-top:1px solid var(--line);padding:12px 0;margin-top:10px}
.sdone{font-size:15px;color:var(--okl);font-weight:600}
.brow{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.pill{white-space:nowrap;border:0;border-radius:22px;background:#111;color:#fff;height:44px;padding:0 24px;font-size:16px;font-weight:600}
.pill.ghost{background:var(--soft);color:#111}
@media (max-width:900px){#main{flex-direction:column}#passage{width:100%;height:45%}#split{display:none}.brand{display:none}}
@media (max-width:700px){#app{grid-template-rows:auto 1fr auto}#hd{height:auto;flex-wrap:wrap;gap:4px 8px;padding:6px 10px}.tabs{order:3;flex:1 0 100%;margin:0;justify-content:space-between}.tab{flex:1;padding:8px 6px 8px;font-size:15px}.tools{margin-left:auto;flex-wrap:wrap}.who2,.hide-m{display:none}#main[data-v="p"] #qs,#main[data-v="q"] #passage{display:none}#passage,#qs{width:100%;flex:1;min-height:0}#passage{padding:14px 16px 30px}#qs{padding:14px 16px 80px}.mv{display:flex;order:4;flex:1 0 100%;gap:8px;padding-bottom:6px}.mvb{flex:1;height:38px;border:0;border-radius:19px;background:var(--soft);font-size:15px;font-weight:600}.mvb.on{background:#111;color:#fff}.chips,.opts,.ex{margin-left:0}h2{font-size:calc(var(--fs) + 4px)}.sbar{bottom:-80px}.card{padding:20px}.brow{flex-wrap:wrap}}
/* gblearning LMS theme */
:root{--ink:#1B1D22;--mut:#6B7280;--line:#E4E6EA;--soft:#F4F5F7;--on:#F4F5F7;--ok:#E8F5EC;--bad:#FBEAEA;--gold:#C89A3A}
body{color:#1B1D22;background:#fff}
#hd{background:#fff;backdrop-filter:none;border-bottom:1px solid #E4E6EA}
.brand{color:#16181D}
.tab.on{color:#16181D;border-bottom-color:#C89A3A}
.ib,.fsb{background:#F4F5F7;border:1px solid #E4E6EA}
.ib.dark,.pill,.chip.sel,.mvb.on{background:#16181D;color:#fff;border-color:#16181D}
.ib.bare{border:0;background:none}
.pill.ghost{background:#F4F5F7;color:#16181D;border:1px solid #E4E6EA}
.ptag{display:inline-flex;align-items:center;gap:8px;background:#F4F5F7;border-radius:9999px;padding:6px 14px 6px 10px;font-weight:700;font-size:14px;color:#16181D;margin-bottom:14px}
.ptag svg{width:16px;height:16px}
#split{background:#F4F5F7}#split:after{background:#C5C9D0}
.opt,.chip{border:1px solid #E4E6EA;border-radius:14px}
.chip{border-radius:9999px}
.chip:hover,.opt:hover{border-color:#E4E6EA}
.opt.sel{background:#F4F5F7;border-color:#16181D}
.gap{background:#F4F5F7;border-bottom:2px solid #16181D;border-radius:10px 10px 0 0}
.gap:focus{background:#ECEEF1}
.qn,.tile{background:#F4F5F7;color:#16181D}
.tile.on{background:#E5C16B}
.tg.cur{background:#F4F5F7}
.legend,.card{border-color:#E4E6EA}
.card{border-radius:20px}
.sbar{border-top:1px solid #E4E6EA}
.mvb{background:#F4F5F7}
u{text-underline-offset:3px}
#main.nop #passage,#main.nop #split{display:none}
#main.nop #qs{display:block!important;width:100%;max-width:980px;margin:0 auto}
</style></head>

ny"], ["C", "Much"], ["D", "More and more"]]], [23, "His _______ to the problem earned him recognition from the management team.", [["A", "innovative solution"], ["B", "solve innovatively"], ["C", "solved innovation"], ["D", "solve the innovation"]]], [24, "_______ tourists visiting the city has increased significantly this year.", [["A", "A number of"], ["B", "The number of"], ["C", "Plenty of"], ["D", "Many"]]], [25, "She had to pass _______ the opportunity to study abroad in order to take care of her family.", [["A", "down"], ["B", "by"], ["C", "up"], ["D", "away"]]]]}, {"kind": "mcq", "title": "Questions 26–30", "lines": ["Each of the following sentences has one error (A, B, C, or D). Find it and blacken your choice on your answer sheet."], "items": [[26, "Each {u:of} the participants {u:are} required {u:to} complete {u:a} short online survey.", [["A", "of"], ["B", "are"], ["C", "to"], ["D", "a"]]], [27, "The {u:train’s} station {u:was} crowded {u:with} passengers {u:waiting} for their evening train.", [["A", "train’s"], ["B", "was"], ["C", "with"], ["D", "waiting"]]], [28, "{u:On} submitting {u:the} assignment, students must demonstrate that {u:her} content {u:is} relevant.", [["A", "on"], ["B", "the"], ["C", "her"], ["D", "is"]]], [29, "{u:The} man with {u:who} I had the interview {u:seemed} very {u:qualified}.", [["A", "The"], ["B", "who"], ["C", "seemed"], ["D", "qualified"]]], [30, "{u:Media} bias can {u:influence} public {u:opinion} on {u:the} certain issues.", [["A", "Media"], ["B", "influence"], ["C", "opinion"], ["D", "the"]]]]}, {"kind": "mcq", "title": "Questions 31–35", "lines": ["Which of the following best restates each of the given sentences?"], "items": [[31, "There was a major traffic jam because of the broken traffic light.", [["A", "The major traffic jam would not have happened if the light hadn’t been broken."], ["B", "If the traffic light had not worked properly, there would have been a major traffic jam."], ["C", "Unless the traffic light was fixed, the traffic jam could not have been avoided."], ["D", "The traffic jam happens because the broken traffic light is not repaired."]]], [32, "This house is big, but the other two houses are much bigger.", [["A", "Of the three houses, this one is the least big."], ["B", "The other two houses are less spacious compared to this one."], ["C", "No other house is bigger than this one in the neighbourhood."], ["D", "One of the three houses is too large to furnish completely."]]], [33, "The restaurant is receiving more bookings possibly because of its improved service.", [["A", "It is impossible for customers to book more tables at the restaurant due to better service."], ["B", "The restaurant’s growth in bookings is due to its excellent customer care."], ["C", "Improvements in service may be the reason for the restaurant's current growth in bookings."], ["D", "The restaurant will attract more customers with its outstanding service quality."]]], [34, "\"We are going to the beach this weekend,\" said Alex.", [["A", "Alex told that they were going to the beach this weekend."], ["B", "Alex asked me if they were going to the beach that weekend."], ["C", "Alex said that they were going to the beach that weekend."], ["D", "Alex said we are going to the beach this weekend."]]], [35, "Take medicine on time to recover from your illness quickly.", [["A", "Take medicine on time so that the recovery will slow down."], ["B", "If medicine is taken late, it may still cure your illness."], ["C", "You must take medicine promptly to avoid worsening your condition."], ["D", "Your recovery will be delayed if you don’t take medicine on time."]]]]}]}, {"id": 3, "label": "Part 3", "title": "Advertisement", "paras": [["", "{b:Discover the World in Hue with GlobeWander}"], ["", "Have you ever dreamed of exploring the most colorful places on Earth? GlobeWander, a(n) {b:(36)} _______ is here to help you fulfill your travel desires. Whether you want {b:(37)} _______ crowded, bustling cities or tranquil countryside, we’ve got it all! Our platform connects you to unique experiences, from discovering hidden gems to enjoying {b:(38)} _______ festivals. All you need to do is sign up, and we’ll match you with a perfect travel itinerary {b:(39)} _______ to your preferences."], ["", "So, why wait? Pack your bags and embark {b:(40)} _______ an unforgettable journey with us! If you wish to explore famous landmarks, GlobeWander will {b:(41)} _______ it easy with just a click."]], "range": [36, 41], "groups": [{"kind": "mcq", "title": "Questions 36–41", "lines": ["Read the following advertisement and mark the letter A, B, C, or D on your answer sheet to indicate the option that best fits each of the numbered blanks from 36 to 41."], "items": [[36, "", [["A", "ideal world exploration guide"], ["B", "ideal exploration guide world"], ["C", "exploration ideal world guide"], ["D", "world ideal guide exploration"]]], [37, "", [["A", "visiting"], ["B", "to visit"], ["C", "to visiting"], ["D", "visit"]]], [38, "", [["A", "vibrant"], ["B", "vibrate"], ["C", "vibration"], ["D", "vibrantly"]]], [39, "", [["A", "tailor"], ["B", "tailoring"], ["C", "tailored"], ["D", "which tailor"]]], [40, "", [["A", "in"], ["B", "on"], ["C", "for"], ["D", "at"]]], [41, "", [["A", "take"], ["B", "last"], ["C", "lead"], ["D", "make"]]]]}]}, {"id": 4, "label": "Part 4", "title": "Leaflet", "paras": [["", "{b:Explore Your Career Opportunities!}"], ["", "Are you looking for a job that offers both growth and satisfaction? At ACE Corporation, we provide numerous opportunities for you to advance your career. With a competitive {b:(42)} _______ and benefits, you can build a fulfilling professional life."], ["", "{b:Why Choose Us?}"], ["", "{b:Career Development:} We believe in investing in our employees. With a {b:(43)} _______ of training programs available, you can {b:(44)} _______ your skills and climb the career ladder."], ["", "{b:Work-Life Balance:} We understand the importance of balance. {b:(45)} _______, we offer flexible hours and {b:(46)} _______ benefits that cater to your needs."], ["", "{b:Supportive Environment:} Our team is dedicated to your success. Many employees in the company have found their passion and excelled, thanks to our collaborative culture."], ["", "{b:Join Us Today!}"], ["", "If you are ready to {b:(47)} _______ new challenges and make a difference, apply now!\nTo learn more about our openings or to submit your application, visit our website or contact us."]], "range": [42, 47], "groups": [{"kind": "mcq", "title": "Questions 42–47", "lines": ["Read the following leaflet and mark the letter A, B, C, or D on your answer sheet to indicate the option that best fits each of the numbered blanks from 42 to 47."], "items": [[42, "", [["A", "fee"], ["B", "salary"], ["C", "money"], ["D", "fare"]]], [43, "", [["A", "large amount"], ["B", "little"], ["C", "range"], ["D", "bit"]]], [44, "", [["A", "ensure"], ["B", "enhance"], ["C", "devote"], ["D", "separate"]]], [45, "", [["A", "In addition"], ["B", "By contrast"], ["C", "However"], ["D", "Therefore"]]], [46, "", [["A", "other"], ["B", "the other"], ["C", "another"], ["D", "others"]]], [47, "", [["A", "catch on"], ["B", "back up"], ["C", "bring up"], ["D", "take on"]]]]}]}, {"id": 5, "label": "Part 5", "title": "Arrangement", "paras": [], "range": [48, 52], "groups": [{"kind": "mcq", "title": "Questions 48–52", "lines": ["Mark the letter A, B, C, or D on your answer sheet to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text in each of the following questions from 48 to 52."], "items": [[48, "a. Ann: Hi, Mi. Long time no see. How're you doing?\nb. Ann: Oh, that's why I haven't seen you in the Reading Club very often.\nc. Mi: I'm fine, thanks. By the way, we moved to a new house in a suburb last month.", [["A", "a-b-c"], ["B", "a-c-b"], ["C", "c-a-b"], ["D", "b-a-c"]]], [49, "a. Man: Yeah. I've got no problem with that. It sounds good, actually. The last place I worked for was quite demanding too. We had to make sure we gave a really high level of service.\nb. Man: That's fine. I'm very used to working in that kind of environment.\nc. Woman: That's good to hear because that will be equally important at Milo's. I know they want people who have an eye for detail.\nd. Woman: OK. Now, they do have some quite specific requirements for the kind of person they're looking for. Milo's a young, dynamic company and they're really keen on creating a strong team. It's really important that you can fit in and get on well with everyone.\ne. Woman: Perfect. So the only other thing that's required is good communication skills, so you'll need to have a certificate in English.", [["A", "e-a-c-b-d"], ["B", "a-e-d-b-c"], ["C", "c-a-b-e-d"], ["D", "d-a-c-b-e"]]], [50, "Hi Susan,\na. The streets are bigger now, and two new highways were built last year.\nb. I'm happy to hear you're having fun at university. And you're right, my town is different now. Do you remember what it looked like when you visited five years ago?\nc. A new movie theater has just been opened too, so I’m going there with my friends tomorrow. What else? Well, two skyscrapers were built two years ago. Because the town center is more crowded now, many people have moved to the outskirts recently.\nd. My aunt's family moved last month, and they like it there.\ne. It’s so much easier to get around now. Last month, two new bookstores were opened near my house. Overall, I like all the changes. How about your town? Has it changed much?\nLove,\nMolly.", [["A", "b-a-e-c-d"], ["B", "a-e-d-b-c"], ["C", "c-a-b-e-d"], ["D", "d-e-c-b-a"]]], [51, "a. It’s taken decades for scientists to develop tasty food that astronauts can easily consume in space.\nb. When astronauts get hungry, they simply rehydrate the food with water from a special dispenser and wait for 20 to 30 minutes until it's ready.\nc. Much of this is freeze-dried; a process by which the food is cooked, frozen, and then it has all its water sucked out.\nd. The food containers can then be attached to trays with fasteners to secure them.\ne. Freeze-dried food lasts for a long time and doesn’t need to be refrigerated, making it ideal for space travel.", [["A", "c-a-e-b-d"], ["B", "a-d-b-e-c"], ["C", "b-e-c-d-a"], ["D", "a-c-e-b-d"]]], [52, "a. The sport saw some success among boomers in more recent years.\nb. Experts also attribute the sport's rapid popularity to a few other factors, including its ease of play, low cost of entry, and sociability.\nc. Pickleball can be learned in just a few lessons, and players can find tournaments at varying competitive levels.\nd. Pickleball, a combination of tennis, badminton, and ping-pong, was first created in 1965 in Bainbridge Island, Washington.\ne. The Villages in Florida now feature more than 220 pickleball courts.", [["A", "c-b-e-a-d"], ["B", "d-a-e-b-c"], ["C", "e-d-b-a-c"], ["D", "a-e-b-d-c"]]]]}]}, {"id": 6, "label": "Part 6", "title": "Homework", "paras": [], "range": [53, 72], "groups": [{"kind": "mcq", "title": "Exercise 1", "lines": ["Choose the best answer A, B, C or D."], "items": [[53, "The more attention we pay to sustainable development, the __________ the quality of life will be for future generations.", [["A", "better"], ["B", "worse"], ["C", "more expensive"], ["D", "harder"]]], [54, "The city can’t handle more traffic because it has __________ completed a large infrastructure project.", [["A", "ever"], ["B", "never"], ["C", "yet"], ["D", "just"]]], [55, "The VinFast electric vehicle system, in combination with the __________, aims to improve sustainability in urban transportation.", [["A", "network city's tram"], ["B", "city's tram network"], ["C", "city's network tram"], ["D", "tram city's network"]]], [56, "__________ buildings are being constructed to meet the demand for housing.", [["A", "Most"], ["B", "Less and less"], ["C", "More and more"], ["D", "The most"]]], [57, "The roads in major cities are getting __________ as traffic congestion worsens due to the increasing number of vehicles.", [["A", "narrower and narrower"], ["B", "more and more narrow"], ["C", "the narrowest"], ["D", "less and less wide"]]], [58, "After only a month, my brother got bored at work and found his job __________ attractive.", [["A", "the least"], ["B", "more or less"], ["C", "more and more"], ["D", "less and less"]]], [59, "After much discussion, they finally decided __________ the location for the new shopping mall.", [["A", "at"], ["B", "to"], ["C", "on"], ["D", "with"]]], [60, "It is getting __________ difficult for young people to find jobs if they don't have any skills.", [["A", "much and more"], ["B", "more and more"], ["C", "more and much"], ["D", "much and much"]]], [61, "This is the first time we __________ such an interesting talk about urbanisation in Viet Nam.", [["A", "listen to"], ["B", "had listened to"], ["C", "listened to"], ["D", "have listened to"]]], [62, "The city has __________ built several new skyscrapers to accommodate the growing population.", [["A", "already"], ["B", "yet"], ["C", "since"], ["D", "so far"]]], [63, "As cities grow, overcrowding becomes an increasingly serious issue, and it is becoming __________ difficult for the government to manage public services.", [["A", "fewer and fewer"], ["B", "easier and easier"], ["C", "less and less"], ["D", "more and more"]]]]}, {"kind": "mcq", "title": "Exercise 2", "lines": ["Each of the following sentences has one error (A, B, C or D). Find it."], "items": [[64, "{u:The more} time people spend {u:commuting}, {u:the least} energy they have {u:for} their families.", [["A", "The more"], ["B", "commuting"], ["C", "the least"], ["D", "for"]]], [65, "Urban planners {u:have discussed} the project {u:for} months, but they {u:haven’t reached} a decision {u:already}.", [["A", "have discussed"], ["B", "for"], ["C", "haven’t reached"], ["D", "already"]]], [66, "{u:More and more} young people {u:is moving} to big cities {u:in search} of {u:well-paid} jobs.", [["A", "More and more"], ["B", "is moving"], ["C", "in search"], ["D", "well-paid"]]], [67, "{u:The most} people move to the capital, the {u:higher} the rents {u:become} and the {u:harder} it is to find a flat.", [["A", "The most"], ["B", "higher"], ["C", "become"], ["D", "harder"]]]]}, {"kind": "fill", "title": "Exercise 3", "lines": ["Complete the second sentence using the word in brackets so that it has a similar meaning to the first. Use between two and five words in each gap."], "items": [[68, "Traffic gets heavier when more people buy cars. (The) The more people buy cars, {} traffic gets."], [69, "We have never seen such a tall building before. (Tallest) This is {} we have ever seen."], [70, "It is getting increasingly difficult to find affordable housing. (And) It is getting {} to find affordable housing."], [71, "They moved to Da Nang in 2019 and they still live there. (Lived) They {} Da Nang since 2019."], [72, "The last time I visited my hometown was two years ago. (For) I {} my hometown for two years."]]}]}]};</script>
<script type="application/json" id="gb-key">{"q1": {"a": "C", "e": "So sánh đồng tiến: The less attention …, the more people … (càng ít quan tâm, càng nhiều người phải dùng xe cá nhân)."}, "q2": {"a": "B", "e": "So sánh nhất + hiện tại hoàn thành với ever: the best decision my sister has ever made."}, "q3": {"a": "C", "e": "The bigger …, the more complex …: vế sau phải là the + so sánh hơn."}, "q4": {"a": "A", "e": "becoming + tính từ; ngữ cảnh tiêu cực (bệnh hô hấp) → less and less acceptable."}, "q5": {"a": "B", "e": "performing (động từ thường) + trạng từ; hành khách bực bội → less and less effectively."}, "q6": {"a": "D", "e": "Trật tự cụm danh từ: số từ + tính từ + danh từ: One common complaint."}, "q7": {"a": "A", "e": "The + so sánh hơn …, the + so sánh hơn …: The faster …, the greater …"}, "q8": {"a": "D", "e": "So sánh nhất + hiện tại hoàn thành: the most expensive present that you have ever given."}, "q9": {"a": "B", "e": "Bổ nghĩa cho động từ has grown cần trạng từ: rapidly."}, "q10": {"a": "C", "e": "So sánh đồng tiến: vế sau là the + so sánh hơn (the more difficult), không dùng so sánh nhất."}, "q11": {"a": "A", "e": "This is the first time + hiện tại hoàn thành: have invested."}, "q12": {"a": "D", "e": "in the 1990s là thời điểm xác định trong quá khứ → quá khứ đơn: started."}, "q13": {"a": "B", "e": "Since + quá khứ đơn (last year), mệnh đề chính dùng hiện tại hoàn thành: Since the metro line opened …"}, "q14": {"a": "A", "e": "farmland là danh từ không đếm được → Less and less; fewer and fewer đi với danh từ số nhiều."}, "q15": {"a": ["the more complicated"], "e": "The + so sánh hơn, the + so sánh hơn: the more complicated."}, "q16": {"a": ["the noisiest neighbourhood"], "e": "never … such a + adj + N = the + so sánh nhất + N + S + have ever + V3."}, "q17": {"a": ["More and more"], "e": "Số lượng tăng dần = More and more + danh từ số nhiều."}, "q18": {"a": ["have been building"], "e": "Hành động bắt đầu trong quá khứ, chưa xong, nhấn mạnh quá trình → hiện tại hoàn thành tiếp diễn: have been building."}, "q19": {"a": ["the fewer people"], "e": "Vế sau: the + so sánh hơn + danh từ số nhiều: the fewer people."}, "q20": {"a": ["has not repaired this road since", "hasn’t repaired this road since", "hasn't repaired this road since"], "e": "The last time + quá khứ đơn = hiện tại hoàn thành phủ định + since + mốc thời gian."}, "q21": {"a": "C", "e": "Kiến thức về Kết hợp thì: • By the time + S + V (quá khứ đơn), S + V (quá khứ hoàn thành): trước khi … đã … • Cấu trúc thì quá khứ hoàn thành: S + had + V3/ed"}, "q22": {"a": "D", "e": "Kiến thức về So sánh kép: • More and more + N: càng ngày càng nhiều …"}, "q23": {"a": "A", "e": "Kiến thức về Trật tự từ: • Sau tính từ sở hữu ‘his’, ta cần một cụm danh từ. • Ta có danh từ ‘solution’ (giải pháp) nên ta dùng tính từ ‘innovative’ (đổi mới) đứng trước danh từ này để bổ sung ý nghĩa."}, "q24": {"a": "B", "e": "Kiến thức về Lượng từ: A. a number of + N đếm được số nhiều: nhiều B. the number of + N đếm được số nhiều: số lượng C. plenty of + N đếm được/ không đếm được: nhiều D. many + N đếm được số nhiều: nhiều • Ta có danh từ ‘tourists’ ở dạng danh từ đếm được số nhiều nên dựa vào nghĩa ta chọn ‘the number of’."}, "q25": {"a": "C", "e": "Kiến thức về Cụm động từ: • pass up something: từ chối, bỏ qua một cơ hội"}, "q26": {"a": "B", "e": "Kiến thức về Hòa hợp chủ ngữ – động từ: • Nếu chủ ngữ là Each of + N thì động từ chính chia ở dạng động từ số ít. Sửa: are → is"}, "q27": {"a": "A", "e": "Kiến thức về Collocation: • train station: nhà ga xe lửa Sửa: train’s → train"}, "q28": {"a": "C", "e": "Kiến thức về Tính từ sở hữu: • Ta dùng tính từ sở hữu ‘its’ nhằm ám chỉ danh từ ‘the assignment’. Sửa: her → its"}, "q29": {"a": "B", "e": "Kiến thức về Đại từ quan hệ: • Sau giới từ, ta dùng đại từ quan hệ ‘whom’ thay thế cho tân ngữ chỉ người trong mệnh đề quan hệ. Sửa: who → whom"}, "q30": {"a": "D", "e": "Kiến thức về Mạo từ: • Ta thấy cụm danh từ ‘certain issues’ ở dạng danh từ số nhiều và chưa xác định nên ta không dùng mạo từ. Sửa: the → Ø (bỏ mạo từ)"}, "q31": {"a": "A", "e": "Kiến thức về Câu điều kiện loại 3: Có một vụ tắc nghẽn giao thông nghiêm trọng vì đèn giao thông bị hỏng. A. Tắc nghẽn giao thông nghiêm trọng sẽ không xảy ra nếu đèn không bị hỏng. => Đúng về ngữ nghĩa và ngữ pháp. B. Nếu đèn giao thông không hoạt động bình thường, sẽ có tắc nghẽn giao thông nghiêm trọng. => Sai về ý nghĩa câu với câu gốc. C. Nếu đèn giao thông không được sửa, tắc nghẽn giao thông không thể tránh được. => Sai về ngữ nghĩa và ngữ pháp. D. Tắc nghẽn giao thông xảy ra vì đèn giao thông bị hỏng không được sửa chữa. => Sai về ngữ nghĩa ở ‘is not repaired’ và thì của câu. Câu điều kiện loại 3: • If + S + had + V3/ed, S + would/could + have + V3/ed • Diễn tả một sự việc hoặc hành "}, "q32": {"a": "A", "e": "Kiến thức về So sánh nhất: Ngôi nhà này lớn, nhưng hai ngôi nhà còn lại kia lớn hơn nhiều. A. Trong ba ngôi nhà, ngôi nhà này là nhỏ nhất. => Đúng về ngữ nghĩa và ngữ pháp. B. Hai ngôi nhà còn lại ít rộng rãi hơn ngôi nhà này. => Sai về nghĩa ở ‘less spacious’. C. Không có ngôi nhà nào lớn hơn ngôi nhà này trong khu phố. => Sai về nghĩa của câu. D. Một trong ba ngôi nhà quá lớn để trang trí hoàn chỉnh. => Sai về nghĩa của câu. Kiến thức về so sánh nhất: • Tính từ ngắn: the + ADJ-est • Tính từ dài: the most + ADJ"}, "q33": {"a": "C", "e": "Kiến thức về Diễn đạt mức độ chắc chắn: Nhà hàng nhận được nhiều lượt đặt bàn hơn có thể là do dịch vụ được cải thiện. A. Khách hàng không thể đặt nhiều bàn hơn tại nhà hàng do dịch vụ tốt hơn. => Sai về ý nghĩa câu. B. Sự tăng lên ở lượt đặt bàn của nhà hàng là nhờ vào sự chăm sóc khách hàng xuất sắc. => Sai vì câu gốc chỉ nói ‘possibly’. C. Cải tiến dịch vụ có thể là lý do cho sự phát triển hiện tại của nhà hàng về số lượng đặt bàn. => Đúng về ngữ nghĩa và ngữ pháp. D. Nhà hàng sẽ thu hút nhiều khách hàng hơn với chất lượng dịch vụ nổi bật của mình. => Sai về ý nghĩa câu."}, "q34": {"a": "C", "e": "Kiến thức về Câu gián tiếp: \"Chúng tôi sẽ đi biển vào cuối tuần này,\" Alex nói. A. Alex nói rằng họ sẽ đi biển vào cuối tuần này. => Sai ở ‘told that’, tell + N. B. Alex hỏi tôi nếu họ sẽ đi biển vào cuối tuần đó. => Sai ở ‘asked me if’, câu gốc không phải câu hỏi. C. Alex nói rằng họ sẽ đi biển vào cuối tuần đó. => Đúng về ngữ nghĩa và ngữ pháp. D. Alex nói chúng tôi sẽ đi biển vào cuối tuần này. => Sai ngữ pháp câu. Chuyển từ câu trực tiếp sang câu gián tiếp: • Chuyển từ câu trần thuật trực tiếp sang câu gián tiếp. • Động từ trần thuật ở thì quá khứ (said) nên lùi thì động từ chính: are were • thay đổi chủ ngữ: we they • thay đổi trạng ngữ chỉ thời gian: this weekend that weekend"}, "q35": {"a": "D", "e": "Kiến thức về Câu điều kiện loại 1: Hãy uống thuốc đúng giờ để phục hồi nhanh chóng khỏi bệnh tật. A. Uống thuốc đúng giờ để việc phục hồi sẽ chậm lại. => Sai về ý nghĩa ở ‘slow down’. B. Nếu uống thuốc muộn, nó vẫn có thể chữa khỏi bệnh tật của bạn. => Sai về ý nghĩa câu. C. Bạn phải uống thuốc đúng giờ để tránh làm tình trạng của bạn xấu đi. => Sai về ý nghĩa câu. D. Việc phục hồi của bạn sẽ bị trì hoãn nếu bạn không uống thuốc đúng giờ. => Đúng về ngữ nghĩa và ngữ pháp. Câu điều kiện loại 1: • If + S + V (hiện tại đơn), S + will/may/can + V nguyên mẫu • Diễn tả một sự việc hoặc hành động có thể xảy ra ở hiện tại hoặc tương lai."}, "q36": {"a": "A", "e": "Dạng bài: Trật tự từ Ta có cụm danh từ: world exploration guide: hướng dẫn viên khám phá thế giới (cung cấp thông tin chi tiết về các địa điểm du lịch, điểm tham quan nổi bật, và các hoạt động khám phá trên toàn thế giới). Ta có quy tắc: Tính từ đứng trước danh từ => tính từ “ideal” phải đứng trước cụm danh từ “world exploration guide”."}, "q37": {"a": "B", "e": "Dạng bài: Danh động từ và động từ nguyên mẫu Ta có: want + to V (nguyên thể): muốn làm gì"}, "q38": {"a": "A", "e": "Dạng bài: Từ loại A. vibrant /ˈvaɪ.brənt/ (a): sôi động, tràn đầy năng lượng B. vibrate /vaɪˈbreɪt/ (v): rung lên, ngân vang lên (âm thanh); rung lắc C. vibration /vaɪˈbreɪ.ʃən/ (n): sự rung lên; sự rung lắc D. vibrantly /ˈvaɪ.brənt.li/ (adv): một cách sôi động, tràn đầy năng lượng Căn cứ vào danh từ “festivals” => vị trí chỗ trống cần một tính từ (theo quy tắc trước danh từ là tính từ)."}, "q39": {"a": "C", "e": "Dạng bài: Rút gọn mệnh đề quan hệ Ta có: Trong một câu không thể có 2 động từ chính cùng chia theo thì của câu, động từ thứ hai phải ở trong mệnh đề quan hệ hoặc chia ở dạng rút gọn mệnh đề quan hệ => loại A. => Căn cứ vào nghĩa, động từ “tailor” cần chia ở dạng bị động => loại D. *Ta có: Khi rút gọn mệnh đề quan hệ, nếu động từ trong mệnh đề quan hệ đó ở thể bị động, ta lược bỏ đại từ quan hệ và trợ động từ, đưa động từ chính về dạng Vp2 => loại B."}, "q40": {"a": "B", "e": "Dạng bài: Giới từ Ta có cụm từ: embark on sth/doing sth: bắt đầu điều gì/làm gì => vị trí chỗ trống cần giới từ “on”."}, "q41": {"a": "D", "e": "Dạng bài: Cụm từ cố định Ta có cụm từ: take it easy: nghỉ ngơi, thư giãn make it easy: làm cho việc gì đơn giản, dễ dàng hơn"}, "q42": {"a": "B", "e": "Dạng bài: Từ vựng A. fee /fiː/ (n): số tiền bạn phải trả cho các dịch vụ lời khuyên, tư vấn mang tính chuyên nghiệp; phí trả cho một loại dịch vụ đặc thù như học phí, phí đăng kí xe, các loại dịch vụ phạm lý; phí trả để đi vào đâu B. salary /ˈsæl.ər.i/ (n): tiền lương (được trả hằng tháng, hằng năm, mang tính cố định, lâu dài) C. money /ˈmʌn.i/ (n): tiền D. fare /feər/ (n): phí di chuyển, phải trả khi sử dụng các phương tiện đi lại như xe bus, tàu hỏa,..."}, "q43": {"a": "C", "e": "Dạng bài: Từ vựng A. amount /əˈmaʊnt/ (n): một lượng => the amount of + N không đếm được: một lượng gì B. little /ˈlɪt.əl/ (adj):nhỏ bé, ít => A little đi kèm danh từ không đếm được, chỉ lượng nhỏ của vật gì đó C. range /reɪndʒ/ (n): hàng loạt => a (wide/whole) range of + N đếm được số nhiều: hàng loạt thứ gì D. bit /bɪt/ (n):Một chút, một ít => A bit thường được dùng như 1 trạng từ với nghĩa một ít, một chút, đi phía sau là động từ hoặc tính từ Căn cứ vào danh từ đếm được số nhiều “programs” => ta không dùng “amount”,”little” => loại A, B. Cũng không dùng “bit” => Loại D"}, "q44": {"a": "B", "e": "Dạng bài: Từ vựng – nghĩa của từ A. ensure /ɪnˈʃɔːr/ (v): đảm bảo B. enhance /ɪnˈhɑːns/ (v): cải thiện, nâng cao C. devote /dɪˈvəʊt/ (v): cống hiến, tận tâm D. separate /ˈsep.ər.ət/ (v): chia cắt, tách ra"}, "q45": {"a": "D", "e": "Dạng bài: Liên từ A. In addition: Thêm vào đó B. By contrast: Ngược lại C. However: Tuy nhiên D. Therefore: Do đó, vì thế"}, "q46": {"a": "A", "e": "Dạng bài: Lượng từ A. other + N không đếm được/ N đếm được số nhiều: những cái khác/ người khác B. the other: cái còn lại trong hai cái, hoặc người còn lại trong hai người C. another + N đếm được số ít: một cái khác/người khác D. others: những cái khác/ người khác, được sử dụng như đại từ, theo sau không có bất kì danh từ nào Căn cứ vào danh từ đếm được số nhiều “benefits” đứng sau vị trí chỗ trống => loại B, C, D."}, "q47": {"a": "D", "e": "Dạng bài: Cụm động từ A. catch on: trở nên phổ biến; hiểu (sau một thời gian dài) B. back up: giúp đỡ, ủng hộ ai; chứng minh điều gì là đúng C. bring up: nuôi nấng; đề cập D. take on: thuê mướn; đảm nhận; đón nhận"}, "q48": {"a": "B", "e": "Dạng bài: Sắp xếp câu tạo thành đoạn hội thoại *Để tạo nên một đoạn văn/lời kể/ đoạn hội thoại hoàn chỉnh, ta sắp xếp chúng sao cho phù hợp về mặt ngữ nghĩa, ngữ pháp, câu sau là sự tiếp nối về nội dung với câu trước. => Ta có cách sắp xếp hoàn chỉnh: a. Ann: Hi, Mi. Long time no see. How’re you doing? (Ann: Chào Mi. Lâu rồi không gặp. Bạn khỏe không?) c. Mi: I’m fine, thanks. By the way, we moved to a new house in a suburb last month. (Mi: Tôi ổn, cảm ơn bạn. Nhân tiện, chúng tôi đã chuyển đến một ngôi nhà mới ở vùng ngoại ô vào tháng trước). b. Ann: Oh, that’s why I haven’t seen you in the Reading Club very often. (Ann: Ồ, đó là lý do tại sao tôi không thấy bạn ở Câu lạc bộ Đọc sách thường"}, "q49": {"a": "D", "e": "Dạng bài: Sắp xếp câu tạo thành đoạn hội thoại *Để tạo nên một đoạn văn/lời kể/ đoạn hội thoại hoàn chỉnh, ta sắp xếp chúng sao cho phù hợp về mặt ngữ nghĩa, ngữ pháp, câu sau là sự tiếp nối về nội dung với câu trước. => Ta có cách sắp xếp hoàn chỉnh: d. Woman: OK. Now, they do have some quite specific requirements for the kind of person they're looking for. Milo's a young, dynamic company and they're really keen on creating a strong team. It's really important that you can fit in and get on well with everyone. (Người phụ nữ: Được thôi. Bây giờ, họ có một số yêu cầu khá cụ thể đối với đối tượng mà họ đang tìm kiếm. Milo là một công ty trẻ, năng động và họ thực sự muốn tạo ra một đội ngũ mạnh"}, "q50": {"a": "A", "e": "Dạng bài: Sắp xếp trật tự câu tạo thành lá thư *Để tạo nên một lá thư hoàn chỉnh, mở đầu phải là lời chào cũng như giới thiệu chủ đề sắp nói đến bằng cách dùng Dear/ Hi + tên người nhận. Ở phần thân lá thư, ta sắp xếp sao cho chúng phù hợp về ngữ nghĩA. Kết thúc lá thư sẽ là lời nhắn nhủ, gửi lời chúc đến người nhận bằng cụm Best wishes/ Best regards/ Best/ Sincerely/ Love/ With warm regards/ Yours faithfully,... => Ta có cách sắp xếp hoàn chỉnh: Hi Susan, (Chào Susan). b. I’m happy to hear you’re having fun at university. And you’re right, my town is different now. Do you remember what it looked like when you visited five years ago? (Tôi rất vui khi biết bạn đang vui vẻ ở trường đại họC. Và"}, "q51": {"a": "D", "e": "Dạng bài: Sắp xếp trật tự câu tạo thành đoạn văn *Để tạo nên một đoạn văn/lời kể hoàn chỉnh, ta sắp xếp chúng sao cho phù hợp về mặt ngữ nghĩa, ngữ pháp, câu sau là sự tiếp nối về nội dung với câu trước. => Ta có cách sắp xếp hoàn chỉnh: a. It’s taken decades for scientists to develop tasty food that astronauts can easily consume in space. (Các nhà khoa học phải mất hàng thập kỷ để phát triển loại thực phẩm ngon mà các phi hành gia có thể dễ dàng tiêu thụ trong không gian). c. Much of this is freeze-dried; a process by which the food is cooked, frozen, and then it has all its water sucked out. (Phần lớn thực phẩm này được sấy khô bằng phương pháp đông lạnh; một quá trình trong đó thực phẩm đ"}, "q52": {"a": "B", "e": "Dạng bài: Sắp xếp trật tự câu tạo thành đoạn văn *Để tạo nên một đoạn văn/lời kể hoàn chỉnh, ta sắp xếp chúng sao cho phù hợp về mặt ngữ nghĩa, ngữ pháp, câu sau là sự tiếp nối về nội dung với câu trước. => Ta có cách sắp xếp hoàn chỉnh: d. Pickleball, a combination of tennis, badminton, and ping-pong, was first created in 1965 in Bainbridge Island, Washington. (Pickleball, sự kết hợp giữa quần vợt, cầu lông và bóng bàn, được sáng tạo lần đầu tiên vào năm 1965 tại đảo Bainbridge, Washington). a. The sport saw some success among boomers in more recent years. (Môn thể thao này đã đạt được một số thành công nhất định trong thế hệ bùng nổ dân số trong những năm gần đây). e. The Villages in Flori"}, "q53": {"a": "A", "e": "The more …, the better …: phát triển bền vững → chất lượng sống càng tốt."}, "q54": {"a": "D", "e": "has just completed: vừa mới hoàn thành."}, "q55": {"a": "B", "e": "Trật tự cụm danh từ có sở hữu cách: city’s tram network."}, "q56": {"a": "C", "e": "More and more + danh từ số nhiều: ngày càng nhiều tòa nhà."}, "q57": {"a": "A", "e": "Tính từ ngắn: narrower and narrower; kẹt xe nặng hơn nên đường càng “hẹp”."}, "q58": {"a": "D", "e": "got bored → công việc ngày càng kém hấp dẫn: less and less attractive."}, "q59": {"a": "C", "e": "decide on + N: quyết định chọn."}, "q60": {"a": "B", "e": "Tính từ dài: more and more difficult."}, "q61": {"a": "D", "e": "This is the first time + hiện tại hoàn thành: have listened to."}, "q62": {"a": "A", "e": "has already built: đã xây rồi; yet dùng trong câu phủ định, nghi vấn; since, so far không đứng giữa has và V3."}, "q63": {"a": "D", "e": "increasingly serious → more and more difficult."}, "q64": {"a": "C", "e": "So sánh đồng tiến: vế sau là the + so sánh hơn: the less energy."}, "q65": {"a": "D", "e": "Câu phủ định hiện tại hoàn thành dùng yet ở cuối câu."}, "q66": {"a": "B", "e": "Chủ ngữ số nhiều (young people) → are moving."}, "q67": {"a": "A", "e": "So sánh đồng tiến mở đầu bằng the + so sánh hơn: The more people …"}, "q68": {"a": ["the heavier"], "e": "The + so sánh hơn, the + so sánh hơn: the heavier."}, "q69": {"a": ["the tallest building"], "e": "never … such a + adj + N = the + so sánh nhất + N + S + have ever + V3."}, "q70": {"a": ["more and more difficult"], "e": "increasingly difficult = more and more difficult."}, "q71": {"a": ["have lived in"], "e": "Bắt đầu trong quá khứ, còn tiếp diễn → hiện tại hoàn thành + since."}, "q72": {"a": ["have not visited", "haven’t visited", "haven't visited"], "e": "The last time + quá khứ đơn … ago = hiện tại hoàn thành phủ định + for + khoảng thời gian."}}</script>
<script>(function () {
  "use strict";
  var D = window.DATA, TEACH = D.mode === "teaching";
  var state = { p: 0, ans: {}, chk: {}, lock: {}, byId: {}, pres: {}, open: [], vocab: true, code: "", sname: "", saved: "", timer: null, loading: false };
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function h(tag, a) {
    var e = document.createElement(tag);
    if (a) for (var k in a) { if (k === "cls") e.className = a[k]; else if (k === "html") e.innerHTML = a[k]; else if (k === "text") e.textContent = a[k]; else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), a[k]); else e.setAttribute(k, a[k]); }
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c == null) continue; e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
    return e;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function plab(P) { return P.label || ("Passage " + P.id); }
  function ftag(s) { return s.replace(/\{([ubi]):([^{}]*)\}/g, "<$1>$2</$1>").replace(/\n/g, "<br>"); }
  function norm(s) { return String(s == null ? "" : s).toLowerCase().replace(/\s+/g, " ").trim(); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { } return null; }

  var ICON = {
    tick: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
    full: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    book: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></svg>',
    reset: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg>'
  };
  ICON.list = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>';
  function ibtn(name, title, fn, cls) { return h("button", { cls: "ib " + (cls || ""), title: title, "aria-label": title, html: ICON[name], onclick: fn }); }

  var QMAP = {}; // qnum -> {pi, item}
  D.passages.forEach(function (P, pi) {
    P.groups.forEach(function (g) {
      if (g.kind === "multi") { for (var i = 0; i < g.n; i++) QMAP[g.firstq + i] = { pi: pi, g: g }; }
      else g.items.forEach(function (it) { QMAP[it[0]] = { pi: pi, g: g, it: it }; });
    });
  });

  /* ---------- answers ---------- */
  function multiSel(g) { return state.ans["m" + g.firstq] || []; }
  function qValue(n) {
    var m = QMAP[n]; if (m.g.kind === "multi") { var s = multiSel(m.g).slice().sort(); return s[n - m.g.firstq] || ""; }
    return state.ans[n] || "";
  }
  function isAnswered(n) { return qValue(n) !== ""; }
  function locked(n) { return !!state.lock[QMAP[n].pi]; }
  function correctOf(n) {
    var m = QMAP[n]; if (!TEACH) return null;
    if (m.g.kind === "multi") { var v = qValue(n); return v !== "" && m.g.answer.indexOf(v) > -1; }
    var it = m.it, v2 = qValue(n);
    if (m.g.kind === "fill") return it[2].some(function (a) { return norm(a) === norm(v2); });
    return norm(it[m.g.kind === "mcq" ? 3 : 2]) === norm(v2);
  }
  function tileState(n) {
    if (!TEACH) { var r = state.byId["q" + n]; if (r !== undefined) return r === true ? "ok" : "bad"; }
    var m = QMAP[n];
    if (TEACH) {
      var key = m.g.kind === "multi" ? "g" + m.g.firstq : n;
      if (state.chk[key]) return correctOf(n) ? "ok" : "bad";
    }
    return isAnswered(n) ? "on" : "";
  }

  /* ---------- passage ---------- */
  function vocabHTML(text) {
    var t = esc(text);
    if (!TEACH) return ftag(t);
    (D.passages[state.p].vocab || []).forEach(function (v, i) {
      var re = new RegExp("(" + esc(v[0]).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
      t = t.replace(re, '<mark class="v" data-i="' + i + '">$1</mark>');
    });
    return t;
  }
  function renderPassage() {
    var P = D.passages[state.p], box = $("#passage"); box.innerHTML = "";
    box.appendChild(h("div", { cls: "ptag", html: ICON.book + plab(P) }));
    box.appendChild(h("h2", { text: P.title }));
    P.paras.forEach(function (pr, i) {
      var L = pr[0], T = pr[1], name = null;
      if (L === "q") { var sp = T.split("|"); T = sp[0]; name = sp[1]; }
      var row = h("div", { cls: "para" + (L === "q" ? " quote" : "") });
      var tag = (L && L !== "q") ? L : (TEACH && !L ? String(i + 1) : "");
      if (L !== "q") row.appendChild(h("span", { cls: "pl" + (L ? "" : " pn"), text: tag }));
      var body = h("div", { cls: "pt" }); body.innerHTML = vocabHTML(T);
      row.appendChild(body);
      if (name) body.appendChild(h("div", { cls: "who", text: name }));
      box.appendChild(row);
    });
    if (TEACH && state.vocab) box.classList.add("vh"); else box.classList.remove("vh");
  }

  /* ---------- questions ---------- */
  function numTile(n) { return h("span", { cls: "qn", id: "q" + n, text: String(n) }); }
  function expl(text, ok) { return h("div", { cls: "ex " + (ok ? "ok" : "bad") }, h("b", { text: ok ? "Correct. " : "Not quite. " }), h("span", { text: text })); }

  function chips(it, opts, kind, rerender) {
    var n = it[0], row = h("div", { cls: "chips" }), done = TEACH && state.chk[n], ans = kind === "para" ? it[2] : it[2];
    opts.forEach(function (o) {
      var val = typeof o === "string" ? o : o[0], lab = typeof o === "string" ? o : o[0] + "  " + o[1];
      var b = h("button", { cls: "chip" + (kind === "tfng" ? " wide" : "") + (state.ans[n] === val ? " sel" : ""), text: kind === "tfng" || kind === "para" ? val : lab,
        onclick: function () { if (locked(n)) return; state.ans[n] = val; if (TEACH) state.chk[n] = true; rerender(); updateTiles(); } });
      if (done) { if (val === ans) b.classList.add("right"); else if (state.ans[n] === val) b.classList.add("wrong"); }
      row.appendChild(b);
    });
    return row;
  }

  function renderGroup(g) {
    var w = h("section", { cls: "grp" });
    var head = h("p", { cls: "gh" }, h("b", { text: g.title + ". " }), h("i", { text: g.lines[0] }));
    w.appendChild(head);
    for (var i = 1; i < g.lines.length; i++) w.appendChild(h("p", { cls: "gl", text: g.lines[i] }));
    if (g.kind === "tfng") {
      var lg = h("div", { cls: "legend" });
      D.legend.forEach(function (l) { lg.appendChild(h("div", { cls: "lr" }, h("b", { text: l[0] }), h("i", { text: l[1] }))); });
      w.appendChild(lg);
    }
    if (g.kind === "multi") return renderMulti(g, w);
    g.items.forEach(function (it) {
      var slot = h("div", { cls: "qi" });
      function draw() {
        slot.innerHTML = "";
        var n = it[0];
        if (g.kind === "fill") {
          var parts = it[1].split("{}"), line = h("div", { cls: "qt" }, numTile(n), h("span", { text: parts[0] }));
          var inp = h("input", { cls: "gap", type: "text", autocomplete: "off", spellcheck: "false", "aria-label": "Answer " + n });
          inp.value = state.ans[n] || "";
          if (!TEACH && locked(n)) inp.disabled = true;
          inp.addEventListener("input", function () { state.ans[n] = inp.value; updateTiles(); });
          if (TEACH) {
            inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { state.chk[n] = true; draw(); updateTiles(); } });
            if (state.chk[n]) inp.classList.add(correctOf(n) ? "right" : "wrong");
          }
          line.appendChild(inp); line.appendChild(h("span", { text: parts[1] || "" }));
          if (TEACH) line.appendChild(ibtn("tick", "Check", function () { state.chk[n] = true; draw(); updateTiles(); }, "bare"));
          slot.appendChild(line);
          if (TEACH && state.chk[n]) slot.appendChild(expl("Answer: " + it[2][0] + ". " + it[3], correctOf(n)));
        } else if (g.kind === "para") {
          slot.appendChild(h("div", { cls: "qt" }, numTile(n), h("span", { text: it[1] })));
          slot.appendChild(chips(it, g.letters, "para", draw));
          if (TEACH && state.chk[n]) slot.appendChild(expl("Answer: " + it[2] + ". " + it[3], correctOf(n)));
        } else if (g.kind === "tfng") {
          slot.appendChild(h("div", { cls: "qt" }, numTile(n), h("span", { text: it[1] })));
          slot.appendChild(chips(it, D.tfng, "tfng", draw));
          if (TEACH && state.chk[n]) slot.appendChild(expl("Answer: " + it[2] + ". " + it[3], correctOf(n)));
        } else if (g.kind === "mcq") {
          slot.appendChild(h("div", { cls: "qt" }, numTile(n), h("span", { html: ftag(esc(it[1])) })));
          var it2 = [n, it[1], it[3]];
          var col = h("div", { cls: "opts" });
          it[2].forEach(function (o) {
            var b = h("button", { cls: "opt" + (state.ans[n] === o[0] ? " sel" : ""),
              onclick: function () { if (locked(n)) return; state.ans[n] = o[0]; if (TEACH) state.chk[n] = true; draw(); updateTiles(); } },
              h("b", { text: o[0] }), h("span", { text: o[1] }));
            if (TEACH && state.chk[n]) { if (o[0] === it[3]) b.classList.add("right"); else if (state.ans[n] === o[0]) b.classList.add("wrong"); }
            col.appendChild(b);
          });
          slot.appendChild(col);
          if (TEACH && state.chk[n]) slot.appendChild(expl("Answer: " + it[3] + ". " + it[4], correctOf(n)));
        }
      }
      draw(); w.appendChild(slot);
    });
    return w;
  }

  function renderMulti(g, w) {
    var slot = h("div", { cls: "qi" });
    function draw() {
      slot.innerHTML = "";
      var sel = multiSel(g), key = "g" + g.firstq, done = TEACH && state.chk[key];
      var nums = []; for (var i = 0; i < g.n; i++) nums.push(g.firstq + i);
      var bar = h("div", { cls: "qt" }, h("span", { cls: "qn wide", id: "q" + g.firstq, text: nums[0] + "–" + nums[nums.length - 1] }),
        h("span", { cls: "muted", text: "Selected " + sel.length + " of " + g.n }));
      if (TEACH) bar.appendChild(ibtn("tick", "Check", function () { state.chk[key] = true; draw(); updateTiles(); }, "bare"));
      slot.appendChild(bar);
      var col = h("div", { cls: "opts" });
      g.options.forEach(function (o) {
        var on = sel.indexOf(o[0]) > -1;
        var b = h("button", { cls: "opt" + (on ? " sel" : ""), onclick: function () {
          if (locked(g.firstq)) return;
          var s = multiSel(g).slice(), k = s.indexOf(o[0]);
          if (k > -1) s.splice(k, 1); else if (s.length < g.n) s.push(o[0]); else return;
          state.ans["m" + g.firstq] = s; if (TEACH) delete state.chk[key]; draw(); updateTiles(); } },
          h("b", { text: o[0] }), h("span", { text: o[1] }));
        if (done) { var isR = g.answer.indexOf(o[0]) > -1; if (isR) b.classList.add("right"); else if (on) b.classList.add("wrong"); }
        col.appendChild(b);
        if (done && (isR || on)) col.appendChild(h("div", { cls: "ex " + (isR ? "ok" : "bad") }, h("span", { text: g.expl[o[0]] || "" })));
        var isR;
      });
      slot.appendChild(col);
      if (done) {
        var okc = sel.filter(function (x) { return g.answer.indexOf(x) > -1; }).length;
        slot.appendChild(h("div", { cls: "ex " + (okc === g.n ? "ok" : "bad") }, h("b", { text: okc + " of " + g.n + " correct. " }), h("span", { text: "Answers: " + g.answer.join(", ") + " (any order)." })));
      }
    }
    draw(); w.appendChild(slot); return w;
  }

  function renderQuestions() {
    var P = D.passages[state.p], box = $("#qs"), top = box.scrollTop; box.innerHTML = "";
    box.appendChild(h("div", { cls: "ptag", html: ICON.list + "Questions " + P.range[0] + "–" + P.range[1] }));
    P.groups.forEach(function (g) { box.appendChild(renderGroup(g)); });
    if (!TEACH) {
      var pi = state.p, bar = h("div", { cls: "sbar" });
      if (state.lock[pi]) bar.appendChild(h("span", { cls: "sdone", text: plab(P) + " submitted" }));
      else {
        bar.appendChild(h("button", { cls: "pill ghost", text: "Save progress", onclick: function () { saveNow(false).then(function () { setSave("Saved"); }); } }));
        bar.appendChild(h("button", { cls: "pill", text: "Submit " + plab(P), onclick: submit }));
      }
      box.appendChild(bar);
    }
    box.scrollTop = top;
  }

  /* ---------- chrome ---------- */
  function updateTiles() {
    scheduleSave();
    var foot = $("#tiles"); foot.innerHTML = "";
    D.passages.forEach(function (P, pi) {
      var grp = h("div", { cls: "tg" + (pi === state.p ? " cur" : "") });
      for (var n = P.range[0]; n <= P.range[1]; n++) (function (n) {
        grp.appendChild(h("button", { cls: "tile " + tileState(n), text: String(n), title: "Question " + n, onclick: function () { go(n); } }));
      })(n);
      foot.appendChild(grp);
    });
  }
  function setView(v) { $("#main").setAttribute("data-v", v); document.querySelectorAll(".mvb").forEach(function (b) { b.classList.toggle("on", b.dataset.v === v); }); }
  function go(n) {
    setView("q");
    var m = QMAP[n]; if (m.pi !== state.p) { state.p = m.pi; paint(); }
    var id = m.g.kind === "multi" ? m.g.firstq : n, e = document.getElementById("q" + id);
    if (e) e.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  function paint() {
    document.querySelectorAll(".tab").forEach(function (t, i) { t.classList.toggle("on", i === state.p); });
    $("#main").classList.toggle("nop", !D.passages[state.p].paras.length); renderPassage(); renderQuestions(); updateTiles(); $("#passage").scrollTop = 0; $("#qs").scrollTop = 0;
  }
  function modal(title, body, btns) {
    var ov = h("div", { cls: "ov" }), card = h("div", { cls: "card" }, h("h3", { text: title }));
    if (typeof body === "string") card.appendChild(h("p", { text: body })); else if (body) card.appendChild(body);
    var row = h("div", { cls: "brow" });
    btns.forEach(function (b) { row.appendChild(h("button", { cls: "pill" + (b.ghost ? " ghost" : ""), text: b.t, onclick: function () { if (!b.keep) ov.remove(); if (b.f) b.f(); } })); });
    card.appendChild(row); ov.appendChild(card); document.body.appendChild(ov); return ov;
  }
  function fontStep(d) {
    var cur = parseFloat(store("fs") || "18"); cur = Math.max(14, Math.min(30, cur + d)); store("fs", String(cur));
    document.documentElement.style.setProperty("--fs", cur + "px");
  }

  /* ---------- practice: login + submit ---------- */
  function rpc(fn, body, keep) {
    return fetch(D.sb.url + "/rest/v1/rpc/" + fn, { method: "POST", keepalive: !!keep, headers: { "Content-Type": "application/json", apikey: D.sb.key }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error((j && (j.message || j.hint)) || "error"); return j; }); });
  }
  function errText(e) {
    var m = String(e && e.message || e);
    if (m.indexOf("student_not_found") > -1) return "Student code not found. Please check it and try again.";
    if (m.indexOf("assignment_not_found") > -1) return "This test has not been assigned to your class.";
    return "Could not reach the server. Check your internet connection and try again.";
  }
  function login() {
    var inp = h("input", { cls: "gap big", type: "text", autocomplete: "off", spellcheck: "false", placeholder: "Student code", "aria-label": "Student code" });
    var hc = "";
    try { hc = (new URLSearchParams(location.search).get("s") || decodeURIComponent((location.hash || "").slice(1))).trim(); } catch (e) { }
    inp.value = hc || store("sc") || "";
    var msg = h("p", { cls: "err", text: "" });
    var ov = h("div", { cls: "ov solid" }, h("div", { cls: "card" }, h("h3", { text: D.title }), h("p", { text: "Enter your student code to start the test." }), inp, msg,
      h("div", { cls: "brow" }, h("button", { cls: "pill", text: "Start", onclick: go1 }))));
    function go1() {
      var c = inp.value.trim(); if (!c) { msg.textContent = "Please enter your code."; return; }
      msg.textContent = "Checking...";
      rpc("student_assignment", { p_student_code: c, p_assignment_code: D.code }).then(function (j) {
        state.code = c; state.sname = j.student_name || ""; store("sc", c);
        return rpc("get_progress", { p_student_code: c, p_assignment_code: D.code }).then(function (pg) {
          loadProgress(pg); $("#who").textContent = state.sname; ov.remove();
        });
      }).catch(function (e) { msg.textContent = errText(e); });
    }
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go1(); });
    document.body.appendChild(ov); setTimeout(function () { inp.focus(); }, 50);
    if (hc) { try { history.replaceState(null, "", location.pathname); } catch (e) { } go1(); }
  }
  function pr(pi) { return D.passages[pi].range; }
  function loadProgress(pg) {
    state.loading = true;
    var d = pg.answers || {}; state.ans = d.ans || {}; state.open = d.open || [];
    state.lock = {}; state.byId = {}; state.pres = {};
    (pg.parts || []).forEach(function (x) {
      var pi = x.part - 1; if (state.open.indexOf(pi) > -1) return;
      state.lock[pi] = true; state.pres[pi] = x.latest;
      (x.latest.items || []).forEach(function (it) { state.byId[it.id] = it.correct; });
    });
    var first = 0; for (var i = 0; i < D.passages.length; i++) { if (!state.lock[i]) { first = i; break; } }
    state.p = first; state.saved = JSON.stringify(draftBody()); state.loading = false;
    paint(); tabMarks(); setSave("");
  }
  function draftBody() { return { ans: state.ans, open: state.open }; }
  function setSave(t) { var e = $("#sv"); if (e) e.textContent = t; }
  function scheduleSave() {
    if (TEACH || !state.code || state.loading) return;
    var cur = JSON.stringify(draftBody()); if (cur === state.saved) return;
    setSave("Saving..."); clearTimeout(state.timer); state.timer = setTimeout(function () { saveNow(false); }, 1200);
  }
  function saveNow(keep) {
    if (TEACH || !state.code) return Promise.resolve();
    clearTimeout(state.timer);
    var body = draftBody(), cur = JSON.stringify(body); if (cur === state.saved) { setSave("Saved"); return Promise.resolve(); }
    return rpc("save_draft", { p_student_code: state.code, p_assignment_code: D.code, p_answers: body }, keep)
      .then(function () { state.saved = cur; setSave("Saved"); })
      .catch(function () { setSave("Not saved"); });
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") saveNow(true); });
  window.addEventListener("pagehide", function () { saveNow(true); });
  function tabMarks() {
    document.querySelectorAll(".tab").forEach(function (t, i) {
      var P = D.passages[i], r = state.pres[i];
      t.textContent = plab(P) + (state.lock[i] && r ? "  " + r.score + "/" + r.total : "");
    });
  }
  function partAnswers(pi) { var a = {}, r = pr(pi); for (var n = r[0]; n <= r[1]; n++) a["q" + n] = qValue(n); return a; }
  function submit() {
    var pi = state.p; if (state.lock[pi]) return;
    var r = pr(pi), un = 0; for (var n = r[0]; n <= r[1]; n++) if (!isAnswered(n)) un++;
    modal("Submit " + plab(D.passages[pi]) + "?", un ? un + " question" + (un > 1 ? "s are" : " is") + " still unanswered in this passage. You cannot change your answers after submitting." : "You cannot change your answers in this passage after submitting.",
      [{ t: "Keep working", ghost: true }, { t: "Submit", f: function () { doSubmit(pi); } }]);
  }
  function doSubmit(pi) {
    var wait = modal("Submitting...", "Please wait.", []);
    rpc("submit_assignment_part", { p_student_code: state.code, p_assignment_code: D.code, p_part: D.passages[pi].id, p_answers: partAnswers(pi) })
      .then(function (j) {
        wait.remove(); state.lock[pi] = true; state.pres[pi] = { score: j.score, total: j.total, is_late: j.is_late, counts_for_score: j.counts_for_score, items: j.items };
        j.items.forEach(function (x) { state.byId[x.id] = x.correct; });
        state.open = state.open.filter(function (x) { return x !== pi; });
        saveNow(false); paint(); tabMarks(); showResult(pi, j);
      }).catch(function (e) { wait.remove(); modal("Could not submit", errText(e), [{ t: "OK" }]); });
  }
  function showResult(pi, j) {
    var left = 0; D.passages.forEach(function (P, i) { if (!state.lock[i]) left++; });
    var body = h("div", null,
      h("p", { cls: "score", text: j.score + " / " + j.total }),
      h("p", { text: j.counts_for_score ? "This is your first attempt at this passage, so this score counts." : "This is a retake. Only your first attempt at each passage counts for your score." }),
      j.is_late ? h("p", { cls: "err", text: "Submitted after the deadline (marked as late)." }) : null,
      h("p", { cls: "muted", text: "Green tiles are correct, red tiles are wrong. Correct answers are not shown." + (left ? " " + left + " passage" + (left > 1 ? "s" : "") + " left to submit." : " You have submitted all passages.") }));
    var next = -1; for (var i = 0; i < D.passages.length; i++) if (!state.lock[i]) { next = i; break; }
    var btns = [{ t: "Review", ghost: true }, { t: "Try again", ghost: true, f: function () { retry(pi); } }];
    if (next > -1) btns.push({ t: "Next passage", f: function () { state.p = next; paint(); } });
    modal(plab(D.passages[pi]) + " result", body, btns);
  }
  function retakeAll() {
    var any = false; D.passages.forEach(function (P, i) { if (state.lock[i]) any = true; });
    if (!any) { modal("Nothing to retake yet", "Submit at least one passage first.", [{ t: "OK" }]); return; }
    modal("Retake the whole test?", "All your answers will be cleared. Only your first full attempt counts for your score; retakes do not count.",
      [{ t: "Cancel", ghost: true }, { t: "Retake", f: function () {
        D.passages.forEach(function (P, pi) {
          for (var n = P.range[0]; n <= P.range[1]; n++) { delete state.ans[n]; delete state.byId["q" + n]; }
          P.groups.forEach(function (g) { if (g.kind === "multi") delete state.ans["m" + g.firstq]; });
          state.lock[pi] = false; delete state.pres[pi]; if (state.open.indexOf(pi) < 0) state.open.push(pi);
        });
        state.p = 0; saveNow(false); paint(); tabMarks();
      } }]);
  }
  function retry(pi) {
    var r = pr(pi); for (var n = r[0]; n <= r[1]; n++) { delete state.ans[n]; delete state.byId["q" + n]; }
    D.passages[pi].groups.forEach(function (g) { if (g.kind === "multi") delete state.ans["m" + g.firstq]; });
    state.lock[pi] = false; delete state.pres[pi]; if (state.open.indexOf(pi) < 0) state.open.push(pi);
    saveNow(false); paint(); tabMarks();
  }

  /* ---------- teaching ---------- */
  function reset() { modal("Start again?", "All your answers on this page will be cleared.", [{ t: "Cancel", ghost: true }, { t: "Clear all", f: function () { state.ans = {}; state.chk = {}; paint(); } }]); }
  var tip;
  function setupVocab() {
    tip = h("div", { cls: "tip" }); document.body.appendChild(tip);
    var box = $("#passage");
    function show(m) {
      var v = D.passages[state.p].vocab[+m.dataset.i]; tip.innerHTML = "<b>" + esc(v[0]) + "</b> " + esc(v[1]);
      var r = m.getBoundingClientRect(); tip.style.display = "block";
      tip.style.left = Math.max(8, Math.min(innerWidth - tip.offsetWidth - 8, r.left)) + "px"; tip.style.top = (r.bottom + 6) + "px";
    }
    box.addEventListener("mouseover", function (e) { if (e.target.classList && e.target.classList.contains("v") && state.vocab) show(e.target); });
    box.addEventListener("mouseout", function (e) { if (e.target.classList && e.target.classList.contains("v")) tip.style.display = "none"; });
  }

  /* ---------- splitter ---------- */
  function setupSplit() {
    var sp = $("#split"), main = $("#main"), drag = false;
    sp.addEventListener("pointerdown", function (e) { drag = true; sp.setPointerCapture(e.pointerId); });
    sp.addEventListener("pointermove", function (e) {
      if (!drag) return; var r = main.getBoundingClientRect(), p = ((e.clientX - r.left) / r.width) * 100;
      main.style.setProperty("--lw", Math.max(25, Math.min(75, p)) + "%");
    });
    sp.addEventListener("pointerup", function () { drag = false; });
  }

  /* ---------- boot ---------- */
  function boot() {
    var fs = parseFloat(store("fs") || "18"); document.documentElement.style.setProperty("--fs", fs + "px");
    var tabs = h("nav", { cls: "tabs" });
    D.passages.forEach(function (P, i) { tabs.appendChild(h("button", { cls: "tab" + (i === 0 ? " on" : ""), text: plab(P), onclick: function () { state.p = i; paint(); } })); });
    var tools = h("div", { cls: "tools" }, h("span", { id: "sv", cls: "who2" }), h("span", { id: "who", cls: "who2" }),
      h("button", { cls: "fsb", text: "A−", title: "Smaller text", onclick: function () { fontStep(-1); } }),
      h("button", { cls: "fsb", text: "A+", title: "Larger text", onclick: function () { fontStep(1); } }));
    if (TEACH) {
      tools.appendChild(ibtn("book", "Show or hide new words", function (e) { state.vocab = !state.vocab; e.currentTarget.classList.toggle("off", !state.vocab); renderPassage(); }));
      tools.appendChild(ibtn("reset", "Start again", reset));
    } else tools.appendChild(ibtn("tick", "Submit this passage", submit, "dark"));
    if (!TEACH) tools.appendChild(ibtn("reset", "Retake the whole test", retakeAll));
    tools.appendChild(ibtn("full", "Full screen", function () {
      try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { }
    }, "hide-m"));
    $("#hd").appendChild(h("div", { cls: "brand", text: D.title })); $("#hd").appendChild(tabs); $("#hd").appendChild(tools);
    var mv = h("div", { cls: "mv" }); ["p", "q"].forEach(function (v) { mv.appendChild(h("button", { cls: "mvb" + (v === "p" ? " on" : ""), "data-v": v, text: v === "p" ? "Passage" : "Questions", onclick: function () { setView(v); } })); });
    $("#hd").appendChild(mv); $("#main").setAttribute("data-v", "p");
    setupSplit(); if (TEACH) setupVocab();
    paint();
    if (!TEACH) login();
  }
  document.addEventListener("DOMContentLoaded", boot);
})();
</script><script src="../../back-to-portal.js"></script>
</body></html>
