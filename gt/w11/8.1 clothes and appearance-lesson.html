html{font-size:clamp(18px,2.3vmin,30px)}

.top{display:flex;align-items:center;gap:16px;min-height:48px}

.ib.on{background:#111;color:#fff}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.navbtn{background:#111;color:#fff;border-radius:999px;width:88px;height:48px;display:grid;place-items:center}
.navbtn:disabled{background:#d8d8da}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}

canvas.ink{position:absolute;left:0;top:0;pointer-events:none;z-index:5}
.menu{position:fixed;inset:0;background:#fff;z-index:50;overflow:auto;padding:24px 28px;display:none}

.menu h3{margin:18px 0 8px;font-size:1.05em}
.menu .row{display:flex;flex-wrap:wrap;gap:8px}
.menu .mb{background:#f2f2f3;border-radius:999px;padding:10px 18px;min-height:44px}
.menu .mb.on{background:#111;color:#fff}
.menu .close{position:fixed;right:20px;top:16px}
.pill{background:#111;color:#fff;border-radius:999px;padding:10px 20px;min-height:46px}
.pill.light{background:#f2f2f3;color:#111}

/* cards */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:14px;grid-auto-rows:minmax(0,1fr)}
.vcard{display:flex;flex-direction:column;min-height:0;background:#f2f2f3;border-radius:20px;overflow:hidden;border:2px solid transparent;cursor:pointer}

.vcard .pic img{width:100%;height:100%;object-fit:contain;display:block}
.vcard .info{padding:10px 14px 12px}
.vcard.nopic .info{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px}
.wl{display:flex;align-items:center;gap:8px}
.wd{font-weight:700;font-size:1.3em}
.pos{color:#76767b;font-size:.85em}
.spk{margin-left:auto;width:44px;height:44px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;flex:none}
.spk svg{width:22px;height:22px}
.ipa{color:#55555a}
.det{display:none;margin-top:6px;border-top:1px solid #d3d3d7;padding-top:6px}
.vcard.open .det{display:block}
.vn{font-weight:700}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.q{background:#f6f6f7;border-radius:18px;padding:12px 16px;display:flex;gap:16px;align-items:center}

.q .qm{flex:1;min-width:0}
.qt{font-weight:600;margin-bottom:8px}
.qt u{text-decoration-thickness:2px;text-underline-offset:3px}
.opts{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:10px}
.opt{min-height:48px;border:2px solid #cfcfd3;border-radius:999px;background:#fff;padding:6px 16px;display:flex;gap:8px;align-items:center}
.opt .l{color:#76767b;font-weight:700}
.opt.ok{background:#dcf2e3;border-color:#2e9e57}
.opt.bad{background:#fbe0e0;border-color:#d64545}
.fb{min-height:1.4em;margin-top:6px;font-size:.92em;color:#55555a}
.fb.ok{color:#1f7a42}
.fb.bad{color:#b02a2a}
/* match */
.mt{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.mt-imgs{flex:1;min-height:0;display:grid;grid-auto-rows:minmax(0,1fr);grid-template-columns:repeat(var(--c,5),minmax(0,1fr));gap:12px}
.mt-img{display:flex;flex-direction:column;min-height:0;background:#f2f2f3;border-radius:16px;border:3px solid transparent;padding:6px;align-items:center}

.mt-img img{width:100%;height:100%;object-fit:contain;display:block}
.mt-img .cap{min-height:1.5em;font-weight:700;padding-top:4px}
.mt-img.sel,.chip.sel{border-color:#111}

.mt-img.done{background:#dcf2e3;border-color:#2e9e57}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{background:#f2f2f3;border:3px solid transparent;border-radius:999px;padding:8px 20px;min-height:48px;font-weight:600}

.msg{text-align:center;font-weight:700;min-height:1.5em}
/* sort */
.sort{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.sortTop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}

.bigchip.bad{background:#d64545}
.bigchip.ok{background:#2e9e57}
.groups{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gp{background:#f2f2f3;border-radius:18px;border:3px solid transparent;padding:12px;display:flex;flex-direction:column;gap:8px;align-content:start;min-height:0;overflow:hidden}

.tags{display:flex;flex-wrap:wrap;gap:6px}

/* guess, flip, fast */
.g5{flex:1;min-height:0;display:grid;grid-auto-rows:minmax(0,1fr);grid-template-columns:repeat(var(--c,5),minmax(0,1fr));gap:12px}
.gc{background:#f2f2f3;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;min-height:0;text-align:center;cursor:pointer;border:2px solid transparent}

.fc{background:#f2f2f3;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;cursor:pointer;border:2px solid transparent;min-height:0}

.tile.got{border-color:#2e9e57;background:#dcf2e3}

.count{font-weight:700;font-size:1.2em;margin-left:auto}
/* layouts */
.two{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px}
.panel{background:#f2f2f3;border-radius:20px;padding:14px 18px;min-height:0;overflow:auto}

.panel ul{margin:0;padding-left:1.1em}
.panel li{margin:6px 0}

.pic.big img{width:100%;height:100%;object-fit:contain}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.hero h1{margin:0;font-size:2.6em;line-height:1.1}
.hero .sub{color:#55555a;font-size:1.2em}
.hero .qbig{font-size:2em;font-weight:700;max-width:22em}
.say{display:flex;flex-direction:column;gap:10px}
.say .row{background:#fff;border-radius:14px;padding:8px 14px}
.cols3{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.board{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}

.board .col b{display:block;background:#fff}
.rc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;flex:1;min-height:0;align-content:start}
.rcard{background:#f2f2f3;border-radius:16px;padding:12px;min-height:3.2em;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-weight:600;border:2px solid transparent}
.rcard.open{background:#fff;border-color:#111}
.rcard .vn{font-weight:400;color:#55555a;display:none}
.rcard.open .vn{display:block}
.rcard small{display:block}
.toolhint{color:#76767b}
@media (max-aspect-ratio:1/1){
 .grid,.groups,.cols3,.rc{grid-template-columns:repeat(2,minmax(0,1fr))}
 .opts{--n:2 !important}
 .two,.board{grid-template-columns:1fr}

 .vcard{min-height:12rem}
}

.compact .qm{display:grid;grid-template-columns:2em minmax(0,1fr);column-gap:8px;align-items:center}.compact .qt{margin:0}.compact .fb{grid-column:2;margin-top:2px}.compact .q{padding:8px 16px}

.navbtn svg{width:26px;height:26px}.tab{padding:8px 10px}.top{gap:12px}

.pic,.mt-img .pic,.gc .pic,.tile .pic,.vcard .pic,.pic.big{position:relative;display:block}
.pic img,.mt-img .pic img,.gc .pic img,.tile .pic img,.vcard .pic img,.pic.big img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}

/* photo-led B1 speaking tasks */
.visual{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:stretch}
.visual-photo{min-height:0;border-radius:20px;overflow:hidden;background:#f2f2f3;position:relative}
.visual-photo img{width:100%;height:100%;object-fit:cover;display:block}
.visual-panel{min-height:0;display:flex;flex-direction:column;gap:12px;overflow:auto;padding:4px 4px 4px 0}

.visual-options{display:grid;grid-template-columns:1fr;gap:8px}
.visual-option{background:#f2f2f3;border:2px solid transparent;border-radius:14px;padding:11px 14px;font:inherit;font-weight:650;cursor:pointer;text-align:left;line-height:1.25}
.visual-option:hover{background:#e9e9eb}

.visual-option.good{border-color:#2d7658;background:#edf6f0}

@media(max-width:760px){.visual{grid-template-columns:1fr;grid-template-rows:minmax(150px,.8fr) minmax(0,1fr)}.visual-photo{min-height:150px}.visual-panel{overflow:auto}}

.response-builder{display:block}.response-group{display:flex;gap:7px;align-items:flex-start;flex-wrap:wrap;margin:7px 0}.response-group>b{min-width:130px;padding-top:7px;font-size:.9em}.response-group .chip{font-size:.88em}.free-wrap{width:min(900px,100%);margin:auto}.free-wrap .panel{display:flex;flex-direction:column;gap:13px}.free-wrap .visual-question{font-size:1.35em}.feedback-workshop{display:flex;flex-direction:column;gap:12px;max-width:900px;margin:auto}.feedback-workshop .visual-options{grid-template-columns:1fr}.feedback-workshop .panel{display:flex;flex-direction:column;gap:9px}.feedback-workshop [hidden]{display:none!important}

var rail=h('div',{class:'rail'}),top=h('div',{class:'top'}),tabs=h('div',{class:'tabs'}),timerEl=h('button',{class:'timer',hidden:true});
var stage=h('div',{class:'stage'}),dots=h('div',{class:'dots'});
var prev=h('button',{class:'navbtn','aria-label':'Previous',onclick:function(){go(cur-1)}},ic('left')),next=h('button',{class:'navbtn','aria-label':'Next',onclick:function(){go(cur+1)}},ic('right'));
var canvas=h('canvas',{class:'ink'});stage.append(canvas);
slides.forEach(function(s,i){
  var sh=h('div',{class:'sh'},h('h2',null,s.title),s.sub?h('span',{class:'sub'},s.sub):null);
  var acts=h('div',{class:'acts'});sh.append(acts);
  var body;
  if(s.type==='title'||s.type==='prompt'&&false)body=null;
  var el=h('div',{class:'slide'});
  var fn=BODY[s.type];
  body=s.type==='match'?matchBody(s,i+1):(s.title==='Give fitting-room feedback'?feedbackBody(s):fn(s));
  if(!body.classList.contains('body')&&['grid','mt','quiz','sort','g5','two','board','rc','hero','cols3'].every(function(c){return !body.classList.contains(c)}))body=h('div',{class:'body'},body);
  if(s.type!=='title')el.append(sh);
  el.append(body);
  if(s.type==='cards'){var b=h('button',{class:'ib','aria-label':'Show all',onclick:function(){body.revealAll()}},ic('eye'));acts.append(b)}
  if(['match','quiz','sort','guess','flip','fast','recap','situations'].indexOf(s.type)>=0){
    var rb=h('button',{class:'ib','aria-label':'Again',onclick:function(){
      var nb=s.type==='match'?matchBody(s,i+1+Math.floor(Math.random()*50)):fn(s);
      body.replaceWith(nb);body=nb;if(s.type==='fast')cntSwap();}},ic('redo'));
    acts.append(rb)}
  if(s.type==='fast'){var cnt=body.counter;acts.prepend(cnt);}
  function cntSwap(){var old=acts.querySelector('.count');if(old)old.replaceWith(body.counter)}
  els.push(el);stage.append(el);
  dots.append(h('span',{class:'dot'}))});
var secs=D.tabs;
secs.forEach(function(t){tabs.append(h('button',{class:'tab','data-id':t.id,onclick:function(){for(var i=0;i<slides.length;i++)if(slides[i].sec===t.id){go(i);break}}},t.label))});
top.append(h('div',{class:'brand'},D.brand),tabs,timerEl);
var bottom=h('div',{class:'bottom'},prev,dots,next);
/* rail tools */
var tool=('ontouchstart' in window||navigator.maxTouchPoints>0)?'pen':'pointer',colors=['#111111','#d64545','#2455d6'],ci=0;
var tbtn={};
function rbtn(name,icon,fn){var b=h('button',{'aria-label':name,onclick:fn},ic(icon));rail.append(b);return b}
var menuBtn=rbtn('Menu','menu',function(){openMenu()});
rbtn('Fullscreen','full',function(){try{var d=document,e=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}}catch(x){}});
rail.append(h('div',{class:'sep'}));
['pointer:pointer','pen:pen','hl:hl','eraser:eraser'].forEach(function(p){var a=p.split(':');tbtn[a[0]]=rbtn(a[0],a[1],function(){setTool(a[0])})});
var swatch=h('span',{class:'swatch',style:'background:'+colors[0]});
var colBtn=h('button',{'aria-label':'Colour',onclick:function(){ci=(ci+1)%colors.length;swatch.style.background=colors[ci]}},swatch);rail.append(colBtn);
var undoBtn=rbtn('Undo','undo',function(){var a=ink[cur];if(a&&a.length){a.pop();redraw()}});
rbtn('Clear','trash',function(){ink[cur]=[];redraw()});
rail.append(h('div',{class:'sep'}));
var timerBtn=rbtn('Timer','timer',function(){toggleTimer()});
function setTool(t){tool=t;Object.keys(tbtn).forEach(function(k){tbtn[k].classList.toggle('on',k===t)})}
setTool(tool);
/* menu */
var menu=h('div',{class:'menu'});
function openMenu(){
  menu.innerHTML='';menu.append(h('button',{class:'ib close','aria-label':'Close',onclick:function(){menu.classList.remove('on')}},ic('close')));
  secs.forEach(function(t){
    menu.append(h('h3',null,t.label));
    var row=h('div',{class:'row'});
    slides.forEach(function(s,i){if(s.sec===t.id)row.append(h('button',{class:'mb'+(i===cur?' on':''),onclick:function(){menu.classList.remove('on');go(i)}},s.title))});
    menu.append(row)});
  menu.classList.add('on')}
/* ink */
var ink={},drawing=null,suppress=false;
function sizeCanvas(){var sl=els[cur]||stage,w=Math.max(sl.scrollWidth,stage.clientWidth),hh=Math.max(sl.scrollHeight,stage.clientHeight),r=window.devicePixelRatio||1;
  if(canvas.width!==Math.round(w*r)||canvas.height!==Math.round(hh*r)){canvas.width=Math.round(w*r);canvas.height=Math.round(hh*r);canvas.style.width=w+'px';canvas.style.height=hh+'px'}return r}
function redraw(){var r=sizeCanvas(),c=canvas.getContext('2d');c.setTransform(r,0,0,r,0,0);c.clearRect(0,0,canvas.width,canvas.height);(ink[cur]||[]).concat(drawing?[drawing.s]:[]).forEach(function(s){strokePath(c,s)})}
function strokePath(c,s){
  c.save();c.lineCap='round';c.lineJoin='round';c.strokeStyle=s.c;c.lineWidth=s.w;
  if(s.t==='hl'){c.globalAlpha=.4;c.globalCompositeOperation='multiply'}
  c.beginPath();s.p.forEach(function(p,i){if(i===0)c.moveTo(p[0],p[1]);else c.lineTo(p[0],p[1])});
  if(s.p.length===1)c.lineTo(s.p[0][0]+.01,s.p[0][1]);c.stroke();c.restore()}
function pt(e){var r=canvas.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
stage.addEventListener('pointerdown',function(e){
  if(tool==='pointer')return;
  if(e.pointerType==='touch')return;
  e.preventDefault();sizeCanvas();
  var p=pt(e);
  if(tool==='eraser'){drawing={er:true};erase(p);try{stage.setPointerCapture(e.pointerId)}catch(x){}return}
  drawing={s:{t:tool,c:tool==='hl'?'#ffd400':colors[ci],w:tool==='hl'?22:3.2,p:[p]}};
  try{stage.setPointerCapture(e.pointerId)}catch(x){}redraw()});
stage.addEventListener('pointermove',function(e){
  if(!drawing)return;e.preventDefault();var p=pt(e);
  if(drawing.er){erase(p);return}
  var l=drawing.s.p[drawing.s.p.length-1];if(Math.abs(l[0]-p[0])+Math.abs(l[1]-p[1])<1.2)return;
  drawing.s.p.push(p);redraw()});
function endStroke(){if(!drawing)return;if(!drawing.er){(ink[cur]=ink[cur]||[]).push(drawing.s)}drawing=null;redraw();suppress=true;setTimeout(function(){suppress=false},350)}
stage.addEventListener('pointerup',endStroke);stage.addEventListener('pointercancel',endStroke);
function erase(p){var a=ink[cur]||[],n=a.length;ink[cur]=a.filter(function(s){return!s.p.some(function(q){return Math.hypot(q[0]-p[0],q[1]-p[1])<(s.t==='hl'?20:16)})});if(ink[cur].length!==n)redraw()}
stage.addEventListener('click',function(e){if(suppress){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('touchstart',function(e){if(tool==='pointer')return;var t=e.touches[0];if(t&&t.touchType==='stylus'&&stage.contains(e.target))e.preventDefault()},{passive:false});
document.addEventListener('touchmove',function(e){if(drawing&&e.cancelable)e.preventDefault()},{passive:false});
new ResizeObserver(function(){redraw()}).observe(stage);
stage.addEventListener('scroll',function(){redraw()});
/* timer */
var tLeft=0,tRun=null,tPreset=0;
function fmt(s){var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x}
function tShow(){timerEl.hidden=!tPreset;timerEl.textContent=fmt(tLeft);timerEl.classList.toggle('end',tLeft===0&&tPreset>0);timerBtn.disabled=!tPreset;timerBtn.classList.toggle('on',!!tRun)}
function toggleTimer(){
  if(!tPreset)return;
  if(tRun){clearInterval(tRun);tRun=null;tShow();return}
  if(tLeft<=0)tLeft=tPreset;
  tRun=setInterval(function(){tLeft--;if(tLeft<=0){tLeft=0;clearInterval(tRun);tRun=null;beep()}tShow()},1000);tShow()}
timerEl.addEventListener('click',function(){if(tRun){clearInterval(tRun);tRun=null}tLeft=tPreset;tShow()});
/* navigation */
function go(i){
  if(i<0||i>=slides.length)return;
  cur=i;
  els.forEach(function(e,k){e.classList.toggle('on',k===i)});
  dots.querySelectorAll('.dot').forEach(function(d,k){d.classList.toggle('on',k===i)});
  tabs.querySelectorAll('.tab').forEach(function(t){var on=t.dataset.id===slides[i].sec;t.classList.toggle('on',on);if(on)t.scrollIntoView({block:'nearest',inline:'nearest'})});
  prev.disabled=i===0;next.disabled=i===slides.length-1;
  if(tRun){clearInterval(tRun);tRun=null}
  tPreset=slides[i].t||0;tLeft=tPreset;tShow();
  stage.scrollTop=0;
  try{history.replaceState(null,'','#s'+(i+1))}catch(e){location.hash='s'+(i+1)}
  requestAnimationFrame(redraw)}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1)});
var app=h('div',{class:'main'},top,stage,bottom);
document.body.append(rail,app,menu);
var m=/^#s(\d+)$/.exec(location.hash);
go(m?Math.min(slides.length,Math.max(1,+m[1]))-1:0);
window.__app={go:go,get cur(){return cur},ink:ink};
})();
</script>
</body></html>
