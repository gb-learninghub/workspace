.mv{display:none}

.sdone{font-size:15px;color:var(--okl);font-weight:600}
.brow{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

s, concerns persist about the ethical implications and accuracy of AI-driven solutions. Misdiagnoses or data privacy breaches can lead to significant consequences for patients. {b:(23)} _______."], ["", "AI in healthcare presents the potential for groundbreaking advancements. Offering significant transformative advantages for both patients and providers, {b:(24)} _______. However, substantial regulatory, ethical, and technical challenges remain. {b:(25)} _______."]], "range": [21, 25], "groups": [{"kind": "mcq", "title": "Questions 21–25", "lines": ["Read the following passage about AI in healthcare and mark the letter A, B, C, or D on your answer sheet to indicate the option that best fits each of the numbered blanks from 21 to 25."], "items": [[21, "", [["A", "of which has increasingly become integral to modern medical practices"], ["B", "having increasingly become integral to modern medical practices"], ["C", "is increasingly becoming integral to modern medical practices"], ["D", "that is increasingly becoming integral to modern medical practices"]]], [22, "", [["A", "makes AI tools particularly attractive to healthcare providers"], ["B", "converts AI tools into something appealing to healthcare providers"], ["C", "in which AI tools are especially attractive to healthcare providers"], ["D", "that renders AI tools especially attractive to healthcare providers"]]], [23, "", [["A", "Aiming to address biases in AI, many organizations are implementing rigorous testing protocols"], ["B", "The risk of technology malfunctioning during critical medical situations is also a worry"], ["C", "They raise concerns about the accuracy of AI due to the absence of potential biases in training data"], ["D", "AI technologies have been developed to enhance decision-making in healthcare"]]], [24, "", [["A", "we expect it to have a revolutionary impact on healthcare delivery"], ["B", "a revolutionary role in healthcare will be taken by these technologies"], ["C", "people expect it to re ing new genres and styles that mix traditions to create something unique."], ["4", "Thanks to cultural diversity, the world of cuisine has opened up to us with an almost {u:infinite} range of flavours and recipes, tempting our taste buds and expanding our culinary experiences. In fashion, designers are inspired by cultural diversity, creating clothing that celebrates the beauty and individuality of different cultures. Embracing cultural diversity enriches our lives in countless ways and reminds us of the beauty of our shared humanity."], ["5", "Cultural diversity has also proven to be an asset for businesses and organizations that actively prioritize it. Recent studies show that teams of diverse individuals tend to be more productive, creative, and innovative. This is due to the various perspectives and skill sets that they bring to the table."], ["6", "Moreover, companies that value and promote diversity often stand out among competitors in attracting and retaining top talent. Employees tend to feel valued and engaged when they work for {u:those} welcoming and creating a diverse environment. By prioritizing diversity and inclusion, businesses can improve their bottom line and foster a more representative and equitable workplace."], ["", "(Adapted from https://blog.opalgroup.net/)"]], "range": [26, 33], "groups": [{"kind": "mcq", "title": "Questions 26–33", "lines": ["Read the passage carefully. Choose an option (A, B, C, or D) that best answers each question."], "items": [[26, "What is the best title for the passage?", [["A", "The Value of Cultural Diversity"], ["B", "Cultural Identity Through Art and Fashion"], ["C", "How Diversity Shapes Economies"], ["D", "The Economic Benefits of Diversity"]]], [27, "In paragraph 1, it is NOT mentioned that _______.", [["A", "cultural diversity is a fundamental human right"], ["B", "cultural diversity is a desirable trait of a vibrant society"], ["C", "everyone must value and adopt cultural diversity"], ["D", "our understanding of the world is enriched thanks to cultural diversity"]]], [28, "In paragraph 2, it is mentioned that cultural diversity _______.", [["A", "breaks down harmful stereotypes"], ["B", "hinders economic growth"], ["C", "leads to new inventions"], ["D", "promotes unity in society"]]], [29, "In paragraph 3, the author uses the word {u:single} to _______", [["A", "highlight the importance of traditional art forms"], ["B", "suggest that cultural diversity is limited to certain areas"], ["C", "emphasize the wide-ranging impact of cultural diversity"], ["D", "indicate that diversity does not influence modern music"]]], [30, "In paragraph 4, the word {u:infinite} can be replaced by _______.", [["A", "important"], ["B", "unlimited"], ["C", "previous"], ["D", "impolite"]]], [31, "It can be seen in paragraphs 2, 3, and 4 that _______.", [["A", "not everyone benefits from cultural diversity"], ["B", "cultural diversity completes, beautifies and enriches life"], ["C", "the benefits of cultural diversity are often intangible"], ["D", "cultural diversity brings both benefits and challenges"]]], [32, "It can be inferred from paragraph 5 that _______", [["A", "teams with diverse members may face difficulties in achieving high performance"], ["B", "organizations that value diversity may encounter challenges in maintaining innovation"], ["C", "creating a diverse work environment can lead to unintended negative consequences"], ["D", "companies with diversity might experience increased creativity and productivity"]]], [33, "The word {u:those} in paragraph 6 refers to _______.", [["A", "competitors"], ["B", "employees"], ["C", "top talent"], ["D", "companies"]]]]}]}, {"id": 4, "label": "Part 4", "title": "Reading 2", "paras": [["", "\"Just finished editing a short film for my photography class,\" types Maya Chen in a group chat, while simultaneously helping coordinate her basketball team's practice schedule and managing three different art accounts. {b:[I]} It's 9 PM on a typical Tuesday, and like many of her peers, Maya's digital engagement runs far deeper than casual scrolling or gaming."], ["", "{b:[II]} In local gaming cafes, the scene tells an unexpected story. Teenagers huddle around screens, but they're not just playing games - they're running small businesses, organizing community events, and even learning foreign languages through international gaming partners. \"Yesterday I practiced Japanese with my raid team,\" says Alex Rodriguez, who picked up the language through his gaming community. \"Today I'm helping design merchandise for our team's upcoming charity stream.\""], ["", "{u:What adults often miss in these digital interactions is their layered complexity.}"], ["", "{b:[III]} During a typical study session, James Park seamlessly weaves between editing YouTube tutorials, managing social media for local businesses, and collaborating on class projects. His YouTube channel, which started as a hobby sharing gaming clips, now serves as a portfolio for potential clients. \"Each video teaches me something new about editing, marketing, or audience engagement\", James explains while adjusting color grades on his latest project."], ["", "School clubs have taken notice of this digital sophistication. {b:[IV]} The debate team now runs a podcast analyzing current events, while the art club showcases student work through carefully {b:curated} Instagram galleries. \"We're not just posting pictures\", explains Sarah Thompson, head of the media club. \"We're building portfolios, learning brand management, and developing professional networks.\""], ["", "Local creative studios report an interesting trend: teenagers arriving with increasingly sophisticated digital skills. \"They understand audience engagement instinctively,\" notes studio owner David Chen. \"Many have been managing online communities since middle school.\" This early exposure to content creation often translates into unexpected career paths. Emma Watson, who started by making simple gaming videos, now freelances as a video editor for environmental organizations. She’s really {b:hit the ground running}, combining her technical skills with her passion for sustainability."]], "range": [34, 43], "groups": [{"kind": "mcq", "title": "Questions 34–43", "lines": ["Read the following passage and mark the letter A, B, C, or D on your answer sheet to indicate the option that best fits each of the numbered blanks from 34 to 43."], "items": [[34, "Where in the passage does the following sentence best fit?\nDigital engagement among teenagers extends far beyond casual entertainment into professional skill development.", [["A", "[I]"], ["B", "[II]"], ["C", "[III]"], ["D", "[IV]"]]], [35, "The word \"they\" in paragraph 2 refers to _______.", [["A", "students"], ["B", "screens"], ["C", "teenagers"], ["D", "cafes"]]], [36, "According to the passage, which of the following activities is NOT described as taking place in gaming cafes?", [["A", "Running small businesses"], ["B", "Learning foreign languages"], ["C", "Organizing community events"], ["D", "Editing YouTube content"]]], [37, "Which of the following best paraphrases the underlined sentence in paragraph 3?", [["A", "Adults frequently fail to perceive that these digital interactions involve multiple, intricate layers."], ["B", "These digital interactions are complex on many levels, a detail that often escapes adult awareness."], ["C", "The intricate and multifaceted nature of digital interactions is often overlooked by adults."], ["D", "Adults are commonly unaware that digital interactions possess an intricately layered structure."]]], [38, "The word \"curated\" in paragraph 4 is closest in meaning to _______.", [["A", "organized"], ["B", "collected"], ["C", "displayed"], ["D", "managed"]]], [39, "Which of the following best summarizes paragraph 4?", [["A", "Students are learning to build professional networks through clubs."], ["B", "Clubs are innovating with digital media to showcase their work."], ["C", "School clubs have enhanced their activities by using digital tools"], ["D", "Digital sophistication is helping clubs enhance traditional activities."]]], [40, "Which of the following is TRUE according to the passage?", [["A", "The art club curates student work through dedicated Instagram gallery platforms."], ["B", "James's recreational video content developed into various professional work samples."], ["C", "Digital studios hire teenagers because of their advanced content creation skills."], ["D", "Local gaming cafes can function as spaces for teenagers' entrepreneurial activities."]]], [41, "The phrase \"hit the ground running\" in the final paragraph could best be replaced by _______.", [["A", "finished effectively"], ["B", "moved quickly"], ["C", "adapted well"], ["D", "learned fast"]]], [42, "What can be inferred from the passage?", [["A", "Students managing online communities often possess superior content engagement understanding."], ["B", "Teenagers begin developing their media management experience well before entering high school."], ["C", "Early exposure to digital content creation naturally leads to environmental advocacy careers."], ["D", "Youth-driven gaming channels frequently transform into professional development opportunities."]]], [43, "Which of the following best summarizes the passage?", [["A", "Teenagers merge online gaming with professional development, while simultaneously building portfolios and managing digital communities through diverse platforms."], ["B", "Modern youth leverage gaming environments and social media to develop marketable skills, creating unexpected pathways toward professional careers."], ["C", "Digital spaces enable teenagers to blend academic work, creative projects, and professional growth while managing multiple online responsibilities."], ["D", "Students transform recreational gaming activities into learning opportunities, leading creative studios to recognize their sophisticated digital capabilities."]]]]}]}, {"id": 5, "label": "Part 5", "title": "Homework", "paras": [], "range": [44, 63], "groups": [{"kind": "mcq", "title": "Exercise 1", "lines": ["Choose the best answer A, B, C or D."], "items": [[44, "Living in the city provides a lot of __________, such as access to education, healthcare, and entertainment.", [["A", "expenses"], ["B", "conveniences"], ["C", "rush hours"], ["D", "crowded spaces"]]], [45, "The rapid urbanization in many countries has led to the reduction of available __________ for agricultural production.", [["A", "forest"], ["B", "space"], ["C", "resources"], ["D", "farmland"]]], [46, "Many people find it difficult to __________ an apartment in the city due to the rising cost of rent.", [["A", "afford"], ["B", "urbanise"], ["C", "reside"], ["D", "reduce"]]], [47, "High-rise buildings are a common feature in urban areas, especially where land for development is __________.", [["A", "increase"], ["B", "decrease"], ["C", "limited"], ["D", "abundant"]]], [48, "The government in Seoul is working to __________ the city's air pollution by reducing the number of cars on the roads.", [["A", "increase"], ["B", "decrease"], ["C", "maintain"], ["D", "ignore"]]], [49, "Urbanisation is transforming many __________, where modern buildings replace traditional fishing villages.", [["A", "coastal areas"], ["B", "urban zones"], ["C", "suburbs"], ["D", "rural regions"]]], [50, "Hà Nội often experiences severe __________ during winter months, leading to health concerns for city residents and visitors.", [["A", "gas"], ["B", "rain"], ["C", "emissions"], ["D", "smog"]]], [51, "Many young people __________ better job opportunities in cities where the economy is stronger.", [["A", "figure"], ["B", "create"], ["C", "seek"], ["D", "choose"]]], [52, "In response to urbanisation, many cities are working to __________ old buildings while preserving their historical significance.", [["A", "modernize"], ["B", "modernization"], ["C", "modernly"], ["D", "modern"]]], [53, "The city needs to provide more __________ so that people can find good places to live.", [["A", "hotel"], ["B", "housing"], ["C", "properties"], ["D", "guesthouse"]]], [54, "The amount of open space in Hong Kong is __________ as more skyscrapers and residential areas are built.", [["A", "decreasingly"], ["B", "decrease"], ["C", "decreasing"], ["D", "decreased"]]], [55, "Youth crime in the inner city has increased __________ in recent months, requiring tightened security.", [["A", "reliably"], ["B", "affordably"], ["C", "conveniently"], ["D", "rapidly"]]], [56, "For centuries, __________ practices in farming have been handed down through generations, but modern techniques are gradually replacing them.", [["A", "traditionally"], ["B", "traditional"], ["C", "tradition"], ["D", "traditions"]]], [57, "In urban areas with a high __________ rate, residents may feel unsafe, leading to calls for increased police presence and community programs.", [["A", "crime"], ["B", "unemployment"], ["C", "pollution"], ["D", "growth"]]]]}, {"kind": "mcq", "title": "Exercise 2", "lines": ["Choose the word or phrase closest in meaning to the underlined word."], "items": [[58, "The new bridge has helped to {u:ease} congestion in the city centre.", [["A", "worsen"], ["B", "relieve"], ["C", "measure"], ["D", "cause"]]], [59, "The island has fewer than five hundred {u:inhabitants}.", [["A", "visitors"], ["B", "owners"], ["C", "residents"], ["D", "workers"]]], [60, "Da Nang is a {u:booming} coastal city that attracts thousands of young workers.", [["A", "rapidly growing"], ["B", "slowly declining"], ["C", "peaceful"], ["D", "ancient"]]]]}, {"kind": "mcq", "title": "Exercise 3", "lines": ["Choose the word or phrase opposite in meaning to the underlined word."], "items": [[61, "The Red River Delta is one of the most {u:densely} populated regions in Viet Nam.", [["A", "heavily"], ["B", "thickly"], ["C", "highly"], ["D", "sparsely"]]], [62, "The village has changed {u:dramatically} since the highway was built.", [["A", "slightly"], ["B", "sharply"], ["C", "greatly"], ["D", "suddenly"]]], [63, "Housing in the suburbs is still relatively {u:affordable}.", [["A", "reasonable"], ["B", "cheap"], ["C", "costly"], ["D", "available"]]]]}]}]};</script>
<script type="application/json" id="gb-key">{"q1": {"a": ["migration"], "e": "rural–urban migration = di cư từ nông thôn ra thành thị."}, "q2": {"a": ["shortage"], "e": "housing shortage = tình trạng thiếu nhà ở."}, "q3": {"a": ["congestion"], "e": "traffic congestion = ùn tắc giao thông; ease congestion = giảm ùn tắc."}, "q4": {"a": ["sprawl"], "e": "urban sprawl = đô thị lan rộng, “nuốt” đất nông nghiệp quanh thành phố."}, "q5": {"a": ["living"], "e": "the cost of living = chi phí sinh hoạt."}, "q6": {"a": ["services"], "e": "public services = dịch vụ công (trường học, bệnh viện)."}, "q7": {"a": ["density"], "e": "population density = mật độ dân số (số người trên mỗi km²)."}, "q8": {"a": ["outskirts"], "e": "on the outskirts of the city = ở vùng ven thành phố."}, "q9": {"a": "B", "e": "respond to sth = phản hồi; handle, address không đi với to; react to thiên về phản ứng tức thời, không hợp “concerns raised”."}, "q10": {"a": "C", "e": "feel stuck = cảm thấy mắc kẹt vì không đủ tiền chuyển đi."}, "q11": {"a": "A", "e": "bring back = khôi phục; give up = từ bỏ, set up = thành lập, take over = tiếp quản."}, "q12": {"a": "D", "e": "invest money to improve … = đầu tư tiền."}, "q13": {"a": "B", "e": "expand its business = mở rộng kinh doanh."}, "q14": {"a": "A", "e": "remain stable = duy trì ổn định, hợp với “financial hub”."}, "q15": {"a": ["populated"], "e": "densely + tính từ: densely populated = đông dân cư."}, "q16": {"a": ["urbanisation", "urbanization"], "e": "Sau tính từ rapid cần danh từ: urbanisation (urbanization)."}, "q17": {"a": ["migrants"], "e": "Chủ ngữ chỉ người, số nhiều (work): migrants = người di cư."}, "q18": {"a": ["congested"], "e": "be + trạng từ + tính từ: heavily congested = tắc nghẽn nặng."}, "q19": {"a": ["unemployment"], "e": "Cần danh từ mang nghĩa tiêu cực (a serious problem): unemployment = thất nghiệp."}, "q20": {"a": ["unaffordable"], "e": "become + tính từ; vế sau cho thấy nghĩa phủ định: unaffordable = không đủ khả năng mua."}, "q21": {"a": "C", "e": "Dạng bài: Cấu trúc câu Ta có cấu trúc của một mệnh đề độc lập: S + V + ... Căn cứ vào vị trí chỗ trống, ta thấy câu đã có chủ ngữ là “Artificial intelligence (AI) in healthcare” và chưa có động từ chính => ta cần một động từ chính chia theo chủ ngữ này để tạo thành câu hoàn chỉnh => loại A, D (ta không dùng mệnh đề quan hệ); loại B (ta không dùng rút gọn động từ ở dạng phân từ hoàn thành)."}, "q22": {"a": "D", "e": "Dạng bài: Cấu trúc câu Kiến thức về mệnh đề quan hệ rút gọn / cấu trúc câu: Câu cần: One notable feature [mệnh đề quan quan hệ bổ nghĩa cho “feature”] … is their ability… → cần “that” + động từ. A. makes AI tools particularly attractive… → thiếu “that”, câu có hai động từ chính liền nhau. B. that renders AI tools especially attractive to healthcare providers → đúng: “that” + V thay cho “feature” (mệnh đề quan hệ). C. converts AI tools into something appealing… → thiếu “that”, sai cấu trúc. D. in which AI tools are especially attractive… → “in which” + mệnh đề không hợp nghĩa/cấu trúc."}, "q23": {"a": "B", "e": "Dạng bài: Mệnh đề độc lập – nghĩa của câu A. Nhằm mục đích giải quyết các sai sót trong AI, nhiều tổ chức đang triển khai các giao thức thử nghiệm nghiêm ngặt B. Nguy cơ công nghệ trục trặc trong các tình huống y tế quan trọng cũng là một mối lo ngại C. Chúng làm dấy lên mối lo ngại về độ chính xác của AI do không có các sai sót tiềm ẩn trong dữ liệu đào tạo. D. Các công nghệ AI đã được phát triển để nâng cao khả năng ra quyết định trong chăm sóc sức khỏe."}, "q24": {"a": "D", "e": "Dạng bài: Phân từ hiện tại, phân từ hoàn thành => Ta có: Khi 2 vế đồng chủ ngữ, người ta bỏ chủ ngữ của mệnh đề đầu, đưa động từ về dạng Ving/ Having Vp2 khi động từ ở thể chủ động. Xét cụ thể trong câu, chủ ngữ của mệnh đề đầu và mệnh đề sau phải giống nhau, và thứ “mang lại những lợi thế có tính thay đổi đáng kể…” phải là “AI in healthcare” (~it), nên đây cũng là chủ ngữ của mệnh đề ở vị trí chỗ trống."}, "q25": {"a": "A", "e": "Dạng bài: Mệnh đề độc lập – nghĩa của câu A. To achieve effective implementation, it is crucial that these obstacles are dealt with: Để đạt được việc triển khai hiệu quả, điều quan trọng là phải giải quyết những trở ngại này B. If these issues are resolved, effective implementation might remain unattainable: Nếu những vấn đề này được giải quyết, việc triển khai hiệu quả có thể vẫn không đạt được C. Without tackling these issues, these machines can realize their full operational potential: Nếu không giải quyết những vấn đề này, những máy móc này có thể phát huy hết tiềm năng hoạt động của chúng D. In order for effective implementation to be achieved, these obstacles must be tackled with => Sa"}, "q26": {"a": "A", "e": "Tiêu đề bài: Tiêu đề nào dưới đây phù hợp nhất với bài đọc? A. Giá trị của sự đa dạng văn hóa B. Bản sắc văn hóa qua nghệ thuật và thời trang C. Cách sự đa dạng hình thành nền kinh tế D. Lợi ích kinh tế của sự đa dạng Tóm tắt: • Đoạn 1: Sự đa dạng văn hóa là một phần quan trọng của xã hội, giúp mở rộng hiểu biết và phản ánh lịch sử, địa lý, con người của từng khu vực trên thế giới. • Đoạn 2: Đa dạng văn hóa giúp xóa bỏ định kiến, thúc đẩy sự thấu hiểu giữa các nền văn hóa và mang lại lợi ích kinh tế thông qua hợp tác và đổi mới. • Đoạn 3: Nghệ thuật và âm nhạc trở nên phong phú nhờ sự đa dạng văn hóa, tạo ra nhiều kiệt tác phản ánh trải nghiệm con người. • Đoạn 4: Ẩm thực và thời trang cũng "}, "q27": {"a": "C", "e": "Thông tin KHÔNG được đề cập: Đoạn 1 KHÔNG đề cập đến việc _______. A. sự đa dạng văn hóa là một quyền cơ bản của con người B. đa dạng văn hóa là một đặc điểm mong muốn của một xã hội lành mạnh và sống động C. mọi người phải đánh giá và áp dụng sự đa dạng văn hóa D. sự hiểu biết của chúng ta về thế giới được làm sâu sắc nhờ sự đa dạng văn hóa Thông tin: • Cultural diversity is not only a desirable characteristic of a healthy and vibrant society, it is also a fundamental human right. (Đa dạng văn hóa không chỉ là một đặc điểm mong muốn của một xã hội lành mạnh và sống động mà còn là một quyền cơ bản của con người.) A và B được đề cập. • By bringing together individuals from different backgroun"}, "q28": {"a": "A", "e": "Thông tin chi tiết: Trong đoạn 2, có đề cập đến việc sự đa dạng văn hóa _______ A. phá vỡ các định kiến có hại B. cản trở sự phát triển kinh tế C. dẫn đến những phát minh mới D. thúc đẩy sự đoàn kết trong xã hội Thông tin: Not only does cultural diversity help to break down harmful stereotypes, but it also promotes empathy and understanding among people of different cultures. (Đa dạng văn hóa không chỉ giúp phá vỡ các định kiến có hại, mà còn thúc đẩy sự đồng cảm và thấu hiểu giữa những người thuộc các nền văn hóa khác nhau.)"}, "q29": {"a": "C", "e": "Mục đích dùng từ: Trong đoạn 3, tác giả sử dụng từ \"single\" để _______ A. nhấn mạnh tầm quan trọng của các hình thức nghệ thuật truyền thống B. gợi ý rằng sự đa dạng văn hóa chỉ giới hạn ở một số lĩnh vực nhất định C. nhấn mạnh tác động rộng rãi của sự đa dạng văn hóa D. chỉ ra rằng sự đa dạng không ảnh hưởng đến âm nhạc hiện đại Thông tin: Cultural diversity enriches every single aspect of our lives, from the arts to cuisine. (Đa dạng văn hóa làm phong phú tất cả các khía cạnh của cuộc sống của chúng ta, từ nghệ thuật đến ẩm thực.)"}, "q30": {"a": "B", "e": "Từ vựng – Từ đồng nghĩa: Trong đoạn 4, từ \"infinite\" có thể thay thế bằng _______ A. important /ɪmˈpɔːtənt/ (adj): quan trọng B. unlimited /ʌnˈlɪmɪtɪd/ (adj): không giới hạn C. previous /ˈpriːviəs/ (adj): trước đây D. impolite /ˌɪmpəˈlaɪt/ (adj): bất lịch sự infinite /ˈɪn.fɪ.nət/ (adj): vô hạn = unlimited (adj) Thông tin: Thanks to cultural diversity, the world of cuisine has opened up to us with an almost infinite range of flavours and recipes, tempting our taste buds and expanding our culinary experiences. (Nhờ vào đa dạng văn hóa, thế giới ẩm thực đã mở ra cho chúng ta vô vàn hương vị và công thức nấu ăn, kích thích vị giác và mở rộng trải nghiệm ẩm thực của chúng ta.)"}, "q31": {"a": "B", "e": "Tổng hợp ý các đoạn: Có thể thấy trong các đoạn 2, 3 và 4 rằng _______ A. không phải ai cũng hưởng lợi từ sự đa dạng văn hóa B. sự đa dạng văn hóa làm hoàn thiện, làm đẹp và làm phong phú cuộc sống C. lợi ích của sự đa dạng văn hóa thường là vô hình D. sự đa dạng văn hóa mang đến cả những lợi ích và những thách thức Thông tin: • A sai vì không có thông tin trong các đoạn. • Additionally, it can provide significant economic benefits by creating opportunities for cross-cultural exchange and collaboration, leading to increased innovation and productivity. (Thêm vào đó, nó có thể mang lại những lợi ích kinh tế đáng kể bằng cách tạo ra cơ hội trao đổi và hợp tác xuyên văn hóa, dẫn đến sự đổi mới "}, "q32": {"a": "D", "e": "Suy luận: Có thể suy ra từ đoạn 5 rằng _______ A. các nhóm với thành viên đa dạng có thể gặp khó khăn trong việc đạt hiệu suất cao B. các tổ chức coi trọng sự đa dạng có thể gặp thách thức trong việc duy trì sự đổi mới C. việc tạo ra môi trường làm việc đa dạng có thể dẫn đến những hệ quả tiêu cực ngoài ý muốn D. các công ty có sự đa dạng có thể trải nghiệm sáng tạo và năng suất cao hơn Thông tin: Recent studies show that teams of diverse individuals tend to be more productive, creative, and innovative. (Các nghiên cứu gần đây cho thấy các nhóm có thành viên đa dạng thường có xu hướng năng suất, sáng tạo và đổi mới hơn.) A sai ở ‘face difficulties’. B sai ở ‘encounter challenges in maintaini"}, "q33": {"a": "D", "e": "Từ quy chiếu: Từ \"those\" trong đoạn 6 ám chỉ _______ A. đối thủ B. nhân viên C. nhân tài hàng đầu D. công ty • Từ ‘those’ trong đoạn 6 ám chỉ ‘companies’. Thông tin: Moreover, companies that value and promote diversity often stand out among competitors in attracting and retaining top talent. Employees tend to feel valued and engaged when they work for those welcoming and creating a diverse environment. (Thêm vào đó, các công ty coi trọng và thúc đẩy sự đa dạng thường nổi bật giữa các đối thủ cạnh tranh trong việc thu hút và giữ chân nhân tài hàng đầu. Nhân viên có xu hướng cảm thấy được quý trọng và gắn kết khi làm việc cho những công ty chào đón và tạo ra một môi trường đa dạng.)"}, "q34": {"a": "B", "e": "Dạng bài: Vị trí câu Câu sau đây phù hợp nhất ở đâu trong đoạn văn? Digital engagement among teenagers extends far beyond casual entertainment into professional skill development. (Sự tham gia của thanh thiếu niên vào công nghệ số không chỉ giới hạn ở giải trí thông thường mà còn mở rộng sang phát triển kỹ năng chuyên nghiệp). A. [I] B. [II] C. [III] D. [IV] Vị trí trí [II]: [II] In local gaming cafes, the scene tells an unexpected story. Teenagers huddle around screens, but they're not just playing games - they're running small businesses, organizing community events, and even learning foreign languages through international gaming partners. [II] (Tại các quán cà phê chơi game địa phương, c"}, "q35": {"a": "C", "e": "Dạng bài: Từ quy chiếu Từ \"they\" trong đoạn 2 ám chỉ ________. A. students – student /ˈstjuː.dənt/ (n): sinh viên B. screens – screen /skriːn/ (n): màn hình C. teenagers – teenager /ˈtiːˌneɪdʒər/ (n): thanh thiếu niên D. cafes – café /ˈkæfeɪ/ (n): quán cà phê Căn cứ vào thông tin: Teenagers huddle around screens, but they're not just playing games - they're running small businesses, organizing community events, and even learning foreign languages through international gaming partners. (Những thanh thiếu niên tụ tập quanh màn hình, nhưng họ không chỉ chơi game - họ đang điều hành các doanh nghiệp nhỏ, tổ chức các sự kiện cộng đồng và thậm chí học ngoại ngữ thông qua các bạn bè chơi game quốc "}, "q36": {"a": "D", "e": "Dạng bài: Thông tin KHÔNG được đề cập Theo đoạn văn, hoạt động nào sau đây KHÔNG được mô tả là diễn ra ở các quán cà phê chơi game? A. Điều hành doanh nghiệp nhỏ B. Học ngoại ngữ C. Tổ chức các sự kiện cộng đồng D. Chỉnh sửa nội dung YouTube Căn cứ vào thông tin: Teenagers huddle around screens, but they're not just playing games - they're running small businesses, organizing community events, and even learning foreign languages through international gaming partners. (Những thanh thiếu niên tụ tập quanh màn hình, nhưng họ không chỉ chơi game - họ đang điều hành các doanh nghiệp nhỏ, tổ chức các sự kiện cộng đồng và thậm chí học ngoại ngữ thông qua các bạn bè chơi game quốc tế)."}, "q37": {"a": "C", "e": "Dạng bài: Diễn đạt lại câu Câu nào sau đây diễn giải lại câu gạch chân trong đoạn 3 một cách tốt nhất? Xét câu gạch chân trong đoạn 3: What adults often miss in these digital interactions is their layered complexity. (Điều mà người lớn thường bỏ lỡ trong những tương tác kỹ thuật số này là sự phức tạp của chúng). => Ta có: layered /ˈleɪ.əd/ (a): được dùng để miêu tả thứ gì phức tạp và thú vị vì nó có nhiều tính năng, cấp độ khác nhau. A. Người lớn thường không nhận ra rằng những tương tác kỹ thuật số này bao gồm nhiều lớp phức tạp => Đáp án A không phù hợp vì câu gốc không đề cập đến “nhiều lớp phức tạp”. B. Những tương tác kỹ thuật số này phức tạp ở nhiều cấp độ, một chi tiết mà người lớn th"}, "q38": {"a": "A", "e": "Dạng bài: Từ đồng nghĩa Từ \"curated\" trong đoạn 4 có nghĩa gần nhất với ________. A. organized - organize /ˈɔː.ɡən.aɪz/ (v): tổ chức, sắp xếp B. collected - collect /kəˈlekt/ (v): thu thập C. displayed - display /dɪˈspleɪ/ (v): trưng bày D. managed - manage /ˈmæn.ɪdʒ/ (v): quản lý Căn cứ vào thông tin: The debate team now runs a podcast analyzing current events, while the art club showcases student work through carefully curated Instagram galleries. (Đội tranh luận hiện đang chạy một podcast phân tích các sự kiện hiện tại, trong khi câu lạc bộ nghệ thuật giới thiệu tác phẩm của sinh viên thông qua các bộ sưu tập Instagram được tuyển chọn cẩn thận). => curate /ˈkjʊəreɪt/ (v): tổ chức, chọn lọ"}, "q39": {"a": "C", "e": "Dạng bài: Tóm tắt đoạn Câu nào sau đây tóm tắt đúng nhất đoạn 4? A. Sinh viên đang học cách xây dựng mạng lưới chuyên nghiệp thông qua các câu lạc bộ. B. Các câu lạc bộ đang đổi mới với phương tiện kỹ thuật số để giới thiệu công việc của họ. C. Các câu lạc bộ trường học đã nâng cao các hoạt động của họ bằng cách sử dụng các công cụ kỹ thuật số. D. Sự tinh vi của kỹ thuật số đang giúp các câu lạc bộ nâng cao các hoạt động truyền thống. Căn cứ vào thông tin đoạn 4: School clubs have taken notice of this digital sophistication. The debate team now runs a podcast analyzing current events, while the art club showcases student work through carefully curated Instagram galleries. (Các câu lạc bộ trư"}, "q40": {"a": "D", "e": "Dạng bài: Thông tin đúng theo bài Theo đoạn văn, câu nào sau đây là ĐÚNG? A. Câu lạc bộ nghệ thuật quản lý tác phẩm của sinh viên thông qua các nền tảng bộ sưu tập Instagram chuyên dụng. B. Nội dung video giải trí của James được phát triển thành nhiều mẫu công việc chuyên nghiệp khác nhau. C. Các studio kỹ thuật số tuyển dụng thanh thiếu niên vì kỹ năng sáng tạo nội dung nâng cao của họ. D. Các quán cà phê chơi game địa phương có thể hoạt động như không gian cho các hoạt động kinh doanh của thanh thiếu niên. Căn cứ vào thông tin: The debate team now runs a podcast analyzing current events, while the art club showcases student work through carefully curated Instagram galleries. (Đội tranh luậ"}, "q41": {"a": "C", "e": "Dạng bài: Thành ngữ Cụm từ \"hit the ground running\" trong đoạn cuối có thể được thay thế tốt nhất bằng _______. A. finished effectively: hoàn thành hiệu quả B. moved quickly: di chuyển nhanh chóng C. adapted well: thích nghi tốt D. learned fast: học nhanh Căn cứ vào thông tin: Emma Watson, who started by making simple gaming videos, now freelances as a video editor for environmental organizations. She's really hit the ground running, combining her technical skills with her passion for sustainability. (Emma Watson, người bắt đầu bằng việc tạo các video chơi game đơn giản, hiện làm việc tự do với tư cách là biên tập viên video cho các tổ chức môi trường. Cô ấy thực sự đã bắt kịp nhanh chóng, k"}, "q42": {"a": "A", "e": "Dạng bài: Suy luận Có thể suy ra điều gì từ đoạn văn? A. Sinh viên quản lý cộng đồng trực tuyến thường có khả năng hiểu biết sâu sắc về nội dung. B. Thanh thiếu niên bắt đầu phát triển kinh nghiệm quản lý phương tiện truyền thông của mình trước khi vào trung học. C. Việc tiếp xúc sớm với việc sáng tạo nội dung số một cách tự nhiên sẽ dẫn đến sự nghiệp bảo vệ môi trường. D. Các kênh chơi game do thanh thiếu niên điều hành thường chuyển thành các cơ hội phát triển chuyên môn. Căn cứ vào thông tin: Local creative studios report an interesting trend: teenagers arriving with increasingly sophisticated digital skills. \"They understand audience engagement instinctively,\" notes studio owner David Ch"}, "q43": {"a": "C", "e": "Dạng bài: Tóm tắt bài Okay, here's the text from the image, formatted for better readability: Câu nào sau đây tóm tắt đúng nhất đoạn văn này? A. Thanh thiếu niên kết hợp chơi game trực tuyến với phát triển chuyên môn, đồng thời xây dựng danh mục đầu tư và quản lý cộng đồng kỹ thuật số thông qua nhiều nền tảng khác nhau. B. Thanh thiếu niên hiện đại tận dụng môi trường chơi game và phương tiện truyền thông xã hội để phát triển các kỹ năng có thể tiếp thị được, tạo ra những con đường bất ngờ hướng tới sự nghiệp chuyên môn. C. Không gian kỹ thuật số cho phép thanh thiếu niên kết hợp công việc học tập, các dự án sáng tạo và sự phát triển chuyên môn trong khi quản lý nhiều trách nhiệm trực tuyến."}, "q44": {"a": "B", "e": "conveniences = những tiện ích (giáo dục, y tế, giải trí)."}, "q45": {"a": "D", "e": "farmland for agricultural production = đất nông nghiệp."}, "q46": {"a": "A", "e": "afford an apartment = đủ tiền thuê/mua căn hộ."}, "q47": {"a": "C", "e": "Đất hạn chế (limited) nên phải xây cao tầng."}, "q48": {"a": "B", "e": "decrease air pollution = giảm ô nhiễm bằng cách giảm số xe."}, "q49": {"a": "A", "e": "coastal areas = vùng ven biển, hợp với “fishing villages”."}, "q50": {"a": "D", "e": "smog = khói bụi (sương khói) vào mùa đông."}, "q51": {"a": "C", "e": "seek opportunities = tìm kiếm cơ hội."}, "q52": {"a": "A", "e": "work to + động từ nguyên mẫu: modernize."}, "q53": {"a": "B", "e": "housing (không đếm được) = nhà ở nói chung; more + hotel/guesthouse số ít là sai."}, "q54": {"a": "C", "e": "is + V-ing: is decreasing (đang giảm dần khi thêm nhà cao tầng)."}, "q55": {"a": "D", "e": "increase rapidly = tăng nhanh."}, "q56": {"a": "B", "e": "Trước danh từ practices cần tính từ: traditional."}, "q57": {"a": "A", "e": "crime rate = tỉ lệ tội phạm; residents feel unsafe."}, "q58": {"a": "B", "e": "ease = làm giảm, làm dịu ≈ relieve."}, "q59": {"a": "C", "e": "inhabitants = cư dân ≈ residents."}, "q60": {"a": "A", "e": "booming = phát triển bùng nổ ≈ rapidly growing."}, "q61": {"a": "D", "e": "densely = dày đặc ↔ sparsely = thưa thớt."}, "q62": {"a": "A", "e": "dramatically = rất nhiều, đáng kể ↔ slightly = một chút."}, "q63": {"a": "C", "e": "affordable = vừa túi tiền ↔ costly = đắt đỏ."}}</script>

    var r = pr(pi); for (var n = r[0]; n <= r[1]; n++) { delete state.ans[n]; delete state.byId["q" + n]; }
    D.passages[pi].groups.forEach(function (g) { if (g.kind === "multi") delete state.ans["m" + g.firstq]; });
    state.lock[pi] = false; delete state.pres[pi]; if (state.open.indexOf(pi) < 0) state.open.push(pi);
    saveNow(false); paint(); tabMarks();
  }

  /* ---------- teaching ---------- */
  function reset() { modal("Start again?", "All your answers on this page will be cleared.", [{ t: "Cancel", ghost: true }, { t: "Clear all", f: function () { state.ans = {}; state.chk = {}; paint(); } }]); }
  var tip;
  function setupVocab() {
    tip = h("div", { cls: "tip" }); document.body.appendChild(tip);
    var box = $("#passage");
    function show(m) {
      var v = D.passages[state.p].vocab[+m.dataset.i]; tip.innerHTML = "<b>" + esc(v[0]) + "</b> " + esc(v[1]);
      var r = m.getBoundingClientRect(); tip.style.display = "block";
      tip.style.left = Math.max(8, Math.min(innerWidth - tip.offsetWidth - 8, r.left)) + "px"; tip.style.top = (r.bottom + 6) + "px";
    }
    box.addEventListener("mouseover", function (e) { if (e.target.classList && e.target.classList.contains("v") && state.vocab) show(e.target); });
    box.addEventListener("mouseout", function (e) { if (e.target.classList && e.target.classList.contains("v")) tip.style.display = "none"; });
  }

  /* ---------- splitter ---------- */
  function setupSplit() {
    var sp = $("#split"), main = $("#main"), drag = false;
    sp.addEventListener("pointerdown", function (e) { drag = true; sp.setPointerCapture(e.pointerId); });
    sp.addEventListener("pointermove", function (e) {
      if (!drag) return; var r = main.getBoundingClientRect(), p = ((e.clientX - r.left) / r.width) * 100;
      main.style.setProperty("--lw", Math.max(25, Math.min(75, p)) + "%");
    });
    sp.addEventListener("pointerup", function () { drag = false; });
  }

  /* ---------- boot ---------- */
  function boot() {
    var fs = parseFloat(store("fs") || "18"); document.documentElement.style.setProperty("--fs", fs + "px");
    var tabs = h("nav", { cls: "tabs" });
    D.passages.forEach(function (P, i) { tabs.appendChild(h("button", { cls: "tab" + (i === 0 ? " on" : ""), text: plab(P), onclick: function () { state.p = i; paint(); } })); });
    var tools = h("div", { cls: "tools" }, h("span", { id: "sv", cls: "who2" }), h("span", { id: "who", cls: "who2" }),
      h("button", { cls: "fsb", text: "A−", title: "Smaller text", onclick: function () { fontStep(-1); } }),
      h("button", { cls: "fsb", text: "A+", title: "Larger text", onclick: function () { fontStep(1); } }));
    if (TEACH) {
      tools.appendChild(ibtn("book", "Show or hide new words", function (e) { state.vocab = !state.vocab; e.currentTarget.classList.toggle("off", !state.vocab); renderPassage(); }));
      tools.appendChild(ibtn("reset", "Start again", reset));
    } else tools.appendChild(ibtn("tick", "Submit this passage", submit, "dark"));
    if (!TEACH) tools.appendChild(ibtn("reset", "Retake the whole test", retakeAll));
    tools.appendChild(ibtn("full", "Full screen", function () {
      try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { }
    }, "hide-m"));
    $("#hd").appendChild(h("div", { cls: "brand", text: D.title })); $("#hd").appendChild(tabs); $("#hd").appendChild(tools);
    var mv = h("div", { cls: "mv" }); ["p", "q"].forEach(function (v) { mv.appendChild(h("button", { cls: "mvb" + (v === "p" ? " on" : ""), "data-v": v, text: v === "p" ? "Passage" : "Questions", onclick: function () { setView(v); } })); });
    $("#hd").appendChild(mv); $("#main").setAttribute("data-v", "p");
    setupSplit(); if (TEACH) setupVocab();
    paint();
    if (!TEACH) login();
  }
  document.addEventListener("DOMContentLoaded", boot);
})();
</script><script src="../../back-to-portal.js"></script>
