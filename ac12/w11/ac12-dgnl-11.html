ou."], ["C", "When I need help, I will remember to call you."], ["D", "If you need help, why don’t you call me?"]]], [45, "The concert may be cancelled due to the heavy rain.", [["A", "Because it was raining heavily, the concert was cancelled."], ["B", "The concert must be cancelled because it is raining heavily."], ["C", "The possible cancellation of the concert is due to the heavy rain."], ["D", "Despite the heavy rain, they will not cancel the concert."]]]]}]}, {"id": 4, "label": "Reading 1", "paras": [["1", "For those looking to learn a new language, the process can feel daunting, especially as an adult. It’s long been thought that the earlier you learn new skills, the easier they are to pick up. The idea that age can play a huge role in a person’s language learning ability is one of the reasons why early childhood was once considered the best time to introduce a second language. But whether that holds true has been heavily debated in the scientific community."], ["2", "“Research says that adults are better learners at everything because we have a lot of self-regulation and we’re very intent when we want to learn something,” says Lourdes Ortega, a professor of linguistics at Georgetown University, who herself speaks four languages."], ["3", "Ortega also says that factors beyond age, like immersion, make a bigger difference in language learning success. No one can learn, as an adult, a new language unless they love it and unless they make it part of their life. In theory, learning languages is a great thing, but you need to have reasons for it and resources to invest in it."], ["4", "According to The Foreign Service Institute (FSI), factors like a person’s natural ability, previous linguistic experience, and the consistency of their lessons affect the language learning process. The FSI says languages that native English speakers would find similar to their own, such as Spanish or French, can be taught relatively quickly in about 24-30 weeks.", [[226, 232]]], ["5", "In contrast, languages that have significant cultural differences from English, like Greek or Russian, will take about 44 weeks. Besides, learning time could double that for those considered exceptionally hard, such as Arabic or Mandarin.", [[174, 179]]], ["6", "That said, children and adults do have their own unique strengths and weaknesses when it comes to grasping new connections. Children tend to learn new languages more intuitively, may have more opportunities to play and experiment with new languages, and may be forced to adapt without the aid of translation apps or other resources. Adults can employ custom strategies to hone their language learning experience, like creating their own memorisation systems or visualisation techniques."], ["s", "(Adapted from https://www.nationalgeographic.com/)"]], "range": [46, 52], "groups": [{"kind": "mcq", "step": "read", "title": "Questions 46-52", "lines": ["Read the passage carefully. Choose an option (A, B, C, or D) that best answers each question."], "items": [[46, "What does the passage mainly discuss?", [["A", "The challenges of learning a new language as an adult"], ["B", "The advantages of age on language learning ability"], ["C", "The factors influencing language learning"], ["D", "The role of the Foreign Service Institute in language teaching"]]], [47, "According to paragraph 1, which of the following is true about the impact of age on language learning?", [["A", "Children acquire language the fastest."], ["B", "It is still controversial among scientists."], ["C", "Adults are motivated to learn languages."], ["D", "The elderly are bad at learning languages."]]], [48, "In paragraph 2, why are adults better at learning?", [["A", "They approach learning with greater determination and control over their actions."], ["B", "They can rely on technology to help them absorb new information more quickly."], ["C", "They understand a lot of new languages thanks to their previous experiences."], ["D", "They have more opportunities to practice and engage in learning activities."]]], [49, "In paragraph 3, which of the following is NOT mentioned as one of the factors relating to learning languages?", [["A", "aims"], ["B", "immersion"], ["C", "differences"], ["D", "resources"]]], [50, "In paragraph 4, what is the word <u>native</u> closest in meaning to?", [["A", "pioneering"], ["B", "foreign"], ["C", "initial"], ["D", "indigenous"]]], [51, "According to paragraph 5, what does the word <u>those</u> refer to?", [["A", "languages"], ["B", "differences"], ["C", "weeks"], ["D", "Greek and Russian"]]], [52, "What can be inferred from paragraph 6?", [["A", "Adults have far fewer chances to be exposed to new languages and cultures."], ["B", "Adults can struggle to learn languages without the help of technology."], ["C", "Children are likely to learn languages more naturally, with fewer resources."], ["D", "Children can learn languages more effectively with scientific methods."]]]]}]}, {"id": 5, "label": "Reading 2", "paras": [["1", "Born in Chicago in 1901 and raised in Missouri, Disney was the fourth son among five siblings. Itching to set off on his own, he and his older brother Roy launched their cartoon business, Laugh-O-Gram Studios, in 1920, but the company went bankrupt a couple of years later."], ["2", "With the loss of his first business, Disney packed his bags, and with just $40 to his name, took off to Los Angeles to try his hand at acting. But he failed at that, too. After years of eating beans and driving up his debts, Disney finally brought Mickey Mouse to life on film starting in the late 1920s and earned his way back to the top of his industry. But it wasn't easy. Bankers rejected the concept of his famous mouse over 300 times before one said yes.", [[166, 169]]], ["3", "Even with the success of Mickey Mouse, Disney still faced challenges in keeping his business afloat. Not only was he overworked, but tensions with his employer, who eventually stole his longtime and best animator from him, led to Disney having a nervous breakdown.", [[182, 185]]], ["4", "After taking some time off with his wife to recuperate, Disney returned with a bold new idea: He would develop a full-length animation feature, which he’d call Snow White and the Seven Dwarfs (1937). It would become an enormous success at the box office, but the films that followed, Pinocchio (1940), Fantasia (1940) and Bambi (1942), would end up being duds. With the success of TV shows like The Mickey Mouse Club and Davy Crockett, Disney was able to harness enough capital to launch his biggest venture yet: Disneyland."], ["5", "Disneyland opened on July 17, 1955, in Anaheim, California. However, forged tickets brought more visitors than anticipated, adding to a line that trailed seven miles long. With temps soaring up to 100 degrees, the new asphalt was melting women’s high heels, drinking fountains were defunct and some of the rides malfunctioned. Critics blasted the opening of Disneyland, calling it “Black Sunday.”"], ["6", "But as always, Disney’s tenacity and perseverance turned his latest endeavour around. Disneyland became a colossal success, clearing out his financial debts, and to this day, operates as an integral part of his business empire.", [[106, 114]]], ["s", "(Adapted from https://www.biography.com/)"]], "range": [53, 60], "groups": [{"kind": "mcq", "step": "read", "title": "Questions 53-60", "lines": ["Read the passage carefully. Choose an option (A, B, C, or D) that best answers each question."], "items": [[53, "The best title of the passage can be _______.", [["A", "Walt Disney’s Early Struggles and Lessons"], ["B", "The Challenges and Triumphs of Walt Disney’s Career"], ["C", "Walt Disney: Overcoming Personal and Family Setbacks"], ["D", "The Evolution of Walt Disney's Animation Techniques"]]], [54, "In paragraph 1, Disney and Roy _______.", [["A", "launched a successful animation company"], ["B", "had strong financial backing to start up"], ["C", "had strained family relationships"], ["D", "created a cartoon business that failed later"]]], [55, "In paragraph 2, it is NOT mentioned that _______.", [["A", "Disney earned a fortune from his successful creation"], ["B", "Disney tried and failed in acting in Los Angeles"], ["C", "Hundreds rejected Disney before one said yes"], ["D", "Before his success, Disney struggled financially for years"]]], [56, "In paragraph 2, the author uses the word <u>too</u> to _______.", [["A", "show how difficult it was for Disney to achieve success"], ["B", "highlight that Disney faced failure in more than one attempt"], ["C", "describe how quickly Disney achieved success"], ["D", "suggest that Disney had too many goals and was determined"]]], [57, "The word <u>his</u> in paragraph 3 refers to _______.", [["A", "Mickey Mouse"], ["B", "the employer"], ["C", "Disney"], ["D", "the business"]]], [58, "It can be inferred from paragraph 5 that _____.", [["A", "the idea of Disneyland was a complete fail"], ["B", "Disneyland did not have a smooth opening"], ["C", "Disneyland’s success was not guaranteed"], ["D", "Disney ignored critics' feedback on Disneyland"]]], [59, "It can be seen in paragraphs 4, 5, and 6 that _______.", [["A", "Although he was talented, Disney was always an unlucky person in the world of business."], ["B", "The early difficulties facing Disney nearly led to the collapse of his whole career."], ["C", "Disney consistently overcame early failures and difficulties to achieve success"], ["D", "Disney's ventures after Disneyland experienced struggles, but he did not give up"]]], [60, "In paragraph 6, the word <u>colossal</u> can be replaced by _______.", [["A", "sharp"], ["B", "real"], ["C", "rare"], ["D", "huge"]]]]}]}]};</script>

    return (Array.isArray(a) ? a : [a]).some(function (x) { return norm(x) === v; });
  }
  var LOCAL = {

  function rpc(fn, body, keep) {

  }

  /* ---------- student's notes + vocabulary notebook ---------- */
  ICON.note = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5zM9 11h6M9 15h6"/></svg>';

  var STEPTXT = {

    error: ["Tìm lỗi sai", ["Đọc cả câu một lần để hiểu nghĩa.", "Kiểm tra từng phần gạch chân: thì, hòa hợp chủ vị, giới từ, từ loại, đại từ.", "Chọn phần duy nhất sai. Các phần còn lại phải đúng."]],
    restate: ["Câu đồng nghĩa", ["Xác định cấu trúc và thì của câu gốc: điều kiện, tường thuật, so sánh, bị động...", "Loại các options đổi nghĩa hoặc sai ngữ pháp.", "Với các options còn lại, đối chiếu nghĩa với câu gốc."]],

  };
  function stepCards(pi) {
    var P = D.passages[pi], seen = {}, out = [];
    P.groups.forEach(function (g) {
      var k = g.step; if (!STEPTXT[k] || seen[k]) return; seen[k] = 1;
      out.push({ n: STEPTXT[k][0], c: STEPTXT[k][1].map(function (t, i) { return (i + 1) + ". " + t; }) });
    });

  }

  var FILEKEY = "ac12/w11/ac12-dgnl-11.html";
  /* highlights: state.hl[passage][paragraph] = [[start,end],...] (character offsets in the paragraph) */
  state.hl = {};
  function hlOf(p) { return state.hl[p] || (state.hl[p] = {}); }
  function applyHl() {
    var H = state.hl[state.p] || {}, P = D.passages[state.p];
    [].forEach.call(document.querySelectorAll("#passage .pt"), function (pt, i) {
      var list = (H[i] || []).slice().sort(function (a, b) { return a[0] - b[0]; });
      var ul = (P.paras && P.paras[i] && P.paras[i][2]) || [];
      if (!list.length && !ul.length) return;
      var t = pt.textContent, cuts = [0, t.length];
      list.concat(ul).forEach(function (r) { cuts.push(r[0], r[1]); });
      cuts = cuts.filter(function (x, k, a) { return x >= 0 && x <= t.length && a.indexOf(x) === k; }).sort(function (a, b) { return a - b; });
      var html = "";
      for (var k = 0; k < cuts.length - 1; k++) {
        var s = cuts[k], e = cuts[k + 1], seg = esc(t.slice(s, e));
        if (ul.some(function (r) { return r[0] <= s && r[1] >= e; })) seg = "<u>" + seg + "</u>";
        if (list.some(function (r) { return r[0] <= s && r[1] >= e; })) seg = '<mark class="hl">' + seg + "</mark>";
        html += seg;

    });
  }
  var renderPassage0 = renderPassage;
  renderPassage = function () { renderPassage0(); applyHl(); };
  function ptOf(n) { var e = n && (n.nodeType === 1 ? n : n.parentNode); return e && e.closest ? e.closest(".pt") : null; }
  function offIn(pt, node, off) { var r = document.createRange(); r.selectNodeContents(pt); r.setEnd(node, off); return r.toString().length; }
  function selInfo() {
    var s = window.getSelection(); if (!s || !s.rangeCount || s.isCollapsed) return null;
    var rg = s.getRangeAt(0), a = ptOf(rg.startContainer), b = ptOf(rg.endContainer); if (!a || a !== b) return null;
    var idx = [].indexOf.call(document.querySelectorAll("#passage .pt"), a); if (idx < 0) return null;
    var st = offIn(a, rg.startContainer, rg.startOffset), en = offIn(a, rg.endContainer, rg.endOffset); if (en <= st) return null;
    return { i: idx, s: st, e: en };
  }
  function overlaps(inf) { return (hlOf(state.p)[inf.i] || []).some(function (r) { return r[0] < inf.e && r[1] > inf.s; }); }
  state.hlUndo = [];
  ICON.undo = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg>';
  function undoBtn() { var b = document.querySelector('button[title="Undo highlight"]'); if (b) b.classList.toggle("off", !state.hlUndo.length); }
  function undoHl() { if (!state.hlUndo.length) return; state.hl = JSON.parse(state.hlUndo.pop()); renderPassage(); scheduleSave(); undoBtn(); }
  document.addEventListener("keydown", function (e) { var a = document.activeElement; if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === "z" && !(a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT"))) { e.preventDefault(); undoHl(); } });
  function setHl(inf, add) {
    state.hlUndo.push(JSON.stringify(state.hl)); if (state.hlUndo.length > 50) state.hlUndo.shift(); setTimeout(undoBtn, 0);
    var H = hlOf(state.p), L = (H[inf.i] || []).slice(), out = [];
    if (add) { L.push([inf.s, inf.e]); L.sort(function (a, b) { return a[0] - b[0]; }); L.forEach(function (r) { var l = out[out.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else out.push([r[0], r[1]]); }); }
    else L.forEach(function (r) { if (r[1] <= inf.s || r[0] >= inf.e) out.push(r); else { if (r[0] < inf.s) out.push([r[0], inf.s]); if (r[1] > inf.e) out.push([inf.e, r[1]]); } });
    H[inf.i] = out; try { window.getSelection().removeAllRanges(); } catch (e) { } if (NOTES) NOTES.hideSel(); renderPassage(); scheduleSave();
  }

  /* khung Student's notes + tra từ: dùng chung file ../../student-notes.js */
  var NOTES = null;
  function buildNotes() {
    NOTES = GBNotes.mount({
      rpc: rpc, code: function () { return state.code; }, fileKey: FILEKEY, store: state,
      part: function () { return state.p; },

    state.npEl = NOTES.el; state.npTab = NOTES.tab;
    if (window.ResizeObserver) { var ro = new ResizeObserver(NOTES.fit); [$("#hd"), $("#tiles")].forEach(function (e) { if (e) ro.observe(e); }); }
  }
  function toggleNotes() { if (NOTES) NOTES.toggle(); }
  function renderNotes() { if (NOTES) NOTES.render(); }
  function fitNotes() { if (NOTES) NOTES.fit(); }

  /* ---------- teacher's notes per question (sent from the In-class page) ---------- */
  var TNS = {}, tnMo = null, tnBusy = false, tnSig = "";
  function tnDecor() {
    var qs = document.getElementById("qs"); if (!qs || tnBusy) return; tnBusy = true; if (tnMo) tnMo.disconnect();
    [].forEach.call(qs.querySelectorAll(".tnq"), function (e) { e.remove(); });
    [].forEach.call(qs.querySelectorAll(".qn"), function (t) {
      var n = parseInt((t.id || "").slice(1), 10); if (!n) return; var it = TNS["q" + n]; if (!it || !it[0] || !it[0].note) return;
      var host = t.closest(".qt,.hrow,.qcell"); if (!host) return;
      var el = h("div", { cls: "tnq" }, h("b", { text: "Teacher: " }), document.createTextNode(it[0].note));
      if (host.classList.contains("qcell")) { var g = t.closest(".grp"); if (g) g.appendChild(el); }
      else if (host.classList.contains("hrow")) host.parentNode.insertBefore(el, host.nextSibling);
      else { var qi = t.closest(".qi"); (qi || host.parentNode).appendChild(el); }
    });

    tnMo.observe(qs, { childList: true, subtree: true });
    tnBusy = false;
  }
  function tnPoll() {

    rpc("student_notes", { p_student_code: state.code, p_assignment_code: D.code }).then(function (r) {
      var m = {}; (r || []).forEach(function (x) { m[x.ref] = x.items || []; });
      var sig = JSON.stringify(m); if (sig === tnSig) return; tnSig = sig; TNS = m; tnDecor();
    }).catch(function () { });
  }
  setInterval(tnPoll, 6000);

  /* ---------- results the teacher opened in class (first Check only) ---------- */
  var CKS = {}, ckMo = null, ckBusy = false, ckSig = "";
  function ckDecor() {
    var qs = document.getElementById("qs"); if (!qs || ckBusy) return; ckBusy = true; if (ckMo) ckMo.disconnect();
    [].forEach.call(qs.querySelectorAll(".ckv"), function (e) { e.remove(); });
    [].forEach.call(qs.querySelectorAll(".qn"), function (t) {
      var n = parseInt((t.id || "").slice(1), 10); if (!n || !(n in CKS)) return;
      var host = t.closest(".qt,.hrow,.qcell"); if (!host) return; var c = CKS[n];
      host.appendChild(h("span", { cls: "ckv " + (c === true ? "ok" : c === false ? "bad" : "blank"), title: "Checked in class", text: c === true ? "\u2713" : c === false ? "\u2717" : "\u2013" }));
    });
    if (!ckMo) ckMo = new MutationObserver(function () { if (ckBusy) return; clearTimeout(ckMo.t); ckMo.t = setTimeout(ckDecor, 30); });
    ckMo.observe(qs, { childList: true, subtree: true });
    ckBusy = false;
  }
  function ckPoll() {
    if (!state.code || document.visibilityState !== "visible") return;
    rpc("student_checks", { p_student_code: state.code, p_assignment_code: D.code }).then(function (r) {
      var m = {}; (r || []).forEach(function (x) { m[x.q] = x.correct; });
      var sig = JSON.stringify(m); if (sig === ckSig) return; ckSig = sig; CKS = m; ckDecor();
    }).catch(function () { });
  }
  setInterval(ckPoll, 5000);

  /* ---------- boot ---------- */
  function boot() {
    var fs = parseFloat(store("fs") || (window.innerWidth <= 700 ? "16" : "18")); document.documentElement.style.setProperty("--fs", fs + "px");
    var tabs = h("nav", { cls: "tabs" });
    D.passages.forEach(function (P, i) { tabs.appendChild(h("button", { cls: "tab" + (i === 0 ? " on" : ""), onclick: function () { state.p = i; paint(); } }, h("span", { cls: "tl", text: P.label }), h("span", { cls: "ts", text: P.short || P.label }))); });
    var tools = h("div", { cls: "tools" }, h("span", { id: "sv", cls: "who2" }), h("span", { id: "who", cls: "who2" }),
      h("button", { cls: "fsb", text: "A−", title: "Smaller text", onclick: function () { fontStep(-1); } }),
      h("button", { cls: "fsb", text: "A+", title: "Larger text", onclick: function () { fontStep(1); } }));
    if (TEACH) {
      tools.appendChild(ibtn("book", "Show or hide new words", function (e) { state.vocab = !state.vocab; e.currentTarget.classList.toggle("off", !state.vocab); renderPassage(); }));
      tools.appendChild(ibtn("reset", "Start again", reset));

    $("#hd").appendChild(mv); $("#main").setAttribute("data-v", "p");
    setupSplit(); if (TEACH) setupVocab(); buildNotes(); if (window.innerWidth >= 1000) toggleNotes();
    paint();

  document.addEventListener("DOMContentLoaded", boot);
})();
