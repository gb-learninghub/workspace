<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Parent Portal</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1D22;--mut:#6B7280;--line:#E4E6EA;--panel:#F4F5F7;--bg:#F4F5F7;--dark:#1B1D22;--gold:#D4A017;--gold-bg:#F7EBC8;--gold-t:#8A6100;--blue:#DCEBFA;--blue-t:#1D4E89;--orange:#FDE8D3;--orange-t:#9A4A0B;--ok:#157A3C;--ok-bg:#E3F5E9;--bad:#B42318;--bad-bg:#FDE7E5;--warn-bg:#FFF4D6;--warn:#8A6100}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',Aptos,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5}
.bar{background:var(--dark);padding:14px 16px;position:sticky;top:0;z-index:20}
.bar .in{max-width:1008px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:#2A2D34;color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex:none}
h1{font-size:1.3rem;margin:0;line-height:1.2;color:var(--gold)}
.sub{color:var(--mut);font-size:.875rem}
.wrap{max-width:1040px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.kids{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding-bottom:4px;margin-bottom:14px}
.kid{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
.kid[aria-pressed=true]{background:var(--dark);border-color:var(--dark);color:#fff}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:900px){.cols{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.col{display:grid;gap:14px}}
@media(max-width:899px){.col{display:contents}}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-height:44px}
.row:last-child{border-bottom:0}
.l{min-width:0}.l b{display:block;overflow-wrap:anywhere}
.l span{color:var(--mut);font-size:.875rem}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8125rem;font-weight:600;white-space:nowrap}
.c-off{background:var(--blue);color:var(--blue-t)}.c-on{background:var(--orange);color:var(--orange-t)}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-mut{background:var(--panel);color:var(--mut)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8125rem;font-weight:700;background:var(--gold);color:#fff;white-space:nowrap}
.rt{display:flex;align-items:center;gap:6px;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.stat{border-radius:14px;padding:10px 6px;text-align:center}
.stat.s-p{background:var(--ok-bg);color:var(--ok)}.stat.s-a{background:var(--bad-bg);color:var(--bad)}.stat.s-l{background:var(--warn-bg);color:var(--warn)}.stat.s-e{background:var(--blue);color:var(--blue-t)}
.stat b{display:block;font-size:1.35rem;line-height:1.2}.stat span{font-size:.8125rem;font-weight:600;opacity:.85}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--mut)}
.tm{padding:11px 0;border-bottom:1px solid var(--line)}.tm:last-child{border-bottom:0}
.tm .top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.money{margin-top:2px;color:var(--mut);font-size:.875rem}.money b{color:var(--ink,inherit);font-weight:600;margin-left:4px}
.neg{color:var(--bad);font-weight:700}.pos{color:var(--ok);font-weight:700}
.owed{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--gold-bg);color:var(--gold-t);border-radius:12px;padding:10px 14px;font-size:.9rem}.owed b{font-size:1.1rem}
.msg{text-align:center;padding:48px 16px;color:var(--mut)}
.msg b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:6px}
form.code{display:flex;gap:8px;max-width:360px;margin:18px auto 0}
form.code input{flex:1;min-width:0;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:16px;letter-spacing:.12em;text-align:center}
form.code button{height:48px;padding:0 20px;border:0;border-radius:999px;background:var(--dark);color:#fff;font:inherit;font-weight:700;cursor:pointer}
/*hw*/.hw{display:grid;grid-template-columns:minmax(0,1fr) auto 86px;gap:10px}.hw b{overflow-wrap:anywhere}.hw .due{color:var(--mut);font-size:.8125rem;white-space:nowrap}.hw .chip{justify-self:end;text-align:center}
@media(max-width:520px){.hw b{font-size:.9375rem}.hw{grid-template-columns:minmax(0,1fr) auto 76px;gap:8px}.stat b{font-size:1.2rem}}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;font-family:inherit;font-size:.9375rem;font-weight:700;line-height:1.5;border:0;margin:0}
.card>h3.pill{margin:0 0 12px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.ph .pill{margin:0;white-space:nowrap}
.pl-att{background:var(--ok-bg);color:var(--ok)}.pl-week{background:var(--gold-bg);color:var(--gold-t)}.pl-hw{background:var(--blue);color:var(--blue-t)}.pl-fee{background:var(--orange);color:var(--orange-t)}
.pb{background:var(--panel);color:var(--ink);cursor:pointer;min-height:36px;font-size:.8125rem;padding:6px 12px;flex:none}
button.stat{border:0;font:inherit;cursor:pointer;width:100%;min-height:44px}.pb:hover{background:#E9EBEF}
.fr{padding:11px 0;border-bottom:1px solid var(--line)}.fr:last-of-type{border-bottom:0}
.fr .top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.mh2~.row,.mh2~.fr{border-bottom:0}.row.ses{gap:8px}.row.ses b{flex:none;width:7.4em}.row.ses .stm{flex:1;min-width:0;color:var(--mut);font-size:.8125rem;white-space:nowrap}.mh2{font-weight:700;color:var(--mut);font-size:.8125rem;margin:16px 0 2px;padding-top:12px;border-top:1px solid var(--line)}.mh2:first-child{margin-top:0;padding-top:0;border-top:0}
.fr.in .top{display:flex;justify-content:space-between;align-items:center;gap:8px}.fr.in .money{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.fr.in .due{color:var(--mut);font-size:.8125rem;white-space:nowrap}
.pl-p{background:var(--ok-bg);color:var(--ok)}.pl-a{background:var(--bad-bg);color:var(--bad)}.pl-l{background:var(--warn-bg);color:var(--warn)}.pl-e{background:var(--blue);color:var(--blue-t)}
.modal{position:fixed;inset:0;background:rgba(27,29,34,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:560px;max-height:70vh;max-height:min(70dvh,560px);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.sheet .mhd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 8px 16px;flex:none}
.sheet .mx{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--panel);font-size:1.4rem;line-height:1;cursor:pointer;color:var(--ink)}
.sheet .mbd{overflow-y:auto;padding:0 16px 12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="msg">Đang tải...</div></div></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="sheet"><div class="mhd"><h3 class="pill"></h3><button type="button" class="mx" aria-label="Đóng">×</button></div><div class="mbd"></div></div></div>
<script>
(function () {
  'use strict';
  var URL_ = 'https://bumaiagvgpewhvczgwio.supabase.co', KEY = 'sb_publishable_B563fC34wnTDCGSZv29euw_6P3mFRs5';
  var c = window.supabase.createClient(URL_, KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
  var app = document.getElementById('app'), D = null, idx = 0;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function pd(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  var WD = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
  function dayLabel(s) { var d = pd(s); return WD[d.getDay()] + ', ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1); }
  function vnd(n) { return Number(n || 0).toLocaleString('vi-VN') + 'đ'; }
  function monthLabel(m) { return 'Tháng ' + Number(m.slice(5, 7)) + '/' + m.slice(0, 4); }
  function timeRange(x) { return x.start ? (x.end ? x.start + ' - ' + x.end : x.start) : ''; }
  function modeChip(x) { return '<span class="chip ' + (x.mode === 'online' ? 'c-on' : 'c-off') + '" title="' + (x.mode === 'online' ? 'Học online' : 'Học tại lớp') + '" aria-label="' + (x.mode === 'online' ? 'Học online' : 'Học tại lớp') + '">' + (x.mode === 'online' ? 'Online' : 'Tại lớp') + '</span>'; }
  var STAT = { planned: ['Sắp học', 'c-mut'], done: ['Đã học', 'c-ok'], cancel: ['Nghỉ', 'c-bad'], makeup: ['Học bù', 'c-warn'], holiday: ['Nghỉ lễ', 'c-mut'] };
  var HW = { done: ['Đã nộp', 'c-ok'], partial: ['Đang làm', 'c-warn'], pending: ['Chưa nộp', 'c-mut'], overdue: ['Quá hạn', 'c-bad'] };
  var TUI = { 'Đã đóng': 'c-ok', 'Chưa đóng': 'c-bad' };

  function code() { return decodeURIComponent((location.hash || '').replace(/^#/, '')).replace(/\s+/g, ''); }

  function askCode(note) {
    app.innerHTML = '<div class="wrap"><div class="msg"><b>Cổng phụ huynh</b>' + esc(note || 'Nhập mã 8 số giáo viên đã gửi hoặc mở lại link được gửi.') +
      '<form class="code" id="f"><input id="c" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="Mã 8 số" aria-label="Mã phụ huynh"><button type="submit">Xem</button></form></div></div>';
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault(); var v = document.getElementById('c').value.replace(/\s+/g, '');
      if (v) { location.hash = v; load(); }
    });
  }

  async function load() {
    var k = code();
    if (!k) return askCode();
    app.innerHTML = '<div class="wrap"><div class="msg">Đang tải...</div></div>';
    var r;
    try { r = await c.rpc('parent_portal', { p_code: k }); } catch (e) { r = { error: e }; }
    if (r.error) { app.innerHTML = '<div class="wrap"><div class="msg"><b>Không tải được dữ liệu</b>Vui lòng kiểm tra mạng và thử lại.</div></div>'; return; }
    if (r.data && r.data.error === 'parent_not_found') return askCode('Link hoặc mã không đúng, hoặc đã được đổi. Vui lòng liên hệ giáo viên.');
    if (r.data && r.data.error === 'too_many') { app.innerHTML = '<div class="wrap"><div class="msg"><b>Hệ thống đang bận</b>Vui lòng thử lại sau vài phút.</div></div>'; return; }
    D = r.data; idx = 0; render();
  }

  var LAB = { present: 'Có mặt', absent: 'Vắng', late: 'Trễ', excused: 'Có phép' };
  var ACLS = { present: ['p', '✓', 'c-ok'], absent: ['a', '×', 'c-bad'], late: ['l', 'T', 'c-warn'], excused: ['e', 'P', 'c-mut'] };
  function weekRange() {
    var t = new Date(), d = (t.getDay() + 6) % 7, mon = new Date(t.getFullYear(), t.getMonth(), t.getDate() - d), sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
    return [ymd(mon), ymd(sun)];
  }
  function nextSession(ch) {
    var today = ymd(new Date());
    return (ch.sessions || []).filter(function (x) { return x.date >= today && (x.status === 'planned' || x.status === 'makeup'); })
      .sort(function (p, q) { return (p.date + (p.start || '')) < (q.date + (q.start || '')) ? -1 : 1; })[0] || null;
  }
  function sessState(x) {
    if (x.attendance && ACLS[x.attendance]) return '<span class="chip ' + ACLS[x.attendance][2] + '">' + LAB[x.attendance] + '</span>';
    if (x.status === 'planned' || x.status === 'makeup') return modeChip(x);
    var st = STAT[x.status]; return st ? '<span class="chip ' + st[1] + '">' + st[0] + '</span>' : '';
  }
  function sessRow(x, hot) {
    return '<div class="row' + (hot ? ' hot' : '') + '"><div class="l"><b>' + esc(dayLabel(x.date)) + '</b><span>' + esc(timeRange(x)) + '</span></div><div class="rt">' + (hot ? '<span class="tag">Sắp tới</span>' : '') + sessState(x) + '</div></div>';
  }
  function mondayOf(str) { var d = pd(str.slice(0, 10)), k = (d.getDay() + 6) % 7; return ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate() - k)); }
  function weekLabel(mon) { var a = pd(mon), b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 6); return 'Tuần ' + pad(a.getDate()) + '/' + pad(a.getMonth() + 1) + ' – ' + pad(b.getDate()) + '/' + pad(b.getMonth() + 1); }
  function byWeek(list, keyOf, rowOf) {
    var g = {}; list.forEach(function (x) { var k = mondayOf(keyOf(x)); (g[k] = g[k] || []).push(x); });
    return Object.keys(g).sort().reverse().map(function (k) { return '<div class="mh2">' + weekLabel(k) + '</div>' + g[k].map(rowOf).join(''); }).join('');
  }
  function sessLine(x) { return '<div class="row ses"><b>' + esc(dayLabel(x.date)) + '</b><span class="stm">' + esc(timeRange(x)) + '</span><div>' + sessState(x) + '</div></div>'; }
  function weekHtml(ch) {
    var w = weekRange(), nx = nextSession(ch), h = '';
    var list = (ch.sessions || []).filter(function (x) { return x.date >= w[0] && x.date <= w[1]; })
      .sort(function (p, q) { return (p.date + (p.start || '')) < (q.date + (q.start || '')) ? -1 : 1; });
    var inWeek = nx && nx.date >= w[0] && nx.date <= w[1];
    if (nx && !inWeek) h += sessRow(nx, true);
    if (!list.length) return h + '<div class="sub">Tuần này không có buổi học.</div>';
    return h + list.map(function (x) { return sessRow(x, nx && x.date === nx.date && x.start === nx.start); }).join('');
  }

  function historyHtml(ch) {
    var today = ymd(new Date()), past = (ch.sessions || []).filter(function (x) { return x.date >= '2026-10-01' && (x.date < today || (x.date === today && x.attendance)); })
      .sort(function (p, q) { return p.date < q.date ? 1 : -1; });
    if (!past.length) return '<div class="sub">Chưa có buổi học nào.</div>';
    return byWeek(past, function (x) { return x.date; }, sessLine);
  }
  var ATT = { present: ['Các buổi có mặt', 'pl-p'], absent: ['Các buổi vắng', 'pl-a'], late: ['Các buổi trễ', 'pl-l'], excused: ['Các buổi có phép', 'pl-e'] };
  function attListHtml(ch, key) {
    var l = (ch.sessions || []).filter(function (x) { return x.attendance === key; }).sort(function (p, q) { return p.date < q.date ? 1 : -1; });
    return l.length ? byWeek(l, function (x) { return x.date; }, sessLine) : '<div class="sub">Không có buổi nào.</div>';
  }

  function attendanceHtml(ch) {
    var a = ch.attendance || {}, t = ch.tuition || {}, owed = t.mode !== 'session' ? Number(t.owed_sessions) || 0 : null;
    return '<div class="stats"><button type="button" class="stat s-p" data-att="present" aria-haspopup="dialog"><b>' + (a.present || 0) + '</b><span>Có mặt</span></button><button type="button" class="stat s-a" data-att="absent" aria-haspopup="dialog"><b>' + (a.absent || 0) + '</b><span>Vắng</span></button><button type="button" class="stat s-l" data-att="late" aria-haspopup="dialog"><b>' + (a.late || 0) + '</b><span>Trễ</span></button><button type="button" class="stat s-e" data-att="excused" aria-haspopup="dialog"><b>' + (a.excused || 0) + '</b><span>Có phép</span></button></div>' +
      (owed === null ? '' : '<div class="owed"><span>Số buổi nghỉ chưa học bù</span><b>' + owed + '</b></div>');
  }

  function hwWeek(x) { return x.week_start ? String(x.week_start).slice(0, 10) : (x.due_at ? mondayOf(ymd(new Date(x.due_at))) : weekRange()[0]); }
  function hwRow(x) {
    var s = HW[x.state] || HW.pending, due = x.due_at ? new Date(x.due_at) : null;
    var d = due ? 'Hạn ' + pad(due.getDate()) + '/' + pad(due.getMonth() + 1) + ' ' + pad(due.getHours()) + ':' + pad(due.getMinutes()) : 'Chưa đặt hạn';
    return '<div class="row hw"><b>' + esc(x.name) + '</b><span class="due">' + esc(d) + '</span><span class="chip ' + s[1] + '">' + s[0] + '</span></div>';
  }
  function homeworkHtml(ch) {
    var w = weekRange()[0], l = (ch.homework || []).filter(function (x) { return hwWeek(x) >= w || x.state !== 'done'; });
    return l.length ? l.map(hwRow).join('') : '<div class="sub">Chưa có bài về nhà.</div>';
  }
  function homeworkHistoryHtml(ch) {
    var l = (ch.homework || []).slice().sort(function (p, q) { return (q.due_at || '') < (p.due_at || '') ? -1 : 1; });
    return l.length ? byWeek(l, hwWeek, hwRow) : '<div class="sub">Chưa có lịch sử bài tập.</div>';
  }

  function feeDue(m) {
    if (!m || !m.month || m.paid_on || !(Number(m.rest) > 0)) return '';
    var y = +m.month.slice(0, 4), mo = +m.month.slice(5, 7), d = new Date(y, mo, 0).getDate();
    return 'Hạn ' + pad(d) + '/' + pad(mo);
  }
  function feeRow(name, m, inl) {
    var known = m && m.status !== 'Chưa có thông tin' && m.fee != null, tone = m ? (TUI[m.status] || 'c-mut') : 'c-mut';
    var money = known ? '<div class="money">Học phí <b>' + vnd(m.fee) + '</b></div>' : '';
    if (inl) {
      var dt = m && m.paid_on ? 'Đã đóng ' + pad(pd(m.paid_on).getDate()) + '/' + pad(pd(m.paid_on).getMonth() + 1) : feeDue(m);
      return '<div class="fr in"><div class="top"><b>' + esc(name) + '</b><span class="chip ' + tone + '">' + esc(m ? m.status : 'Chưa có thông tin') + '</span></div>' + (known ? '<div class="money"><span>Học phí <b>' + vnd(m.fee) + '</b></span><span class="due">' + esc(dt) + '</span></div>' : '') + '</div>';
    }
    return '<div class="fr"><div class="top"><div class="l"><b>' + esc(name) + '</b>' + (m && m.paid_on ? '<span>Đã đóng ngày ' + esc(pd(m.paid_on).toLocaleDateString('vi-VN')) + '</span>' : feeDue(m) ? '<span>' + feeDue(m) + '</span>' : '') + '</div><span class="chip ' + tone + '">' + esc(m ? m.status : 'Chưa có thông tin') + '</span></div>' + money + '</div>';
  }
  function kidMonths(k) {
    return ((k.tuition && k.tuition.months) || []).slice().sort(function (p, q) { return p.month < q.month ? 1 : -1; });
  }
  function feeHtml() {
    var kids = D.children || [], cur = ymd(new Date()).slice(0, 7), total = 0;
    var rows = kids.map(function (k) {
      var ms = kidMonths(k); total += ms.reduce(function (a, m) { return a + (m.fee != null ? Number(m.rest) || 0 : 0); }, 0);
      var now = ms.filter(function (m) { return m.month === cur; })[0] || null;
      return feeRow(k.name, now, true);
    }).join('');
    var h = '<div class="card"><div class="ph"><h3 class="pill pl-fee">Học phí tháng ' + Number(cur.slice(5)) + '</h3><button type="button" class="pill pb" data-pop="fee" aria-haspopup="dialog">Lịch sử đóng học phí</button></div>' + rows;
    if (kids.length > 1) h += '<div class="owed" style="margin-top:10px"><span>Tổng chưa đóng (tất cả các tháng)</span><b>' + vnd(total) + '</b></div>';
    return h + '</div>';
  }
  function feeHistoryHtml() {
    var kids = D.children || [], cur = ymd(new Date()).slice(0, 7), by = {};
    kids.forEach(function (k) { kidMonths(k).forEach(function (m) { if (m.month < cur) (by[m.month] = by[m.month] || []).push(feeRow(k.name, m, true)); }); });
    var keys = Object.keys(by).sort().reverse();
    if (!keys.length) return '<div class="sub">Chưa có lịch sử học phí.</div>';
    return keys.map(function (k) { return '<div class="mh2">' + esc(monthLabel(k)) + '</div>' + by[k].join(''); }).join('');
  }

  var modal = document.getElementById('modal');
  function closePop() { modal.hidden = true; document.body.style.overflow = ''; }
  function openPop(title, cls, html) {
    modal.querySelector('.mhd h3').className = 'pill ' + cls; modal.querySelector('.mhd h3').textContent = title;
    modal.querySelector('.mbd').innerHTML = html; modal.hidden = false; document.body.style.overflow = 'hidden'; modal.querySelector('.mx').focus();
  }
  modal.addEventListener('click', function (e) { if (e.target === modal || e.target.closest('.mx')) closePop(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modal.hidden) closePop(); });

  function render() {
    var kids = D.children || [], ch = kids[idx];
    var h = '<div class="bar"><div class="in"><div class="logo">gb</div><h1>Cổng phụ huynh</h1></div></div>';
    if (!ch) { app.innerHTML = h + '<div class="wrap"><div class="msg"><b>Chưa có thông tin học sinh</b>Vui lòng liên hệ giáo viên.</div></div>'; return; }
    h += '<div class="wrap">';
    if (kids.length > 1) h += '<div class="kids" role="group" aria-label="Chọn học sinh">' + kids.map(function (k, i) { return '<button type="button" class="kid" data-i="' + i + '" aria-pressed="' + (i === idx) + '">' + esc(k.name) + '</button>'; }).join('') + '</div>';
    h += '<div class="cols"><div class="col">' +
      '<div class="card"><h3 class="pill pl-att">Tổng quan chuyên cần</h3>' + attendanceHtml(ch) + '</div>' +
      '<div class="card"><div class="ph"><h3 class="pill pl-week">Lịch tuần này</h3><button type="button" class="pill pb" data-pop="hist" aria-haspopup="dialog">Lịch sử buổi học</button></div>' + weekHtml(ch) + '</div>' +
      '</div><div class="col">' +
      '<div class="card"><div class="ph"><h3 class="pill pl-hw">Bài tập về nhà</h3><button type="button" class="pill pb" data-pop="hw" aria-haspopup="dialog">Lịch sử bài tập</button></div>' + homeworkHtml(ch) + '</div>' +
      feeHtml() +
      '</div></div></div>';
    app.innerHTML = h; document.title = 'Parent Portal';
    Array.prototype.forEach.call(app.querySelectorAll('[data-pop]'), function (b) { b.addEventListener('click', function () {
      var k = b.getAttribute('data-pop');
      if (k === 'hist') openPop('Lịch sử buổi học', 'pl-week', historyHtml(ch));
      else if (k === 'hw') openPop('Lịch sử bài tập', 'pl-hw', homeworkHistoryHtml(ch));
      else openPop('Lịch sử đóng học phí', 'pl-fee', feeHistoryHtml());
    }); });
    Array.prototype.forEach.call(app.querySelectorAll('[data-att]'), function (b) { b.addEventListener('click', function () {
      var k = b.getAttribute('data-att'); openPop(ATT[k][0], ATT[k][1], attListHtml(ch, k));
    }); });
    Array.prototype.forEach.call(app.querySelectorAll('.kid'), function (b) { b.addEventListener('click', function () { idx = +b.getAttribute('data-i'); render(); window.scrollTo(0, 0); }); });
  }

  window.addEventListener('hashchange', load);
  load();
})();
</script>
</body>
</html>
