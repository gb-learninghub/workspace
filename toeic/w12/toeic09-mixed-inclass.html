<script type="application/json" id="gb-key">{"q101": {"a": "B", "e": "Sau động từ help cần tân ngữ, và người được giúp là Ms. Durkin: her. Bẫy A: she là chủ cách, không làm tân ngữ. Bẫy C: hers là đại từ sở hữu (của cô ấy), không đứng sau help. Bẫy D: herself chỉ dùng khi tân ngữ trùng với chủ ngữ của help; ở đây chủ ngữ của help là volunteers. Dịch: Cô Durkin đề nghị các tình nguyện viên giúp cô trong chương trình thể dục của nhân viên."}, "q102": {"a": "C", "e": "Sau tính từ extensive và trước of cần danh từ: knowledge (kiến thức). Bẫy A: know là động từ. Bẫy B: known là V3, không đứng sau extensive. Bẫy D: knowledgeable là tính từ, không đứng sau extensive. Dịch: Nhân viên của Lasner Electronics có kiến thức sâu rộng về các hệ thống phần cứng hiện hành."}, "q103": {"a": "A", "e": "Once a year = mỗi năm một lần, đứng đầu câu bổ nghĩa cho cả câu. Bẫy B, C: immediately và directly (ngay lập tức) không đi với a year. Bẫy D: yet không đứng đầu câu theo kiểu này. Dịch: Mỗi năm một lần, Tarrin Industrial Supply kiểm toán sổ sách của tất cả nhà máy."}, "q104": {"a": "D", "e": "Sau chỗ trống là một mệnh đề đầy đủ (the coffeemaker ... was damaged), cần liên từ chỉ lý do: because. Bẫy A: despite là giới từ, theo sau là danh từ, và nghĩa trái. Bẫy B: why không nối mệnh đề lý do ở vị trí này. Bẫy C: concerning là giới từ (liên quan đến), không nối mệnh đề. Dịch: Cô Pham yêu cầu hoàn tiền vì chiếc máy pha cà phê cô nhận được bị hỏng."}, "q105": {"a": "B", "e": "Information about + danh từ = thông tin về. Bẫy A: across (băng qua) sai nghĩa. Bẫy C: upon (trên) sai nghĩa. Bẫy D: except (ngoại trừ) sai nghĩa. Dịch: Thông tin về các tác phẩm nghệ thuật ở sảnh có tại quầy lễ tân."}, "q106": {"a": "C", "e": "Chỗ trống đứng giữa can và động từ see, cần trạng từ: easily (một cách dễ dàng). Bẫy A: ease là động từ hoặc danh từ. Bẫy B: easy là tính từ. Bẫy D: easier là tính từ so sánh hơn. Dịch: Với ống nhòm Gema XTI, người dùng có thể dễ dàng nhìn thấy vật cách xa hơn 100 mét."}, "q107": {"a": "A", "e": "Cấu trúc keep + tân ngữ + tính từ: keeping costs affordable (giữ chi phí ở mức phải chăng). Bẫy B: permitted (được phép) sai nghĩa. Bẫy C: cutting (cắt giảm) không hợp cấu trúc và nghĩa. Bẫy D: necessary (cần thiết) sai nghĩa. Dịch: Hiệp hội Vật lý trị liệu cam kết giữ chi phí các chương trình chứng chỉ ở mức phải chăng."}, "q108": {"a": "D", "e": "Câu thiếu động từ chia ở quá khứ (before he became president): occupied (đảm nhiệm). Bẫy A: occupation là danh từ. Bẫy B: occupational là tính từ. Bẫy C: occupying là V-ing, không có trợ động từ nên không làm vị ngữ. Dịch: Ông Brennel từng đảm nhiệm các vị trí ở nhiều mảng của công ty trước khi trở thành chủ tịch."}, "q109": {"a": "C", "e": "Cần danh từ hợp nghĩa với to the book: revisions (các bản chỉnh sửa), đúng việc biên tập viên gửi lại cho tác giả. Bẫy A: ideas (ý tưởng) không thường đi với to the book. Bẫy B: essays (bài tiểu luận) sai ngữ cảnh. Bẫy D: suggestions (gợi ý) kém hợp hơn vì cần bản đã chỉnh sửa để đúng tiến độ. Dịch: Để kịp tiến độ, các biên tập viên phải gửi mọi bản chỉnh sửa của cuốn sách cho tác giả trước thứ Sáu."}, "q110": {"a": "A", "e": "Only + danh từ làm chủ ngữ = chỉ những ai. Bẫy B: until là liên từ hoặc giới từ chỉ thời gian, sai nghĩa. Bẫy C: unless là liên từ, theo sau là mệnh đề. Bẫy D: quite là trạng từ chỉ mức độ, không đứng trước industry professionals theo nghĩa này. Dịch: Chỉ các chuyên gia trong ngành mới được mua vé Hội chợ Nhiếp ảnh Kuo."}, "q111": {"a": "A", "e": "Accepted a trophy = nhận một chiếc cúp. Bẫy B: congratulated cần tân ngữ chỉ người. Bẫy C: nominated (đề cử) không đi với trophy theo kiểu này. Bẫy D: hoped không có tân ngữ trực tiếp. Dịch: Tại tiệc của Pharmbeck, ông Jones nhận cúp cho thành tích trong chương trình cải tiến chất lượng năm nay."}, "q112": {"a": "C", "e": "Sau become cần tính từ: predictable (có thể dự đoán được). Bẫy A: predict là động từ. Bẫy B: prediction là danh từ, không thể nói xu hướng trở thành sự dự đoán. Bẫy D: predictably là trạng từ, không đứng sau become. Dịch: Cô Suto cho rằng nhờ phân tích dữ liệu, các xu hướng thị trường quan trọng trở nên có thể dự đoán được."}, "q113": {"a": "D", "e": "The relationship between A and B = mối quan hệ giữa hai bên: between salespeople and their customers. Bẫy A: inside (bên trong) sai nghĩa. Bẫy B: within (trong phạm vi) không dùng cho hai đối tượng. Bẫy C: around (xung quanh) sai nghĩa. Dịch: Một mục tiêu của Grommer Consulting là tăng cường mối quan hệ giữa nhân viên bán hàng và khách hàng."}, "q114": {"a": "A", "e": "Depending on your answers: việc gọi lại chỉ là khả năng, dùng modal may call. Bẫy B: are calling nói việc đang xảy ra, không hợp với depending on. Bẫy C: have been called là bị động, nhưng sau chỗ trống còn tân ngữ you. Bẫy D: must be calling (chắc chắn đang gọi) sai nghĩa. Dịch: Tùy câu trả lời khảo sát của bạn, chúng tôi có thể gọi cho bạn để thu thập thêm thông tin."}, "q115": {"a": "B", "e": "Sau chỗ trống là mệnh đề (Jemburger opened its newest franchise), cần liên từ chỉ thời điểm: when. Bẫy A: now đứng một mình không nối mệnh đề, phải là now that. Bẫy C: as if (như thể) sai nghĩa. Bẫy D: after all (rốt cuộc) là trạng ngữ, không nối mệnh đề. Dịch: Khi Jemburger mở chi nhánh mới nhất, 100 khách đầu tiên được tặng hamburger miễn phí."}, "q116": {"a": "B", "e": "Sau any cần danh từ không đếm hoặc số nhiều: correspondence (thư từ trao đổi). Bẫy A: corresponds là động từ. Bẫy C: correspondingly là trạng từ. Bẫy D: correspondent là danh từ chỉ người (phóng viên), sai nghĩa. Dịch: Vui lòng ghi số sê-ri sản phẩm vào mọi thư từ trao đổi với bộ phận chăm sóc khách hàng."}, "q117": {"a": "A", "e": "Awareness of + danh từ = nhận thức về. Bẫy B, C, D: to, from, with không đi với awareness theo nghĩa này. Dịch: Bộ phim đoạt giải Underwater Secrets nâng cao nhận thức về ô nhiễm đại dương và tác động của nó lên hành tinh."}, "q118": {"a": "B", "e": "Specializes in + (tính từ) + danh từ: personalized promotional items (vật phẩm khuyến mại được cá nhân hóa). Bẫy A: personally là trạng từ. Bẫy C: personality là danh từ, không đứng trước promotional items. Bẫy D: personalizes là động từ chia, không đứng sau in. Dịch: BYF Company chuyên cung cấp vật phẩm khuyến mại cá nhân hóa giúp doanh nghiệp quảng bá thương hiệu."}, "q119": {"a": "A", "e": "Sau chỗ trống là mệnh đề điều kiện, cần liên từ: as long as (miễn là). Bẫy B: along with là giới từ. Bẫy C: not only (không những) sai nghĩa và cấu trúc. Bẫy D: otherwise là trạng từ, không nối mệnh đề. Dịch: Miễn là mức tăng tiền thuê dưới 2%, Selwin Electrical Supply sẽ tiếp tục thuê mặt bằng."}, "q120": {"a": "D", "e": "Chủ ngữ procedures (số nhiều) được thực hiện, nên dùng bị động ở hiện tại tiếp diễn, hợp với meets regularly: are being performed. Bẫy A: to be performed không phải động từ chia. Bẫy B: would have performed là chủ động và sai thì. Bẫy C: had been performed là quá khứ hoàn thành, không hợp mốc thời gian. Dịch: Giám đốc Bệnh viện Belden họp thường xuyên với nhân viên để bảo đảm các quy trình đang được thực hiện đúng."}, "q121": {"a": "B", "e": "The appropriate department supervisor = trưởng bộ phận phụ trách phù hợp. Bẫy A: urgent (khẩn cấp) sai nghĩa. Bẫy C: subsequent (tiếp theo) sai nghĩa. Bẫy D: deliverable (có thể giao) sai nghĩa. Dịch: Mọi yêu cầu nghỉ phép phải gửi cho trưởng bộ phận phụ trách phù hợp."}, "q122": {"a": "D", "e": "Chỗ trống đứng sau innovative và song song với shipping methods, cần danh từ làm bổ ngữ: preservation methods (phương pháp bảo quản). Bẫy A: preserves là danh từ số nhiều nghĩa là mứt, sai nghĩa. Bẫy B: preserved là V3 hoặc tính từ. Bẫy C: preserve là động từ. Dịch: World Fish Supply giao cá tươi nhất có thể nhờ các phương pháp bảo quản và vận chuyển sáng tạo."}, "q123": {"a": "A", "e": "The annual budget requirements = các yêu cầu về ngân sách hằng năm do bộ phận lập kế hoạch gửi lên. Bẫy B: deliveries (các chuyến giao hàng) sai nghĩa. Bẫy C: developers (nhà phát triển) sai nghĩa. Bẫy D: qualities (chất lượng) sai nghĩa. Dịch: Ban điều hành đang xem xét các yêu cầu ngân sách hằng năm do bộ phận Kế hoạch tài chính trình lên."}, "q124": {"a": "C", "e": "Chỗ trống đứng sau was, bổ nghĩa cho cụm the result: partly (một phần). Bẫy A: parts là danh từ số nhiều. Bẫy B: parted là V2 hoặc V3. Bẫy D: parting là V-ing hoặc danh từ. Dịch: Ngay cả CEO cũng phải thừa nhận chiến thắng của Prasma Designs một phần là nhờ thời điểm thuận lợi."}, "q125": {"a": "D", "e": "Sau on cần danh từ hoặc đại từ làm tiền ngữ cho mệnh đề quan hệ (the focus group discussed): everything. Bẫy A: each cần danh từ theo sau. Bẫy B: several cần danh từ đếm được số nhiều theo sau. Bẫy C: another cần danh từ số ít theo sau. Dịch: Ông Singh ghi chú mọi điều mà nhóm thảo luận đã bàn trong buổi sáng."}, "q126": {"a": "B", "e": "Ranked third overall = xếp thứ ba chung cuộc. Bẫy A: together (cùng nhau) sai nghĩa. Bẫy C: consecutively (liên tiếp) sai nghĩa. Bẫy D: generally (nói chung) không đi với thứ hạng. Dịch: Năm ngoái, Tadaka Computer Solutions xếp thứ ba chung cuộc về doanh thu khu vực."}, "q127": {"a": "D", "e": "Sau chỗ trống là cụm danh từ the popularity of ..., cần giới từ chỉ nguyên nhân: as a result of (do). Bẫy A: on behalf of (thay mặt cho) sai nghĩa. Bẫy B: whether là liên từ, theo sau là mệnh đề. Bẫy C: moreover là trạng từ nối câu. Dịch: Do loa không dây BPT39 được ưa chuộng, sản lượng sẽ tăng gấp năm lần từ tháng sau."}, "q128": {"a": "C", "e": "Law firm whose offices = hãng luật có văn phòng, whose chỉ sở hữu. Bẫy A: how không thay cho sở hữu. Bẫy B: what không làm đại từ quan hệ sau danh từ. Bẫy D: wherever là liên từ, sai nghĩa. Dịch: Zypo Properties vừa ký hợp đồng thuê với hãng luật có văn phòng ở tầng ba."}, "q129": {"a": "D", "e": "Unforeseen events = những sự kiện không lường trước, hợp với việc lợi nhuận chênh lệch so với dự báo. Bẫy A: total (tổng) sai nghĩa. Bẫy B: marginal (không đáng kể) trái với differ significantly. Bẫy C: representative (đại diện) sai nghĩa. Dịch: Những sự kiện không lường trước trong năm nay khiến lợi nhuận quý hai và quý ba chênh lệch đáng kể so với dự báo ban đầu."}, "q130": {"a": "D", "e": "Allow for = tính đến, chừa chỗ cho: kéo dài mốc thời gian để tiếp nhận ý kiến. Bẫy A: use up (dùng hết) sai nghĩa. Bẫy B: believe in (tin vào) sai nghĩa. Bẫy C: make into (biến thành) sai nghĩa. Dịch: Mốc thời gian của dự án chiếu sáng lối đi được kéo dài để tiếp nhận ý kiến của ủy ban môi trường."}}</script>
