<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Test 06 - Writing (In-class)</title>
<style>
:root{--fs:18px;--ink:#111;--mut:#6b6b6b;--line:#dcdcdc;--soft:#f3f3f3;--ok:#e3f3e6;--okl:#2e7d4f;--bad:#fbe6e6;--badl:#b42b2b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Aptos,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;font-size:16px}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{height:100dvh;display:grid;grid-template-rows:56px 1fr}
#hd{display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(10px)}
.brand{font-weight:700;font-size:17px;white-space:nowrap}
.tabs{display:flex;gap:4px;margin:0 auto}
.tab{border:0;background:none;padding:15px 14px 13px;font-size:16px;border-bottom:3px solid transparent;color:var(--mut)}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.tools{display:flex;align-items:center;gap:6px}
.who2{font-size:14px;color:var(--mut);margin-right:6px}
.ib,.fsb,.tm{height:38px;min-width:38px;border:0;border-radius:19px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.fsb,.tm{font-weight:700;font-size:15px}
.tm.on{background:#111;color:#fff}
.ib.dark{background:#111;color:#fff}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;min-width:56px;text-align:center}
.clock.over{color:var(--badl)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.mv{display:none}
#main{--lw:48%;display:flex;min-height:0}
#task{width:var(--lw);overflow:auto;padding:24px 28px 60px;min-width:0}
#split{width:10px;cursor:col-resize;background:var(--soft);flex:none;position:relative;touch-action:none}
#split:after{content:"";position:absolute;left:3px;top:50%;width:4px;height:44px;margin-top:-22px;border-radius:2px;background:#bdbdbd}
#work{flex:1;display:flex;flex-direction:column;min-width:0;padding:24px 28px 16px}
.ptag{font-size:14px;color:var(--mut);margin-bottom:4px}
h2{margin:0 0 14px;font-size:calc(var(--fs) + 8px);line-height:1.25}
.tp{font-size:var(--fs);line-height:1.6;margin:0 0 12px;text-align:justify}
.tp.hint{color:var(--mut);font-size:16px}
.tp b{font-weight:700}
.q{font-weight:700}
#fig{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px;display:block}
#ta{flex:1;min-height:0;width:100%;resize:none;border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;font:inherit;font-size:var(--fs);line-height:1.6;outline:none;color:var(--ink);background:#fff}
#ta:focus{border-color:#111}
#ta[readonly]{background:var(--soft)}
#bar{display:flex;align-items:center;gap:12px;padding:10px 2px 0;font-size:15px;color:var(--mut)}
#wc{font-weight:700;color:var(--ink)}
#wc.low{color:var(--badl)}
#wc.ok{color:var(--okl)}
.fill{flex:1}
.banner{border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:15px;line-height:1.5;background:var(--ok)}
.banner.fb{background:var(--soft)}
.banner b{font-weight:700}
.ov{position:fixed;inset:0;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50}
.ov.solid{background:#fff}
.card{width:min(480px,92vw);background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px 28px}
.card h3{margin:0 0 10px;font-size:22px}
.card p{margin:8px 0;line-height:1.5;font-size:16px}
.card p.muted{color:var(--mut);font-size:15px}
.err{color:var(--badl)}
.gap{font:inherit;font-size:17px;border:0;border-bottom:2px solid #111;background:var(--soft);padding:10px 12px;margin:10px 0;width:100%;border-radius:6px 6px 0 0;outline:none}
.brow{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.pill{white-space:nowrap;border:0;border-radius:22px;background:#111;color:#fff;height:44px;padding:0 24px;font-size:16px;font-weight:600}
.pill.ghost{background:var(--soft);color:#111}
@media (max-width:900px){#main{flex-direction:column}#task{width:100%;height:42%}#split{display:none}.brand{display:none}}
@media (max-width:700px){#app{grid-template-rows:auto 1fr}#hd{height:auto;flex-wrap:wrap;gap:4px 8px;padding:6px 10px}.tabs{order:3;flex:1 0 100%;margin:0}.tab{flex:1;padding:8px 6px}.tools{margin-left:auto;flex-wrap:wrap;gap:4px}.who2,.hide-m{display:none}#main[data-v="t"] #work,#main[data-v="w"] #task{display:none}#task,#work{width:100%;flex:1;min-height:0}#task{padding:14px 16px 24px}#work{padding:12px 16px 10px}.mv{display:flex;order:4;flex:1 0 100%;gap:8px;padding-bottom:6px}.mvb{flex:1;height:38px;border:0;border-radius:19px;background:var(--soft);font-size:15px;font-weight:600}.mvb.on{background:#111;color:#fff}.card{padding:20px}.brow{flex-wrap:wrap}.sep{display:none}}
.stp{flex:none;margin:0 0 8px}.stk{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border:1.5px solid var(--line);border-radius:12px}.stk::-webkit-scrollbar{display:none}.stc{flex:0 0 100%;scroll-snap-align:start;padding:10px 12px;overflow:hidden;font-size:14px;line-height:1.45}.stn{font-weight:800;font-size:15px;margin:0 0 6px;color:#000}.stb{margin:0;padding:0 0 0 18px;list-style:disc}.stb li{margin:0 0 4px}.stb li::marker{font-size:1em}.stf{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}.sta{border:0;background:none;font-size:22px;line-height:1;width:44px;height:32px}.sta[disabled]{opacity:.25}.std{display:flex;gap:6px}.sdot{width:7px;height:7px;border-radius:50%;background:#ccc}.sdot.on{background:#111}
#stripbox{flex:none;padding:12px 16px 0}#wbody{flex:1;min-height:0;display:flex;flex-direction:column}

.sct mark{border-radius:3px;padding:0 1px;color:inherit;cursor:pointer}
.sct mark::after{content:attr(data-n);font-size:.6em;font-weight:800;vertical-align:super;margin-left:1px;color:#111}
.t-Grammar{background:#fbd5d5}.t-Word{background:#ffe0a8}.t-Spelling{background:#e3d4ff}.t-Unclear{background:#cfe3ff}.t-Good{background:#cdeccf}
.sn{flex:none;max-height:38%;overflow:auto;border-top:1px solid var(--line);padding:8px 14px;background:#fafafa}
.sn .ni{display:flex;gap:8px;align-items:baseline;font-size:15px;line-height:1.45;margin:3px 0;cursor:pointer}
.sn .ni b{flex:none;min-width:18px}
.sn .ni i{font-style:normal;flex:none;border-radius:10px;padding:1px 8px;font-size:13px;font-weight:700}
.sn .ni q{quotes:none;color:var(--mut)}
#abar{position:fixed;z-index:60;width:min(440px,94vw);background:#fff;border:1.5px solid #111;border-radius:14px;padding:10px}
#abar .aq{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
#abar .ach{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#abar .ach button{height:36px;padding:0 12px;border-radius:18px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:600}
#abar .ach button.on{border-color:#111;border-width:2px}
#abar .arow{display:flex;gap:6px;align-items:center}
#abar input{flex:1;min-width:0;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;height:40px}
#abar .am{font-size:13px;color:var(--badl);margin-top:6px}

#tools2{display:flex;align-items:center;gap:6px}
#upd{font-size:14px;color:var(--mut);margin-right:6px;white-space:nowrap}
#work{padding:0;background:#fff}
.icchips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none;align-items:center}
.icchip{height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);background:#fff;font-size:15px}
.icchip.on{background:#111;border-color:#111;color:#fff}
.icchip small{margin-left:6px;opacity:.7;font-size:12px}
#cards{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:12px 16px 16px;overflow:auto}
.sc{flex:1 1 0;min-height:240px;display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.sch{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--soft);flex:none}
.sch b{font-size:16px}.sch small{color:var(--mut);font-size:13px}
.sch .fill{flex:1}
.st{font-size:13px;font-weight:700;border-radius:12px;padding:3px 10px;background:#fff;color:var(--mut);border:1px solid var(--line)}
.st.sub{background:var(--ok);color:var(--okl);border-color:transparent}
.st.late{background:#fff0d6;color:#8a5a00;border-color:transparent}
.st.wr{background:#111;color:#fff;border-color:#111}
.wcn{font-weight:700;font-size:15px}.wcn.low{color:var(--badl)}.wcn.ok{color:var(--okl)}
.sct{flex:1;min-height:0;overflow:auto;padding:14px 16px;font-size:var(--fs);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.sct.empty{color:var(--mut)}
.msg{padding:16px;color:var(--mut);font-size:15px}
</style></head>
