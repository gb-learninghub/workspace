body.remote{display:block;overflow:hidden}

#pick{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#pick h1{margin:0 0 4px;font-size:1.5rem}
#pick .sub{color:#55555a;margin-bottom:8px}
#pick .row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:100%;max-width:640px}
#pick button{flex:1 1 240px;min-height:120px;border-radius:22px;border:2px solid #111;background:var(--sky,#e7f0fb);font:inherit;font-weight:700;font-size:1.2rem;padding:16px;cursor:pointer}
#pick button:nth-child(2){background:var(--mint,#e4f3ea)}
#pick button small{display:block;font-weight:400;color:#4b4b52;font-size:1rem;margin-top:6px}
#rm{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;background:#fff;font-size:16px;line-height:1.4;color:#111;padding-top:env(safe-area-inset-top)}
#rm *{box-sizing:border-box}
#rm button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#rm svg{width:22px;height:22px;display:block}
.rm-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px 4px;min-height:40px}
.rm-brand{font-weight:700}
.rm-stat{font-size:.85rem;color:#4b4b52;display:flex;align-items:center;gap:6px}
.rm-stat i{width:10px;height:10px;border-radius:50%;background:#d0d0d3;display:inline-block}
.rm-stat.on i{background:#2e9e57}
.rm-tabs{display:flex;gap:2px;overflow-x:auto;padding:0 10px;border-bottom:1px solid #e6e6e9;scrollbar-width:none;flex:none}
#rm .rm-tabs button{padding:8px 10px;min-height:44px;font-weight:600;color:#6b6b70;border-bottom:3px solid transparent;white-space:nowrap}
#rm .rm-tabs button.on{color:#111;border-color:#111}
.rm-body{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 16px;-webkit-overflow-scrolling:touch}
.rm-body h2{margin:0 0 2px;font-size:1.3rem;line-height:1.2}
.rm-sub{color:#55555a;margin-bottom:10px;font-size:.95rem}

.rm-card:nth-of-type(4n+3){background:var(--peach,#fdece0)}
.rm-card:nth-of-type(4n+4){background:var(--lilac,#eee9f8)}
.rm-card h3{margin:0 0 4px;font-size:1rem}
.rm-card ul{margin:0;padding-left:1.1em}
.rm-card li{margin:3px 0}
.rm-w{margin:6px 0}
.rm-w i{font-style:normal;color:#4b4b52}
.rm-w .ex{color:#333;font-size:.95rem}
.rm-ok{font-weight:700;color:#1f7a42}
.rm-note{color:#4b4b52;font-size:.92rem}
.rm-bar{flex:none;border-top:1px solid #e6e6e9;background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.rm-tools{display:flex;gap:8px;justify-content:center}
#rm .rm-tools button{min-width:48px;height:44px;border-radius:999px;background:var(--lilac,#eee9f8);display:grid;place-items:center;padding:0 14px;font-weight:700;font-variant-numeric:tabular-nums}
#rm .rm-tools button:disabled{opacity:.35}
#rm .rm-tools button.timer-on{background:var(--butter,#faf2d6)}

.rm-nav{display:flex;align-items:center;gap:12px}

#rm .rm-nav .nv:disabled{background:#d8d8da}
.rm-nav .ct{min-width:72px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.rm-menu{position:fixed;inset:0;z-index:20;background:#fff;overflow-y:auto;padding:16px 14px calc(16px + env(safe-area-inset-bottom));display:none}

.rm-menu .opts2{display:flex;flex-wrap:wrap;gap:8px}

#rm .rm-menu .opts2 button.on{background:#111;color:#fff}
#rm .rm-menu .cl{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:50%;background:var(--lilac,#eee9f8);display:grid;place-items:center}
