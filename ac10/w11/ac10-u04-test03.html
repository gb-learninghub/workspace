 any questions, please email charityoftheyear@reading.ac.uk."]], "range": [1, 6], "groups": [{"kind": "mcq", "step": "cloze", "title": "Questions 1-6", "lines": ["Read the following advertisement and mark the letter A, B, C or D on your answer sheet to indicate the correct option that best fits each of the numbered blanks from 1 to 6."], "items": [[1, "", [["A", "improving"], ["B", "improvement"], ["C", "improved"], ["D", "improver"]]], [2, "", [["A", "local people helping"], ["B", "local helped people"], ["C", "helping local people"], ["D", "local people helped"]]], [3, "", [["A", "whose"], ["B", "whom"], ["C", "who"], ["D", "which"]]], [4, "", [["A", "looking after"], ["B", "listening to"], ["C", "arguing about"], ["D", "getting ready for"]]], [5, "", [["A", "Another"], ["B", "More"], ["C", "Many"], ["D", "Few"]]], [6, "", [["A", "During"], ["B", "Between"], ["C", "Among"], ["D", "Since"]]]]}]}, {"id": 2, "label": "Câu 7–12", "short": "7–12", "title": "Save the Children: Save the Future of the World", "paras": [["", "Save the Children is a charity that helps children all over the world. It wants to make children’s lives better with education, health care and human rights. It also helps children (7) ______ by natural disasters or war."], ["", "In the last ten years, the charity has helped about 273 million children get a better education. In 2019, it helped over 144 million children in about 117 countries. It spent about 700 million dollars on its work (8) ______ that year. This money came from gifts and (9) ______ events. The charity has many projects in Africa. (10) ______, right now, it is helping children and families in Somalia. They live in poor and dangerous places. The charity provides them (11) ______ food and water, and tries (12) ______ their health and education."], ["", "In short, Save the Children has done a lot to keep children safe and healthy. It will keep helping them in the future."]], "range": [7, 12], "groups": [{"kind": "mcq", "step": "cloze", "title": "Questions 7-12", "lines": ["Read the following leaflet and mark the letter A, B, C or D on your answer sheet to indicate the option that best fits each of the numbered blanks."], "items": [[7, "", [["A", "effect"], ["B", "affected"], ["C", "affect"], ["D", "effects"]]], [8, "", [["A", "in"], ["B", "on"], ["C", "at"], ["D", "to"]]], [9, "", [["A", "fundraising"], ["B", "volunteering"], ["C", "advertisement"], ["D", "non-profit"]]], [10, "", [["A", "Because"], ["B", "But"], ["C", "For example"], ["D", "So"]]], [11, "", [["A", "for"], ["B", "with"], ["C", "to"], ["D", "by"]]], [12, "", [["A", "improving"], ["B", "improve"], ["C", "to improving"], ["D", "to improve"]]]]}]}, {"id": 3, "label": "Câu 13–17", "short": "13–17", "nop": true, "range": [13, 17], "groups": [{"kind": "mcq", "step": "order", "title": "Questions 13-17", "lines": ["Mark the letter A, B, C, or D on your answer sheet to indicate the correct arrangement of the sentences to make a meaningful paragraph/letter in each of the following questions."], "items": [[13, "a. Lan: What a good idea! You can help by showing students the way, giving out water and saying kind words.<br>b. Hải: Yes! It is really nice to talk to the students. We give them confidence and we learn a lot too.<br>c. Hải: I want to join the “Tiếp sức mùa thi” program to help students in the exam season.", [["A", "c-a-b"], ["B", "b-c-a"], ["C", "c-b-a"], ["D", "a-c-b"]]], [14, "a. Linh: Right. It has courses to help teachers teach better and use technology in class.<br>b. Linh: Yes! It also teaches teachers and children how to stay safe, and helps families who need help.<br>c. Minh: It also gives books and school things to children in faraway places, so they can learn.<br>d. Linh: Have you heard of Save the Children? It is a big charity that helps children around the world.<br>e. Minh: Yes, I have! It started work in Viet Nam in 1990. It helps with education and training.", [["A", "b-c-a-e-d"], ["B", "d-c-a-e-b"], ["C", "d-e-a-c-b"], ["D", "b-e-a-c-d"]]], [15, "Hi Billy,<br>a. In the afternoon, there is an art sale. Some of our best students made beautiful paintings and we sell them cheaply.<br>b. You can also give us clothes you do not want any more.<br>c. In the morning, there is a clothes sale. We collected old clothes, and you can buy anything you like.<br>d. We did the same event last year and it was great. It starts at 9:30 and ends at about 3:00.<br>e. How are you? This Saturday, my school has an event to raise money for children with disabilities.<br>f. At the end of the day, a famous writer will come to meet us.<br>Do you want to come? My family can pick you up at 9:00 on Saturday morning.<br>Claire<br>Let me know if you can come.", [["A", "d-e-a-f-c-b"], ["B", "e-d-c-b-a-f"], ["C", "a-f-e-c-b-d"], ["D", "a-e-d-b-f-c"]]], [16, "Muddy Dog Challenge<br>Mia Roberts, May 5<br>a. Many people think the Muddy Dog Challenge is fun and important. You can have fun with your pet and help other animals too.<br>b. People can run 2.5 kilometres or 5 kilometres. There are up to 20 fun muddy tasks.<br>c. The Muddy Dog Challenge is a charity event. Every year there are many races in the UK.<br>d. People can run with or without their dogs. In 2019, the races raised over one million pounds for the Battersea Dogs and Cats Home.<br>e. The event raises money to help animals at Battersea Dogs and Cats Home. This charity has looked after dogs and cats since 1860.<br>Both owners and dogs will have a lot of fun at the Muddy Dog Challenge.", [["A", "c-b-e-a-d"], ["B", "c-a-e-b-d"], ["C", "a-c-b-e-d"], ["D", "c-e-b-d-a"]]], [17, "a. But these weekly activities are not always easy. The work can be hard and dangerous, but the members always work with a smile.<br>b. Through this work, they become more confident and learn to talk with other people. This also makes other people want to join.<br>c. Saigon Green Team is a group of young volunteers. They clean dirty canals in Ho Chi Minh City.<br>d. They often post about their work on social media, so more people can see it and say thank you for these small but important actions.<br>e. Every week they join volunteer activities to help the environment and teach people about it.", [["A", "c-a-e-b-d"], ["B", "d-b-a-c-e"], ["C", "c-e-d-a-b"], ["D", "d-a-b-c-e"]]]]}]}, {"id": 4, "label": "Câu 18–22", "short": "18–22", "title": "Howard Hughes Medical Institute", "paras": [["", "The Howard Hughes Medical Institute (HHMI) is one of the biggest charities in the world. Howard Hughes started it in 1963. He was a famous businessman, pilot, engineer and film director."], ["", "HHMI is a health charity. Its aim is (18) ______. Its main research program is called Investigators. It chooses scientists who can make a difference and helps them. Every year, there is a competition. The winners get money for their research for seven years. HHMI scientists have helped us understand the human body better. HHMI (19) ______. It has spent 653 million dollars on research. Since 1978, more than 30 scientists (20) ______."], ["", "(21) ______. It gives free materials to teachers and students on its website. It also gives scholarships to students and professors. It has spent more than 66 million dollars on science education. To make science more interesting for people, (22) ______. One of these films won an Emmy Award in 2018."]], "range": [18, 22], "groups": [{"kind": "mcq", "step": "cloze2", "title": "Questions 18-22", "lines": ["Read the following passage and mark the letter A, B, C, or D to indicate the correct option that best fits each of the numbered blanks from 18 to 22."], "items": [[18, "", [["A", "to making money from science"], ["B", "it wants to learn about health"], ["C", "to help people know more about science, especially about biology and medicine"], ["D", "help the public to know more about health"]]], [19, "", [["A", "helping many science projects around the world"], ["B", "will also help scientists in many countries"], ["C", "was giving money to many universities"], ["D", "has also given money to scientists at universities and hospitals"]]], [20, "", [["A", "that HHMI has helped have won the Nobel Prize"], ["B", "going on to win a Nobel Prize"], ["C", "who got help from the Nobel Prize have won"], ["D", "has helped have won prizes"]]], [21, "", [["A", "In addition, HHMI must make everyone love science"], ["B", "The institute also works to improve science education"], ["C", "It also builds new hospitals for children"], ["D", "They also write many books about doctors"]]], [22, "", [["A", "more people have visited science museums"], ["B", "science books are sold at low prices"], ["C", "the films are free to watch on the internet"], ["D", "the institute has worked with film makers to make science films"]]]]}]}, {"id": 5, "label": "Câu 23–30", "short": "23–30", "title": "The Risks of Giving to Charity", "paras": [["1", "Volunteering and giving to charity are often seen as good things. People who give their time or money often feel that their life has more meaning. They learn new skills and meet new people. Charity can change the lives of poor people, families and whole communities."], ["2", "But not all charities are honest. Some organizations or dishonest people take advantage of people who want to give. They may keep the money for themselves, say that a problem is worse than it is, or use the help for their own benefit. This hurts the people who need help, and it makes the public trust real charities less."], ["3", "Volunteers can also have bad experiences. Some organizations give them too much work and not enough help, do not train them well, or never say thank you. Then a good experience can become a heavy and boring job."], ["4", "To protect your time and money, you should check a charity before you help it. Read its financial reports, ask former volunteers about their experience, and ask clearly how the money is used. A good organization will give you full information and will not mind your questions."], ["5", "Even with these problems, most charities work honestly and do a lot of good. If you are careful and think before you act, you can still make a real difference in your community and avoid being cheated. When you help carefully, both the community and the volunteer get real benefits."]], "range": [23, 30], "groups": [{"kind": "mcq", "step": "read", "title": "Questions 23-30", "lines": ["Read the following passage and mark the letter A, B, C, D on your answer sheet to indicate the best answer to each of the following questions from 23 to 30."], "items": [[23, "Which of the following is <b>not</b> mentioned as a bad experience for volunteers?", [["A", "Being given too much work without enough help."], ["B", "Not getting good training."], ["C", "Nobody says thank you for their work."], ["D", "Being asked to give some of their own money."]]], [24, "The word “cheated” in paragraph 5 is closest in meaning to:", [["A", "tricked"], ["B", "paid"], ["C", "thanked"], ["D", "trained"]]], [25, "The word “careful” in paragraph 5 is <b>opposite</b> in meaning to:", [["A", "wise"], ["B", "smart"], ["C", "kind"], ["D", "careless"]]], [26, "The word “They” in paragraph 2 refers to:", [["A", "people who want to give"], ["B", "people who need help"], ["C", "bad organizations and dishonest people"], ["D", "honest charities"]]], [27, "Which of the following best paraphrases the sentence from paragraph 2: “This hurts the people who need help, and it makes the public trust real charities less.”?", [["A", "Dishonest actions hurt the people who need help and make people trust real charities less."], ["B", "People who need help trust charities less because they get nothing."], ["C", "A few bad charities lose a lot of money."], ["D", "People will trust real charities more if they stop helping those who need help."]]], [28, "According to the passage, which of the following is <b>true</b>?", [["A", "The passage tells people not to give or volunteer."], ["B", "Most charities are not honest, so people should stay away from them."], ["C", "People should check a charity’s financial reports before they give."], ["D", "All volunteers will have bad experiences."]]], [29, "In which paragraph does the writer tell readers how to make sure their help is used well?", [["A", "Paragraph 1"], ["B", "Paragraph 2"], ["C", "Paragraph 3"], ["D", "Paragraph 4"]]], [30, "In which paragraph does the writer say that most charity work is good, even with the problems?", [["A", "Paragraph 3"], ["B", "Paragraph 5"], ["C", "Paragraph 1"], ["D", "Paragraph 4"]]]]}]}, {"id": 6, "label": "Câu 31–40", "short": "31–40", "title": "Giving Back to Your Community", "paras": [["1", "[I] Volunteering is important for your community! Without volunteers, many services and events would not be possible. Helping at local shelters or food banks gives important help to people who have less. Giving back to the place where you live also brings people together and makes the differences between rich and poor people smaller."], ["2", "[II] Giving your time to help other people is good for you and for your community. Studies show that people who volunteer regularly are healthier in body and mind. People who volunteer all their lives usually live longer and feel happier. Volunteering also gives you a sense of purpose. The good feeling of giving back and helping society is very special."], ["3", "[III] Giving back is also a good way to know your community and the people in it. When you volunteer, you meet many new people. Working with people who also want to make their neighbourhood better helps you to widen your group of friends. It also helps you understand how other people in your community live. Knowing people from different backgrounds helps you become a kind and helpful citizen."], ["4", "You do not only learn people skills when you volunteer. Helping others teaches you to be patient, kind and strong. You also get better at talking with others when you work in a team, and you get many experiences that will help you in the future. Volunteering may even help you find a new interest."], ["5", "[IV] Whether you like animals, want to help homeless people or care about people’s rights, you can find a good way to give your time. Many towns and cities have community centres where you can find volunteer work. You can also look on websites like VolunteerMatch or Idealist. Even if you give only a few hours each month, you can make a big difference to other people’s lives."]], "range": [31, 40], "groups": [{"kind": "mcq", "step": "read", "title": "Questions 31-40", "lines": ["Read the following passage and mark the letter A, B, C or D to indicate the correct answer to each of the questions from 31 to 40."], "items": [[31, "Where in paragraph [ ] does the following sentence best fit?<br><i>There are many important causes, and they always need volunteers.</i>", [["A", "[I]"], ["B", "[II]"], ["C", "[III]"], ["D", "[IV]"]]], [32, "The word “special” in paragraph 2 is <b>opposite</b> in meaning to:", [["A", "unusual"], ["B", "ordinary"], ["C", "great"], ["D", "useful"]]], [33, "The word “widen” in paragraph 3 is closest in meaning to:", [["A", "lose"], ["B", "protect"], ["C", "forget"], ["D", "increase"]]], [34, "The word “It” in paragraph 3 (“It also helps you understand…”) refers to:", [["A", "the neighbourhood"], ["B", "working with people who want to help"], ["C", "your new friends"], ["D", "the community"]]], [35, "Which of the following best paraphrases the sentence from paragraph 5: “Even if you give only a few hours each month, you can make a big difference to other people’s lives.”?", [["A", "Only people who volunteer full time can change things."], ["B", "Giving money every month works better than giving time."], ["C", "Giving a little time regularly can really help people."], ["D", "You should not volunteer if you cannot give many hours."]]], [36, "Which of the following is <b>not</b> mentioned as a personal benefit of volunteering?", [["A", "Better physical and mental health."], ["B", "Learning skills like patience and kindness."], ["C", "Getting a salary or money for the work."], ["D", "Making more friends and contacts."]]], [37, "According to the passage, which of the following is <b>true</b>?", [["A", "People volunteer mainly to meet new people."], ["B", "Volunteering is a good way to get better at communication and other useful skills."], ["C", "Every town has a lot of volunteer chances."], ["D", "The good feeling of giving back is easy to find in many other activities."]]], [38, "Which of the following is the main idea of the second paragraph?", [["A", "Volunteering is good for your health and gives you a sense of purpose."], ["B", "People who volunteer regularly always live longer than other people."], ["C", "Helping society feels better than anything else."], ["D", "Volunteering is the only way to be healthy in body and mind."]]], [39, "Which of the following can most likely be inferred from the passage?", [["A", "Volunteering helps volunteers more than it helps the community."], ["B", "People who volunteer regularly will probably be healthier and happier."], ["C", "Only trained volunteers can help a community."], ["D", "Volunteering is a duty, not a choice."]]], [40, "Which of the following best summarises the passage?", [["A", "Volunteering is a good activity: it improves your health and skills and makes the community stronger."], ["B", "The best thing about volunteering is meeting different people and making more friends."], ["C", "People volunteer mainly because they want to feel good about themselves."], ["D", "Volunteering is the only way to give free services in a community."]]]]}]}]};</script>
