  var IC_SCR = ["<p>A conversation between two students, Harry and Andrea, who have just finished their final exams</p>\n<p>H: Hi Andrea, how are you feeling now that exams are over?</p>\n<p>A: It’s fantastic to have finished, isn’t it, and to sleep in every morning! What about you?</p>\n<p>H: Well, I’ve been catching up on sleep, too. But I’ve got a lot to do before I leave for <u>England</u>. Perhaps you could give me some advice? <b class=\"qm\" data-q=\"1\">1</b><mark>I've got a lot of things I can’t possibly take back with me but I don’t know what to do with them.</mark></p>\n<p>A: Well, it depends on what sort of <u>things</u> they are and whether you’re thinking of giving them away or selling them.</p>\n<p>H: Well, almost everything - furniture, <b class=\"qm\" data-q=\"2\">2</b><mark>the fridge and other kitchen stuff that I bought from the previous tenant, but the new people have already got what they need so they’re not interested in buying stuff from me.</mark> I can’t afford to give it away but I’m not sure how to sell it all. Oh, and there are some clothes and books as well.</p>\n<p>A: Why can’t you take them?</p>\n<p>H: The books are really heavy - it’s so expensive if you exceed the airline baggage allowance. And the clothes just won’t all fit in my suitcase, it’s amazing how much stuff I’ve accumulated since I’ve been here. Anyway I don’t think I’ll need as many summer clothes in England as I have here in Australia!</p>\n<p>A: I see. Well, there are several alternatives. First of all, you could put up notices around the <u>university</u> about the <u>books</u> - you know on the notice-boards in the <u>student</u> union building, and <b class=\"qm\" data-q=\"3\">3</b><mark>in the economics department, anywhere second and third year students will see them.</mark> People are always keen to buy cheap textbooks.</p>\n<p>H: OK. What should I say on the notices?</p>\n<p>A: Just put the titles, authors and price you want ... your name of course, and maybe put your phone number on those little tear off tags.</p>\n<p>H: That’s a good idea. And what about the <u>furniture</u>?</p>\n<p>A: You could try <u>doing</u> the <u>same</u> <u>thing</u>, but usually <b class=\"qm\" data-q=\"4\">4</b><mark>students are away all summer so they don’t want to buy furniture now.</mark> Another place to try might be a <u>second</u>-<u>hand</u> <u>shop</u>. Someone from the <u>shop</u> will usually come around and give you a <u>free</u> quote, and then you can decide. But <b class=\"qm\" data-q=\"5\">5</b><mark>you don’t usually get much money for that sort of stuff.</mark></p>\n<p>(Pause)</p>\n<p>A: Another alternative is to put an advertisement in the Trading Post. Do you know that paper? It comes out every week, advertising things people want to sell. You have to pay to put the advert in and then hope people phone. Give them as much information as possible and if they’re interested, invite them to come and have a look. The hard part is agreeing on a price.</p>\n<p>H: No, I haven’t seen the <u>Trading</u> <u>Post</u>, but I should have a look at it, and I could <b class=\"qm\" data-q=\"6\">6</b><mark>advertise</mark> the fridge, the microwave, and the <u>furniture</u>. But the kitchen stuff isn’t really that good -you know, old cutlery, a few pots and pans, and some plates and <u>things</u>. What shall I do with them?</p>\n<p>A: Well, another option is to <b class=\"qm\" data-q=\"7\">7</b><mark>donate</mark> the <u>kitchen</u> <u>things</u> to a charity <u>shop</u>, you know like the Salvation Army or St. Vincent de Paul. Why don’t you get a <u>second</u>-<u>hand</u> <u>shop</u> to give you a <b class=\"qm\" data-q=\"8\">8</b><mark>quote</mark> <u>first</u>?</p>\n<p>H: Yes, I could do that - find out how much they’ll <u>give</u> me and then decide whether to sell them or <u>give</u> them away. But I’ve still got the <u>clothes</u>.</p>\n<p>A: A <b class=\"qm\" data-q=\"9\">9</b><mark>charity</mark> <u>shop</u> will take them too, as long as they’re in good condition. And even though you don’t get any money at least you know that someone who really deserves some help has benefited.</p>\n<p>H: That’s a good point. I’ll advertise the expensive stuff - the furniture - and donate the clothes and kitchen stuff. Let’s go and buy a Trading Post and you can help me write the advert.</p>\n<p>A: Well, ... <b class=\"qm\" data-q=\"10\">10</b>actually I’m interested in buying the <u>fridge</u> and the <u>microwave</u>, depending on the price of course.</p>\n<p>H: OK. Let’s see how good you are at bargaining!</p>", "<p>A phone conversation giving information about a health and fitness centre</p>\n<p>H: Hello.</p>\n<p>C: Hello. Is that Ms. Heidi Jones?</p>\n<p>H: Yes.</p>\n<p>C: Good morning Ms. Jones, I’d like to take a few minutes of your time to tell you about the Sevenoaks Health and Fitness Centre which is in your suburb. Would that be convenient?</p>\n<p>H: OK.</p>\n<p>C: Well, the centre’s not far from you, it’s on the <b class=\"qm\" data-q=\"11\">11</b><mark>corner</mark> of <u>Marion</u> St. and <u>Giles</u> St., and has a large car park. It’s open every day of the week, opening on weekdays at <b class=\"qm\" data-q=\"12\">12</b><mark>6</mark> am and at <u>9</u> am at the weekend. It closes at <u>9</u>:<u>30</u> pm <u>Monday</u> to <u>Friday</u>, and on Saturday at 4 pm and <u>Sunday</u> at <b class=\"qm\" data-q=\"13\">13</b><mark>2</mark> pm.</p>\n<p>We also have childcare, <u>Monday</u> to Saturday from nine in the morning until midday for a small extra charge, so you can leave your children in safe hands while you attend one of our classes, or perhaps have a swim, or if you just want to relax in the spa and sauna or steam room. Talking of classes we have a very wide range which are designed to suit all different <u>levels</u> of fitness and individual needs. I mentioned the pool just now; well, in addition to swimming laps or just relaxing we also offer <u>aqua</u> <u>aerobic</u> <b class=\"qm\" data-q=\"14\">14</b><mark>classes</mark>, which are 45 minute classes that use the therapeutic effects of water. This provides a very safe and effective exercise and is suitable for all fitness levels, as well as being a lot of fun. Many people who haven’t been exercising for a while start in the aqua classes, as do people who need to take care after hospital surgery for example. These classes are very popular and are scheduled every <u>weekday</u>, Monday to Friday and on Saturday afternoon and Sunday morning. Another very popular activity in the pool area is learning to <b class=\"qm\" data-q=\"15\">15</b><mark>swim</mark>, and these swimming classes are held at 4 pm every <u>weekday</u> and in the <u>mornings</u> at the <u>weekend</u>. By the way, they’re open to both adults and children of any age.</p>\n<p>Now it would take too much of your time to tell you in detail about all our programs as we have a very wide range of activities at different times, however, I’ll just outline some of them. Our super-circuit classes are extremely popular and you get a good aerobic <u>workout</u> while toning your muscles. They’re <u>easy</u> to <b class=\"qm\" data-q=\"16\">16</b><mark>learn</mark>, as you combine using hydraulic equipment with exercises guaranteed to give you a good <u>cardio</u>- <u>workout</u>. The teachers are very good and there’s a fun atmosphere. And the classes are very effective in assisting weight loss, relieving stress, lowering blood pressure and generally increasing fitness. Oh, and I haven’t mentioned our range of aerobic and step classes of different types which suit all levels. Our specially designed aerobics room holds over 55 people, and our highly qualified and trained staff can advise you as to which class might suit you.</p>\n<p>We are inviting you to a free one week trial period when you can come and try any of the classes or activities before you make the decision to join. By the way, there is also a large and very well-equipped gym, where we offer free <u>fitness</u> assessments and you can have an <u>individual</u> <b class=\"qm\" data-q=\"17\">17</b><mark>program</mark> designed just for you. Also the cardio-vascular room has the latest range of machines which help you burn fat, increase your <u>fitness</u> or just warm up. They’re very popular as you can forget all about the calorie burning by watching your <u>favourite</u> <b class=\"qm\" data-q=\"18\">18</b><mark>music videos</mark> on TV <u>while</u> you <u>exercise</u>! Right now we have a very special new member joining fee offer, which allows two memberships for the price of one, a real bargain! So if you can, bring along a friend who’d like to get fit as well, in time for summer. Come along and try us out. You can meet the staff, try out some of the classes for a week, absolutely <b class=\"qm\" data-q=\"19\">19</b><mark>free</mark>, and then if you like us, sign up for only $<u>110</u> each for <b class=\"qm\" data-q=\"20\">20</b><mark>six</mark> <u>months</u>. Thanks for taking the time to learn about the Centre and I hope we’ll see you there soon, Heidi. I’ll put one of our brochures in the mail for you right now. Bye for now ... .</p>", "<p>Two business studies students, Evelyn and Mark, preparing for a seminar presentation</p>\n<p>E: Well, I think the marketing of food would be a good topic. I read a very interesting article the other day about the Canadian food market.</p>\n<p>M: Mm... I suppose everybody’s interested in food, even if it’s trying NOT to eat. Why Canada? I know that’s where you come from, but isn’t it just all North America really?</p>\n<p>E: No, that’s why I thought this article was inter-esting. Although lots of US companies are well established in Canada, and vice versa, there are still <u>subtle</u> <b class=\"qm\" data-q=\"21\">21</b><mark>differences</mark> <u>between</u> the two markets. It says here 'the <u>Canadian</u> market is definitely not a northern clone of the US’. I like that. And it says that if you understand these differences, it can have a big impact on successful food marketing.</p>\n<p>M: So I know that Canada has a big French-speaking population in Quebec, is this what they’re referring to?</p>\n<p>E: Not only French and English speakers, there are many <u>different</u> <u>ethnic</u> <u>groups</u> in <u>Canada</u>.</p>\n<p>It’s really quite multicultural. For example, <u>Toronto</u> has <u>large</u> <u>Asian</u> and <b class=\"qm\" data-q=\"22\">22</b><mark>Italian</mark> <u>populations</u>, and Vancouver’s got a <u>large</u> <u>Asian</u> population, too. And because <u>Canada</u>’s population is small, these <u>groups</u> make quite an impact, introducing new styles of cooking. So you can see lots of unfamiliar vegetables and things in the markets and new restaurants are opening every day. It’s great if you love trying out new foods, as many people do!</p>\n<p>M: Which kinds of food are becoming popular?</p>\n<p>E: Well, some Asian food I’d say has been popular for quite a while like Chinese, but now <u>South</u> <u>East</u> <u>Asian</u> restaurants are becoming very fashionable. Then there’s <u>Mediterranean</u> of course, such as Greek, Italian and so on, but <u>Caribbean</u> and <b class=\"qm\" data-q=\"23\">23</b><mark>Mexican</mark> food is really taking off among young people these days.</p>\n<p>M: So are the supermarkets starting to stock the <b class=\"qm\" data-q=\"24\">24</b><mark>ingredients</mark> that are needed to <u>prepare</u> these <u>foods</u> at home, you know, all those unusual <u>condiments</u> and <u>sauces</u>?</p>\n<p>E: Yes, that’s right, it’s quite interesting going to the supermarket, isn’t it, and noticing how they’re introducing sections for foods of different nationalities - you can buy quite exotic products locally these days. The article mentioned that 80% of the Canadian retail market is controlled by eight major national supermarket chains, so that when they introduce changes they can happen quite rapidly.</p>\n<p>M: OK, well, how are we going to organise this seminar then?</p>\n<p>E: I made some notes on the trends in the Canadian market, about changing tastes and also patterns for where food is consumed. I thought maybe we could summarise it into a chart or table and maybe use the overhead projector to present it.</p>\n<p>M: Good idea. Maybe I could have a look for similar <u>trends</u> and tastes in <b class=\"qm\" data-q=\"25\">25</b><mark>Australia</mark> and the UK, for comparison. Let’s have a look at what you found.</p>\n<p>(Pause)</p>\n<p>E: The most significant trend it seemed to me, was that Canadians are definitely interested in healthy <u>food</u>. For example, did you know that <u>salads</u> are the <u>third</u> most <u>commonly</u> <u>eaten</u> <u>food</u> in <u>Canadian</u> <b class=\"qm\" data-q=\"26\">26</b><mark>restaurants</mark>?</p>\n<p>M: Really! What about organic <u>food</u> then, is that becoming more popular?</p>\n<p>E: Yes, it’s definitely moving into the mainstream, compared to a few years ago. And, a recent survey .showed that 4 out of 5 <u>shoppers</u> said that they <u>check</u> the <b class=\"qm\" data-q=\"27\">27</b><mark>fat</mark> and <u>nutritional</u> <u>information</u> on the packet when they are deciding what to buy.</p>\n<p>M: What other trends did you find out?</p>\n<p>E: There’s one change I noticed straight away when I was home last year, in the meat department. You know here the meat packaging says 'rump steak’ or 'forequarter chops’ and so on? Well, they discovered that most consumers these days didn’t know what to do with these roasts, and rounds and ribs, so the government approved a new naming system for cuts of meat, which is related to the required <b class=\"qm\" data-q=\"28\">28</b><mark>cooking</mark> <u>technique</u>.</p>\n<p>M: What a good idea. I’ve never really understood the difference between sirloin, rump, round and all those names. So how many new categories are there?</p>\n<p>E: Eight. There are three kinds of steak - for grilling, for marinating and for simmering, and then there’s what they call 'quick serve’ beef, for stir fries I suppose, and premium oven roast, oven roast, pot roast and stewing beef. It’s a great idea, isn’t it? I hope it catches on here.</p>\n<p>M: I agree! Any other trends that you thought were significant?</p>\n<p>E: Well, what’s really interesting is what the article called 'mobile meals’. In other words, more and more Canadians are eating meals away from home, but NOT just eating more junk food.</p>\n<p>They are projecting a <b class=\"qm\" data-q=\"29\">29</b><mark>40%</mark> <u>increase</u> in snack food <u>sales</u> over the <u>next</u> three <u>years</u> and the <u>growth</u> is coming from <b class=\"qm\" data-q=\"30\">30</b><mark>healthy</mark> <u>snacks</u> - you know the ones that have less cholesterol and fat, such as <u>muesli</u> <u>bars</u>, health food <u>bars</u> and those types of products. Apparently in the food marketing jargon they are called 'nutritious portable foods’ which means healthy snacks!</p>\n<p>The other major trend is that young people are doing more of the food shopping these days so marketing has to be aimed more at them, as well as more conventionally at the mother.</p>\n<p>M: Thanks Evelyn, I think we’ll have an interesting discussion about these trends and the comparisons with other English speaking countries. I’ll see if I can get some information about them to compare with yours, and meet you on Friday to put it together.</p>\n<p>E: See you then, bye.</p>", "<p>A talk given by Doctor Miranda James and introduced by the President of Overseas Students' Association Good afternoon everybody and welcome to the first in a series of talks we have arranged for the Overseas Students’ Association this semester.</p>\n<p>Doctor James has very kindly agreed to speak to us today on the topic of public speaking, and judging from the large numbers of you here it is clearly a subject of great interest and relevance. Dr. James. Hello. It’s good to see so many of you here and hopefully what I’m going to tell you will be useful to you both here at the University and in your future employment. Many <u>people</u> avoid <u>speaking</u> publicly, by which I mean in front of say <b class=\"qm\" data-q=\"31\">31</b><mark>10 or more</mark> <u>people</u>, not because they <u>lack</u> the ability but mainly because they <u>lack</u> <u>confidence</u> which is really only due to <b class=\"qm\" data-q=\"32\">32</b><mark>lack of practice</mark>. Today, as a consequence of the influence of television, audiences expect speakers to be relatively brief and to the point, in addition to being well informed and interesting or entertaining.</p>\n<p>Probably the most important <u>part</u> of <u>public</u> <u>speaking</u> is what you do beforehand, by which I mean <b class=\"qm\" data-q=\"33\">33</b><mark>preparation</mark>. This <u>includes</u> practical details such as knowing precisely what your <b class=\"qm\" data-q=\"34\">34</b><mark>topic</mark> is and exactly how long you are expected to <u>talk</u> for. You should also plan the content thoroughly. A good strategy is to write out the content as you intend to say it and then make brief notes, preferably on small cards, which you use to talk from. This way, you sound more natural, you incorporate pauses while you look at your notes and you can then look at your <u>audience</u> while you are speaking. Never read your speech without looking at the <u>audience</u>. <b class=\"qm\" data-q=\"35\">35</b><mark>Eye contact</mark> is a very <u>important</u> part of communicating with an <u>audience</u>; so deliberately move your head and look around at your <u>audience</u>. Pauses are <u>important</u> as most people when they are nervous tend to rush through their speech. Practise speaking slowly, this gives you more time to pronounce your words correctly. It’s always easier for your audience to listen to someone whose speaking is clear and calmly paced so that they can understand the ideas being explained. And the <u>bigger</u> the group, the more <b class=\"qm\" data-q=\"36\">36</b><mark>slowly</mark> you should <u>speak</u>. Remember to <u>project</u> your <u>voice</u>, speaking clearly to the person furthest away from you. It’s a good idea to <u>rehearse</u> and <b class=\"qm\" data-q=\"37\">37</b><mark>record yourself</mark>. Pay attention to your intonation when you listen to yourself. It’s even harder if you are speaking in a second language. I would imagine, but there’s nothing worse than listening to a flat monotonous voice, so try to vary your <u>tone</u> and <u>rhythm</u>. This will add <b class=\"qm\" data-q=\"38\">38</b><mark>meaning</mark> to your words. <u>Lastly</u>, pay attention to both your <b class=\"qm\" data-q=\"39\">39</b><mark>posture</mark> and your <u>gestures</u>. A confident person stands (or sits in a small group) with their head up, chin out and shoulders back; Try to <u>avoid</u> <u>scratching</u> or <u>fiddling</u> with your hair or beard, or pens, jewellery and so on. These movements can <b class=\"qm\" data-q=\"40\">40</b><mark>distract</mark> and irri-late your <u>audience</u>, yet you may be unaware of them yourself - another reason for rehearsing, preferably with feedback from a friend, or better still on video.</p>\n<p>I hope these few tips will make your experience of speaking in public a little easier - remember 'practice makes perfect’!</p>"];

  /* ---------- audio ---------- */
  var au = { a: null, rg: null, speeds: [1, 0.75, 1.25], si: 0 };

  function drawAu() {
    var a = au.a, d = a.duration || 0, t = a.currentTime || 0, p = d ? t / d : 0, sk = $("#sk"); if (!sk) return;
    $(".fl", sk).style.width = (p * 100) + "%"; $(".ph", sk).style.left = (p * 100) + "%";
    var rg = $(".rg", sk); if (au.rg && d) { rg.style.display = "block"; rg.style.left = (au.rg[0] / d * 100) + "%"; rg.style.width = ((au.rg[1] - au.rg[0]) / d * 100) + "%"; } else rg.style.display = "none";

  function buildAudio() {

    var down = null;
    function tAt(e) { var r = sk.getBoundingClientRect(), x = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); return x * (a.duration || 0); }

  /* ---------- progress, save, submit ---------- */
  function draftBody() { return { ans: state.ans, open: state.open, notes: state.notes || {} }; }
  function scheduleSave() {
    if (!state.code || state.loading) return;
    var cur = JSON.stringify(draftBody()); if (cur === state.saved) return;
    setSave("Saving..."); clearTimeout(state.timer); state.timer = setTimeout(function () { saveNow(false); }, 1200);
  }
  function saveNow(keep) {
    if (!state.code) return Promise.resolve();

      .then(function () { state.saved = cur; setSave("Saved"); }).catch(function () { setSave("Not saved"); });
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") saveNow(true); });
  window.addEventListener("pagehide", function () { saveNow(true); });
  function loadProgress(pg) {

    state.lock = {}; state.byId = {}; state.pres = {};
    (pg.parts || []).forEach(function (x) {
      var pi = x.part - 1; if (state.open.indexOf(pi) > -1 || !D.parts[pi]) return;

      (x.latest.items || []).forEach(function (it) { state.byId[it.id] = it.correct; });
    });
    var first = 0; for (var i = 0; i < D.parts.length; i++) { if (!state.lock[i]) { first = i; break; } }
    state.pi = first; state.pg = 0; state.review = false; setAudio(first);
    state.saved = JSON.stringify(draftBody()); state.loading = false; paintAll(); setSave("");
  }
  function partAnswers(pi) { var a = {}; nums(pi).forEach(function (n) { a["q" + n] = val(n); }); return a; }
  function submit() {
    var pi = state.pi; if (locked(pi)) return;

    modal("Submit Part " + D.parts[pi].id + "?", (un ? un + " question" + (un > 1 ? "s are" : " is") + " still unanswered in this part. " : "") + "You cannot change your answers in this part after submitting.",
