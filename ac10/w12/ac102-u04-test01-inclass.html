, B, C, or D to indicate the word(s) OPPOSITE in meaning to the underlined word(s)."], "items": [[8, "He plans to organize <u>various</u> activities so that as many students can join as possible.", [["A", "different"], ["B", "similar"], ["C", "diverse"], ["D", "numerous"]]], [9, "Volunteering has helped me <u>gain</u> life experiences and find my sense of purpose in life.", [["A", "acquire"], ["B", "achieve"], ["C", "profit"], ["D", "lose"]]]]}, {"kind": "mcq", "step": "read", "title": "Questions 10-22", "lines": ["Mark the letter A, B, C, or D to indicate the correct answer to each of the following sentences."], "items": [[10, "I became a volunteer at the local center for community development just ______.", [["A", "by chance"], ["B", "on purpose"], ["C", "for all"], ["D", "in need"]]], [11, "Community service not only benefits the local area, but can also boost our ______.", [["A", "confident"], ["B", "unconfident"], ["C", "confidence"], ["D", "confidently"]]], [12, "I’m so ______ about volunteering at the center and I want to apply to join.", [["A", "interested"], ["B", "excited"], ["C", "surprised"], ["D", "fond"]]], [13, "I hope your application is ______ and you may enjoy your work.", [["A", "succeed"], ["B", "success"], ["C", "successful"], ["D", "successfully"]]], [14, "He is so ______ that he’s always willing to give a lot of money to charity.", [["A", "generous"], ["B", "independent"], ["C", "outgoing"], ["D", "sociable"]]], [15, "The club is ______ in a remote area so it’s hard to get to it.", [["A", "named"], ["B", "presented"], ["C", "designed"], ["D", "located"]]], [16, "They ______ a programme on TV when the light ______ out.", [["A", "were watching – was going"], ["B", "were watching – went"], ["C", "watched – went"], ["D", "watched – was going"]]], [17, "John was surfing the Internet ______ he found some information about the Blood Club.", [["A", "while"], ["B", "before"], ["C", "after"], ["D", "when"]]], [18, "She was ______ and had to put her child up for adoption. They had no place to live.", [["A", "unemployed"], ["B", "disabled"], ["C", "homeless"], ["D", "orphanage"]]], [19, "______ the end of each month, my mother gathers all the items she’s made and takes them to the Volunteer Club.", [["A", "To"], ["B", "At"], ["C", "In"], ["D", "On"]]], [20, "Volunteering helps us feel lucky about life. ______, the activities also help us become stronger and meet more friends with the same interests.", [["A", "Then"], ["B", "Therefore"], ["C", "What is more"], ["D", "In contrast"]]], [21, "Having children ______ in community activities is a good method of educating them.", [["A", "participate"], ["B", "participation"], ["C", "participant"], ["D", "to participate"]]], [22, "One of the most important benefits of helping a community is that people can ______ contact people from different circumstances.", [["A", "come to"], ["B", "come up"], ["C", "come on"], ["D", "come into"]]]]}, {"kind": "mcq", "step": "read", "title": "Questions 23-25", "lines": ["Mark the letter A, B, C, or D to indicate the underlined part that needs correction in each question."], "items": [[23, "People whose <u>applicant</u> is <u>successful</u> will be <u>trained</u> by <u>experienced</u> volunteers.", [["A", "applicant"], ["B", "successful"], ["C", "trained"], ["D", "experienced"]]], [24, "The <u>organisation</u> needs <u>reliable</u> and hard-working <u>voluntarily</u> to work <u>at</u> the head office.", [["A", "organisation"], ["B", "reliable"], ["C", "voluntarily"], ["D", "at"]]], [25, "<u>When</u> I <u>lived</u> in Paris, I <u>was spending</u> three hours a day <u>travelling</u> to and from work.", [["A", "When"], ["B", "lived"], ["C", "was spending"], ["D", "travelling"]]]]}]}, {"id": 2, "label": "Câu 26–30", "short": "26–30", "title": "Community Impact", "paras": [["", "There are many (26) ______ to get involved in your community and positively impact. For example, you can participate in community projects like painting old buildings or (27) ______ trash. Or you can partner with local businesses and organizations to host community events. Whatever you choose, your involvement will positively impact your community."], ["", "Investing in local schools has several benefits. One of these is that it helps communities improve their educational outcomes, especially those (28) ______. Another advantage is that local schools can be used as a catalyst for upward economic mobility."], ["", "One of the most popular and beneficial ways to positively impact your community is through giving back. You can give away items, services, or time to your community. You can also give money to a charity or cause you believe in. These small acts of kindness will (29) ______ a difference and spread positive emotions."], ["", "Investing in community-based organizations is an effective way to impact your community positively. It helps organizations listen to their constituents and improve the community by providing needed resources. In addition, you will help create a (30) ______ effect by investing in local organizations."]], "range": [26, 30], "groups": [{"kind": "mcq", "step": "cloze", "title": "Questions 26-30", "lines": ["Read the passage and choose the option that best fits each numbered blank."], "items": [[26, "", [["A", "ways"], ["B", "methods"], ["C", "routes"], ["D", "roads"]]], [27, "", [["A", "disposing of"], ["B", "dropping off"], ["C", "picking up"], ["D", "taking up"]]], [28, "", [["A", "privileged"], ["B", "disadvantaged"], ["C", "handicapped"], ["D", "suffered"]]], [29, "", [["A", "take"], ["B", "make"], ["C", "do"], ["D", "give"]]], [30, "", [["A", "side"], ["B", "adverse"], ["C", "ripple"], ["D", "direct"]]]]}]}, {"id": 3, "label": "Câu 31–35", "short": "31–35", "title": "Volunteering at Home and Abroad", "paras": [["", "For years, charities across the globe have been encouraging students to join their volunteering programmes to help make a difference in the world. Volunteers are an integral part of any ch     var items = IC.rows.map(function (s) { var v = stuAns(s, n), txt = showVal(v); return { student_name: s.student_name, class_code: s.class_code, given: txt, correct: txt ? stuOk(n, v) : null }; });
    rpcNet("teacher_check_release", { p_teacher_code: IC.code, p_assignment_code: D.code, p_q: q, p_results: items }).catch(function () { delete icRel[q]; });
  }
  function icRefresh() { icDecorate(); renderNotes(); renderPassage(); }

  /* evidence highlight in the passage */
  function nz(s) { return s.replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, "-").toLowerCase(); }
  function wrapIn(pt, s, e) {
    var w = document.createTreeWalker(pt, NodeFilter.SHOW_TEXT), pos = 0, list = [], nd;
    while ((nd = w.nextNode())) { var L = nd.nodeValue.length, a = Math.max(s, pos), b = Math.min(e, pos + L); if (a < b) list.push([nd, a - pos, b - pos]); pos += L; }
    list.forEach(function (x) { var r = document.createRange(); r.setStart(x[0], x[1]); r.setEnd(x[0], x[2]); var mk = document.createElement("mark"); mk.className = "evd"; r.surroundContents(mk); });
  }
  function applyEv() {
    var pts = document.querySelectorAll("#passage .pt"), r = D.passages[state.p].range;
    Object.keys(IC.ev).forEach(function (key) {
      if (!IC.ev[key]) return;
      var ns = key.charAt(0) === "g" ? [0, 1, 2].map(function (i) { return parseInt(key.slice(1), 10) + i; }) : [parseInt(key, 10)];
      ns.forEach(function (n) {
        if (n < r[0] || n > r[1]) return;
        (ELOC[n] || []).forEach(function (L) {
          var pt = pts[L[0]]; if (!pt) return;
          var i = nz(pt.textContent).indexOf(nz(L[1])); if (i > -1) wrapIn(pt, i, i + L[1].length);
        });
      });
    });
  }
  var renderPassage1 = renderPassage;
  renderPassage = function () { renderPassage1(); applyEv(); };
  var paint1 = paint;
  paint = function () { paint1(); icDecorate(); };

  /* students' answers from the server */
  function icPoll() {
    if (!IC.code) return Promise.resolve();
    return Promise.all([rpcNet("teacher_review", { p_teacher_code: IC.code, p_assignment_code: D.code }), rpcNet("teacher_notes_get", { p_teacher_code: IC.code, p_assignment_code: D.code }).catch(function () { return null; })]).then(function (rr) { var r = rr[0]; if (rr[1]) tnMerge(rr[1]);
      var first = !IC.ok; IC.ok = true; IC.err = ""; IC.rows = r.students || []; if (r.key && !KEY) { var had = !!IC.key; IC.key = r.key; if (!had) icDecorate(); } IC.t = Date.now();
      renderNotes(); icVerdicts(); return first;
    }).catch(function (e) {
      var m = String(e && e.message || e);
      IC.err = m.indexOf("assignment_not_found") > -1 ? "This test is not assigned to any class yet, so there are no student answers." : m.indexOf("forbidden") > -1 ? "Teacher code not accepted." : "Could not reach the server.";
      IC.ok = m.indexOf("forbidden") < 0 && m.indexOf("Could not") < 0 ? IC.ok : IC.ok; renderNotes();
    });
  }
  scheduleSave = function () { }; saveNow = function () { return Promise.resolve(); };
  function icStart() {
    state.code = "0000";
    var c = ""; try { c = (new URLSearchParams(location.search).get("s") || "").trim(); } catch (e) { }
    if (!c) { try { c = sessionStorage.getItem("ic_code") || ""; } catch (e) { } }
    var who = $("#who"); if (who) who.textContent = "Teacher";
    function begin(code) {
      IC.code = code; try { sessionStorage.setItem("ic_code", code); } catch (e) { }
      icPoll(); setInterval(function () { if (document.visibilityState === "visible") icPoll(); }, 2000);
    }
    if (c) { begin(c); try { history.replaceState(null, "", location.pathname); } catch (e) { } return; }
    var inp = h("input", { cls: "gap big", type: "password", autocomplete: "off", placeholder: "Teacher code", "aria-label": "Teacher code" }), msg = h("p", { cls: "err", text: "" });
    var ov = h("div", { cls: "ov solid" }, h("div", { cls: "card" }, h("h3", { text: D.title }), h("p", { text: "Enter the teacher code to see students' answers." }), inp, msg,
      h("div", { cls: "brow" }, h("button", { cls: "pill", text: "Open", onclick: go1 }))));
    function go1() {
      var v = inp.value.trim(); if (!v) { msg.textContent = "Please enter the code."; return; }
      msg.textContent = "Checking...";
      rpcNet("teacher_review", { p_teacher_code: v, p_assignment_code: D.code }).then(function () { ov.remove(); begin(v); })
        .catch(function (e) { var m = String(e && e.message || e); if (m.indexOf("assignment_not_found") > -1) { ov.remove(); begin(v); } else msg.textContent = m.indexOf("forbidden") > -1 ? "Teacher code not accepted." : "Could not reach the server."; });
    }
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go1(); });
    document.body.appendChild(ov); setTimeout(function () { inp.focus(); }, 50);
  }

  /* ---------- boot ---------- */
  function boot() {
    var fs = parseFloat(store("fs") || (window.innerWidth <= 700 ? "16" : "18")); document.documentElement.style.setProperty("--fs", fs + "px");
    var tabs = h("nav", { cls: "tabs" });

    var tools = h("div", { cls: "tools" }, h("span", { id: "sv", cls: "who2" }), h("span", { id: "who", cls: "who2" }),

    }, "hide-m"));
