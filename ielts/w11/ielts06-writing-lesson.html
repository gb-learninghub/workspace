<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test 06 - Writing (Lesson)</title>
<style>
:root{--fs:18px;--ink:#111;--mut:#6b6b6b;--line:#dcdcdc;--soft:#f3f3f3;--ok:#e3f3e6;--okl:#2e7d4f;--bad:#fbe6e6;--badl:#b42b2b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Aptos,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;font-size:16px}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{height:100dvh;display:grid;grid-template-rows:56px 1fr}
#hd{display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.tabs{display:flex;gap:4px;margin:0 auto}
.tab{border:0;background:none;padding:15px 14px 13px;font-size:16px;border-bottom:3px solid transparent;color:var(--mut)}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.fsb{height:38px;min-width:38px;border:0;border-radius:19px;background:var(--soft);font-weight:700;font-size:15px}
#main{display:flex;min-height:0}
#left{width:46%;overflow:auto;padding:24px 28px 60px;border-right:1px solid var(--line)}
#right{flex:1;overflow:auto;padding:20px 28px 80px;min-width:0}
.ptag{font-size:14px;color:var(--mut);margin-bottom:6px}
#left p{font-size:var(--fs);line-height:1.6;margin:0 0 12px}
#left img{width:100%;height:auto;mix-blend-mode:multiply;display:block;margin-top:8px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.sp{border:1px solid var(--line);background:#fff;border-radius:999px;height:40px;padding:0 16px;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.sp.on{background:#111;color:#fff;border-color:#111}
.sp.done{background:var(--ok);border-color:#bfe3c7}
.sp.on.done{background:#111}
h3{margin:0 0 6px;font-size:calc(var(--fs) + 2px)}
.intro{color:var(--mut);margin:0 0 16px;font-size:16px;line-height:1.5}
.it{margin:0 0 18px}
.q{font-size:var(--fs);line-height:1.5;margin:0 0 8px}
.q b{margin-right:8px}
.os{display:flex;flex-wrap:wrap;gap:8px}
.o{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-size:16px;text-align:left}
.o.right{background:var(--ok);border-color:#9fd1ab}
.o.wrong{background:var(--bad);border-color:#e3a3a3}
.ex{margin:8px 0 0;padding:10px 14px;background:var(--soft);border-radius:12px;font-size:16px;line-height:1.5}
h4{margin:18px 0 10px;font-size:16px;color:var(--mut)}
.nav{display:flex;gap:10px;margin-top:20px}
.pill{height:44px;border:0;border-radius:22px;background:#111;color:#fff;padding:0 22px;font-size:16px}
.pill.ghost{background:var(--soft);color:var(--ink)}
.pill[disabled]{opacity:.35}
.ord{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.ob2{display:flex;align-items:center;gap:12px;min-height:56px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-size:16px;line-height:1.5}.ob2 .grip{font-size:26px;color:#999;width:36px;height:44px;display:flex;align-items:center;justify-content:center;cursor:grab}.ob2 .desc{font-size:16px;color:#333}.ob2.okc{background:var(--ok);border-color:#9fd1ab}.ob2.badc{background:var(--bad);border-color:#e3a3a3}.ob2.drag{box-shadow:none;border-color:#111}.ob2 b{min-width:96px}
.ob{min-height:48px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:16px;text-align:left;font-weight:600}
.ob.used{background:var(--soft);color:#999}
.ob.badflash{background:var(--bad)}
.slot{display:flex;gap:12px;padding:10px 14px;border-radius:12px;background:var(--ok);margin:0 0 8px;font-size:16px;line-height:1.5}
.slot b{min-width:96px}
.mdl{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.meta{font-weight:700;font-size:16px;margin:0 0 4px}
.mdl .pl{font-weight:700;font-size:15px;color:var(--mut);margin:12px 0 2px}
.mdl p{margin:0;font-size:var(--fs);line-height:1.6;text-align:justify}
@media(max-width:820px){#main{flex-direction:column}#left{width:100%;max-height:42%;border-right:0;border-bottom:1px solid var(--line)}}
</style><style id="fitfix">
html,body{max-width:100%;overflow-x:hidden}
img,svg,video,canvas{max-width:100%}
.card:has(ul.intro){max-height:calc(100dvh - 20px);overflow:hidden;padding:14px 16px}
.card:has(ul.intro) h3{font-size:18px;margin:0 0 6px}
ul.intro{margin:0 0 4px;padding-left:18px}
ul.intro li{margin:0 0 5px;line-height:1.45;font-size:14px}
.card:has(ul.intro) .brow{margin-top:8px}
@media (max-height:700px){ul.intro li{font-size:13px;margin-bottom:3px}}
.gap{max-width:100%}
.tbl{table-layout:fixed;width:100%}.tbl td,.tbl th{word-break:break-word}
#tiles{overflow-x:visible;gap:8px;padding:6px 10px}
#tiles .tg{flex:1 1 0;min-width:0;gap:3px;padding:3px 4px}
#tiles .tile{flex:1 1 0;min-width:0;width:auto;max-width:34px;height:30px}
@media (max-width:700px){#tiles .tg:not(.cur){display:none}#tiles .tg.cur{flex:1 1 100%}#tiles .tile{height:28px;font-size:12px;max-width:none}}
#tl .t{min-width:0;flex:1 1 0;padding:0}
#hd{height:auto;min-height:52px;flex-wrap:wrap;row-gap:4px}
#hd .tools{flex-wrap:wrap}
#app{grid-template-columns:minmax(0,1fr);max-width:100vw}
#app>*{min-width:0}
.qcell{white-space:normal}
</style>

99 and 2000, ___ recovering to around 880,000 in 2001.", "opts": ["although", "because", "before"], "ans": 2, "e": "before nối hai giai đoạn theo thứ tự thời gian."}, {"q": "Canada's figure stayed ___ 230,000 and 270,000 until 2000.", "opts": ["among", "between", "from"], "ans": 1, "e": "between ... and ... chỉ khoảng giá trị."}, {"q": "Australia, meanwhile, ___ at around 100,000 for most of the period.", "opts": ["remains", "had remain", "remained"], "ans": 2, "e": "Quá khứ đơn: remained."}], "band": "6.5 - 7.0", "model": [["Introduction", "The line graph illustrates the number of people who immigrated to the USA, Canada and Australia each year between 1991 and 2001."], ["Overview", "Overall, the USA received by far the largest number of immigrants throughout the period, although its figure fell considerably. By contrast, immigration to Canada and Australia remained low and relatively stable, with only a slight rise at the end."], ["Body 1", "In 1991, around 1.45 million people moved to the USA, and this figure peaked at approximately 1.8 million in 1992. It then dropped sharply to about 1 million in 1993 and continued to decline gradually, reaching a low of roughly 690,000 in 1999 and 2000, before recovering to around 880,000 in 2001."], ["Body 2", "Canada's figure started at about 200,000 and stayed between 230,000 and 270,000 until 2000, before climbing sharply to approximately 460,000 in 2001. Australia, meanwhile, remained at around 100,000 for most of the period, dipping to 70,000 in 1994 and 1995, and rising slightly to 150,000 in 2000 and 2001."]]}]}, {"name": "Task 2", "lines": ["Nowadays, some parents put a lot of pressure on their children to succeed.", "Why do parents do this?", "Is this a positive or negative development for the children?"], "fig": null, "steps": [{"title": "Read the task", "kind": "mc", "intro": "Đọc đề và xác định dạng đề trước khi viết.", "items": [{"q": "Đề có mấy câu hỏi cần trả lời?", "opts": ["One", "Two", "Three"], "ans": 1, "e t of encouragement can motivate children ___ harder.", "opts": ["working", "work", "to work"], "ans": 2, "e": "motivate someone to do something."}, {"q": "Excessive pressure is likely ___ the opposite effect.", "opts": ["to have", "having", "have"], "ans": 0, "e": "be likely to + động từ."}], "band": "6.5 - 7.0", "model": [["Introduction", "Nowadays, many parents push their children hard to achieve success. This essay will explain the reasons behind this trend and argue that it is, on balance, a negative development."], ["Body 1", "There are two main reasons why parents behave this way. Firstly, they worry about the future of their children in an increasingly competitive job market, so they believe that excellent grades will guarantee a stable and well-paid career. Secondly, some parents compare their children with others, or try to achieve through their children the goals that they were unable to reach themselves. In both cases, the success of the child is seen as proof of the parents' own achievement. For example, many parents in competitive societies send their children to extra classes every evening so that they can enter a top university."], ["Body 2", "However, I believe that this pressure does more harm than good. Children who are constantly expected to be top of the class often suffer from stress and anxiety, and they may lose interest in learning altogether. In addition, they have little time to play, make friends or develop their own interests, which is essential for healthy growth. These skills, such as creativity and teamwork, are just as important as exam results in adult life. Admittedly, a certain amount of encouragement can motivate children to work harder, but excessive pressure is likely to have the opposite effect. As a result, some young people grow up fearing failure rather than enjoying the process of learning."], ["Conclusion", "In conclusion, parents mainly pressure their children out of concern for their future and social comparison, but I believe that this has more negative than positive consequences for the children."]]}]}]};</script>

    hd.appendChild(tabs);
    hd.appendChild(h("button", { cls: "fsb", text: "A−", onclick: function () { fs(-2); } }));
    hd.appendChild(h("button", { cls: "fsb", text: "A+", onclick: function () { fs(2); } }));
  }
  function left() {
    var T = D.tasks[st.t], L = $("#left"); L.innerHTML = "";
    L.appendChild(h("div", { cls: "ptag", text: T.name }));
    T.lines.forEach(function (l) { L.appendChild(h("p", { text: l })); });
    if (T.fig) L.appendChild(h("img", { src: T.fig, alt: "Graph" }));
  }
  function stepBar() {
    var T = D.tasks[st.t], bar = h("div", { cls: "steps" });
    T.steps.forEach(function (S, i) {
      bar.appendChild(h("button", { cls: "sp" + (i === st.s ? " on" : "") + (st.done[key(st.t, i)] ? " done" : ""), text: (i + 1) + ". " + S.title, onclick: function () { st.s = i; st.top = true; draw(); } }));
    });
    return bar;
  }
  function mcItem(S, i, it, num) {
    var k = key(st.t, st.s) + "-" + i, wrap = h("div", { cls: "it" });
    wrap.appendChild(h("div", { cls: "q" }, h("b", { text: num + "." }), document.createTextNode(it.q)));
    var os = h("div", { cls: "os" }), got = st.ans[k] === it.ans;
    it.opts.forEach(function (o, j) {
      var c = "o"; if (got && j === it.ans) c += " right"; else if (st.ans[k] === j && !got) c += " wrong";
      os.appendChild(h("button", { cls: c, text: o, onclick: function () { if (got) return; st.ans[k] = j; if (j === it.ans) checkDone(); draw(); } }));
    });
    wrap.appendChild(os);
    if (got) wrap.appendChild(h("div", { cls: "ex", text: it.e }));
    else if (st.ans[k] !== undefined) wrap.appendChild(h("div", { cls: "ex", text: "Chưa đúng, hãy thử lại." }));
    return wrap;
  }
  function checkDone() {
    var S = D.tasks[st.t].steps[st.s];
    if (S.kind !== "mc") return;
    var ok = true; S.items.forEach(function (it, i) { if (it.h) return; var a = st.ans[key(st.t, st.s) + "-" + i]; if (a !== it.ans) ok = false; });
    if (ok) st.done[key(st.t, st.s)] = true;
  }
  function modelBox(S) {
    var box = h("div", { cls: "mdl" }), wc = 0;
    S.model.forEach(function (m) { wc += m[1].split(/\s+/).filter(Boolean).length; });
    box.appendChild(h("div", { cls: "meta", text: "Số từ: " + wc + "  ·  Band dự kiến: " + S.band }));
    S.model.forEach(function (m) { box.appendChild(h("div", { cls: "pl", text: m[0] })); box.appendChild(h("p", { text: m[1] })); });
    return box;
  }
  function orderStep(S, r) {
    var k = key(st.t, st.s), o = st.ord[k] || (st.ord[k] = { list: S.shuffle.slice(), checked: false });
    var done = !!st.done[k];
    r.appendChild(h("p", { cls: "intro", text: done ? "Đúng thứ tự. Đây là nội dung từng đoạn." : "Kéo các đoạn lên xuống (giữ biểu tượng ⠿ bên trái) để xếp đúng thứ tự, rồi bấm Check." }));
    var box = h("div", { cls: "ord" });
    o.list.forEach(function (idx, pos) {
      var ok = o.checked && idx === pos;
      var card = h("div", { cls: "ob2" + (done ? " okc" : "") + (o.checked && !done ? (ok ? " okc" : " badc") : ""), "data-i": String(pos) });
      if (!done) card.appendChild(h("span", { cls: "grip", text: "⠿", "aria-label": "Drag" }));
      card.appendChild(h("b", { text: S.parts[idx][0] }));
      if (done) card.appendChild(h("span", { cls: "desc", text: S.parts[idx][1] }));
      box.appendChild(card);
      if (!done) attachDrag(card, box, o);
    });
    r.appendChild(box);
    if (!done) r.appendChild(h("button", { cls: "pill", text: "Check", onclick: function () {
      o.checked = true; if (o.list.every(function (v, p) { return v === p; })) st.done[k] = true; draw();
    } }));
    else r.appendChild(h("button", { cls: "pill ghost", text: "Làm lại", onclick: function () { delete st.ord[k]; delete st.done[k]; draw(); } }));
  }
  function attachDrag(card, box, o) {
    var grip = card.querySelector(".grip"), cards;
    grip.style.touchAction = "none";
    grip.addEventListener("pointerdown", function (e) {
      e.preventDefault(); grip.setPointerCapture(e.pointerId); card.classList.add("drag"); o.checked = false;
      var arr = Array.prototype.slice.call(box.children);
      function move(ev) {
        var others = arr.filter(function (c) { return c !== card; }), cy = ev.clientY, pos = others.length;
        for (var j = 0; j < others.length; j++) { var rc = others[j].getBoundingClientRect(); if (cy < rc.top + rc.height / 2) { pos = j; break; } }
        others.splice(pos, 0, card); arr = others; arr.forEach(function (c, n) { c.style.order = String(n); });
      }
      function up() {
        grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up); grip.removeEventListener("pointercancel", up);
        card.classList.remove("drag");
        var S = D.tasks[st.t].steps[st.s];
        o.list = arr.map(function (c) { var n = c.querySelector("b").textContent; for (var q = 0; q < S.parts.length; q++) if (S.parts[q][0] === n) return q; });
        draw();
      }
      grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", up); grip.addEventListener("pointercancel", up);
    });
  }
  function right() {
    var T = D.tasks[st.t], S = T.steps[st.s], r = $("#right"), keep = r.scrollTop; r.innerHTML = "";
    r.appendChild(stepBar());
    r.appendChild(h("h3", { text: "Step " + (st.s + 1) + ": " + S.title }));
    r.appendChild(h("p", { cls: "intro", text: S.intro }));
    if (S.kind === "mc") { var num = 0; S.items.forEach(function (it, i) { if (it.h) { r.appendChild(h("h4", { text: it.h })); return; } r.appendChild(mcItem(S, i, it, ++num)); }); }
    else orderStep(S, r);
    if (S.model) {
      var shown = st.ans["m" + key(st.t, st.s)];
      r.appendChild(h("button", { cls: "pill ghost", text: shown ? "Ẩn bài mẫu" : "Xem bài mẫu đầy đủ", onclick: function () { st.ans["m" + key(st.t, st.s)] = !shown; draw(); } }));
      if (shown) r.appendChild(modelBox(S));
    }
    var nav = h("div", { cls: "nav" });
    nav.appendChild(h("button", { cls: "pill ghost", text: "Back", onclick: function () { st.s--; st.top = true; draw(); }, disabled: st.s === 0 ? "disabled" : null }));
    nav.appendChild(h("button", { cls: "pill", text: "Next", onclick: function () { st.s++; st.top = true; draw(); }, disabled: st.s === T.steps.length - 1 ? "disabled" : null }));
    if (st.s === 0) nav.firstChild.setAttribute("disabled", "disabled"); else nav.firstChild.removeAttribute("disabled");
    if (st.s === T.steps.length - 1) nav.lastChild.setAttribute("disabled", "disabled"); else nav.lastChild.removeAttribute("disabled");
    r.appendChild(nav);
    r.scrollTop = st.top ? 0 : keep; st.top = false;
  }
  function draw() { head(); left(); right(); }
  draw();
})();
</script></body></html>
