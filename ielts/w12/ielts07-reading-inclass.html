<script>window.DATA={"mode": "practice", "title": "Test 07 - Reading (In-class)", "code": "IELTS07-Reading", "tfng": ["TRUE", "FALSE", "NOT GIVEN"], "legend": [["TRUE", "if the statement agrees with the information"], ["FALSE", "if the statement contradicts the information"], ["NOT GIVEN", "if there is no information on this"]], "sb": {"url": "https://bumaiagvgpewhvczgwio.supabase.co", "key": "sb_publishable_B563fC34wnTDCGSZv29euw_6P3mFRs5"}, "passages": [{"id": 1, "title": "The Pesticide-Free Village", "paras": [["", "Gerry Marten and Dona Glee Williams report on the Indian village of Punukula, so nearly destroyed by reliance on pesticides."], ["", "Around 20 years ago, a handful of families migrated from the Guntur district of Andhra Pradesh, south-east India, into Punukula, a community of around 900 people farming plots of between two and ten acres. The outsiders from Guntur brought cotton culture with them, and this attracted resident farmers by promising to bring in more hard cash than the mixed crops they were already growing to eat and sell, such as millet, mung beans, chilli and rice. But growing cotton meant using pesticides and fertilisers – until then a mystery to the mostly illiterate farmers of the community."], ["", "Local agrochemical dealers obligingly filled the need for information and supplies. These ‘middlemen’ sold commercial seeds, fertilisers and insecticides on credit, and guaranteed purchase of the crop. They offered technical advice provided by the companies that supplied their products. The farmers depend on the dealers. If they wanted to grow cotton – and they did – it seemed they had no choice."], ["", "A quick ‘high’ of booming yields and incomes hooked growers during the early years of cotton in the region. Outlay on insecticides was fairly low because cotton pests hadn’t moved in yet. Many farmers were so impressed with the chemicals that they started using them on their other crops as well. The immediate payoffs from chemically dependent cotton agriculture both ensured and obscured the fact that the black dirt fields had gone into a freefall of environmental degradation, dragged down by a chain of cause and effect."], ["", "Soon cotton-eaters, such as bollworms and aphids, plagued the fields. Repeated spraying killed off the most susceptible pests and left the strongest to reproduce and pass on their resistance to generations of ever-hardier offspring. As the bugs grew tougher and more abundant, farmers applied a greater variety and quantity of poisons, sometimes mixing ‘cocktails’ of as many as ten insecticides. At the same time, cotton was gobbling up the nutrients in the soil, leaving the growers no option but to invest in chemical fertilisers."], ["", "By the time some farmers tried to break free of their chemical dependence, insecticides had already decimated the birds, wasps, beetles, and other predators that had once provided natural control of crop pests. Without their balancing presence, pests ran riot if insecticide was cut back. As outlays for fertilisers and insecticides escalated, the cost of producing cotton mounted. Eventually the expense of chemical inputs outgrew the cash value of the crop, and farmers fell further and further into debt and poverty."], ["", "Their vicious cycle was only broken by the willingness of a prominent village elder to experiment with something different. He had been among the first villagers to grow cotton, and he would be the first to try it without chemicals, as set out by a programme in Non-Pesticide Management (NPM). This had been devised for Punukula with the help of a Non-Government Organisation called SECURE that had become aware of the hardships caused by the pesticide trap."], ["", "It involved turning to neem, a fast-growing, broad-leaved evergreen tree related to mahogany. Neem protects itself against insects by producing a multitude of natural pesticides that have evolved specifically to defeat plant-eating insects. Thus they are generally harmless to human and other animals, including birds and insects that eat pests."], ["", "The plant is native to India and Burma, where it has been used for centuries to control pests and to promote health. To protect cotton, neem seeds are simply ground into a powder, soaked overnight in water, and sprayed onto the crop at least every 10 days. Neem cake applied to the soil kills insect pests and doubles as an organic fertiliser high in nitrogen. As neem grows locally and is easy to process, it is much less expensive than the chemical insecticides sold for profit by the dealers and their corporate suppliers. Quick, short-term gains had once pushed Punukula into chemical-dependent agriculture. Now they found that similar immediate rewards were helping to speed change in the other direction: the harvest of the next 20 NPM farmers was as good as the harvest of farmers using insecticides, and they came out ahead because they weren’t buying insecticides. Instead of investing cash (in short supply) in chemicals, they invested time and labour in NPM practices."], ["", "By the end of 2000, all the farmers in Punukula village were using NPM rather than chemicals for cotton, and they began to use it on other crops as well. The change gathered momentum as NPM became even more effective once everyone was using it. The status and economic opportunities of women improved – neem became a source of income for some of them, as they gathered seeds from the surrounding area to sell for NPM in other villages. The improved situation meant that families could afford to put more land under cultivation."], ["", "In 2004, the panchayat (village government) formally declared Punukula to be a pesticide-free village. And they have big plans for the future, such as water purification. The village now serves as a model for disseminating NPM to other communities, with around 2000 farmers visiting each year."], ["", "What began as a few farmers desperate to find a way to farm without poisons has become a movement with the potential to pull an entire region back from ecological disaster."]], "range": [1, 13], "groups": [{"kind": "tfng", "title": "Questions 1–4", "lines": ["Do the following statements agree with the information given in Reading Passage 1?", "Choose TRUE if the statement agrees with the information, FALSE if it contradicts the information, or NOT GIVEN if there is no information on this."], "items": [[1, "Cotton growing was expected to raise more money than other crops."], [2, "Some of the local agrochemical dealers had been farmers in the past."], [3, "Initially the farmers’ cotton yields were low."], [4, "At first, the farmers failed to notice the negative effects on their fields of pesticide use."]]}, {"kind": "notes", "title": "Questions 5–10", "lines": ["Complete the notes below.", "Choose no more than two words from the passage for each answer."], "notesTitle": "Notes: Non-Pesticide-Management Programme", "notes": [{"type": "bullet", "text": "Developed with the aid of SECURE"}, {"type": "bullet", "text": "Based on the use of an {5}"}, {"type": "bullet", "text": "Neem contains many {6} that target plant-eating predators"}, {"type": "section", "text": "Neem (Used as a pesticide):"}, {"type": "sub", "text": "{7} formed by grinding seeds"}, {"type": "sub", "text": "Left {8} to soak in water"}, {"type": "sub", "text": "Sprayed regularly"}, {"type": "section", "text": "Neem (Used as a fertilizer):"}, {"type": "sub", "text": "Added in {9} form to soil"}, {"type": "sub", "text": "Contains a lot of {10}"}], "items": [[5, "Based on the use of an {}."], [6, "Neem contains many {} that target plant-eating predators."], [7, "Neem seeds are ground into a {}."], [8, "The neem seeds are left {} to soak in water."], [9, "Neem is added in {} form to the soil."], [10, "Neem cake contains a lot of {}."]]}, {"kind": "fill", "title": "Questions 11–13", "lines": ["Choose no more than two words and/or a number from the passage for each answer."], "items": [[11, "In which year did farmers finally stop using chemicals on cotton crops in Punukula? {}"], [12, "What did the women of Punukula collect to make money? {}"], [13, "What project do the authorities in Punukula hope to set up in the future? {}"]]}]}, {"id": 2, "title": "New Filter Promises Clean Water for Millions", "paras": [["", "An ingenious invention is set to bring clean water to developing countries, and while the science may be cutting edge, the materials are extremely down to earth."], ["", "A handful of clay, yesterday’s coffee grounds and some cow manure are the ingredients that could bring clean, safe drinking water to many developing countries. The simple new technology, developed by Australian National University (ANU) materials scientist and potter Tony Flynn, allows water filters to be made from commonly available materials and fired (or baked) using cow manure as the source of heat, without the need for a kiln (an oven for baking or drying pottery). The filters have been tested and shown to remove common pathogens (disease-producing organisms) including E-coli."], ["", "The invention was born out of a project involving the Manatuto community in East Timor. A charity operating there wanted to help set up a small industrial site manufacturing water filters, but initial research found the local clay to be too fine – a problem solved by the addition of organic material. While the problems of producing a working ceramic filter in East Timor were overcome, the solution was kiln-based and particular to that community’s materials and couldn’t be applied elsewhere. Flynn’s technique for manure firing, with no requirement for a kiln, has made this zero technology approach available anywhere it is needed."], ["", "Other commercial clay filters do exist, but, even if available, with prices starting at US$5 each, they are often outside the budgets of most people in the developing world. Unlike other water filtering devices, Flynn’s filters are inexpensive and simple to produce. Take a handful of clay, mix it with a handful of organic material such as used tea leaves, coffee grounds or rice hulls, add water in a sufficient quantity to make a stiff mixture and form a cylindrical pot that has one end closed, then dry it in the sun. According to Flynn, used coffee grounds have given the best results to date. The walls of the filter can be measured using the width of an adult finger as the standard. Next, surround the pots with straw, put them in a mound of cow manure, light the straw and then top up the burning manure as required. The filters are finished in 45 to 60 minutes."], ["", "The properties of cow manure are vital, as the fuel can reach a temperature of 700 degrees in half an hour, and will be up to 950 degrees after another 20 to 30 minutes. The manure makes a good fuel because it is very high in organic material that burns readily and quickly. The manure has to be dry and is best used exactly as found in the field; there is no need to break it up or process it any further. In contrast, a potter’s kiln is an expensive item and can take up to four or five hours to get up to 800 degrees. It needs expensive scarce fuel, such as gas or wood to heat it, and experience to use it. With no technology, no insulation and nothing other than a pile of cow manure and a match, none of these requirements apply."], ["", "It is also helpful that, like clay and organic material, cow manure is freely available across the developing world. A cow is a natural fuel factory. Manure is a mixture of vegetable materials of different sizes, and cow manure as a fuel is the same wherever it is found. Just as using manure as a fuel for domestic use is not a new idea, the fact that liquid can pass through clay objects is something that potters have always known, and clay’s porous nature is something that, as a former ceramics lecturer in the ANU School of Art, Flynn is well aware of. The difference is that, rather than viewing the porous nature of the material as a problem – after all, not many people want a pot that won’t hold water – his filters capitalize on this property."], ["", "The filtration process is simple, but effective. The basic principle is that there are passages through the filter that are wide enough for water droplets to pass through, but too narrow for pathogens. Tests with the deadly E-coli bacterium have seen the filters remove 96.4 to 99.8 per cent of the pathogen – well within safe levels. The thickness of the clay container needs to be the same thickness as an adult finger for the process to be effective. If this is the case, using only one filter, a liter of water can be obtained in two hours."], ["", "The use of organic material, which burns away leaving cavities after firing, helps produce the structure in which pathogens will become trapped. It overcomes the potential problems of finer clays that may not let water through and also means that cracks are soon halted. And like clay and cow manure, organic material is universally available in the developing communities that need most assistance, as tea, coffee and rice are grown in these areas. With all the components being widely available, Flynn says there is no reason the technology couldn’t be applied throughout the developing world. He has no plans to exploit his idea financially by registering ownership through a patent. If he did, any commercial copying would legally entitle him to a share in any profits made. Without a patent, there will be no illegality in it being adopted in any community that needs it. ‘Everyone has a right to clean water, and these filters have the potential to enable anyone in the world to drink water safely,’ says Flynn."]], "range": [14, 26], "groups": [{"kind": "fill", "title": "Questions 14–19", "lines": ["Complete the flow-chart below.", "Choose no more than two words and/or a number from the passage for each answer."], "items": [[14, "Step 1: Make the mixture for the filter using {}, organic material (e.g. tea, coffee, rice), and water."], [15, "Step 1: Make the mixture for the filter using clay, organic material (e.g. tea, coffee, rice), and {}."], [16, "Step 2: Shape into pots and place them in a fire made from {} and cow manure."], [17, "Step 2: Shape into pots and place them in a fire made from straw and {}."], [18, "Step 3: Fuel the fire to reach a maximum heat of {}."], [19, "Step 4: Bake the filters in the fire for a maximum period of {}."]]}, {"kind": "tfng", "title": "Questions 20–23", "lines": ["Do the following statements agree with the information given in Reading Passage 2?", "Choose TRUE if the statement agrees with the information, FALSE if it contradicts the information, or NOT GIVEN if there is no information on this."], "items": [[20, "The clay in the Manatuto project was initially unsuitable for the project’s purpose."], [21, "Coffee grounds produce filters that are twice as efficient as those using other organic materials."], [22, "It takes half an hour for a cow-manure fire to reach 950 degrees."], [23, "E-coli is the most difficult bacterium to remove from water by filtration."]]}, {"kind": "mcq", "title": "Questions 24–26", "lines": ["Choose the correct letter, A, B, C or D."], "items": [[24, "The Manatuto project aimed to set up a:", [["A", "charitable trust."], ["B", "filtration experiment."], ["C", "water filter factory."], ["D", "community kiln."]]], [25, "To be effective, the Flynn filters must:", [["A", "remove all dangerous pathogens."], ["B", "be a particular thickness."], ["C", "filter water as quickly as possible."], ["D", "be made from 100 per cent clay."]]], [26, "Flynn does not intend to patent his filter because he:", [["A", "wants it to be freely available."], ["B", "has produced a very simple design."], ["C", "cannot make a profit in poor countries."], ["D", "has already given the idea to a charity."]]]]}]}, {"id": 3, "title": "Putting the Brakes on Climate Change", "paras": [["A", "It is tempting to think that the conservation of coral reefs and rainforests is a separate issue from traffic and air pollution. But it is not. Scientists are now confident that rapid changes in the Earth’s climate are already disrupting and altering many wildlife habitats. Pollution from vehicles is a big part of the problem."], ["B", "The United Nation’s Climate Change Panel has estimated that the global average temperature rise expected by the year 2100 could be as much as 6°C, causing forest fires and dieback on land and coral bleaching in the ocean. Few species, if any, will be immune from the changes in temperature, rainfall, and sea levels. The panel believes that if such catastrophic temperature rises are to be avoided, the quantity of greenhouse gases, especially carbon dioxide, being released into the atmosphere must be reduced. That will depend on slowing the rate of deforestation and, more crucially, finding alternatives to coal, oil, and gas as our principal energy sources."], ["C", "Technologies do exist to reduce or eliminate carbon dioxide as a waste product of our energy consumption. Wind power and solar power are both spreading fast, but what are we doing about traffic? Electric cars are one possible option, but their range and the time it takes to charge their batteries pose serious limitations. However, the technology that shows the most potential to make cars climate-friendly is fuel-cell technology. This was actually invented in the late nineteenth century, but because the world’s motor industry put its effort into developing the combustion engine, it was never refined for mass production. One of the first prototype fuel-cell-powered vehicles has been built by the Ford Motor Company. It is like a conventional car, only with better acceleration and a smoother ride. Ford engineers expect to be able to produce a virtually silent vehicle in the future."], ["D", "So what’s the process involved – and is there a catch? Hydrogen goes into the fuel tank, producing electricity. The only emission from the exhaust pipe is water. The fuel cell is, in some ways, similar to a battery, but unlike a battery, it does not run down. As long as hydrogen and oxygen are supplied to the cell, it will keep on generating electricity. Some cells work off methane and a few use liquid fuels such as methanol, but fuel cells using hydrogen probably have the most potential. Furthermore, they need not be limited to transport. Fuel cells can be made in a huge range of sizes, small enough for portable computers or large enough for power stations. They have no moving parts and therefore need no oil. They just need a supply of hydrogen. The big question, then, is where to get it from."], ["E", "One source of hydrogen is water. But to exploit the abundant resource, electricity is needed, and if the electricity is produced by a coal-fired power station or other fossil fuel, then the overall carbon reduction benefit of the fuel cell disappears. Renewable sources, such as wind and solar power, do not produce enough energy for it to be economically viable to use them in the ‘manufacture’ of hydrogen as a transport fuel. Another source of hydrogen is, however, available and could provide a supply pending the development of more efficient and cheaper renewable energy technologies. By splitting natural gas (methane) into its constituent parts, hydrogen and carbon dioxide are produced. One way around the problem of what to do with the carbon dioxide could be to store it back below ground – so-called geological sequestration. Oil companies, such as Norway’s Statoil, are experimenting with storing carbon dioxide below ground in oil and gas wells."], ["F", "With freak weather conditions, arguably caused by global warming, frequently in the headlines, the urgent need to get fuel-cell vehicles on the road is evident. Experts predict that within ten years, fuel-cell vehicles will be available in most showrooms. Even now, fuel-cell buses are operating in the US, while in Germany, a courier company is planning to take delivery of fuel-cell-powered vans in the near future. The fact that centrally-run fleets of buses and vans are the first fuel-cell vehicles identifies another challenge – fuel distribution. The refueling facilities necessary to top up hydrogen-powered vehicles are available only in a very few places at present. Public transport and delivery firms are logical places to start since their vehicles are operated from central depots."], ["G", "Fuel-cell technology is being developed right across the automotive industry. This technology could have a major impact in slowing down climate change, but further investment is needed if the industry – and the world’s wildlife – is to have a long-term future."]], "range": [27, 40], "groups": [{"kind": "head", "title": "Questions 27–32", "lines": ["Reading Passage 3 has seven paragraphs, A–G.", "Choose the correct heading for paragraphs A–F from the list of headings below."], "items": [[27, "Paragraph A"], [28, "Paragraph B"], [29, "Paragraph C"], [30, "Paragraph D"], [31, "Paragraph E"], [32, "Paragraph F"]], "bank": [["i", "Action already taken by the United Nations"], ["ii", "Marketing the hydrogen car"], ["iii", "Making the new technology available worldwide"], ["iv", "Some negative predictions from one group of experts"], ["v", "How the new vehicle technology works"], ["vi", "The history of fuel-cell technology"], ["vii", "A holistic view of climatic change"], ["viii", "Locating the essential ingredient"], ["ix", "Sustaining car manufacture"]]}, {"kind": "fill", "title": "Questions 33–36", "lines": ["Complete the sentences below.", "Choose no more than two words from the passage for each answer."], "items": [[33, "In the late nineteenth century, the car industry invested in the development of the {}, rather than fuel-cell technology."], [34, "Ford engineers predict that they will eventually design an almost {}."], [35, "While a fuel-cell lasts longer, some aspects of it are comparable to a {}."], [36, "Fuel-cells can come in many sizes and can be used in power stations and in {} as well as in vehicles."]]}, {"kind": "tfng", "title": "Questions 37–40", "lines": ["Do the following statements agree with the information given in Reading Passage 3?", "Choose TRUE if the statement agrees with the information, FALSE if it contradicts the information, or NOT GIVEN if there is no information on this."], "items": [[37, "Using electricity produced by burning fossil fuels to access sources of hydrogen may increase the positive effect of the fuel-cell."], [38, "The oil company Statoil in Norway owns gas wells in other parts of the world."], [39, "Public transport is leading the way in the application of fuel-cell technology."], [40, "More funding is necessary to ensure the success of the fuel-cell vehicle industry."]]}]}]};</script>

4": {"a": ["silent vehicle"], "e": "Passage 3, paragraph C says Ford expects to produce a virtually silent vehicle."}, "q35": {"a": ["battery"], "e": "Passage 3, paragraph D compares the fuel cell with a battery."}, "q36": {"a": ["portable computers"], "e": "Passage 3, paragraph D says fuel cells can be small enough for portable computers."}, "q37": {"a": "FALSE", "e": "Passage 3, paragraph E says fossil-fuel electricity removes the overall carbon-reduction benefit."}, "q38": {"a": "NOT GIVEN", "e": "Passage 3, paragraph E says Statoil is experimenting with storage in oil and gas wells but does not say it owns wells abroad."}, "q39": {"a": "TRUE", "e": "Passage 3, paragraph F says buses are already operating and public transport is a logical place to start."}, "q40": {"a": "TRUE", "e": "Passage 3, paragraph G says further investment is needed for the industry’s long-term future."}}</script>
