<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AC10-W12 Writing</title>
<style>
:root{--fs:18px;--ink:#111;--mut:#6b6b6b;--line:#dcdcdc;--soft:#f3f3f3;--ok:#e3f3e6;--okl:#2e7d4f;--bad:#fbe6e6;--badl:#b42b2b}
*{box-sizing:border-box}

.fsb,.tm{font-weight:700;font-size:15px}
.tm.on{background:#111;color:#fff}
.ib.dark{background:#111;color:#fff}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;min-width:56px;text-align:center}
.clock.over{color:var(--badl)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.mv{display:none}
#main{--lw:48%;display:flex;min-height:0}

.ptag{font-size:14px;color:var(--mut);margin-bottom:4px}

.tp{font-size:var(--fs);line-height:1.6;margin:0 0 12px;text-align:justify}
.tp.hint{color:var(--mut);font-size:16px}
.tp b{font-weight:700}
.q{font-weight:700}
#fig{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px;display:block}
#ta{flex:1;min-height:0;width:100%;resize:none;border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;font:inherit;font-size:var(--fs);line-height:1.6;outline:none;color:var(--ink);background:#fff}

#wc{font-weight:700;color:var(--ink)}

.err{color:var(--badl)}

@media (max-width:700px){#app{grid-template-rows:auto 1fr}#hd{height:auto;flex-wrap:wrap;gap:4px 8px;padding:6px 10px}.tabs{order:3;flex:1 0 100%;margin:0}.tab{flex:1;padding:8px 6px}.tools{margin-left:auto;flex-wrap:wrap;gap:4px}.who2,.hide-m{display:none}#main[data-v="t"] #work,#main[data-v="w"] #task{display:none}#task,#work{width:100%;flex:1;min-height:0}#task{padding:14px 16px 24px}#work{padding:12px 16px 10px}.mv{display:flex;order:4;flex:1 0 100%;gap:8px;padding-bottom:6px}.mvb{flex:1;height:38px;border:0;border-radius:19px;background:var(--soft);font-size:15px;font-weight:600}.mvb.on{background:#111;color:#fff}.card{padding:20px}.brow{flex-wrap:wrap}.sep{display:none}}

#tn{flex:none;max-height:34%;overflow:auto;margin-top:10px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:#fafafa}
#tn[hidden]{display:none}
#tn .th{font-weight:800;font-size:14px;margin-bottom:4px}
#tn .ni{display:flex;gap:8px;align-items:baseline;font-size:15px;line-height:1.45;margin:4px 0}
#tn .ni b{flex:none;min-width:18px}
#tn .ni i{font-style:normal;flex:none;border-radius:10px;padding:1px 8px;font-size:13px;font-weight:700}
#tn .ni q{quotes:none;color:var(--mut)}
.t-Grammar{background:#fbd5d5}.t-Word{background:#ffe0a8}.t-Spelling{background:#e3d4ff}.t-Unclear{background:#cfe3ff}.t-Good{background:#cdeccf}
</style><style id="fitfix">
html,body{max-width:100%;overflow-x:hidden}
img,svg,video,canvas{max-width:100%}
.card:has(ul.intro){max-height:calc(100dvh - 20px);overflow:hidden;padding:14px 16px}
.card:has(ul.intro) h3{font-size:18px;margin:0 0 6px}
ul.intro{margin:0 0 4px;padding-left:18px}
ul.intro li{margin:0 0 5px;line-height:1.45;font-size:14px}
.card:has(ul.intro) .brow{margin-top:8px}
@media (max-height:700px){ul.intro li{font-size:13px;margin-bottom:3px}}
.gap{max-width:100%}
.tbl{table-layout:fixed;width:100%}.tbl td,.tbl th{word-break:break-word}
#tiles{overflow-x:visible;gap:8px;padding:6px 10px}

#tiles .tile{flex:1 1 0;min-width:0;width:auto;max-width:34px;height:30px}
@media (max-width:700px){#tiles .tg:not(.cur){display:none}#tiles .tg.cur{flex:1 1 100%}#tiles .tile{height:28px;font-size:12px;max-width:none}}

#hd{height:auto;min-height:52px;flex-wrap:wrap;row-gap:4px}
#hd .tools{flex-wrap:wrap}
#app{grid-template-columns:minmax(0,1fr);max-width:100vw}
#app>*{min-width:0}
.qcell{white-space:normal}
</style>
