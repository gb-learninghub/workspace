<!doctype html>
<html lang="vi"><head><meta http-equiv="Cache-Control" content="no-store"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xem thử</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Segoe UI",sans-serif;background:#e9ecf1;height:100vh;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#0b1f44;flex-wrap:wrap}
.bar button,.bar select{height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#e5c16b;font-weight:700;padding:0 14px;font-size:14px;cursor:pointer}
.bar select{background:#fff;color:#0b1f44}.bar button[aria-pressed=true]{background:#e5c16b;color:#0b1f44;border-color:#e5c16b}
.sp{flex:1}.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;padding:14px;overflow:auto}
iframe{border:0;background:#fff;border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.18)}
#f.d{width:100%;height:100%}#f.t{width:1180px;max-width:100%;height:min(820px,100%);flex:none}#f.m{width:390px;height:min(844px,100%)}
</style></head><body>
<div class="bar">
<button id="bd" aria-pressed="true">Desktop</button><button id="bt" aria-pressed="false">Tablet</button><button id="bm" aria-pressed="false">Mobile</button>
<select id="pg"><option value="index.html">Tổng quan</option><option value="index.html#schedule">Lịch tuần</option><option value="index.html#lib">Học liệu</option><option value="classes.html">Lớp học</option><option value="student-list.html">Học viên</option><option value="parent-list.html">Phụ huynh</option><option value="tuition.html">Học phí</option><option value="teacher.html">Trang giáo viên</option><option value="student.html#0001">Học sinh mẫu (0001)</option><option value="student.html?lockdemo=1#0001">Học sinh mẫu, bật khóa Writing</option></select>
<span class="sp"></span><span id="stamp" style="color:#e5c16b;font-size:12px;opacity:.8"></span><button id="rl">Tải lại</button></div>
<div class="stage"><iframe id="f" class="d"></iframe></div>
<script>
var f=document.getElementById('f'),pg=document.getElementById('pg'),bd=document.getElementById('bd'),bm=document.getElementById('bm'),bt=document.getElementById('bt');
function go(){f.src='about:blank';setTimeout(function(){var u=pg.value.split('#');f.src=u[0]+(u[0].indexOf('?')<0?'?':'&')+'t='+Date.now()+(u[1]?'#'+u[1]:'')},30);try{localStorage.setItem('xt_pg',pg.value)}catch(e){}fetch(pg.value.split('#')[0]+(pg.value.split('#')[0].indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store'}).then(function(r){var d=r.headers.get('Last-Modified');document.getElementById('stamp').textContent='Bản file: '+(d?new Date(d).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' '+new Date(d).toLocaleDateString('vi-VN'):'?')}).catch(function(){})}
function mode(m){f.className=m;bd.setAttribute('aria-pressed',m==='d');bt.setAttribute('aria-pressed',m==='t');bm.setAttribute('aria-pressed',m==='m');try{localStorage.setItem('xt_m',m)}catch(e){}go()}
bd.onclick=function(){mode('d')};bt.onclick=function(){mode('t')};bm.onclick=function(){mode('m')};pg.onchange=go;document.getElementById('rl').onclick=function(){go()};
try{var p=localStorage.getItem('xt_pg');if(p)pg.value=p}catch(e){}
f.onload=function(){try{[].forEach.call(f.contentDocument.querySelectorAll('link[rel=stylesheet]'),function(l){var h=l.getAttribute('href');if(h&&!/^https?:/.test(h)&&h.indexOf('?')<0)l.href=h+'?t='+Date.now()})}catch(e){}};
var m0='d';try{m0=localStorage.getItem('xt_m')||'d'}catch(e){}mode(m0);
</script></body></html>
