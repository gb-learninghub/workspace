ed help."], ["B", "If you had called me, I would have helped you."], ["C", "When I need help, I will remember to call you."], ["D", "If you need help, why don’t you call me?"]]], [45, "The concert may be cancelled due to the heavy rain.", [["A", "Because it was raining heavily, the concert was cancelled."], ["B", "The concert must be cancelled because it is raining heavily."], ["C", "The possible cancellation of the concert is due to the heavy rain."], ["D", "Despite the heavy rain, they will not cancel the concert."]]]]}]}, {"id": 4, "label": "Reading 1", "paras": [["1", "For those looking to learn a new language, the process can feel daunting, especially as an adult. It’s long been thought that the earlier you learn new skills, the easier they are to pick up. The idea that age can play a huge role in a person’s language learning ability is one of the reasons why early childhood was once considered the best time to introduce a second language. But whether that holds true has been heavily debated in the scientific community."], ["2", "“Research says that adults are better learners at everything because we have a lot of self-regulation and we’re very intent when we want to learn something,” says Lourdes Ortega, a professor of linguistics at Georgetown University, who herself speaks four languages."], ["3", "Ortega also says that factors beyond age, like immersion, make a bigger difference in language learning success. No one can learn, as an adult, a new language unless they love it and unless they make it part of their life. In theory, learning languages is a great thing, but you need to have reasons for it and resources to invest in it."], ["4", "According to The Foreign Service Institute (FSI), factors like a person’s natural ability, previous linguistic experience, and the consistency of their lessons affect the language learning process. The FSI says languages that native English speakers would find similar to their own, such as Spanish or French, can be taught s employer, who eventually stole his longtime and best animator from him, led to Disney having a nervous breakdown.", [[182, 185]]], ["4", "After taking some time off with his wife to recuperate, Disney returned with a bold new idea: He would develop a full-length animation feature, which he’d call Snow White and the Seven Dwarfs (1937). It would become an enormous success at the box office, but the films that followed, Pinocchio (1940), Fantasia (1940) and Bambi (1942), would end up being duds. With the success of TV shows like The Mickey Mouse Club and Davy Crockett, Disney was able to harness enough capital to launch his biggest venture yet: Disneyland."], ["5", "Disneyland opened on July 17, 1955, in Anaheim, California. However, forged tickets brought more visitors than anticipated, adding to a line that trailed seven miles long. With temps soaring up to 100 degrees, the new asphalt was melting women’s high heels, drinking fountains were defunct and some of the rides malfunctioned. Critics blasted the opening of Disneyland, calling it “Black Sunday.”"], ["6", "But as always, Disney’s tenacity and perseverance turned his latest endeavour around. Disneyland became a colossal success, clearing out his financial debts, and to this day, operates as an integral part of his business empire.", [[106, 114]]], ["s", "(Adapted from https://www.biography.com/)"]], "range": [53, 60], "groups": [{"kind": "mcq", "step": "read", "title": "Questions 53-60", "lines": ["Read the passage carefully. Choose an option (A, B, C, or D) that best answers each question."], "items": [[53, "The best title of the passage can be _______.", [["A", "Walt Disney’s Early Struggles and Lessons"], ["B", "The Challenges and Triumphs of Walt Disney’s Career"], ["C", "Walt Disney: Overcoming Personal and Family Setbacks"], ["D", "The Evolution of Walt Disney's Animation Techniques"]]], [54, "In paragraph 1, Disney and Roy _______.", [["A", "launched a successful animation company"], ["B", "had strong financial backing to start up"], ["C", "had strained family relationships"], ["D", "created a cartoon business that failed later"]]], [55, "In paragraph 2, it is NOT mentioned that _______.", [["A", "Disney earned a fortune from his successful creation"], ["B", "Disney tried and failed in acting in Los Angeles"], ["C", "Hundreds rejected Disney before one said yes"], ["D", "Before his success, Disney struggled financially for years"]]], [56, "In paragraph 2, the author uses the word <u>too</u> to _______.", [["A", "show how difficult it was for Disney to achieve success"], ["B", "highlight that Disney faced failure in more than one attempt"], ["C", "describe how quickly Disney achieved success"], ["D", "suggest that Disney had too many goals and was determined"]]], [57, "The word <u>his</u> in paragraph 3 refers to _______.", [["A", "Mickey Mouse"], ["B", "the employer"], ["C", "Disney"], ["D", "the business"]]], [58, "It can be inferred from paragraph 5 that _____.", [["A", "the idea of Disneyland was a complete fail"], ["B", "Disneyland did not have a smooth opening"], ["C", "Disneyland’s success was not guaranteed"], ["D", "Disney ignored critics' feedback on Disneyland"]]], [59, "It can be seen in paragraphs 4, 5, and 6 that _______.", [["A", "Although he was talented, Disney was always an unlucky person in the world of business."], ["B", "The early difficulties facing Disney nearly led to the collapse of his whole career."], ["C", "Disney consistently overcame early failures and difficulties to achieve success"], ["D", "Disney's ventures after Disneyland experienced struggles, but he did not give up"]]], [60, "In paragraph 6, the word <u>colossal</u> can be replaced by _______.", [["A", "sharp"], ["B", "real"], ["C", "rare"], ["D", "huge"]]]]}]}]};</script>
