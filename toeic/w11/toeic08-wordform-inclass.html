<script type="application/json" id="gb-key">{"q101": {"a": "B", "e": "Sau the cần danh từ: opening (lễ khánh thành). Bẫy A: opens là động từ, không đứng sau the. Bẫy C: opened là động từ chia quá khứ, không đứng sau the. Bẫy D: openly là trạng từ, không thay được danh từ sau the. Dịch: York Development Corporation đánh dấu lễ khánh thành khu văn phòng đường Ford bằng buổi cắt băng."}, "q102": {"a": "A", "e": "Sau was not cần tính từ: profitable (có lãi). Bẫy B: profiting là V-ing, không đứng sau was not trong câu này. Bẫy C: profitability là danh từ. Quý hai không thể là khả năng sinh lợi. Bẫy D: profitably là trạng từ, không đứng sau be làm vị ngữ. Dịch: Dù quý hai của Smithton Electronics không có lãi, công ty vẫn định đầu tư số tiền lớn cho nghiên cứu."}, "q103": {"a": "A", "e": "Câu đã đủ thành phần, chỗ trống bổ nghĩa cho động từ submit: separately. Bẫy B: separateness là danh từ, câu đã đủ tân ngữ. Bẫy C: separates là động từ, câu đã có động từ submit. Bẫy D: separate là tính từ, không bổ nghĩa cho động từ. Dịch: Vui lòng nộp riêng từng yêu cầu hoàn tiền theo từng loại, như đã nêu trong bản ghi nhớ tháng trước."}, "q104": {"a": "C", "e": "Sau tính từ extensive và trước of cần danh từ: knowledge (kiến thức). Bẫy A: know là động từ, không đứng sau tính từ extensive. Bẫy B: known là V-ed, không đứng sau extensive để thay danh từ. Bẫy D: knowledgeable là tính từ (am hiểu), đã có extensive làm tính từ rồi nên cần danh từ. Dịch: Nhân viên của Lasner Electronics có kiến thức sâu rộng về các hệ thống phần cứng hiện nay."}, "q105": {"a": "A", "e": "Giữa the và danh từ merger cần tính từ: proposed (được đề xuất). Bẫy B: proposal là danh từ, hai danh từ proposal merger không đi liền như vậy. Bẫy C: proposition là danh từ, sai vị trí và sai nghĩa. Bẫy D: proposing là V-ing (đang đề xuất), vụ sáp nhập không tự đề xuất được. Dịch: Cô Luo sẽ giải thích một số hệ quả có thể xảy ra của vụ sáp nhập được đề xuất với Wilson-Peek."}, "q106": {"a": "D", "e": "Chỗ trống bổ nghĩa cho động từ operates, cần trạng từ: more quickly. Bẫy A: quickest là so sánh nhất của tính từ, không đi sau more. Bẫy B: quickness là danh từ, không bổ nghĩa cho động từ. Bẫy C: quick là tính từ, không bổ nghĩa cho động từ operates. Dịch: Máy in mới hoạt động nhanh hơn mẫu trước."}, "q107": {"a": "B", "e": "Sau any cần danh từ: correspondence (thư từ trao đổi). Bẫy A: corresponds là động từ, không đứng sau any. Bẫy C: correspondingly là trạng từ, không đứng sau any. Bẫy D: correspondent là danh từ chỉ người (phóng viên, người viết thư), không hợp nghĩa với in any ... with the department. Dịch: Vui lòng ghi số sê-ri sản phẩm trong mọi thư từ trao đổi với bộ phận chăm sóc khách hàng."}, "q108": {"a": "C", "e": "Sau become cần tính từ: predictable (có thể dự đoán). Bẫy A: predict là động từ, không đứng sau become. Bẫy B: prediction là danh từ (lời dự đoán), xu hướng không thể trở thành lời dự đoán. Bẫy D: predictably là trạng từ, không đứng sau become. Dịch: Bà Suto cho rằng các xu hướng thị trường quan trọng trở nên dễ dự đoán nhờ phân tích dữ liệu."}, "q109": {"a": "D", "e": "Giữa was và hired (V-ed) cần trạng từ: originally (ban đầu). Bẫy A: originality là danh từ, không đứng giữa was và hired. Bẫy B: original là tính từ, không bổ nghĩa cho động từ hired. Bẫy C: originals là danh từ số nhiều, không đứng giữa was và hired. Dịch: Walter Keegan ban đầu được thuê làm nhân viên bán hàng, nhưng chẳng bao lâu sau trở thành trưởng phòng marketing."}, "q110": {"a": "A", "e": "Sau the trade, cuối câu cần danh từ: trade agreement (hiệp định thương mại). Bẫy B: agreeing là V-ing, không đứng sau the trade. Bẫy C: agreeably là trạng từ, không thay được danh từ. Bẫy D: agrees là động từ chia số ít, không đứng sau the trade. Dịch: Phần lớn khu vực sản xuất báo cáo lợi nhuận cao hơn nhờ hiệp định thương mại."}, "q111": {"a": "D", "e": "Sau is cần tính từ: comparable to (có thể sánh với). Bẫy A: compare là động từ, không đứng sau is. Bẫy B: comparing là V-ing, không tạo nghĩa is comparing to trong câu này. Bẫy C: comparison là danh từ, không đứng sau is trong cấu trúc này. Dịch: Sức mạnh tính toán của laptop mới ngang bằng bất kỳ máy tính để bàn nào cùng tầm giá."}, "q112": {"a": "C", "e": "Chỗ trống bổ nghĩa cho động từ met, cần trạng từ: frequently (thường xuyên). Bẫy A: frequent là tính từ, không bổ nghĩa cho động từ met. Bẫy B: frequenting là V-ing, câu đã có động từ met. Bẫy D: frequented là V-ed, câu đã có động từ met. Dịch: Ông Okada gặp quản lý tòa nhà thường xuyên để bàn về dự án phá dỡ."}, "q113": {"a": "D", "e": "Sau tính từ innovative cần danh từ: preservation (sự bảo quản). Bẫy A: preserves là động từ chia số ít, không đứng sau innovative. Bẫy B: preserved là V-ed, không thay danh từ sau innovative. Bẫy C: preserve là động từ nguyên mẫu, không đứng sau innovative. Dịch: World Fish Supply giao cá tươi nhất có thể nhờ các phương pháp bảo quản và vận chuyển tiên tiến."}, "q114": {"a": "B", "e": "Giữa most và danh từ customers cần tính từ: valued (được quý trọng). Bẫy A: valuation là danh từ (sự định giá), không đứng trước customers để bổ nghĩa như vậy. Bẫy C: value là danh từ hoặc động từ, không đứng sau most. Bẫy D: values là danh từ số nhiều hoặc động từ, không đứng sau most. Dịch: Cảm ơn quý khách đã là một trong những khách hàng quý nhất của Danton Transportation suốt mười năm qua."}, "q115": {"a": "B", "e": "Trước tính từ short cần trạng từ: surprisingly (một cách đáng ngạc nhiên). Bẫy A: surprise là danh từ hoặc động từ, không bổ nghĩa cho tính từ short. Bẫy C: surprising là tính từ, tính từ không bổ nghĩa cho tính từ khác. Bẫy D: surprised là V-ed (cảm thấy ngạc nhiên), dùng cho người, không bổ nghĩa cho short. Dịch: Cầu Cullingford được sửa trong một khoảng thời gian ngắn đến bất ngờ."}, "q116": {"a": "A", "e": "Giữa all và danh từ guidelines cần tính từ: local (của địa phương). Bẫy B: locals là danh từ (người dân địa phương), không đứng trước health guidelines. Bẫy C: locally là trạng từ, không đứng giữa all và danh từ. Bẫy D: localize là động từ, không đứng sau all. Dịch: Các nhà hàng ở Rondale phải tuân thủ mọi hướng dẫn y tế của địa phương."}, "q117": {"a": "D", "e": "Sau no cần danh từ: objection (sự phản đối), đi với to. Bẫy A: objected là V-ed, không đứng sau no. Bẫy B: objecting là V-ing, không đi sau no trong cấu trúc no objection to. Bẫy C: objects là danh từ số nhiều (đồ vật) hoặc động từ, sai nghĩa và sai cấu trúc. Dịch: Phó chủ tịch công ty Astrid Barretto không phản đối việc được cân nhắc cho vị trí CEO."}, "q118": {"a": "C", "e": "Trước tính từ refundable cần trạng từ: fully (toàn bộ). Bẫy A: fullest là so sánh nhất của tính từ, không bổ nghĩa cho tính từ. Bẫy B: fuller là so sánh hơn của tính từ, không bổ nghĩa cho tính từ. Bẫy D: full là tính từ, không bổ nghĩa cho tính từ refundable. Dịch: Lệ phí đăng ký được hoàn lại toàn bộ cho đến hai tuần trước ngày hội nghị."}, "q119": {"a": "A", "e": "Sau engine (danh từ) và cuối cụm of engine ... cần danh từ: engine construction (việc chế tạo động cơ). Bẫy B: constructed là V-ed, không đứng sau engine để tạo cụm danh từ. Bẫy C: constructive là tính từ (mang tính xây dựng), không thay danh từ cuối cụm. Bẫy D: construct là động từ, không đứng sau of engine. Dịch: Các tiêu chuẩn khí thải mới buộc Rider Auto thay đổi quy trình chế tạo động cơ."}, "q120": {"a": "B", "e": "Giữa whose và danh từ effort cần tính từ: collective (chung, của cả tập thể). Bẫy A: collect là động từ, không đứng giữa whose và effort. Bẫy C: collects là động từ chia số ít, không đứng trước effort. Bẫy D: collector là danh từ chỉ người (người sưu tầm), sai nghĩa. Dịch: Chúc mừng toàn thể nhân viên Riverside, nỗ lực chung của mọi người đã giúp giảm 20 phần trăm chi phí xử lý rác thải."}, "q121": {"a": "C", "e": "Chỗ trống bổ nghĩa cho động từ differ, cần trạng từ: greatly (rất nhiều). Bẫy A: great là tính từ, không bổ nghĩa cho động từ differ. Bẫy B: greater là so sánh hơn của tính từ, không bổ nghĩa cho động từ. Bẫy D: greatest là so sánh nhất của tính từ, không bổ nghĩa cho động từ. Dịch: Mức lương quản lý khách sạn cấp cao chênh lệch rất nhiều tùy công ty, địa điểm và kinh nghiệm."}, "q122": {"a": "D", "e": "Sau giới từ into cần danh từ: production (việc sản xuất), cụm go into production. Bẫy A: product là danh từ (sản phẩm), nhưng go into product sai nghĩa và thiếu mạo từ. Bẫy B: producer là danh từ chỉ người, bản thiết kế không đi vào nhà sản xuất. Bẫy C: productive là tính từ, không đứng sau giới từ into. Dịch: Trước khi bản thiết kế cập nhật được đưa vào sản xuất, nó phải được ban quản lý phê duyệt."}, "q123": {"a": "B", "e": "Sau the most cần tính từ: innovative (sáng tạo), so sánh nhất của tính từ dài. Bẫy A: innovate là động từ, không đứng sau the most. Bẫy C: innovations là danh từ số nhiều, chủ ngữ là một chiến dịch nên không hợp. Bẫy D: innovatively là trạng từ, không đứng sau the most để làm vị ngữ. Dịch: Chiến dịch quảng cáo được đề xuất của Ford Group cho đến nay là chiến dịch sáng tạo nhất mà chúng tôi từng thấy."}, "q124": {"a": "C", "e": "Giữa will và động từ rise cần trạng từ: steadily (đều đặn). Bẫy A: steady là tính từ (hoặc động từ), không đứng giữa will và rise. Bẫy B: steadying là V-ing, sau will cần động từ nguyên mẫu. Bẫy D: steadier là so sánh hơn của tính từ, không bổ nghĩa cho động từ. Dịch: Sản lượng từ khu vườn của bạn sẽ tăng đều khi bạn thêm phân Natrium Compost vào đất."}, "q125": {"a": "A", "e": "Sau much, cuối câu cần danh từ không đếm được: interest (sự quan tâm). Bẫy B: interests là danh từ số nhiều (đếm được), không đi với much. Bẫy C: interested là tính từ (cảm thấy quan tâm), không thay danh từ sau much. Bẫy D: interesting là tính từ (thú vị), không thay danh từ sau much. Dịch: Gian hàng của Klassin Group tại Liberty Architecture Expo thu hút nhiều sự quan tâm."}, "q126": {"a": "C", "e": "Giữa a và danh từ way cần tính từ: practical (thiết thực). Bẫy A: practice là danh từ hoặc động từ, không đứng giữa a và way để bổ nghĩa như vậy. Bẫy B: practicing là V-ing, không hợp nghĩa trước way. Bẫy D: practically là trạng từ, không đứng giữa a và danh từ. Dịch: Một cách thiết thực để hỗ trợ tăng trưởng kinh tế ở thành phố Ludlow là mua sắm tại các cửa hàng trong khu vực."}, "q127": {"a": "D", "e": "Chỗ trống bổ nghĩa cho động từ negotiating, cần trạng từ: effectively (hiệu quả). Bẫy A: effective là tính từ, không bổ nghĩa cho động từ negotiating. Bẫy B: effecting là V-ing, câu đã có negotiating. Bẫy C: effected là V-ed, không bổ nghĩa cho động từ negotiating. Dịch: Cấp trên của bà Taniguchi khen bà đã đàm phán hiệu quả với Furuyama Corporation."}, "q128": {"a": "B", "e": "Sau giới từ with cần danh từ: emphasis (sự nhấn mạnh), cụm emphasis on. Bẫy A: emphatic là tính từ, không đứng sau with để thay danh từ. Bẫy C: emphasize là động từ, không đứng sau giới từ with. Bẫy D: emphasized là V-ed, không đứng sau giới từ with. Dịch: Người quản lý trình bày dữ liệu về hiệu suất nhân viên, nhấn mạnh vào các thành tích đo lường được."}, "q129": {"a": "B", "e": "Sau were cần tính từ, và chủ ngữ Guests là người cảm thấy ấn tượng: impressed (đuôi -ed). Bẫy A: impressive chỉ vật gây ấn tượng, không dùng cho người cảm thấy ấn tượng. Bẫy C: impressing là V-ing, không tạo nghĩa bị động cảm thấy ấn tượng. Bẫy D: impressively là trạng từ, không đứng sau were để làm vị ngữ. Dịch: Các vị khách rất ấn tượng với đồ trang trí bàn trong bữa tiệc của công ty."}, "q130": {"a": "A", "e": "Giữa chủ ngữ và động từ considered cần trạng từ: briefly (trong chốc lát). Bẫy B: briefs là danh từ số nhiều hoặc động từ, không đứng giữa chủ ngữ và considered. Bẫy C: briefing là danh từ hoặc V-ing, câu đã có động từ considered. Bẫy D: briefed là V-ed, câu đã có động từ considered. Dịch: Marina Hou từng cân nhắc trong chốc lát việc làm diễn viên trước khi quyết định viết kịch."}, "q131": {"a": "C", "e": "Sau product và nối với customer service bằng and, cần danh từ chỉ việc: distribution (việc phân phối). Bẫy A: distribute là động từ, không đứng sau product để làm danh từ. Bẫy B: distributor là danh từ chỉ người hoặc đơn vị, không song song với customer service. Bẫy D: distributed là V-ed, không thay danh từ sau product. Dịch: Bộ phận Tokyo phụ trách phân phối sản phẩm và chăm sóc khách hàng của công ty."}, "q132": {"a": "D", "e": "Sau found it cần tính từ: convenient (tiện lợi). Bẫy A: conveniences là danh từ số nhiều, không đứng sau found it. Bẫy B: conveniently là trạng từ, sau found it cần tính từ. Bẫy C: convenience là danh từ, sau found it cần tính từ. Dịch: Phản hồi ban đầu từ những người mua sớm điện thoại Sunbell XC2 cho thấy họ thấy nó tiện dùng."}, "q133": {"a": "B", "e": "Giữa very và acknowledged (V-ed) cần trạng từ: favorably (một cách tích cực). Bẫy A: favor là danh từ hoặc động từ, không đứng sau very. Bẫy C: favorable là tính từ, không bổ nghĩa cho V-ed acknowledged. Bẫy D: favored là V-ed, không đứng sau very để bổ nghĩa cho acknowledged. Dịch: Đóng góp của nhóm vào kế hoạch marketing của Ripton Group được ghi nhận rất tích cực."}, "q134": {"a": "B", "e": "Sau the common cần danh từ: assumption (giả định), làm chủ ngữ của was. Bẫy A: assume là động từ, không làm chủ ngữ sau the common. Bẫy C: assuming là V-ing, không làm danh từ chủ ngữ ở đây. Bẫy D: assumable là tính từ hiếm gặp, không thay danh từ sau the common. Dịch: Khi chủ tịch ngân hàng nghỉ hưu, giả định phổ biến là phó chủ tịch sẽ kế nhiệm."}, "q135": {"a": "A", "e": "Sau the most và trước mailing option cần tính từ: economical (tiết kiệm). Bẫy B: economy là danh từ, không đứng sau the most để bổ nghĩa như vậy. Bẫy C: economize là động từ, không đứng sau the most. Bẫy D: economized là V-ed, không hợp nghĩa trước mailing option. Dịch: Bà Kuramoto chọn phương án gửi thư tiết kiệm nhất có sẵn."}}</script>
<script>window.DATA={"mode": "practice", "title": "Lesson 08 - Word form (In-class)", "code": "TOEIC08-WordForm", "tfng": [], "legend": [], "sb": {"url": "https://bumaiagvgpewhvczgwio.supabase.co", "key": "sb_publishable_B563fC34wnTDCGSZv29euw_6P3mFRs5"}, "passages": [{"id": 1, "label": "Giải", "short": "Giải", "nop": true, "range": [101, 103], "groups": [{"kind": "mcq", "step": "wordform", "title": "Câu mẫu 101-103", "lines": ["Ba câu mẫu: nhìn từ trước và sau chỗ trống, xác định loại từ, loại đáp án sai loại."], "items": [[101, "York Development Corporation marked the _______ of the Ford Road office complex with a ribbon-cutting ceremony.", [["A", "opens"], ["B", "opening"], ["C", "opened"], ["D", "openly"]]], [102, "Even though Smithton Electronics' second quarter was not _______, the company plans to invest large sums on research.", [["A", "profitable"], ["B", "profiting"], ["C", "profitability"], ["D", "profitably"]]], [103, "Please submit each reimbursement request _______ according to its category, as outlined in last month's memo.", [["A", "separately"], ["B", "separateness"], ["C", "separates"], ["D", "separate"]]]]}]}, {"id": 2, "label": "Làm", "short": "Làm", "nop": true, "range": [104, 115], "groups": [{"kind": "mcq", "step": "wordform", "title": "Câu 104-115", "lines": ["Làm lần lượt từng câu trên lớp. Câu 104-115 làm trực tiếp, chưa có đáp án của học viên."], "items": [[104, "Lasner Electronics' staff have extensive _______ of current hardware systems.", [["A", "know"], ["B", "known"], ["C", "knowledge"], ["D", "knowledgeable"]]], [105, "Ms. Luo will explain some possible consequences of the _______ merger with the Wilson-Peek Corporation.", [["A", "proposed"], ["B", "proposal"], ["C", "proposition"], ["D", "proposing"]]], [106, "The new printer operates more _______ than the previous model did.", [["A", "quickest"], ["B", "quickness"], ["C", "quick"], ["D", "quickly"]]], [107, "Please include the serial number of your product in any _______ with the customer service department.", [["A", "corresponds"], ["B", "correspondence"], ["C", "correspondingly"], ["D", "correspondent"]]], [108, "Ms. Suto claims that important market trends become _______ with the use of data analysis.", [["A", "predict"], ["B", "prediction"], ["C", "predictable"], ["D", "predictably"]]], [109, "Walter Keegan was _______ hired as a salesperson, but he soon became head of the marketing department.", [["A", "originality"], ["B", "original"], ["C", "originals"], ["D", "originally"]]], [110, "Most of the manufacturing sector has reported higher profits as a result of the trade _______.", [["A", "agreement"], ["B", "agreeing"], ["C", "agreeably"], ["D", "agrees"]]], [111, "The computing power of the new laptop is _______ to any desktop computer in the same price range.", [["A", "compare"], ["B", "comparing"], ["C", "comparison"], ["D", "comparable"]]], [112, "Mr. Okada met _______ with the building manager to discuss the demolition project.", [["A", "frequent"], ["B", "frequenting"], ["C", "frequently"], ["D", "frequented"]]], [113, "World Fish Supply delivers the freshest fish possible thanks to innovative _______ and shipping methods.", [["A", "preserves"], ["B", "preserved"], ["C", "preserve"], ["D", "preservation"]]], [114, "Thank you for being one of Danton Transportation's most _______ customers over the past ten years.", [["A", "valuation"], ["B", "valued"], ["C", "value"], ["D", "values"]]], [115, "The Cullingford Bridge took a _______ short amount of time to be repaired.", [["A", "surprise"], ["B", "surprisingly"], ["C", "surprising"], ["D", "surprised"]]]]}]}, {"id": 3, "label": "Homework", "short": "Homework", "nop": true, "range": [116, 135], "groups": [{"kind": "mcq", "step": "wordform", "title": "Câu 116-135", "lines": ["Chữa bài tập về nhà. Đáp án của học viên lấy từ bài Practice."], "items": [[116, "Restaurants in Rondale must follow all _______ health guidelines.", [["A", "local"], ["B", "locals"], ["C", "locally"], ["D", "localize"]]], [117, "Company Vice President Astrid Barretto had no _______ to being considered for the position of CEO.", [["A", "objected"], ["B", "objecting"], ["C", "objects"], ["D", "objection"]]], [118, "The registration fee is _______ refundable up to two weeks prior to the conference date.", [["A", "fullest"], ["B", "fuller"], ["C", "fully"], ["D", "full"]]], [119, "New emissions standards have forced Rider Auto to modify the process of engine _______.", [["A", "construction"], ["B", "constructed"], ["C", "constructive"], ["D", "construct"]]], [120, "We congratulate all Riverside employees, whose _______ effort has resulted in a 20 percent reduction in waste disposal costs.", [["A", "collect"], ["B", "collective"], ["C", "collects"], ["D", "collector"]]], [121, "Senior hotel manager salaries differ _______ by company, location, and experience.", [["A", "great"], ["B", "greater"], ["C", "greatly"], ["D", "greatest"]]], [122, "Before the updated design can go into _______, it must be approved by management.", [["A", "product"], ["B", "producer"], ["C", "productive"], ["D", "production"]]], [123, "The Ford Group's proposed advertising campaign is by far the most _______ we have seen so far.", [["A", "innovate"], ["B", "innovative"], ["C", "innovations"], ["D", "innovatively"]]], [124, "Yields from your garden will _______ rise as you add Natrium Compost to the soil.", [["A", "steady"], ["B", "steadying"], ["C", "steadily"], ["D", "steadier"]]], [125, "The Klassin Group's booth at the Liberty Architecture Expo has garnered much _______.", [["A", "interest"], ["B", "interests"], ["C", "interested"], ["D", "interesting"]]], [126, "A _______ way to support economic growth in Ludlow City is to shop at area businesses.", [["A", "practice"], ["B", "practicing"], ["C", "practical"], ["D", "practically"]]], [127, "Ms. Taniguchi's supervisor commended her for negotiating _______ with Furuyama Corporation.", [["A", "effective"], ["B", "effecting"], ["C", "effected"], ["D", "effectively"]]], [128, "The manager presented data on employee performance with _______ on measurable achievements.", [["A", "emphatic"], ["B", "emphasis"], ["C", "emphasize"], ["D", "emphasized"]]], [129, "Guests were _______ with the table decorations for the company banquet.", [["A", "impressive"], ["B", "impressed"], ["C", "impressing"], ["D", "impressively"]]], [130, "Marina Hou _______ considered becoming an actor before deciding to write plays instead.", [["A", "briefly"], ["B", "briefs"], ["C", "briefing"], ["D", "briefed"]]], [131, "The Tokyo division handles product _______ and customer service for the company.", [["A", "distribute"], ["B", "distributor"], ["C", "distribution"], ["D", "distributed"]]], [132, "The initial feedback from early buyers of the Sunbell XC2 mobile phone indicates that they found it _______ to use.", [["A", "conveniences"], ["B", "conveniently"], ["C", "convenience"], ["D", "convenient"]]], [133, "The team's contributions to the Ripton Group's marketing plan were very _______ acknowledged.", [["A", "favor"], ["B", "favorably"], ["C", "favorable"], ["D", "favored"]]], [134, "When the bank president retired, the common _______ was that the vice president would take over.", [["A", "assume"], ["B", "assumption"], ["C", "assuming"], ["D", "assumable"]]], [135, "Ms. Kuramoto selected the most _______ mailing option available.", [["A", "economical"], ["B", "economy"], ["C", "economize"], ["D", "economized"]]]]}]}]};</script>

<script>(function () {
  "use strict";
  var D = window.DATA, TEACH = D.mode === "teaching";
  var state = { p: 0, ans: {}, chk: {}, lock: {}, byId: {}, pres: {}, open: [], vocab: true, code: "", sname: "", saved: "", timer: null, loading: false };
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function h(tag, a) {
    var e = document.createElement(tag);
    if (a) for (var k in a) { if (k === "cls") e.className = a[k]; else if (k === "html") e.innerHTML = a[k]; else if (k === "text") e.textContent = a[k]; else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), a[k]); else e.setAttribute(k, a[k]); }
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c == null) continue; e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
    return e;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function norm(s) { return String(s == null ? "" : s).toLowerCase().replace(/\s+/g, " ").trim(); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { } return null; }

  var ICON = {

    book: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></svg>',
    cross: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    reset: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg>'
  };
  function ibtn(name, title, fn, cls) { return h("button", { cls: "ib " + (cls || ""), title: title, "aria-label": title, html: ICON[name], onclick: fn }); }

  var QMAP = {}; // qnum -> {pi, item}
  D.passages.forEach(function (P, pi) {
    P.groups.forEach(function (g) {
      if (g.kind === "multi") { for (var i = 0; i < g.n; i++) QMAP[g.firstq + i] = { pi: pi, g: g }; }
      else g.items.forEach(function (it) { QMAP[it[0]] = { pi: pi, g: g, it: it }; });
    });
  });

  /* ---------- answers ---------- */
  function multiSel(g) { return state.ans["m" + g.firstq] || []; }
  function qValue(n) {
    var m = QMAP[n]; if (m.g.kind === "multi") { var s = multiSel(m.g).slice().sort(); return s[n - m.g.firstq] || ""; }
    return state.ans[n] || "";
  }
  function isAnswered(n) { return qValue(n) !== ""; }
  function locked(n) { return !!state.lock[QMAP[n].pi]; }
  function correctOf(n) {
    var m = QMAP[n]; if (!TEACH) return null;
    if (m.g.kind === "multi") { var v = qValue(n); return v !== "" && m.g.answer.indexOf(v) > -1; }
    var it = m.it, v2 = qValue(n);
    if (m.g.kind === "fill") return it[2].some(function (a) { return norm(a) === norm(v2); });
    return norm(it[m.g.kind === "mcq" ? 3 : 2]) === norm(v2);
  }
  function tileState(n) {
    if (!TEACH) { var r = state.byId["q" + n]; if (r !== undefined) return r === true ? "ok" : "bad"; }
    var m = QMAP[n];
    if (TEACH) {
      var key = m.g.kind === "multi" ? "g" + m.g.firstq : n;
