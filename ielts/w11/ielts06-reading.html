<script>window.DATA={"mode": "practice", "title": "Test 06 - Reading (Practice)", "code": "IELTS06-Reading", "tfng": ["TRUE", "FALSE", "NOT GIVEN"], "legend": [["TRUE", "if the statement agrees with the information"], ["FALSE", "if the statement contradicts the information"], ["NOT GIVEN", "if there is no information on this"]], "sb": {"url": "https://bumaiagvgpewhvczgwio.supabase.co", "key": "sb_publishable_B563fC34wnTDCGSZv29euw_6P3mFRs5"}, "passages": [{"id": 1, "title": "Fordlandia", "paras": [["", "Natural latex, or rubber, comes from the sap of rubber trees. Native to the Amazon region of South America, they had long been a Brazilian monopoly, and the boom in wild rubber had made many remote jungle towns rich, until thousands of seeds of the tree were smuggled out by an entrepreneurial Brit, Henry Wickham. These were used to start plantations throughout British East-Asia, where the trees, facing none of their natural insect or fungal enemies, thrived. Thus, the Brazilian rubber boom crashed, leaving control of the world’s supplies with the plantation owners in Malaysia (where to this day, most of the world’s natural rubber is still produced)."], ["", "But in the late 1920s, the automobile tycoon, Henry Ford, had a vision. He believed in vertical integration—that is, a supply chain of car parts and products united through his ownership. With his factories producing hundreds of thousands of cars, each of them needing rubber tyres, Ford wanted his own source of rubber and resented dealing with the British plantation interests. He therefore decided to buy a huge tract of Amazonian rainforest, where he would transplant his American workers and lifestyle, in order to make the largest rubber plantation on the planet. It would be called Fordlandia — ambitious, grandiose, and doomed from the beginning."], ["", "The first mistake was to hire a rather untrustworthy Brazilian to scout for the best location in the Amazon. This man recommended a damp, rocky, and infertile series of hillsides near the Tapajos river, a tributary of the wide and mighty Amazon. In 1928, Ford blindly acquired a 10,000-square-kilometre concession and immediately ordered an immense amount of infrastructure to be built—at huge cost. To this end, earth-moving equipment arrived, tractors, stump-pullers, trains, prefabricated living quarters, and food-making equipment. The surface jungle was cleared, scores of Ford’s employees were relocated, and out of this wilderness sprang an instant slice of America, complete with a modern hospital, library, hotels, ice cream makers, and row upon row of prefabricated houses positioned along nicely paved streets."], ["", "The second big mistake was that, incredibly, Ford never thought to consult trained horticulturists. He naively assumed that his own company engineers, who had proven their worth in the production of cars, would prove equally adept at this agricultural endeavour. Thus, they planted the rubber trees thickly together, believing that they would nourish in their home environment. However, in the Amazonian jungle, wild rubber trees are actually few and far between — a defence against the prodigious insect life which chews, drills, sucks, and bites. In such environments, monocultural farming approaches are dubious at best. Ford’s young rubber trees had no sooner appeared from the ground than they were attacked by caterpillars, ants, red spiders, and most significantly, South American leaf blight, which, to this day, limits the number of rubber plantations in this, the tree’s native land."], ["", "The next problem was based on cultural differences. The newly planted fields needed hundreds of local workers, who, although well paid, were expected to follow Ford’s patronising vision of a healthy lifestyle. Instead of the local custom of working before and after the roastingly hot middle of the day, Ford’s workers were forced to do the standard company 9-to-5 shift. Similarly, they had to eat American food and take part in weekend activities considered sufficiently wholesome, such as poetry reading and square-dancing. Alcohol was strictly forbidden at work, in the housing estates, or within Fordlandia’s sphere of influence. After a year denied their local customs, the disgruntled workers had had enough, and a riot followed, leaving the hapless American staff scurrying into the jungle to escape injury. It was all finally quelled with the arrival of the Brazilian army."], ["", "After three years, and no significant quantity of rubber to show for it all, Ford did what he should have done from the beginning—hired a trained horticulturist, who ultimately concluded that, in whatever manner the rubber trees were planted, the land was not appropriate for their cultivation. With such humiliating news, anyone less stubborn would have given up, yet Ford purchased another tract of land some fifty miles downstream of the Tapajos river—flatter, drier, better drained, and more suitable for machinery — and started all over again. This time, Ford imported blight-resistant Malaysian rubber trees, and much more horticultural expertise. Still, 10 years later, in 1942, the operation could only produce a paltry 750 tons of latex rubber. Ford’s factories were hoping for almost 40,000."], ["", "The final nail in the coffin was the development of synthetic rubber, and in 1945, it was time to admit defeat, although it was not Ford who did so. By that time he was old and ill and had relinquished control of his company to his grandson, Henry Ford II, who closed down the entire rubber operation. The holdings were sold back to the Brazilian government for a pittance, leaving a loss of over $20 million (which would be over 10 times that much in today’s terms) — a complete and utter financial disaster."]], "range": [1, 13], "groups": [{"kind": "tfng", "title": "Questions 1–4", "lines": ["Do the following statements agree with the information given in Reading Passage 1?"], "items": [[1, "Henry Wickham destroyed the Brazilian rubber boom."], [2, "Rubber trees are well suited to Malaysia."], [3, "The Tapajos river is very wide."], [4, "Fordlandia may have succeeded."]]}, {"kind": "fill", "title": "Questions 5–10", "lines": ["Complete the table.", "Choose no more than two words from the passage for each answer."], "items": [[5], [6], [7], [8], [9], [10]], "tbl": {"head": ["", "Fordlandia’s problems", "Result of these problems"], "rows": [["One", "first piece of land not {5} for rubber trees", "no {6} of rubber produced"], ["Two", "{7} were unfamiliar with farming", "an unwise {8} approach"], ["Three", "not following {9}", "a {10}"]]}}, {"kind": "fill", "title": "Questions 11–13", "lines": ["Complete the sentences.", "Choose no more than two words from the passage for each answer."], "items": [[11, "The natural enemy of rubber trees is {}."], [12, "Plantations definitely need the skills of {}."], [13, "Fordlandia closed down upon the invention of {}."]]}]}, {"id": 2, "title": "Shakespeare: The Authorship Question", "paras": [["", "If one were asked to name the greatest writer in the English language, few would hesitate in answering, ‘William Shakespeare’. Although he dabbled in poetry, his central claim to fame is his plays, almost 40 of them. Extensively studied, constantly performed, adapted, and reinterpreted into modern contexts, Shakespeare’s plays remain as popular as ever. But did he write them, that is the question?"], ["", "The immediate reaction is to wonder why anyone would even ask this. Although there is little documentary evidence of Shakespeare’s life, what does exist unequivocally identifies him as the author of the plays. His name appears on title pages of a few publications, printing orders, and theatrical documents, and is mentioned by contemporary commentators and a fellow playwright, both publicly and in private memoirs, in every case in a way that is consistent with Shakespeare being the author. Consequently, for hundreds of years, no one held any doubts whatsoever on the matter."], ["", "There it would have remained, had Shakespeare’s posthumous reputation not reached such lofty heights. With the widespread acceptance of his dramatic genius, apparent inconsistencies were perceived. Chief among these was how such literature could originate from, as viewed by some, a humble ill-educated country bumpkin and bawdy stage entrepreneur, about whom so little was known. Details of Shakespeare’s schooling and upbringing in the small market town of Stratford-Upon-Avon are non-existent, but among his surviving children there is no evidence of strong education or even basic literacy skills. No original written texts have ever been found, and Shakespeare’s six surviving signatures are all unsteady, showing inconsistent style and spelling."], ["", "Most tellingly for some are the circumstances of Shakespeare’s death. Firstly, there is his will, a commonplace and unpoetic document, making no mention whatsoever of the considerable body of papers, reference books, and miscellaneous plays, poetry, and writings that one would expect a playwright of Shakespeare’s stature to possess. Apparently he was unconcerned about the rights to both his own plays (many of which remained unpublished at that time) and his own literary heritage. The second fact is that, upon his death, there were no eulogies, mourning notices, or testimonies from those who knew him. All this seems very perplexing for a playwright and poet who, whilst not necessarily considered the most polished, professional, or learned by his peers, had nevertheless achieved considerable wealth, respect, and fame, even in his own lifetime."], ["", "Such thoughts first became public in the mid-19th century — and have never really stopped, developing the grand title, ‘The Shakespeare authorship question’, and dividing those interested into two sides: the Stratfordians: those who support Shakespeare as the author, and the anti-Stratfordians: those who do not. For the latter body, the only way to overcome the documentary evidence in support of Shakespeare’s authorship is to assume a conspiracy existed among a select group of people, perhaps including Shakespeare himself, in order to protect the real author’s identity. So who was he (and in those times, it goes without saying that it could not be a ‘she’)?"], ["", "The anti-Stratfordians search for a university-educated, upper-class candidate — someone who would inevitably have had knowledge of aristocratic manners and mores, and familiarity with the proceedings and politics of the royal court, all of which so often appear in the plays themselves. The reason for the conspiracy is that producing such works, full with themes of royal revenge and murder, intrigue and assassination, mob rule and rebellion, could render a nobleman liable to the dangerous charge of subversion. Some have also argued that, at that time, it was considered socially unacceptable for the upper-class to publish creative literature for monetary gain, being instead confined to circulating their writings among their peers, or seeing them performed among courtly audiences."], ["", "There are four leading contenders. Sir Francis Bacon was the first nominated, and certainly had the best intellectual credentials, being well-versed in law, philosophy, essay writing, and science. However, since the 1920s, Edward de Vere, an aristocratic earl who patronised and sponsored actors and the arts, has become the leading contender. Only slightly less favoured is a fellow playwright, Christopher Marlowe. Born into the same social class as Shakespeare, he at least went to university, although his early death in a tavern brawl presents difficulties — unless one assumes his demise was fabricated to allow him to continue writing under Shakespeare’s name. Finally, there is William Stanley, another aristocratic earl. Contemporary accounts attest to the fact that he wrote plays for the common people, and throughout his life he displayed interest and support for the theatre."], ["", "And the evidence? Mere historical and literary conjecture, vague similarities in writing styles, and loose coincidences between the lives and travels of these contenders when compared to the scenes and settings of many of the plays in question. In other words, nothing solid at all. The case is so flimsy that reputable scholars barely discuss it, and rightly so. Although capable of attracting public interest and selling books, unless some real evidence emerges, I would say that the authorship question is not questionable at all."]], "range": [14, 26], "groups": [{"kind": "tfng", "title": "Questions 14–17", "lines": ["Do the following statements agree with the information given in Reading Passage 2?"], "items": [[14, "Shakespeare’s name appears on many documents."], [15, "He was considered a genius even in his lifetime."], [16, "He was well-educated."], [17, "When he died, not all the plays had been published."]]}, {"kind": "fill", "title": "Questions 18–21", "lines": ["Complete the sentences.", "Choose one word only from the passage for each answer."], "items": [[18, "We have six examples of Shakespeare’s {}."], [19, "He used ordinary language in his {}."], [20, "The lack of public grieving upon his death is {}."], [21, "Those who believe Shakespeare was not the author are called {}."]]}, {"kind": "fill", "title": "Questions 22–24", "lines": ["Complete the flowchart.", "Choose no more than three words from the passage for each answer."], "items": [[22], [23], [24]], "flow": {"title": "The argument for an aristocratic author", "boxes": ["Writing commercial plays was dangerous and {22}", "Real author needed to {23}", "A conspiracy was arranged (with Shakespeare, too).", "This counters the {24} supporting Shakespeare’s authorship"]}}, {"kind": "mcq", "title": "Questions 25–26", "lines": ["Choose the correct letter, A, B, C or D."], "items": [[25, "Which sentence was mentioned in the reading passage?", [["A", "Sir Francis Bacon was the smartest of the candidates."], ["B", "Edward de Vere was in the same social class as Shakespeare."], ["C", "Christopher Marlowe is the prime candidate."], ["D", "William Stanley wrote plays for courtly audiences."]]], [26, "The author believes that Shakespeare", [["A", "did not write the plays."], ["B", "may not have written the plays."], ["C", "probably wrote the plays."], ["D", "certainly wrote the plays."]]]]}]}, {"id": 3, "title": "The Immunisation Controversy", "paras": [["A", "Carl Sagan once said, ‘Science loses ground to pseudo-science because the latter seems to offer more comfort.’ Yes, hard science, proven facts, and indisputable logic are often not sufficiently consoling, and thus routinely eliminated from the equation. Never, though, has this been more distressing than with the so-called ‘anti-vaccination’ movement. The end result has been the needless death of very young children, the most helpless of bystanders, and yet it seems there is no end in sight."], ["B", "It is strange to believe that vaccination, with such a long and distinguished track record, is now under assault. Smallpox, for example, had killed over half a billion human beings throughout history but was eradicated — completely removed from the face of the Earth — via immunisation programs. Similarly, polio, rubella, whooping cough, measles, and a slew of other diseases which routinely decimated the youth are now, virtually, things of the past. The days of high infant mortality, short life spans, and nasty brutish lives are indeed long gone, and we owe it all to this crucial insight into disease prevention."], ["C", "And this is part of the problem. With the once terrible epidemics lying outside of human memory, a growing number of people are convinced that vaccinations are no longer necessary, and that the small risk of adverse effects outweighs the benefits. One reason for this belief is that many genetic disorders related to brain impairment often emerge at around two years of age — that is, the same period in which babies receive vaccinations. If one in a hundred babies is destined to develop autism among a vaccinated group, then observable symptoms of the problem will likely appear after a vaccination shot, leading distraught parents to link one event to the other."], ["D", "This misattribution is compounded by the Internet, which now hosts a sprawling forum of anti-vaccination lobby groups and their websites, full with unsubstantiated claims, fraudulent research, anecdotal evidence, and the passionate tirades of multitudes, firmly convinced of the correctness of their case. Authority is undermined, statistics ignored, and hard science excluded. Is it so surprising? If creationists and alternative medicine practitioners can gain respectability and widespread public and political support, so too can the pseudo-science of the anti-vaccinationists. When faced with this wave of propaganda, it would be hard for many parents, motivated by the intense desire to protect their children, not to be influenced."], ["E", "At this point, it must be clarified that there is no credible evidence whatsoever to support the anti-vaccinationists’ claims. Over a score of peer-reviewed studies have found nothing to link the MMR (measles/mumps/rubella) vaccine to autism, or even the more subtle neurological problems, and every reason to continue with vaccinations. The so-called increase in autism so often attributed to vaccinations merely results from more accurate diagnoses. Children who in the past would have been labeled as ‘retarded’ or ‘slow’ are now identified as having one of the three main grades of autism (which is probably genetically determined). Yet this argument falls on deaf ears, and the counter-claimants have succeeded in reducing vaccination rates among certain communities to the extent that outbreaks of preventable childhood illnesses (such as polio, meningitis, and measles) are occurring."], ["F", "The MMR controversy is a sad case. In 1998, a high-profile paper linked this vaccine to autism. It was later shown that the author was receiving funds from various groups engaged in a lawsuit against vaccine manufacturers, and that the study was both ethically and methodologically faulty. Data had been manipulated, and results misreported. Similar studies found no link whatsoever, and in 2004, the medical journal which hosted the original article formally retracted its conclusion. Yet vaccination rates in the UK had dropped to 80% in the subsequent years. In late 1999, a measles outbreak occurred in North Dublin (which had vaccination rates as low as 60%), resulting in 100 hospitalisations and three deaths."], ["G", "One of the key arguments of the anti-vaccinationists is that they have the right to choose their medication. These people attack what they see as the impersonal, intrusive, and uncaring edifice of modern medical science. However, the success of immunisation programs depends on a sufficiently high number of the population being immune, which forces the disease to die out through lack of carriers. If there are enough susceptible individuals to provide a chain of disease transmission, safety is compromised for all, and this is why free choice should not be an issue, particularly when the hard evidence presents an overwhelming case. Personally, I would have thought that when children started dying from preventable diseases, the anti-vaccinationists’ case would die also."], ["H", "But there are other agendas at play. Anti-vaccinationists can posture as moral crusaders, dismissing those who support immunisation as being in the payment of big pharmaceutical companies, whom they see as dishonest and immoral. Talk show hosts, women’s magazines, paid ‘experts’, lawyers, and media celebrities, all benefit from creating controversy when none existed, while alternative medicine practitioners and snake-oil salesmen all oppose vaccination, believing that their own slew of pills, potions, and unproven expensive treatments do the job better. Against all this, how can rational science prevail?"]], "range": [27, 40], "groups": [{"kind": "head", "title": "Questions 27–33", "lines": ["Reading Passage 3 has seven paragraphs, A–H.", "Choose the correct heading for paragraphs B–H from the list of headings.", "Drag a heading into each box, or tap a heading and then tap a box."], "bank": [["i", "Easy publicity"], ["ii", "Increasing outbreaks of disease"], ["iii", "Some real reasons"], ["iv", "All or nothing"], ["v", "Autism on the rise"], ["vi", "Past successes"], ["vii", "A sad consequence"], ["viii", "An unfortunate coincidence"], ["ix", "A simple explanation"], ["x", "Some dubious evidence"]], "example": ["Paragraph A", "vii"], "items": [[27, "Paragraph B"], [28, "Paragraph C"], [29, "Paragraph D"], [30, "Paragraph E"], [31, "Paragraph F"], [32, "Paragraph G"], [33, "Paragraph H"]]}, {"kind": "multi", "title": "Questions 34–36", "lines": ["Choose three answers from the list.", "For which three reasons, A–G, do anti-vaccinationists oppose vaccinations?", "Choose three letters, A–G, in any order."], "n": 3, "firstq": 34, "options": [["A", "Believing they cause problems"], ["B", "Wanting to save money"], ["C", "Wanting freedom of choice"], ["D", "Not believing drug manufacturers"], ["E", "The pain of vaccinations"], ["F", "The influence of creationists"], ["G", "Preferring alternative medicine"]]}, {"kind": "mcq", "title": "Questions 37–40", "lines": ["Choose the correct letter, A, B, C or D."], "items": [[37, "Autism is", [["A", "sometimes caused by vaccinations."], ["B", "a very subtle neurological disorder."], ["C", "most likely inherited."], ["D", "increasing."]]], [38, "The 1998 paper was", [["A", "the cause of falling vaccination rates."], ["B", "defended by the medical journal."], ["C", "verified by other studies."], ["D", "funded by patients."]]], [39, "Vaccinations", [["A", "have removed most smallpox from the world."], ["B", "are supported by solid evidence."], ["C", "are defended on some websites."], ["D", "are no longer necessary."]]], [40, "Alternative medicine practitioners", [["A", "believe vaccinations are generally good."], ["B", "can be impersonal and uncaring."], ["C", "are often supported by politicians."], ["D", "are often quite cheap."]]]]}]}]};</script>

<script>(function () {
  "use strict";
  var D = window.DATA, TEACH = D.mode === "teaching";
  var state = { p: 0, ans: {}, chk: {}, lock: {}, byId: {}, pres: {}, open: [], vocab: true, code: "", sname: "", saved: "", timer: null, loading: false };
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function h(tag, a) {
    var e = document.createElement(tag);
    if (a) for (var k in a) { if (k === "cls") e.className = a[k]; else if (k === "html") e.innerHTML = a[k]; else if (k === "text") e.textContent = a[k]; else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), a[k]); else e.setAttribute(k, a[k]); }
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c == null) continue; e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
    return e;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function norm(s) { return String(s == null ? "" : s).toLowerCase().replace(/\s+/g, " ").trim(); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { } return null; }

  var ICON = {
    tick: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
    full: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    book: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></svg>',
    reset: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg>'
  };
  function ibtn(name, title, fn, cls) { return h("button", { cls: "ib " + (cls || ""), title: title, "aria-label": title, html: ICON[name], onclick: fn }); }

  var QMAP = {}; // qnum -> {pi, item}
  D.passages.forEach(function (P, pi) {
    P.groups.forEach(function (g) {
      if (g.kind === "multi") { for (var i = 0; i < g.n; i++) QMAP[g.firstq + i] = { pi: pi, g: g }; }
      else g.items.forEach(function (it) { QMAP[it[0]] = { pi: pi, g: g, it: it }; });
    });
  });

  /* ---------- answers ---------- */
  function multiSel(g) { return state.ans["m" + g.firstq] || []; }
  function qValue(n) {
    var m = QMAP[n]; if (m.g.kind === "multi") { var s = multiSel(m.g).slice().sort(); return s[n - m.g.firstq] || ""; }
    return state.ans[n] || "";
  }
  function isAnswered(n) { return qValue(n) !== ""; }
  function locked(n) { return !!state.lock[QMAP[n].pi]; }
  function correctOf(n) {
    var m = QMAP[n]; if (!TEACH) return null;
    if (m.g.kind === "multi") { var v = qValue(n); return v !== "" && m.g.answer.indexOf(v) > -1; }
    var it = m.it, v2 = qValue(n);
    if (m.g.kind === "fill") return it[2].some(function (a) { return norm(a) === norm(v2); });
    return norm(it[m.g.kind === "mcq" ? 3 : 2]) === norm(v2);
  }
  function tileState(n) {
    if (!TEACH) { var r = state.byId["q" + n]; if (r !== undefined) return r === true ? "ok" : "bad"; }
    var m = QMAP[n];
    if (TEACH) {
      var key = m.g.kind === "multi" ? "g" + m.g.firstq : n;
      if (state.chk[key]) return correctOf(n) ? "ok" : "bad";
    }
    return isAnswered(n) ? "on" : "";
  }

  /* ---------- passage ---------- */
  function vocabHTML(text) {
    var t = esc(text);
    if (!TEACH) return t;
    (D.passages[state.p].vocab || []).forEach(function (v, i) {
      var re = new RegExp("(" + esc(v[0]).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
      t = t.replace(re, '<mark class="v" data-i="' + i + '">$1</mark>');
    });
    return t;
  }
  function renderPassage() {
    var P = D.passages[state.p], box = $("#passage"); box.innerHTML = "";
    box.appendChild(h("div", { cls: "ptag", text: "Reading passage " + P.id }));
    box.appendChild(h("h2", { text: P.title }));
    P.paras.forEach(function (pr, i) {
      var L = pr[0], T = pr[1], name = null;
      if (L === "q") { var sp = T.split("|"); T = sp[0]; name = sp[1]; }
      var row = h("div", { cls: "para" + (L === "q" ? " quote" : "") });
      var tag = (L && L !== "q") ? L : (TEACH && !L ? String(i + 1) : "");
      if (L !== "q" && (L || TEACH)) row.appendChild(h("span", { cls: "pl" + (L ? "" : " pn"), text: tag }));
      var body = h("div", { cls: "pt" }); body.innerHTML = vocabHTML(T);
      row.appendChild(body);
      if (name) body.appendChild(h("div", { cls: "who", text: name }));
      box.appendChild(row);
    });
    if (TEACH && state.vocab) box.classList.add("vh"); else box.classList.remove("vh");
  }

  /* ---------- questions ---------- */
  function numTile(n) { return h("span", { cls: "qn", id: "q" + n, text: String(n) }); }
  function expl(text, ok) { return h("div", { cls: "ex " + (ok ? "ok" : "bad") }, h("b", { text: ok ? "Correct. " : "Not quite. " }), h("span", { text: text })); }

  function chips(it, opts, kind, rerender) {
    var n = it[0], row = h("div", { cls: "chips" }), done = TEACH && state.chk[n], ans = kind === "para" ? it[2] : it[2];
    opts.forEach(function (o) {
      var val = typeof o === "string" ? o : o[0], lab = typeof o === "string" ? o : o[0] + "  " + o[1];
      var b = h("button", { cls: "chip" + (kind === "tfng" ? " wide" : "") + (state.ans[n] === val ? " sel" : ""), text: kind === "tfng" || kind === "para" ? val : lab,
        onclick: function () { if (locked(n)) return; state.ans[n] = val; if (TEACH) state.chk[n] = true; rerender(); updateTiles(); } });
      if (done) { if (val === ans) b.classList.add("right"); else if (state.ans[n] === val) b.classList.add("wrong"); }
      row.appendChild(b);
    });
    return row;
  }

  function renderGroup(g) {
    var w = h("section", { cls: "grp" });
    var head = h("p", { cls: "gh" }, h("b", { text: g.title + ". " }), h("i", { text: g.lines[0] }));
    w.appendChild(head);
    for (var i = 1; i < g.lines.length; i++) w.appendChild(h("p", { cls: "gl", text: g.lines[i] }));
    if (g.kind === "tfng") {
      var lg = h("div", { cls: "legend" });
      D.legend.forEach(function (l) { lg.appendChild(h("div", { cls: "lr" }, h("b", { text: l[0] }), h("i", { text: l[1] }))); });
      w.appendChild(lg);
    }
    if (g.kind === "multi") return renderMulti(g, w);
    if (g.kind === "head") return renderHead(g, w);
    if (g.tbl || g.flow) return renderCells(g, w);
    g.items.forEach(function (it) {
      var slot = h("div", { cls: "qi" });
      function draw() {
        slot.innerHTML = "";
        var n = it[0];
        if (g.kind === "fill") {
          var parts = it[1].split("{}"), line = h("div", { cls: "qt" }, numTile(n), h("span", { text: parts[0] }));
          var inp = h("input", { cls: "gap", type: "text", autocomplete: "off", spellcheck: "false", "aria-label": "Answer " + n });
          inp.value = state.ans[n] || "";
          if (!TEACH && locked(n)) inp.disabled = true;
          inp.addEventListener("input", function () { state.ans[n] = inp.value; updateTiles(); });
          if (TEACH) {
            inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { state.chk[n] = true; draw(); updateTiles(); } });

    bl.style.display = word ? "" : "none"; bh.style.display = inf ? "" : "none"; bc.style.display = inf && overlaps(inf) ? "" : "none";
    selb.removeAttribute("hidden");
    selb.style.left = Math.max(8, Math.min(innerWidth - 270, rect.left)) + "px"; selb.style.top = Math.max(60, rect.top - 44) + "px";
  }
  ["mouseup", "touchend"].forEach(function (ev) { document.addEventListener(ev, function () { setTimeout(checkSel, 20); }); });
  document.addEventListener("mousedown", function (e) {
    if (!selb.contains(e.target)) hideSel();
    if (!fcard.contains(e.target) && !fcard.hasAttribute("hidden")) hideCard();
  });
  selb.addEventListener("mousedown", function (e) { e.preventDefault(); });
  bl.addEventListener("click", function () {
    var w = selWord, rect = selRect; hideSel(); if (!w) return;
    state.nview = "notes"; if (state.npEl.hasAttribute("hidden")) toggleNotes(); else if (state.npEl.querySelector(".npb.nn") == null) renderNotes();
    delete state.dis[w]; lookup(w, true).then(function () { showCard(w, rect); });
  });
  bh.addEventListener("click", function () { if (selHl) setHl(selHl, true); });
  bc.addEventListener("click", function () { if (selHl) setHl(selHl, false); });
  /* each explicit look-up also adds a row to "My words" (pos, ipa, meaning, pronunciation) */
  ICON.spk = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  state.words = {};
  function speak(w) { try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(w); u.lang = "en-US"; u.rate = 0.9; speechSynthesis.speak(u); } catch (e) { } }
  function wlist() { return state.words[state.p] || (state.words[state.p] = []); }
  function addWords(w, r) {
    var rows = (r && r.length) ? r.map(function (e) { return { word: e.word, pos: e.pos || "", ipa: e.ipa || "", meaning: e.meaning || "" }; }) : [{ word: w, pos: "", ipa: "", meaning: "" }];
    var L = wlist(); rows.forEach(function (x) { if (!L.some(function (y) { return y.word.toLowerCase() === x.word.toLowerCase() && y.pos === x.pos; })) L.push(x); });
    state.dis[w] = 1; scheduleSave(); drawWords();
  }
  var POS = ["noun", "verb", "adjective", "adverb", "preposition", "pronoun", "conjunction", "phrase"];
  function drawWords() {
    var box = document.getElementById("npw"); if (!box) return; box.innerHTML = "";
    var L = wlist(); if (!L.length) box.appendChild(h("div", { cls: "none", text: "Words you look up appear here." }));
    L.forEach(function (x, i) {
      var sel = h("select", { "aria-label": "Part of speech of " + x.word });
      var opts = POS.slice(); if (x.pos && opts.indexOf(x.pos) < 0) opts.push(x.pos);
      sel.appendChild(h("option", { value: "", text: "Word class" }));
      opts.forEach(function (o) { var op = h("option", { value: o, text: o }); if (o === x.pos) op.selected = true; sel.appendChild(op); });
      sel.addEventListener("change", function () { x.pos = sel.value; x.added = false; scheduleSave(); drawWords(); });
      var mi = h("input", { cls: "wmi", type: "text", placeholder: "Meaning", autocomplete: "off", spellcheck: "false", value: x.meaning || "", "aria-label": "Meaning of " + x.word });
      mi.addEventListener("input", function () { x.meaning = mi.value; x.added = false; scheduleSave(); });
      var add = h("button", { cls: "ib bare", title: x.added ? "In notebook" : "Add to notebook", "aria-label": "Add " + x.word + " to notebook", text: x.added ? "✓" : "+" });
      if (x.added) add.disabled = true; else add.addEventListener("click", function () {
        add.disabled = true; add.textContent = "…";
        rpc("student_vocab_add", { p_student_code: state.code, p_word: x.word, p_pos: x.pos || "", p_ipa: x.ipa || null, p_meaning: x.meaning || null, p_file_key: FILEKEY })
          .then(function () { x.added = true; state.nb = null; scheduleSave(); drawWords(); }).catch(function () { add.disabled = false; add.textContent = "!"; });
      });
      box.appendChild(h("div", { cls: "wr" },
        h("button", { cls: "ib bare", title: "Listen", "aria-label": "Listen to " + x.word, html: ICON.spk, onclick: function () { speak(x.word); } }),
        h("span", { cls: "ww", text: x.word }), sel, add,
        h("button", { cls: "ib bare wx", text: "×", title: "Remove", "aria-label": "Remove " + x.word, onclick: function () { L.splice(i, 1); scheduleSave(); drawWords(); } }),
        h("span", { cls: "wi", text: x.ipa }), mi));
    });
  }
  var lookup0 = lookup;
  lookup = function (w, count) { return lookup0(w, count).then(function (r) { if (count) addWords(w, r); return r; }); };

  /* suggestions while typing in the look-up bar */
  function attachSuggest(lk, getGo) {
    var inp = lk.querySelector("input"); if (!inp) return;
    lk.style.position = "relative";
    var sg = h("div", { id: "npsg", hidden: "hidden" }); lk.appendChild(sg);
    var tmr = null;
    function hide() { sg.setAttribute("hidden", "hidden"); sg.innerHTML = ""; }
    inp.addEventListener("input", function () {
      clearTimeout(tmr); var q = inp.value.trim();
      if (q.length < 2 || !state.code) { hide(); return; }
      tmr = setTimeout(function () {
        rpc("student_vocab_suggest", { p_student_code: state.code, p_q: q }).then(function (r) {
          if (inp.value.trim() !== q) return; sg.innerHTML = "";
          (Array.isArray(r) ? r : []).forEach(function (e) {
            sg.appendChild(h("button", { cls: "sgi", onclick: function () { inp.value = e.w; hide(); getGo()(); } },
              h("span", { cls: "sgw", text: e.w }), h("span", { cls: "sgp", text: e.pos || "" }), h("span", { cls: "sgm", text: e.meaning || "" }), h("span", { cls: "sgn", text: e.in_notebook ? "✓" : "" })));
          });
          if (sg.childNodes.length) sg.removeAttribute("hidden"); else hide();
        }).catch(hide);
      }, 200);
    });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") hide(); });
    inp.addEventListener("blur", function () { setTimeout(hide, 250); });
  }
  /* look-up bar on top, notes below */
  var renderNotes0 = renderNotes;
  renderNotes = function () {
    renderNotes0(); var b = state.npEl && state.npEl.querySelector(".npb.nn"); if (!b) return;
    var lk = b.querySelector(".lk"); if (lk) b.insertBefore(lk, b.firstChild);
    var w = h("div", { id: "npw", cls: "wl" }); if (lk) { lk.after(w); attachSuggest(lk, function () { return state.goLookup; }); var sp = stripEl(stepCards(state.p)); w.after(sp); } drawWords();
  };


  /* ---------- teacher's notes per question (sent from the In-class page) ---------- */
  var TNS = {}, tnMo = null, tnBusy = false, tnSig = "";
  function tnDecor() {
    var qs = document.getElementById("qs"); if (!qs || tnBusy) return; tnBusy = true; if (tnMo) tnMo.disconnect();
    [].forEach.call(qs.querySelectorAll(".tnq"), function (e) { e.remove(); });
    [].forEach.call(qs.querySelectorAll(".qn"), function (t) {
      var n = parseInt((t.id || "").slice(1), 10); if (!n) return; var it = TNS["q" + n]; if (!it || !it[0] || !it[0].note) return;
      var host = t.closest(".qt,.hrow,.qcell"); if (!host) return;
      var el = h("div", { cls: "tnq" }, h("b", { text: "Teacher: " }), document.createTextNode(it[0].note));
      if (host.classList.contains("qcell")) { var g = t.closest(".grp"); if (g) g.appendChild(el); }
      else if (host.classList.contains("hrow")) host.parentNode.insertBefore(el, host.nextSibling);
      else { var qi = t.closest(".qi"); (qi || host.parentNode).appendChild(el); }
    });
    if (!tnMo) tnMo = new MutationObserver(function () { if (tnBusy) return; clearTimeout(tnMo.t); tnMo.t = setTimeout(tnDecor, 30); });
    tnMo.observe(qs, { childList: true, subtree: true });
    tnBusy = false;
  }
  function tnPoll() {
    if (!state.code || document.visibilityState !== "visible") return;
    rpc("student_notes", { p_student_code: state.code, p_assignment_code: D.code }).then(function (r) {
      var m = {}; (r || []).forEach(function (x) { m[x.ref] = x.items || []; });
      var sig = JSON.stringify(m); if (sig === tnSig) return; tnSig = sig; TNS = m; tnDecor();
    }).catch(function () { });
  }
  setInterval(tnPoll, 6000);

  /* ---------- boot ---------- */
  function boot() {
    var fs = parseFloat(store("fs") || "18"); document.documentElement.style.setProperty("--fs", fs + "px");
    var tabs = h("nav", { cls: "tabs" });
    D.passages.forEach(function (P, i) { tabs.appendChild(h("button", { cls: "tab" + (i === 0 ? " on" : ""), text: "Passage " + P.id, onclick: function () { state.p = i; paint(); } })); });
    var tools = h("div", { cls: "tools" }, h("span", { id: "sv", cls: "who2" }), h("span", { id: "who", cls: "who2" }),
      h("button", { cls: "fsb", text: "A−", title: "Smaller text", onclick: function () { fontStep(-1); } }),
      h("button", { cls: "fsb", text: "A+", title: "Larger text", onclick: function () { fontStep(1); } }));
    if (TEACH) {
      tools.appendChild(ibtn("book", "Show or hide new words", function (e) { state.vocab = !state.vocab; e.currentTarget.classList.toggle("off", !state.vocab); renderPassage(); }));
      tools.appendChild(ibtn("reset", "Start again", reset));
    } else tools.appendChild(ibtn("tick", "Submit this passage", submit, "dark"));
    if (!TEACH) tools.appendChild(ibtn("reset", "Retake the whole test", retakeAll));
    tools.appendChild(ibtn("undo", "Undo highlight", function () { undoHl(); }, "off"));
    tools.appendChild(ibtn("note", "Student's notes", toggleNotes));
    tools.appendChild(ibtn("full", "Full screen", function () {
      try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { }
    }, "hide-m"));
    $("#hd").appendChild(h("div", { cls: "brand", text: D.title })); $("#hd").appendChild(tabs); $("#hd").appendChild(tools);
    var mv = h("div", { cls: "mv" }); ["p", "q"].forEach(function (v) { mv.appendChild(h("button", { cls: "mvb" + (v === "p" ? " on" : ""), "data-v": v, text: v === "p" ? "Passage" : "Questions", onclick: function () { setView(v); } })); });
    $("#hd").appendChild(mv); $("#main").setAttribute("data-v", "p");
    setupSplit(); if (TEACH) setupVocab(); buildNotes();
    paint();
    if (!TEACH) login();
  }
  document.addEventListener("DOMContentLoaded", boot);
})();
