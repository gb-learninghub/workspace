<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test 06 - Listening - Lesson</title><style>:root{--ink:#1B1D22;--mut:#6b7078;--line:#E4E6EA;--panel:#F4F5F7;--gold:#e5c16b;--dark:#16181D}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Aptos,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fff;font-size:17px}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:56px 1fr;height:100dvh}
#hd{display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--dark);color:#fff}
#hd h1{font-size:18px;margin:0;flex:1}
.ib{width:40px;height:40px;border:0;border-radius:12px;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
#hd .ib{color:#fff}#hd .ib:hover{background:#2a2d35}
.ib:disabled{opacity:.35}
#main{display:grid;grid-template-columns:1fr 1fr;min-height:0}
#left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
#au{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#au input[type=range]{flex:1;accent-color:#111;min-width:60px}
#au .tm{font-size:14px;color:var(--mut);min-width:84px;text-align:center}
#au .sp{border:0;background:#fff;border-radius:999px;height:36px;padding:0 12px;font-weight:700;cursor:pointer;border:1.5px solid var(--line)}
#script{flex:1;overflow:auto;padding:14px 22px 40px}
.sdesc{color:var(--mut);font-size:15px;margin:0 0 12px;font-style:italic}
.blk{display:flex;gap:10px;margin:0 0 12px;line-height:1.65}
.blk .who{flex:none;width:26px;font-weight:800}
.ss{cursor:pointer;border-radius:3px}
.ss.sel{background:#fff1b8}.ss.sel.ok{background:#dff2e3}
.ss.evs{background:#ffd9a0}
.hidn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%;color:var(--mut);text-align:center;padding:30px}
.hidn .big{width:56px;height:56px;border-radius:50%;background:var(--panel)}
mark.vw{background:#e8eefc;color:inherit;border-radius:3px;padding:0 2px;border-bottom:2px solid #7d93d6;cursor:pointer}
#right{padding:6px 18px 8px;overflow:auto;min-height:0}
.stbar{display:flex;align-items:center;gap:6px;margin:6px 0 2px}
.sd{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.sd.on{background:#111;color:#fff;border-color:#111}.sd.dn:not(.on){background:#e3f3e6;border-color:#2e7d4f}
.step{padding:0 2px 4px}
.trylab{display:inline-block;margin:6px 0 0;padding:3px 12px;border-radius:999px;background:#111;color:#fff;font-weight:700;font-size:14px}
.step h3{font-size:18px;margin:6px 0 0}
.tq{font-size:16px;padding:2px 0 4px;margin:2px 0 0;border-bottom:1px solid var(--line)}
.gl{margin:2px 0 0;padding-left:22px}
.gl>li{padding:5px 0;border-bottom:1px solid var(--line)}.gl>li:last-child{border-bottom:0}
.gt{font-size:16px;line-height:1.4;font-weight:700}
.act{margin:3px 0 0}
.note{display:inline-block;padding:4px 10px;border-radius:10px;background:#fff;border:1.5px dashed var(--line);font-size:14px;color:var(--mut)}
.note.set{border-style:solid;border-color:#c89a3a;color:var(--ink);background:#fff8e1}
.kwline{display:flex;align-items:baseline;font-size:16px;line-height:1.55}
.kwline b{flex:none;min-width:30px;margin-right:6px}.kwl{flex:1}
.kwd{cursor:pointer;padding:2px 1px;border-radius:4px}
.kwd.on{background:#ffe9a8;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.kgap{letter-spacing:1px}
.ob{display:flex;gap:8px;flex-wrap:wrap}
.pill{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.pill.on{background:#111;color:#fff;border-color:#111}
.ol2{display:flex;flex-direction:column;gap:2px}
.or{display:flex;gap:8px;align-items:center;text-align:left;min-height:32px;padding:4px 10px;border-radius:12px;border:0;background:transparent;cursor:pointer;font-size:16px}
.or b{flex:none;min-width:34px}.or.on{background:#eef0f3}
.tbl{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;font-size:15px}
.tbl div{display:flex}.tbl div>span{padding:6px 10px;flex:1}.tbl div>span:first-child{flex:none;width:130px;font-weight:700;background:var(--panel)}
.gap{font:inherit;font-size:16px;border:0;border-bottom:2px solid #111;background:var(--panel);padding:6px 10px;width:100%;border-radius:6px 6px 0 0;outline:none}
.chkrow{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.chkb:disabled{opacity:.35}
.trapb{border:0;background:transparent;font-size:14px;font-weight:700;color:var(--mut);padding:8px 0;cursor:pointer}.trapb.on{color:var(--ink)}
.traps{margin:0 0 4px;padding-left:20px;font-size:14px;line-height:1.4}
.fbk{flex:1;margin:0 8px;padding:6px 12px;border-radius:12px;background:#fbeaea;font-size:14px;line-height:1.35}
.icx{margin:4px 0 0;padding:8px 14px;border-radius:14px}
.icx.ok{background:#e8f5ea}.icx.bad{background:#fbeaea}
.icx>div:first-child{font-size:16px}.icev{margin-top:2px;color:#3a3d44;font-size:14px;line-height:1.45}
.ice{display:inline-flex;align-items:center;gap:6px;height:32px;border-radius:16px;padding:0 12px;margin-top:6px;font-size:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.ice.on{background:#ffd9a0;border-color:#e0a24a}
.step.done .gl,.step.done .traps,.step.done .chkrow{display:none}
.icx .trapb{display:block;padding:8px 0 0}
#np{position:fixed;top:56px;right:0;bottom:0;width:380px;background:#fff;border-left:1px solid var(--line);z-index:20;display:flex;flex-direction:column}
#np[hidden]{display:none}
.nph{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-weight:800}.nph span{flex:1}
.npb{flex:1;overflow:auto;padding:8px 14px}
.npm{font-size:14px;color:var(--mut);margin-bottom:6px}
.vr{display:grid;grid-template-columns:40px 1fr auto;gap:2px 8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.vr.flash{background:#fff6d6}
.vr .vw{font-weight:700}.vr .vp{font-size:13px;color:var(--mut);margin-left:6px}.vr .vm{grid-column:2/4;font-size:15px}
.vadd{margin:4px 0 8px}
@media(max-width:900px){#main{grid-template-columns:1fr;grid-template-rows:45% 55%}#right{overflow:auto}#np{width:100%}}
.wyh{margin:4px 0 0;font-size:14px;line-height:1.3}
.wc{border:0;background:#e8eefc;border-radius:999px;padding:3px 10px;margin:2px 3px 2px 0;font-size:14px;cursor:pointer}
.wc.on{background:#111;color:#fff}
.wd{margin:3px 0 0;padding:2px 10px;background:var(--panel);border-radius:10px;font-size:14px}
.step.done .wyh{display:none}
.wd{display:flex;align-items:center;gap:6px}.wsp{width:26px;height:26px;border-radius:50%;background:#fff}
.pill{min-height:30px;padding:0 10px;font-size:14px}.ob{gap:6px}.gl>li{padding:4px 0}.gt{font-size:15px}.kwline{font-size:15px;line-height:1.4}
.phs{margin:6px 0 2px}.step.done .phs{display:none}
.pill.ok{background:#e3f3e6;border-color:#2e7d4f}.pill.bad{background:#fbeaea;border-color:#c0392b}.pur{font-size:13.5px;line-height:1.35;color:var(--mut);margin:4px 0 2px}.pur b{color:var(--ink)}.step.done .pur{display:none}
.trylab{margin:2px 0 0}.step h3{font-size:17px;margin:3px 0 0}.stbar{margin:2px 0 0}.kwline{line-height:1.3}.gl>li{padding:3px 0}.pur{margin:2px 0 0}
.pill.on.ok,.pill.on.bad{color:var(--ink)}
.sd{width:auto;min-width:40px;padding:0 12px}.icx{line-height:1.45}
</style></head><body><div id="app"><div id="hd"></div><div id="main"><div id="left"><div id="au"></div><div id="script"></div></div><div id="right"></div></div></div><div id="np" hidden></div><audio id="aud" preload="none"></audio><script>window.DATA={"mode": "teaching", "title": "Test 06 - Listening - Lesson", "code": "IELTS06-Listening-Lesson", "fileKey": "ielts/w11/ielts06-listening-lesson.html", "sb": {"url": "https://bumaiagvgpewhvczgwio.supabase.co", "key": "sb_publishable_B563fC34wnTDCGSZv29euw_6P3mFRs5"}, "audioBase": "https://bumaiagvgpewhvczgwio.supabase.co/storage/v1/object/public/audio/", "parts": [{"label": "Part 1", "audio": "ielts/Practice%20Test%2006/Practice%20Test%2006%20-%20Listening%20-%20Part%201.mp3", "desc": "A conversation between two students, Harry and Andrea, who have just finished their final exams", "blocks": [{"sp": "H", "sents": [{"i": 0, "t": "Hi Andrea, how are you feeling now that exams are over?"}]}, {"sp": "A", "sents": [{"i": 1, "t": "It’s fantastic to have finished, isn’t it, and to sleep in every morning!"}, {"i": 2, "t": "What about you?"}]}, {"sp": "H", "sents": [{"i": 3, "t": "Well, I’ve been catching up on sleep, too."}, {"i": 4, "t": "But I’ve got a lot to do before I leave for England."}, {"i": 5, "t": "Perhaps you could give me some advice?"}, {"i": 6, "t": "I've got a lot of things I can’t possibly take back with me but I don’t know what to do with them."}]}, {"sp": "A", "sents": [{"i": 7, "t": "Well, it depends on what sort of things they are and whether you’re thinking of giving them away or selling them."}]}, {"sp": "H", "sents": [{"i": 8, "t": "Well, almost everything - furniture, the fridge and other kitchen stuff that I bought from the previous tenant, but the new people have already got what they need so they’re not interested in buying stuff from me."}, {"i": 9, "t": "I can’t afford to give it away but I’m not sure how to sell it all."}, {"i": 10, "t": "Oh, and there are some clothes and books as well."}]}, {"sp": "A", "sents": [{"i": 11, "t": "Why can’t you take them?"}]}, {"sp": "H", "sents": [{"i": 12, "t": "The books are really heavy - it’s so expensive if you exceed the airline baggage allowance."}, {"i": 13, "t": "And the clothes just won’t all fit in my suitcase, it’s amazing how much stuff I’ve accumulated since I’ve been here."}, {"i": 14, "t": "Anyway I don’t think I’ll need as many summer clothes in England as I have here in Australia!"}]}, {"sp": "A", "sents": [{"i": 15, "t": "I see."}, {"i": 16, "t": "Well, there are several alternatives."}, {"i": 17, "t": "First of all, you could put up notices around the university about the books - you know on the notice-boards in the student union building, and in the economics department, anywhere second and third year students will see them."}, {"i": 18, "t": "People are always keen to buy cheap textbooks."}]}, {"sp": "H", "sents": [{"i": 19, "t": "OK."}, {"i": 20, "t": "What should I say on the notices?"}]}, {"sp": "A", "sents": [{"i": 21, "t": "Just put the titles, authors and price you want ... your name of course, and maybe put your phone number on those little tear off tags."}]}, {"sp": "H", "sents": [{"i": 22, "t": "That’s a good idea."}, {"i": 23, "t": "And what about the furniture?"}]}, {"sp": "A", "sents": [{"i": 24, "t": "You could try doing the same thing, but usually students are away all summer so they don’t want to buy furniture now."}, {"i": 25, "t": "Another place to try might be a second-hand shop."}, {"i": 26, "t": "Someone from the shop will usually come around and give you a free quote, and then you can decide."}, {"i": 27, "t": "But you don’t usually get much money for that sort of stuff."}]}, {"sp": "A", "sents": [{"i": 28, "t": "Another alternative is to put an advertisement in the Trading Post."}, {"i": 29, "t": "Do you know that paper?"}, {"i": 30, "t": "It comes out every week, advertising things people want to sell."}, {"i": 31, "t": "You have to pay to put the advert in and then hope people phone."}]}, {"sp": "", "sents": [{"i": 32, "t": "Give them as much information as possible and if they’re interested, invite them to come and have a look."}, {"i": 33, "t": "The hard part is agreeing on a price."}]}, {"sp": "H", "sents": [{"i": 34, "t": "No, I haven’t seen the Trading Post, but I should have a look at it, and I could advertise the fridge, the microwave, and the furniture."}, {"i": 35, "t": "But the kitchen stuff isn’t really that good -you know, old cutlery, a few pots and pans, and some plates and things."}, {"i": 36, "t": "What shall I do with them?"}]}, {"sp": "A", "sents": [{"i": 37, "t": "Well, another option is to donate the kitchen things to a charity shop, you know like the Salvation Army or St. Vincent de Paul."}, {"i": 38, "t": "Why don’t you get a second-hand shop to give you a quote first?"}]}, {"sp": "H", "sents": [{"i": 39, "t": "Yes, I could do that - find out how much they’ll give me and then decide whether to sell them or give them away."}, {"i": 40, "t": "But I’ve still got the clothes."}]}, {"sp": "A", "sents": [{"i": 41, "t": "A charity shop will take them too, as long as they’re in good condition."}, {"i": 42, "t": "And even though you don’t get any money at least you know that someone who really deserves some help has benefited."}]}, {"sp": "H", "sents": [{"i": 43, "t": "That’s a good point."}, {"i": 44, "t": "I’ll advertise the expensive stuff - the furniture - and donate the clothes and kitchen stuff."}, {"i": 45, "t": "Let’s go and buy a Trading Post and you can help me write the advert."}]}, {"sp": "A", "sents": [{"i": 46, "t": "Well, ... actually I’m interested in buying the fridge and the microwave, depending on the price of course."}]}, {"sp": "H", "sents": [{"i": 47, "t": "OK."}, {"i": 48, "t": "Let’s see how good you are at bargaining!"}]}]}, {"label": "Part 2", "audio": "ielts/Practice%20Test%2006/Practice%20Test%2006%20-%20Listening%20-%20Part%202.mp3", "desc": "A phone conversation giving information about a health and fitness centre", "blocks": [{"sp": "H", "sents": [{"i": 0, "t": "Hello."}]}, {"sp": "C", "sents": [{"i": 1, "t": "Hello."}, {"i": 2, "t": "Is that Ms. Heidi Jones?"}]}, {"sp": "H", "sents": [{"i": 3, "t": "Yes."}]}, {"sp": "C", "sents": [{"i": 4, "t": "Good morning Ms. Jones, I’d like to take a few minutes of your time to tell you about the Sevenoaks Health and Fitness Centre which is in your suburb."}, {"i": 5, "t": "Would that be convenient?"}]}, {"sp": "H", "sents": [{"i": 6, "t": "OK."}]}, {"sp": "C", "sents": [{"i": 7, "t": "Well, the centre’s not far from you, it’s on the corner of Marion St. and Giles St., and has a large car park."}, {"i": 8, "t": "It’s open every day of the week, opening on weekdays at 6 am and at 9 am at the weekend."}, {"i": 9, "t": "It closes at 9:30 pm Monday to Friday, and on Saturday at 4 pm and Sunday at 2 pm."}, {"i": 10, "t": "We also have childcare, Monday to Saturday from nine in the morning until midday for a small extra charge, so you can leave your children in safe hands while you attend one of our classes, or perhaps have a swim, or if you just want to relax in the spa and sauna or steam room."}]}, {"sp": "", "sents": [{"i": 11, "t": "Talking of classes we have a very wide range which are designed to suit all different levels of fitness and individual needs."}, {"i": 12, "t": "I mentioned the pool just now; well, in addition to swimming laps or just relaxing we also offer aqua aerobic classes, which are 45 minute classes that use the therapeutic effects of water."}, {"i": 13, "t": "This provides a very safe and effective exercise and is suitable for all fitness levels, as well as being a lot of fun."}, {"i": 14, "t": "Many people who haven’t been exercising for a while start in the aqua classes, as do people who need to take care after hospital surgery for example."}]}, {"sp": "", "sents": [{"i": 15, "t": "These classes are very popular and are scheduled every weekday, Monday to Friday and on Saturday afternoon and Sunday morning."}, {"i": 16, "t": "Another very popular activity in the pool area is learning to swim, and these swimming classes are held at 4 pm every weekday and in the mornings at the weekend."}, {"i": 17, "t": "By the way, they’re open to both adults and children of any age."}, {"i": 18, "t": "Now it would take too much of your time to tell you in detail about all our programs as we have a very wide range of activities at different times, however, I’ll just outline some of them."}]}, {"sp": "", "sents": [{"i": 19, "t": "Our super-circuit classes are extremely popular and you get a good aerobic workout while toning your muscles."}, {"i": 20, "t": "They’re easy to learn, as you combine using hydraulic equipment with exercises guaranteed to give you a good cardio-workout."}, {"i": 21, "t": "The teachers are very good and there’s a fun atmosphere."}, {"i": 22, "t": "And the classes are very effective in assisting weight loss, relieving stress, lowering blood pressure and generally increasing fitness."}]}, {"sp": "", "sents": [{"i": 23, "t": "Oh, and I haven’t mentioned our range of aerobic and step classes of different types which suit all levels."}, {"i": 24, "t": "Our specially designed aerobics room holds over 55 people, and our highly qualified and trained staff can advise you as to which class might suit you."}, {"i": 25, "t": "We are inviting you to a free one week trial period when you can come and try any of the classes or activities before you make the decision to join."}, {"i": 26, "t": "By the way, there is also a large and very well-equipped gym, where we offer free fitness assessments and you can have an individual program designed just for you."}]}, {"sp": "", "sents": [{"i": 27, "t": "Also the cardio-vascular room has the latest range of machines which help you burn fat, increase your fitness or just warm up."}, {"i": 28, "t": "They’re very popular as you can forget all about the calorie burning by watching your favourite music videos on TV while you exercise!"}, {"i": 29, "t": "Right now we have a very special new member joining fee offer, which allows two memberships for the price of one, a real bargain!"}, {"i": 30, "t": "So if you can, bring along a friend who’d like to get fit as well, in time for summer."}]}, {"sp": "", "sents": [{"i": 31, "t": "Come along and try us out."}, {"i": 32, "t": "You can meet the staff, try out some of the classes for a week, absolutely free, and then if you like us, sign up for only $110 each for six months."}, {"i": 33, "t": "Thanks for taking the time to learn about the Centre and I hope we’ll see you there soon, Heidi."}, {"i": 34, "t": "I’ll put one of our brochures in the mail for you right now."}]}, {"sp": "", "sents": [{"i": 35, "t": "Bye for now ... ."}]}]}, {"label": "Part 3", "audio": "ielts/Practice%20Test%2006/Practice%20Test%2006%20-%20Listening%20-%20Part%203.mp3", "desc": "Two business studies students, Evelyn and Mark, preparing for a seminar presentation", "blocks": [{"sp": "E", "sents": [{"i": 0, "t": "Well, I think the marketing of food would be a good topic."}, {"i": 1, "t": "I read a very interesting article the other day about the Canadian food market."}]}, {"sp": "M", "sents": [{"i": 2, "t": "Mm... I suppose everybody’s interested in food, even if it’s trying NOT to eat."}, {"i": 3, "t": "Why Canada?"}, {"i": 4, "t": "I know that’s where you come from, but isn’t it just all North America really?"}]}, {"sp": "E", "sents": [{"i": 5, "t": "No, that’s why I thought this article was interesting."}, {"i": 6, "t": "Although lots of US companies are well established in Canada, and vice versa, there are still subtle differences between the two markets."}, {"i": 7, "t": "It says here 'the Canadian market is definitely not a northern clone of the US’."}, {"i": 8, "t": "I like that."}, {"i": 9, "t": "And it says that if you understand these differences, it can have a big impact on successful food marketing."}]}, {"sp": "M", "sents": [{"i": 10, "t": "So I know that Canada has a big French-speaking population in Quebec, is this what they’re referring to?"}]}, {"sp": "E", "sents": [{"i": 11, "t": "Not only French and English speakers, there are many different ethnic groups in Canada."}, {"i": 12, "t": "It’s really quite multicultural."}, {"i": 13, "t": "For example, Toronto has large Asian and Italian populations, and Vancouver’s got a large Asian population, too."}, {"i": 14, "t": "And because Canada’s population is small, these groups make quite an impact, introducing new styles of cooking."}]}, {"sp": "", "sents": [{"i": 15, "t": "So you can see lots of unfamiliar vegetables and things in the markets and new restaurants are opening every day."}, {"i": 16, "t": "It’s great if you love trying out new foods, as many people do!"}]}, {"sp": "M", "sents": [{"i": 17, "t": "Which kinds of food are becoming popular?"}]}, {"sp": "E", "sents": [{"i": 18, "t": "Well, some Asian food I’d say has been popular for quite a while like Chinese, but now South East Asian restaurants are becoming very fashionable."}, {"i": 19, "t": "Then there’s Mediterranean of course, such as Greek, Italian and so on, but Caribbean and Mexican food is really taking off among young people these days."}]}, {"sp": "M", "sents": [{"i": 20, "t": "So are the supermarkets starting to stock the ingredients that are needed to prepare these foods at home, you know, all those unusual condiments and sauces?"}]}, {"sp": "E", "sents": [{"i": 21, "t": "Yes, that’s right, it’s quite interesting going to the supermarket, isn’t it, and noticing how they’re introducing sections for foods of different nationalities - you can buy quite exotic products locally these days."}, {"i": 22, "t": "The article mentioned that 80% of the Canadian retail market is controlled by eight major national supermarket chains, so that when they introduce changes they can happen quite rapidly."}]}, {"sp": "M", "sents": [{"i": 23, "t": "OK, well, how are we going to organise this seminar then?"}]}, {"sp": "E", "sents": [{"i": 24, "t": "I made some notes on the trends in the Canadian market, about changing tastes and also patterns for where food is consumed."}, {"i": 25, "t": "I thought maybe we could summarise it into a chart or table and maybe use the overhead projector to present it."}]}, {"sp": "M", "sents": [{"i": 26, "t": "Good idea."}, {"i": 27, "t": "Maybe I could have a look for similar trends and tastes in Australia and the UK, for comparison."}, {"i": 28, "t": "Let’s have a look at what you found."}]}, {"sp": "E", "sents": [{"i": 29, "t": "The most significant trend it seemed to me, was that Canadians are definitely interested in healthy food."}, {"i": 30, "t": "For example, did you know that salads are the third most commonly eaten food in Canadian restaurants?"}]}, {"sp": "M", "sents": [{"i": 31, "t": "Really!"}, {"i": 32, "t": "What about organic food then, is that becoming more popular?"}]}, {"sp": "E", "sents": [{"i": 33, "t": "Yes, it’s definitely moving into the mainstream, compared to a few years ago."}, {"i": 34, "t": "And, a recent survey showed that 4 out of 5 shoppers said that they check the fat and nutritional information on the packet when they are deciding what to buy."}]}, {"sp": "M", "sents": [{"i": 35, "t": "What other trends did you find out?"}]}, {"sp": "E", "sents": [{"i": 36, "t": "There’s one change I noticed straight away when I was home last year, in the meat department."}, {"i": 37, "t": "You know here the meat packaging says 'rump steak’ or 'forequarter chops’ and so on?"}, {"i": 38, "t": "Well, they discovered that most consumers these days didn’t know what to do with these roasts, and rounds and ribs, so the government approved a new naming system for cuts of meat, which is related to the required cooking technique."}]}, {"sp": "M", "sents": [{"i": 39, "t": "What a good idea."}, {"i": 40, "t": "I’ve never really understood the difference between sirloin, rump, round and all those names."}, {"i": 41, "t": "So how many new categories are there?"}]}, {"sp": "E", "sents": [{"i": 42, "t": "Eight."}, {"i": 43, "t": "There are three kinds of steak - for grilling, for marinating and for simmering, and then there’s what they call 'quick serve’ beef, for stir fries I suppose, and premium oven roast, oven roast, pot roast and stewing beef."}, {"i": 44, "t": "It’s a great idea, isn’t it?"}, {"i": 45, "t": "I hope it catches on here."}]}, {"sp": "M", "sents": [{"i": 46, "t": "I agree!"}, {"i": 47, "t": "Any other trends that you thought were significant?"}]}, {"sp": "E", "sents": [{"i": 48, "t": "Well, what’s really interesting is what the article called 'mobile meals’."}, {"i": 49, "t": "In other words, more and more Canadians are eating meals away from home, but NOT just eating more junk food."}, {"i": 50, "t": "They are projecting a 40% increase in snack food sales over the next three years and the growth is coming from healthy snacks - you know the ones that have less cholesterol and fat, such as muesli bars, health food bars and those types of products."}, {"i": 51, "t": "Apparently in the food marketing jargon they are called 'nutritious portable foods’ which means healthy snacks!"}, {"i": 52, "t": "The other major trend is that young people are doing more of the food shopping these days so marketing has to be aimed more at them, as well as more conventionally at the mother."}]}, {"sp": "M", "sents": [{"i": 53, "t": "Thanks Evelyn, I think we’ll have an interesting discussion about these trends and the comparisons with other English speaking countries."}, {"i": 54, "t": "I’ll see if I can get some information about them to compare with yours, and meet you on Friday to put it together."}]}, {"sp": "E", "sents": [{"i": 55, "t": "See you then, bye."}]}]}, {"label": "Part 4", "audio": "ielts/Practice%20Test%2006/Practice%20Test%2006%20-%20Listening%20-%20Part%204.mp3", "desc": "A talk about public speaking", "blocks": [{"sp": "", "sents": [{"i": 0, "t": "Good afternoon everybody and welcome to the first in a series of talks we have arranged for the Overseas Students’ Association this semester."}, {"i": 1, "t": "Doctor James has very kindly agreed to speak to us today on the topic of public speaking, and judging from the large numbers of you here it is clearly a subject of great interest and relevance."}, {"i": 2, "t": "Dr. James."}, {"i": 3, "t": "Hello."}]}, {"sp": "", "sents": [{"i": 4, "t": "It’s good to see so many of you here and hopefully what I’m going to tell you will be useful to you both here at the University and in your future employment."}, {"i": 5, "t": "Many people avoid speaking publicly, by which I mean in front of say 10 or more people, not because they lack the ability but mainly because they lack confidence which is really only due to lack of practice."}, {"i": 6, "t": "Today, as a consequence of the influence of television, audiences expect speakers to be relatively brief and to the point, in addition to being well informed and interesting or entertaining."}, {"i": 7, "t": "Probably the most important part of public speaking is what you do beforehand, by which I mean preparation."}]}, {"sp": "", "sents": [{"i": 8, "t": "This includes practical details such as knowing precisely what your topic is and exactly how long you are expected to talk for."}, {"i": 9, "t": "You should also plan the content thoroughly."}, {"i": 10, "t": "A good strategy is to write out the content as you intend to say it and then make brief notes, preferably on small cards, which you use to talk from."}, {"i": 11, "t": "This way, you sound more natural, you incorporate pauses while you look at your notes and you can then look at your audience while you are speaking."}]}, {"sp": "", "sents": [{"i": 12, "t": "Never read your speech without looking at the audience."}, {"i": 13, "t": "Eye contact is a very important part of communicating with an audience; so deliberately move your head and look around at your audience."}, {"i": 14, "t": "Pauses are important as most people when they are nervous tend to rush through their speech."}, {"i": 15, "t": "Practise speaking slowly, this gives you more time to pronounce your words correctly."}]}, {"sp": "", "sents": [{"i": 16, "t": "It’s always easier for your audience to listen to someone whose speaking is clear and calmly paced so that they can understand the ideas being explained."}, {"i": 17, "t": "And the bigger the group, the more slowly you should speak."}, {"i": 18, "t": "Remember to project your voice, speaking clearly to the person furthest away from you."}, {"i": 19, "t": "It’s a good idea to rehearse and record yourself."}]}, {"sp": "", "sents": [{"i": 20, "t": "Pay attention to your intonation when you listen to yourself."}, {"i": 21, "t": "It’s even harder if you are speaking in a second language."}, {"i": 22, "t": "I would imagine, but there’s nothing worse than listening to a flat monotonous voice, so try to vary your tone and rhythm."}, {"i": 23, "t": "This will add meaning to your words."}]}, {"sp": "", "sents": [{"i": 24, "t": "Lastly, pay attention to both your posture and your gestures."}, {"i": 25, "t": "A confident person stands (or sits in a small group) with their head up, chin out and shoulders back; Try to avoid scratching or fiddling with your hair or beard, or pens, jewellery and so on."}, {"i": 26, "t": "These movements can distract and irritate your audience, yet you may be unaware of them yourself -another reason for rehearsing, preferably with feedback from a friend, or better still on video."}, {"i": 27, "t": "I hope these few tips will make your experience of speaking in public a little easier - remember 'practice makes perfect’!"}]}]}], "steps": [{"id": "s1", "p": 0, "mode": "Nghe và chọn đáp án", "title": "Trắc nghiệm (Multiple choice)", "ref": "Q4", "q": "Andrea thinks it is unlikely students will buy the furniture because …", "target": 24, "reveal": "C", "e": "Andrea nói sinh viên thường đi vắng cả mùa hè nên không muốn mua đồ nội thất lúc này. Đáp án C: it's the summer vacation.", "traps": ["Đáp án thường được paraphrase: 'away all summer' thành 'summer vacation'.", "Đáp án A và B có thể nghe được từ khóa nhưng không phải lý do Andrea nói."], "items": [{"ph": 0, "t": "Đọc hướng dẫn của đề bài.", "a": {"k": "note", "text": "You will hear a conversation between two students, Harry and Andrea, who have just finished their final exams."}}, {"ph": 0, "t": "Nghe 1–2 câu đầu của bài nghe.", "a": {"k": "note", "text": "Phát audio ở thanh phía trên."}}, {"ph": 0, "t": "Chủ đề của đoạn nghe là gì?", "a": {"k": "wtype", "ans": "Harry sắp về Anh, bàn cách bán hoặc cho đồ đạc", "bad": "chủ đề", "opts": ["Hai bạn lên kế hoạch du lịch Anh", "Harry sắp về Anh, bàn cách bán hoặc cho đồ đạc", "Andrea nhờ Harry giúp ôn thi"]}}, {"ph": 0, "t": "Có bao nhiêu người nói?", "a": {"k": "wtype", "ans": "2 người", "bad": "số người nói", "opts": ["1 người", "2 người", "Trên 2 người"]}}, {"ph": 1, "t": "Trước khi nghe: đọc câu hỏi và 3 đáp án, chạm để đánh dấu keyword.", "a": {"k": "kw", "lines": [["", "Andrea thinks it is unlikely students will buy the furniture because …"], ["A", "they're all doing the same thing."], ["B", "they live at home."], ["C", "it's the summer vacation."]]}}, {"ph": 1, "t": "nghe cả Part 1, chú ý từ đồng nghĩa với keyword. Phát audio ở thanh phía trên.", "a": {"k": "note", "text": "Phát audio Part 1, nghe một lần."}}, {"ph": 1, "t": "Sau khi nghe: mở script, chạm vào câu chứa lý do Andrea đưa ra.", "a": {"k": "sent", "bad": "câu trong script"}}, {"ph": 1, "t": "Sau khi nghe: chọn đáp án dựa trên câu đó.", "a": {"k": "choose", "ans": "C", "bad": "đáp án", "opts": [["A", "they're all doing the same thing."], ["B", "they live at home."], ["C", "it's the summer vacation."]]}}], "au": "SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//NYwAAAAAAAAAAAAEluZm8AAAAPAAAA3QAAfQQABAcJCw8RExYYGx4gIiUoKi0vMTU3OTw/QURGSExOUFNVWFtdX2JlZ2pscHJ0dnl8foGDhYmLjZCSlpianKCipaepra+xs7a5vL7AwsbIy83Q09XX2d3f4uTm6uzu8fP2+fv9AAAAAExhdmM2MC
