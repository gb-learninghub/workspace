a significant difference to the planet."], ["", "Environmental impact: Using excessive amounts of water can damage rivers and lakes and harm fish and (7) ______ aquatic animals. Every year, people (8) ______ thousands of liters of water unnecessarily by leaving taps running."], ["", "Practical tips:"], ["", "• Always turn off taps when you’re brushing your teeth or washing dishes. This can help (9) ______ water consumption significantly."], ["", "• (10) ______ using bottled water, invest in a reusable water bottle. This not only saves resources but also cuts down the (11) ______ of plastic waste produced."], ["", "• Sort your household waste carefully and place recyclable (12) ______ into appropriate bins."]], "range": [7, 12], "groups": [{"kind": "mcq", "step": "cloze", "title": "Questions 7-12", "lines": ["Read the following leaflet and mark the letter A, B, C, or D on your answer sheet to indicate the option that best fits each of the numbered blanks from 7 to 12."], "items": [[7, "", [["A", "the others"], ["B", "another"], ["C", "others"], ["D", "other"]]], [8, "", [["A", "throw away"], ["B", "bring up"], ["C", "let down"], ["D", "pass by"]]], [9, "", [["A", "decrease"], ["B", "shorten"], ["C", "increase"], ["D", "rise"]]], [10, "", [["A", "Because of"], ["B", "Despite of"], ["C", "Instead of"], ["D", "In addition to"]]], [11, "", [["A", "number"], ["B", "amount"], ["C", "quality"], ["D", "level"]]], [12, "", [["A", "resources"], ["B", "factors"], ["C", "items"], ["D", "substances"]]]]}]}, {"id": 3, "label": "Câu 13–17", "short": "13–17", "nop": true, "range": [13, 17], "groups": [{"kind": "mcq", "step": "order", "title": "Questions 13-17", "lines": ["Mark the letter A, B, C, or D on your answer sheet to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text in each of the following questions from 13 to 17."], "items": [[13, "a. Jack: I agree. Let’s meet at the café around 5 p.m.<br>b. Jack: Hi Sarah! Are you free tomorrow afternoon?<br>c. Sarah: Yes, Jack. Do you want to discuss the school project?", [["A", "c-b-a"], ["B", "c-a-b"], ["C", "a-b-c"], ["D", "b-c-a"]]], [14, "a. Tim: What movie should we watch?<br>b. Jane: Let’s do it this Saturday.<br>c. Jane: How about going to the cinema?<br>d. Jane: I heard the new sci-fi film is amazing. Let’s watch that one.<br>e. Tim: Sounds exciting!", [["A", "a-d-c-e-b"], ["B", "a-c-e-d-b"], ["C", "c-a-d-e-b"], ["D", "c-b-a-d-e"]]], [15, "Hello Emma,<br>a. I’m really excited about our upcoming trip next month, especially since it will be our first time traveling together to such a fascinating destination!<br>b. To avoid any last-minute stress, we should book our accommodation soon, perhaps within the next few days, to secure the best deals available.<br>c. Have you considered what specific attractions or landmarks you want to prioritize visiting during our stay?<br>d. It’s going to be absolutely wonderful exploring a completely new city together and discovering all the unique places it has to offer.<br>e. By the way, I’ve already done some preliminary research on hotels and managed to find several promising options with excellent reviews and reasonable prices.<br>Best regards,<br>Sophie", [["A", "a-d-c-e-b"], ["B", "d-a-e-c-b"], ["C", "a-c-b-d-e"], ["D", "d-c-e-b-a"]]], [16, "a. In addition, adhering to a balanced diet rich in nutrients and engaging in regular physical activity have been proven to significantly enhance one’s overall well-being and resilience.<br>b. As a result, maintaining an optimistic outlook, even during challenging circumstances, is considered essential to living a happier and more fulfilling life.<br>c. Recent scientific studies have consistently indicated that optimism not only improves mental health but can also positively impact physical health outcomes.<br>d. For example, individuals who demonstrate optimism are often observed to recover faster from illnesses and injuries compared to their more pessimistic counterparts.<br>e. In summary, integrating optimism with healthy lifestyle practices, including proper nutrition and consistent exercise routines, can greatly improve both mental and physical health.", [["A", "c-d-a-b-e"], ["B", "c-d-b-a-e"], ["C", "b-c-a-d-e"], ["D", "d-c-b-a-e"]]], [17, "a. Consequently, severe traffic congestion has become a persistent daily issue, leading to increased frustration and longer commuting times for residents.<br>b. Over the past five years, the city has experienced rapid urban expansion, driven by significant investment in both residential and commercial development projects.<br>c. Unfortunately, this swift and extensive urban growth has not been accompanied by adequate development of essential infrastructure, resulting in various logistical and practical problems.<br>d. Numerous green spaces, previously enjoyed by the community, have been replaced by housing complexes and commercial buildings, drastically changing the city’s landscape.<br>e. In response to these challenges, residents have increasingly called upon local authorities to implement immediate and effective solutions to address the worsening living conditions.", [["A", "b-d-c-a-e"], ["B", "b-c-d-a-e"], ["C", "d-b-a-c-e"], ["D", "c-d-b-e-a"]]]]}]}, {"id": 4, "label": "Câu 18–22", "short": "18–22", "paras": [["", "Smart homes, commonly depicted in futuristic films, are rapidly turning into a practical reality. Google Home, a notable example, (18) ______. Following its initial release, Google Home has continuously expanded its capabilities, integrating with numerous smart devices and appliances worldwide. By 2019, Google Home had successfully established itself as a significant player in home automation, providing users the ability to (19) ______ in ways that were once thought impossible. Its voice-activated assistant, powered by sophisticated artificial intelligence, allows users to perform a variety of tasks ranging from turning off lights to adjusting thermostats with ease."], ["", "The smart devices incorporated into Google Home rely on advanced artificial intelligence (AI) and sophisticated algorithms to manage household tasks effectively. (20) ______. These innovations enable automated lighting, climate control, security management, and even health monitoring, ensuring a comfortable and secure living environment for people of all ages, including the elderly and those with disabilities."], ["", "Google Home devices are crafted to provide user convenience through intuitive voice commands. (21) ______. Additionally, visual interfaces displayed through integrated screens offer real-time feedback, making interactions seamless and enhancing the overall user experience. Users can even schedule reminders, manage shopping lists, and access news briefings without needing to lift a finger."], ["", "Thanks to ongoing improvements in natural language processing technology, (22) ______. Ultimately, the advancement of smart home technology aims to simplify daily tasks, enhance home security, and significantly improve the overall quality of life for users around the globe, setting the foundation for an increasingly connected and intelligent future."]], "range": [18, 22], "groups": [{"kind": "mcq", "step": "cloze2", "title": "Questions 18-22", "lines": ["Read the following passage about smart homes and mark the letter A, B, C or D on your answer sheet to indicate the option that best fits each of the numbered blanks from 18 to 22."], "items": [[18, "", [["A", "having had its first demonstration publicly in May, 2016"], ["B", "was initially demonstrated publicly in May of 2016"], ["C", "whose first public demonstration was held in May 2016"], ["D", "that saw its first demonstration publicly in May of 2016"]]], [19, "", [["A", "monitor their homes effortlessly through smart sensors"], ["B", "manage household environments using simple vocal instructions"], ["C", "easily instruct their home environments via vocal commands"], ["D", "control their household environments with voice commands"]]], [20, "", [["A", "Intelligent systems like these have been developed to help users better control various aspects of household life, including safety, comfortable, and sustainability"], ["B", "This device has been specifically designed to assist users in managing their homes more efficiently and conveniently"], ["C", "The assistance in managing daily home routines and improving comfort levels led to the integration of these systems"], ["D", "Designed to make modern living more secure, convenient, and efficient, these technologies are now integral parts of many households"]]], [21, "", [["A", "Equipped with AI-integrated microphones and speakers, these devices process voice instructions and carry out corresponding tasks accurately"], ["B", "Devices equipping with intelligent sensors and audio systems allow them to hear, interpret, communicate and react to users’ requests in real time"], ["C", "Their responsive programming allow users to communicate naturally with the system as they would with another person"], ["D", "Their voice-recognition features, which combined with sensors and cloud computing, are able to understand commands and respond appropriately"]]], [22, "", [["A", "interactions between Google Home and its users occurred naturally and effectively"], ["B", "effective natural communication between Google Home and users is ensured"], ["C", "communication with users naturally and effectively is achieved by Google Home"], ["D", "Google Home can now communicate naturally and effectively with its users"]]]]}]}, {"id": 5, "label": "Câu 23–30", "short": "23–30", "paras": [["1", "Sustainable tourism aims to minimize the negative impacts of travel while maximizing benefits for local communities, cultures, and environments. Unlike mass tourism, which often prioritizes volume and profit, sustainable practices focus on long-term well-being. This approach recognizes that natural landscapes, cultural heritage, and local economies are valuable assets that need protection. Key principles include conserving resources, supporting local businesses, respecting local customs, and ensuring that tourism contributes positively to the destinations visited, such as fragile ecosystems or historical sites."], ["2", "The benefits of adopting sustainable tourism are significant. Environmentally, it helps protect biodiversity and reduce pollution and waste generated by tourist activities. Economically, it ensures that revenue stays within the local community, supporting small enterprises and creating fair employment opportunities. Its focus on authentic cultural experiences also helps preserve local traditions and crafts, offering visitors deeper, more meaningful interactions. This approach fosters mutual respect between hosts and guests, enhancing the overall travel experience for everyone involved and promoting cross-cultural understanding."], ["3", "However, implementing truly sustainable tourism faces several challenges. Balancing economic development with conservation requires careful planning and regulation, which can be difficult to enforce. “Greenwashing,” where businesses falsely market themselves as sustainable, can mislead consumers and undermine genuine efforts. Educating tourists about responsible behavior and managing visitor numbers to prevent overcrowding in popular destinations like Venice or Machu Picchu remain ongoing struggles. Furthermore, the initial investment required for sustainable infrastructure can be prohibitive for smaller communities or businesses."], ["4", "Despite these difficulties, the movement towards sustainable travel is growing. Consumers are increasingly aware of their impact and seeking more responsible options. Governments and international organizations are developing frameworks and certifications to guide the industry. Innovations in eco-friendly transport and accommodation are also emerging. Ultimately, achieving sustainability in tourism requires a collaborative effort from travelers, businesses, and policymakers to ensure that exploring our world does not come at the cost of damaging it for future generations.", [[167, 278]]]], "range": [23, 30], "groups": [{"kind": "mcq", "step": "read", "title": "Questions 23-30", "lines": ["Read the following passage about sustainable tourism and mark the letter A, B, C or D on your answer sheet to indicate the best answer to each of the following questions from 23 to 30."], "items": [[23, "Which of the following is NOT mentioned as a principle of sustainable tourism?", [["A", "Respecting local customs"], ["B", "Maximizing tourist volume"], ["C", "Conserving natural resources"], ["D", "Supporting local businesses"]]], [24, "The word “Its” in paragraph 2 refers to _______.", [["A", "cultural experience’s"], ["B", "local community’s"], ["C", "mass tourism’s"], ["D", "sustainable tourism’s"]]], [25, "The word “prohibitive” in paragraph 3 is OPPOSITE in meaning to _______.", [["A", "affordable"], ["B", "protective"], ["C", "necessary"], ["D", "expensive"]]], [26, "The word “preserve” in paragraph 2 could be best replaced by _______.", [["A", "display"], ["B", "ignore"], ["C", "protect"], ["D", "change"]]], [27, "Which of the following best paraphrases the underlined sentence in paragraph 4?", [["A", "The tourism industry is guiding governments to develop sustainable frameworks."], ["B", "Consumers are developing frameworks to guide the sustainable tourism industry."], ["C", "Frameworks and certifications are being created by authorities to direct sustainable tourism practices."], ["D", "Businesses are creating their own certifications to guide government policies on the sustainable tourism industry."]]], [28, "Which of the following is TRUE according to the passage?", [["A", "Managing visitor numbers is a challenge for sustainable tourism."], ["B", "Sustainable tourism guarantees that no pollution is generated."], ["C", "“Greenwashing” helps consumers identify genuinely sustainable businesses."], ["D", "Mass tourism focuses primarily on long-term well-being."]]], [29, "In which paragraph does the writer mainly discuss the obstacles or difficulties in implementing sustainable tourism?", [["A", "Paragraph 2"], ["B", "Paragraph 3"], ["C", "Paragraph 1"], ["D", "Paragraph 4"]]], [30, "In which paragraph does the writer primarily define sustainable tourism and its core ideas?", [["A", "Paragraph 2"], ["B", "Paragraph 4"], ["C", "Paragraph 1"], ["D", "Paragraph 3"]]]]}]}, {"id": 6, "label": "Câu 31–40", "short": "31–40", "paras": [["1", "[I] Social media platforms have become deeply integrated into the daily lives of many people worldwide. [II] For many young people, platforms like Instagram, TikTok, and Facebook are primary tools for communication and self-expression. These networks offer unprecedented opportunities for connection and information sharing; however, they also present a unique set of challenges. [III] Understanding both the positive and negative impacts is crucial for navigating this digital landscape effectively. [IV]", [[46, 61]]], ["2", "On the one hand, social media provides significant benefits. It allows teenagers to maintain friendships, especially with those who live far away, and to connect with others who share similar interests, fostering a sense of community and belonging. These platforms can be valuable sources of information and news, exposing young users to diverse perspectives and current events. Furthermore, they offer spaces for creativity and self-discovery, enabling teens to share their talents, opinions, and experiences with a potentially global audience. Social media can also be a powerful tool for social and political engagement, allowing young people to learn about and participate in causes they care about."], ["3", "However, the downsides of social media use among adolescents are considerable and concerning. Cyberbullying, or online harassment, is a significant risk, potentially causing severe emotional distress. Constant exposure to carefully curated and often idealized images of others can lead to social comparison, negatively impacting self-esteem and body image. This comparison culture may contribute to feelings of anxiety and depression. Moreover, the addictive nature of social media, designed to keep users engaged for extended periods, can interfere with sleep, homework, and face-to-face interactions. Concerns about privacy and the potential misuse of personal data are also valid issues associated with heavy usage."], ["4", "Ultimately, achieving a healthy relationship with social media involves mindful usage and balance. It requires recognizing potential pitfalls while harnessing the positive aspects. Open communication between teenagers, parents, and educators about online experiences is vital. Developing digital literacy skills—such as critically evaluating information and understanding privacy settings—empowers teens to use these powerful tools responsibly and protect their well-being in an increasingly connected world. Finding offline hobbies and maintaining real-world connections remain essential for overall adolescent development.", [[0, 98]]]], "range": [31, 40], "groups": [{"kind": "mcq", "step": "read", "title": "Questions 31-40", "lines": ["Read the following passage about the impact of social media on teenagers and mark the letter A, B, C or D on your answer sheet to indicate the best answer to each of the following questions from 31 to 40."], "items": [[31, "Where in paragraph 1 does the following sentence best fit?<br><i>Undeniably, their presence is becoming ubiquitous, especially in modern youth culture.</i>", [["A", "[III]"], ["B", "[II]"], ["C", "[I]"], ["D", "[IV]"]]], [32, "The phrase “integrated into” in paragraph 1 is closest in meaning to ______.", [["A", "removed from"], ["B", "separated from"], ["C", "combined with"], ["D", "interested in"]]], [33, "The word “they” in paragraph 2 refers to ______.", [["A", "current events"], ["B", "diverse perspectives"], ["C", "platforms"], ["D", "young users"]]], [34, "According to paragraph 2, which of the following is NOT mentioned as a positive effect of social media?", [["A", "Improving academic performance."], ["B", "Connecting with people who have similar hobbies."], ["C", "Providing access to information."], ["D", "Offering opportunities for creative expression."]]], [35, "Which of the following best serves as the main idea of paragraph 3?", [["A", "Social media usage among teens has several significant negative consequences."], ["B", "Social media primarily causes emotional distress through cyberbullying."], ["C", "Idealized images on social media only affect body image negatively."], ["D", "The main problem with social media is its addictive design."]]], [36, "The word “Constant” in paragraph 3 is OPPOSITE in meaning to ______.", [["A", "Permanent"], ["B", "Intermittent"], ["C", "Continuous"], ["D", "Frequent"]]], [37, "Which of the following statements is TRUE, according to the passage?", [["A", "Social media offers only challenges and no real benefits for most of the teenagers."], ["B", "Developing digital literacy is suggested as a way to use social media responsibly."], ["C", "Social comparison on social media always leads to severe depression."], ["D", "Using social media guarantees connection with people far away."]]], [38, "Which of the following best paraphrases the underlined sentence in paragraph 4?", [["A", "Social media relationships are healthier if they are balanced with mindful activities."], ["B", "In the end, social media use should be avoided completely to stay healthy."], ["C", "Finally, using social media carefully and not excessively is key to a positive experience."], ["D", "It is ultimately impossible to have a healthy relationship with social media platforms."]]], [39, "What can be inferred from the passage about managing teenagers’ social media use?", [["A", "The negative impacts of social media outweigh any potential benefits."], ["B", "Teenagers require guidance and skill development to navigate social media safely."], ["C", "Strict bans on social media are the most effective solution."], ["D", "Social media platforms themselves are solely responsible for every user’s well-being."]]], [40, "What is the main purpose of the passage?", [["A", "To persuade teenagers to delete their social media accounts."], ["B", "To provide a detailed guide on how to become more popular on social media."], ["C", "To compare the features of different social media platforms."], ["D", "To discuss both the advantages and disadvantages of social media for teenagers."]]]]}]}]};</script>

    var qs = document.getElementById("qs"); if (!qs || ckBusy) return; ckBusy = true; if (ckMo) ckMo.disconnect();
    [].forEach.call(qs.querySelectorAll(".ckv"), function (e) { e.remove(); });
    [].forEach.call(qs.querySelectorAll(".qn"), function (t) {
      var n = parseInt((t.id || "").slice(1), 10); if (!n || !(n in CKS)) return;
      var host = t.closest(".qt,.hrow,.qcell"); if (!host) return; var c = CKS[n];
      host.appendChild(h("span", { cls: "ckv " + (c === true ? "ok" : c === false ? "bad" : "blank"), title: "Checked in class", text: c === true ? "\u2713" : c === false ? "\u2717" : "\u2013" }));
    });
    if (!ckMo) ckMo = new MutationObserver(function () { if (ckBusy) return; clearTimeout(ckMo.t); ckMo.t = setTimeout(ckDecor, 30); });
    ckMo.observe(qs, { childList: true, subtree: true });
    ckBusy = false;
  }
  function ckPoll() {
    if (!state.code || document.visibilityState !== "visible") return;
    rpc("student_checks", { p_student_code: state.code, p_assignment_code: D.code }).then(function (r) {
      var m = {}; (r || []).forEach(function (x) { m[x.q] = x.correct; });
      var sig = JSON.stringify(m); if (sig === ckSig) return; ckSig = sig; CKS = m; ckDecor();
    }).catch(function () { });
  }
  setInterval(ckPoll, 5000);

  /* ---------- boot ---------- */
  function boot() {
    var fs = parseFloat(store("fs") || (window.innerWidth <= 700 ? "16" : "18")); document.documentElement.style.setProperty("--fs", fs + "px");
    var tabs = h("nav", { cls: "tabs" });
    D.passages.forEach(function (P, i) { tabs.appendChild(h("button", { cls: "tab" + (i === 0 ? " on" : ""), onclick: function () { state.p = i; paint(); } }, h("span", { cls: "tl", text: P.label }), h("span", { cls: "ts", text: P.short || P.label }))); });
    var tools = h("div", { cls: "tools" }, h("span", { id: "sv", cls: "who2" }), h("span", { id: "who", cls: "who2" }),
      h("button", { cls: "fsb", text: "A−", title: "Smaller text", onclick: function () { fontStep(-1); } }),
      h("button", { cls: "fsb", text: "A+", title: "Larger text", onclick: function () { fontStep(1); } }));
    if (TEACH) {
      tools.appendChild(ibtn("book", "Show or hide new words", function (e) { state.vocab = !state.vocab; e.currentTarget.classList.toggle("off", !state.vocab); renderPassage(); }));
      tools.appendChild(ibtn("reset", "Start again", reset));
    } else tools.appendChild(ibtn("tick", "Submit the test", submit, "dark"));
    if (!TEACH) tools.appendChild(ibtn("reset", "Retake the whole test", retakeAll));
    tools.appendChild(ibtn("undo", "Undo highlight", function () { undoHl(); }, "off"));
    tools.appendChild(ibtn("note", "Student's notes", toggleNotes));
    tools.appendChild(ibtn("full", "Full screen", function () {
      try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { }
    }, "hide-m"));
    $("#hd").appendChild(h("div", { cls: "brand", text: D.title })); $("#hd").appendChild(tabs); $("#hd").appendChild(tools);
    var mv = h("div", { cls: "mv" }); ["p", "q"].forEach(function (v) { mv.appendChild(h("button", { cls: "mvb" + (v === "p" ? " on" : ""), "data-v": v, text: v === "p" ? "Passage" : "Questions", onclick: function () { setView(v); } })); });
    $("#hd").appendChild(mv); $("#main").setAttribute("data-v", "p");
    setupSplit(); if (TEACH) setupVocab(); buildNotes();
    paint();
    if (!TEACH) login();
  }
  document.addEventListener("DOMContentLoaded", boot);
})();
